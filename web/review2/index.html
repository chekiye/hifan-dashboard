*{box-sizing:border-box}

h1{margin:0;font-size:18px;font-weight:750;letter-spacing:-.01em}

.kpi.g{background:var(--greenbg);border-color:var(--greenline);color:var(--green)} .kpi.g b{color:var(--green)}

button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
button.pri:hover{background:#1348A8}

.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.tabs button .n{font:600 11.5px var(--mono);color:var(--ink3);margin-left:5px}

.row{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:9px;

.row.o{border-left-color:var(--red)} .row.b{border-left-color:var(--blue)} .row.n{border-left-color:var(--gray2,#B9C0CC)}

.tag.hn{background:#E0F2FE;border-color:#BAE6FD;color:#026AA2}

.tag.vN{background:var(--graybg);border-color:var(--line);color:var(--ink2)}

.ttl{font-weight:650;font-size:14.5px}
.yr{font:600 12.5px var(--mono);color:var(--ink3)}
.brand{font-size:12px;color:var(--ink3);background:var(--graybg);padding:2px 7px;border-radius:5px}
.mark{margin-left:auto;display:flex;gap:5px}

.mark .ok{background:var(--greenbg);border-color:var(--greenline);color:var(--green)}
.mark .no{background:var(--redbg);border-color:var(--redline);color:var(--red)}
.mark .ok.on{background:var(--green);color:#fff;border-color:var(--green)}
.mark .no.on{background:var(--red);color:#fff;border-color:var(--red)}
.rbody{padding:0 15px 12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.rbody{grid-template-columns:1fr}}
.box{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#FCFCFD}

.box .big{font-size:15px;font-weight:700;line-height:1.35}
.box .ja{font-size:12.5px;color:var(--ink2);margin-top:2px}
.box .meta{font-size:12px;color:var(--ink3);margin-top:3px}
.ev{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}

.old{background:#fff}
.more{padding:0 15px 11px;font-size:12.5px;color:var(--ink2)}

.foot .msg{font-size:12.5px;color:var(--ink2)}
.empty{padding:50px;text-align:center;color:var(--ink3)}

    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
    a.download='v4_marks.json'; a.click();
  });
};
document.getElementById('clr').onclick = ()=>{ marks={}; localStorage.removeItem('v4marks'); render(); };
render();
</script></body></html>
