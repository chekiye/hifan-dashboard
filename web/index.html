<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>里番缺口看板 · TMDB 全览</title>
<style>
/* >>> 由 scripts/_splice_main_style.py 注入，勿直接改这里 */
/* ═══════════════════════════════════════════════════════════════════════
   里番缺口看板 · LUMEN-2 视觉层
   ---------------------------------------------------------------------------
   本文件只负责「皮」与信息层级，**不碰任何数据与业务逻辑**。
   设计目标（三条）：
     ① 一眼分层 —— 顶栏 / 轨道 / 工具条 / 内容 四层各司其职，不再挤成一行
     ② 抽屉不再是文字墙 —— 结论横幅 + 页签 + 因子网格 + 折叠溯源
     ③ 核对信息可扫读 —— 决定性字段放大，次要字段收进一行灰字
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  /* 层次：canvas → surface-2 → surface */
  --canvas:#EFF2F7;
  --surface:#FFFFFF;
  --surface-2:#F6F8FC;
  --surface-3:#EAEFF7;
  --ink:#0A1020;
  --ink2:#48536A;
  --ink3:#8A94A8;
  --ink4:#B3BCC9;
  --line:rgba(10,16,32,.09);
  --line2:rgba(10,16,32,.16);

  --brand:#4F46E5;  --brand-2:#7C74F2;  --brand-ink:#3730A3;  --brand-soft:#EDEEFE;

  --ok:#0E9F6E;    --ok-ink:#05603F;    --ok-soft:#E1F6ED;
  --warn:#C07800;  --warn-ink:#7A4700;  --warn-soft:#FCF1DA;
  --bad:#DC2B2B;   --bad-ink:#8A1414;   --bad-soft:#FDEBEB;
  --info:#2F7FD8;  --info-ink:#18549B;  --info-soft:#E7F0FC;
  --purple:#7C5CD6;--purple-ink:#4C2FA0;--purple-soft:#F0EBFD;
  --rose:#D4537E;  --rose-ink:#72243E;  --rose-soft:#FBEAF0;

  --fs-xl:34px; --fs-lg:24px; --fs-md:18px; --fs-sm:15px; --fs-xs:13px; --fs-xx:12px;
  --r-xs:6px; --r-s:9px; --r-m:13px; --r-l:17px; --r-xl:22px;
  --sh-1:0 1px 2px rgba(10,16,32,.05);
  --sh-2:0 2px 5px rgba(10,16,32,.04),0 10px 22px -10px rgba(10,16,32,.14);
  --sh-3:0 26px 64px -22px rgba(10,16,32,.30),0 4px 14px rgba(10,16,32,.08);
  --ease:cubic-bezier(.22,1,.36,1);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--canvas)}
body{
  font-family:var(--sans); color:var(--ink);
  font-size:var(--fs-sm); line-height:1.6; -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1200px 600px at 15% -10%, #F6F8FF 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #F2F7FF 0%, transparent 55%),
    var(--canvas);
  background-attachment:fixed;
  min-height:100vh;
}
body.modal{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{text-decoration:none;color:inherit}
img{display:block}
/* 🔴 2026-10-29（§82 蛙哥：「很奇怪，上面没封面，下面有封面」）：
   上一行的 `display:block` 会**覆盖浏览器默认的 `[hidden]{display:none}`**
   （作者样式优先级高于 UA 样式表）⇒ 任何 `<img ... hidden>` 都会渲染成一个
   带背景色的空方块。抽屉头缩略图就是这么冒出一块灰的（`.dhead .dthumb` 还有渐变底色）。
   ⇒ 这条必须留着，它管所有「先占位、后填图」的 img。 */
[hidden]{display:none !important}

/* ══ 顶栏 ══════════════════════════════════════════════════════════ */
.top{
  position:relative; z-index:1;
  background:rgba(255,255,255,.86);
  backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid var(--line);
}
.top-row1{
  display:flex; align-items:center; gap:18px;
  padding:14px 28px 12px;
}
.brand{display:flex; align-items:center; gap:11px; min-width:0}
.brand .mark{
  width:30px; height:30px; border-radius:9px; flex:0 0 auto;
  background:linear-gradient(140deg,var(--brand) 0%,var(--brand-2) 100%);
  box-shadow:0 3px 10px -3px rgba(79,70,229,.6);
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:14px; font-weight:800; letter-spacing:-.04em;
}
.brand .bt{min-width:0}
.brand h1{
  font-size:var(--fs-lg); font-weight:780; letter-spacing:-.025em;
  line-height:1.15; white-space:nowrap;
}
.brand .sub{
  font-size:var(--fs-xx); color:var(--ink3); white-space:nowrap;
  display:block; margin-top:1px;
}
.brand .chain{
  font-size:11.5px; color:var(--ink3); font-family:var(--mono);
  padding-left:12px; border-left:1px solid var(--line2); white-space:nowrap;
}

/* 读数条：4 个数字 + 分隔线，不用方块框 */
.statstrip{display:flex; align-items:stretch; gap:0; margin-left:6px}
.tstat{padding:0 16px; border-left:1px solid var(--line); line-height:1.2}
.tstat:first-child{border-left:0}
.tstat b{display:block; font-size:21px; font-weight:760; letter-spacing:-.03em}
.tstat span{font-size:11px; color:var(--ink3); white-space:nowrap}

.top-actions{margin-left:auto; display:flex; align-items:center; gap:9px; flex:none}

/* 双源覆盖体检条 */
.covline{
  display:flex; flex-wrap:wrap; gap:6px; align-items:center;
  padding:0 28px 11px;
}
.cov-line-lb{
  font-size:11px; color:var(--ink3); font-weight:700; letter-spacing:.04em;
  margin-right:2px; white-space:nowrap;
}
.cov-i{
  display:inline-flex; align-items:baseline; gap:5px; padding:3px 10px;
  border-radius:999px; font-size:11.5px; white-space:nowrap;
  border:1px solid transparent; font-weight:500;
}
.cov-i b{font-size:13px; font-weight:750}
.cov-i i{font-style:normal; font-size:10.5px; opacity:.7}
.cov-ok {background:var(--ok-soft);    color:var(--ok-ink);    border-color:rgba(14,159,110,.24)}
.cov-mt {background:var(--info-soft);  color:var(--info-ink);  border-color:rgba(47,127,216,.24)}
.cov-pm {background:var(--purple-soft);color:var(--purple-ink);border-color:rgba(124,92,214,.24)}
.cov-gap{background:var(--bad-soft);   color:var(--bad-ink);   border-color:rgba(220,43,43,.24)}
.cov-unk{background:var(--surface-3);  color:var(--ink2);      border-color:var(--line2)}

/* 年份轨道 */
.track{
  display:flex; gap:4px; padding:0 28px 12px; overflow-x:auto;
  scrollbar-width:none;
}
.track::-webkit-scrollbar{display:none}
.yr{
  flex:0 0 auto; min-width:46px; padding:6px 10px 7px; border-radius:var(--r-s);
  background:var(--surface); border:1px solid var(--line); cursor:pointer;
  text-align:center; transition:all .16s var(--ease); position:relative;
  box-shadow:var(--sh-1); overflow:hidden;
}
/* ⭐ 年份轨道 = 迷你柱状图（2026-10-21 视觉重制）
   以前用 linear-gradient 画条形，token 换掉后其实没生效 ⇒ 轨道是平的，
   看不出哪年作品多。现在用 --pct 驱动的伪元素做真正的柱。 */
.yr::before{
  content:''; position:absolute; left:0; right:0; bottom:0; height:var(--pct,0%);
  background:linear-gradient(to top, rgba(79,70,229,.13), rgba(79,70,229,.02));
  transition:height .35s var(--ease);
  pointer-events:none;
}
.yr>*{position:relative}
.yr:hover{border-color:var(--line2); transform:translateY(-1px); box-shadow:var(--sh-2)}
.yr.on{background:var(--ink); border-color:var(--ink); color:#fff; box-shadow:0 6px 16px -8px rgba(10,16,32,.6)}
.yr.on::before{background:linear-gradient(to top, rgba(255,255,255,.20), rgba(255,255,255,.04))}
.yr.on .yr-n{color:rgba(255,255,255,.7)}
.yr-n{display:block; font-family:var(--mono); font-size:10.5px; color:var(--ink3); letter-spacing:.02em}
.yr-c{display:block; font-size:16px; font-weight:750; letter-spacing:-.02em; line-height:1.3}
/* ⭐ §141：年份薄标记（.yr.thin 小圆点）已删 —— 蛙哥：屏蔽部分后 <30 的年份也会变多，
   点会被误读成「有问题」标记。 */

/* ══ 工具条 ═════════════════════════════════════════════════════════ */
.bar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  padding:11px 28px; border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.92); backdrop-filter:blur(14px);
}
.search{
  /* 🔴 §78：原来是 flex:1 1 240px ⇒ 搜索框**主动扩张**抢走余量，
     工具栏（.bar 是 flex-wrap:wrap）总宽超容器 ⇒ 整条换行（实测 63px → 109px）。
     改成 flex:0 1 240px ⇒ 只在需要时收缩，不抢后面的控件宽度。 */
  flex:0 1 240px; max-width:380px; display:flex; align-items:center; gap:8px;
  padding:8px 13px; border:1px solid var(--line2); border-radius:var(--r-m);
  background:var(--surface-2); transition:.15s var(--ease);
}
.search:focus-within{border-color:var(--brand); background:#fff; box-shadow:0 0 0 3px var(--brand-soft)}
.search input{
  flex:1; border:0; background:transparent; font-family:var(--sans);
  font-size:var(--fs-sm); color:var(--ink); outline:0;
}
.search input::placeholder{color:var(--ink4)}
.seg{
  display:flex; background:var(--surface-2); border:1px solid var(--line2);
  border-radius:var(--r-m); padding:2px; gap:2px;
}
.seg button{
  border:0; background:transparent; font-family:var(--sans); font-size:var(--fs-xs);
  font-weight:600; color:var(--ink2); padding:6px 13px; border-radius:10px;
  cursor:pointer; transition:all .14s var(--ease); white-space:nowrap;
}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--ink); color:#fff; box-shadow:var(--sh-1)}
.chk{
  display:flex; align-items:center; gap:6px; font-size:var(--fs-xs);
  color:var(--ink2); cursor:pointer; user-select:none; white-space:nowrap;
  padding:5px 9px; border-radius:var(--r-s); transition:.14s var(--ease);
}
.chk:hover{background:var(--surface-2)}
.chk input{width:15px; height:15px; accent-color:var(--brand); cursor:pointer}
.hint{font-size:var(--fs-xx); color:var(--ink3); margin-left:auto; white-space:nowrap}

/* ══ 入库状态分段筛选（2026-10-27 §75 → 2026-10-28 §77 改多选）══════════
   ⭐ §77：**可多选**（蛙哥「多勾选、随意组合」）—— 三档是「并集」关系：
      勾「全部入库」+「部分入库」⇒ 同时看这两档。
      ⛔ 用 .seg 的外观但**不复用 .seg button.on 的黑底白字**：
         那样多个同时点亮会糊成一片、看不出勾了哪几个。
         ⇒ 选中态改成「档位浅色底 + 档位深色字 + 底部色条」，每个档一眼可辨。
   ⛔ 不用裸短词做类名（0gq）：.segSt 是筛选栏专用前缀。
   ⭐ 数字是**该档在当前其它筛选条件下的部数**，随数据实时变 ⇒ 点之前就知道还剩多少。 */
.segSt button{position:relative}
.segSt .sb-n{
  font-family:var(--mono); font-size:10.5px; font-weight:700;
  opacity:.62; margin-left:5px; letter-spacing:-.02em;
}
/* 三个档各有主色（与卡面徽章同一套语义：绿=收全 / 琥珀=差几集 / 灰=没入库）
   ⭐ §77 选中态 = **浅色底 + 深色字**（不是 .seg 的黑底）⇒ 多选时每个档各自可辨 */
.segSt button[data-st="full"] .sb-n{color:var(--ok)}
.segSt button[data-st="part"] .sb-n{color:var(--warn-ink)}
.segSt button[data-st="none"] .sb-n{color:var(--ink3)}
.segSt button.on .sb-n{opacity:1}
.segSt button.on::after{
  content:''; position:absolute; left:50%; transform:translateX(-50%);
  bottom:3px; width:14px; height:2px; border-radius:2px; opacity:.95;
}
.segSt button[data-st="full"].on{background:var(--ok-soft); color:var(--ok-ink)}
.segSt button[data-st="part"].on{background:var(--warn-soft); color:var(--warn-ink)}
.segSt button[data-st="none"].on{background:var(--surface-3); color:var(--ink2)}
.segSt button[data-st="full"].on::after{background:var(--ok)}
.segSt button[data-st="part"].on::after{background:var(--warn)}
.segSt button[data-st="none"].on::after{background:var(--ink3)}
/* 「不限」= 清空选择（多选后它不再是第四档，而是 reset 按钮）⇒ 不用档位色
   🔴 §78：它**不挂数字**（旧版挂全库基数会被读成「已入库 N 部」）⇒ 也不需要 .sb-n 规则 */
.segSt button[data-st=""]{color:var(--ink3)}
.segSt button[data-st=""].on{background:var(--ink); color:#fff; box-shadow:var(--sh-1)}

/* 动作按钮 */
.safebtn{
  display:flex; align-items:center; gap:8px; padding:7px 13px;
  border:1px solid var(--line2); border-radius:var(--r-m);
  background:var(--surface); cursor:pointer; user-select:none;
  font-family:var(--sans); font-size:var(--fs-xs); font-weight:600; color:var(--ink2);
  transition:all .16s var(--ease); white-space:nowrap;
}
.safebtn:hover{border-color:var(--ink3); box-shadow:var(--sh-1)}
.safebtn.active{background:var(--ink); border-color:var(--ink); color:#fff}
.safebtn .dot{
  width:8px; height:8px; border-radius:50%; background:var(--ok); flex:0 0 auto;
  box-shadow:0 0 0 3px var(--ok-soft);
}
.safebtn.blur .dot{background:var(--warn); box-shadow:0 0 0 3px var(--warn-soft)}
.safebtn.hide .dot{background:var(--bad); box-shadow:0 0 0 3px var(--bad-soft)}
.unconf-link{
  display:inline-flex; align-items:center; gap:6px; flex:none;
  padding:7px 13px; border-radius:var(--r-m);
  font-size:var(--fs-xs); font-weight:700; white-space:nowrap; text-decoration:none;
  color:var(--brand-ink); background:var(--brand-soft);
  border:1px solid rgba(79,70,229,.24); transition:.15s var(--ease);
}
.unconf-link:hover{background:var(--brand); color:#fff; border-color:var(--brand)}
.safechip{
  display:none; align-items:center; gap:7px; padding:5px 11px; border-radius:999px;
  font-size:11.5px; font-weight:600;
  background:var(--warn-soft); color:var(--warn-ink); border:1px solid rgba(192,120,0,.26);
}
.safechip.show{display:inline-flex}
.safechip.hide-mode{background:var(--bad-soft); color:var(--bad-ink); border-color:rgba(220,43,43,.26)}
.safechip.ok{background:var(--ok-soft); color:var(--ok-ink); border-color:rgba(14,159,110,.26)}

/* ══ 主体 ═════════════════════════════════════════════════════════ */
main{padding:24px 28px 70px; max-width:1760px; margin:0 auto}
.yearhead{
  display:flex; align-items:baseline; gap:14px; margin:0 0 16px;
  padding-bottom:10px; border-bottom:2px solid var(--ink);
}
.yearhead h2{font-size:var(--fs-xl); font-weight:780; letter-spacing:-.035em; line-height:1.1}
.yearhead .meta{font-size:var(--fs-xs); color:var(--ink3)}
.yearhead .meta b{color:var(--ink2); font-weight:700}

/* 海报墙 */
.grid{
  display:grid; gap:20px 16px;
  grid-template-columns:repeat(auto-fill,minmax(152px,1fr));
}
.card{
  cursor:pointer; border-radius:var(--r-l); min-width:0;
  transition:transform .2s var(--ease);
}
.card:hover{transform:translateY(-5px)}
.poster{
  position:relative; aspect-ratio:2/3; border-radius:var(--r-l); overflow:hidden;
  background:linear-gradient(160deg,#E9ECF2,#DDE2EA); border:1px solid var(--line);
  box-shadow:var(--sh-1);
}
.poster img{width:100%; height:100%; object-fit:cover; display:block}
.poster .ph{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:11.5px; color:var(--ink3); font-family:var(--mono); text-align:center; padding:8px;
}
.card:hover .poster{box-shadow:var(--sh-2)}
.card:hover .ctitle{color:var(--brand-ink)}

/* 角标
   ⚠️ 角标位置是**互斥**的，否则会互相压字（2026-10-21 视觉重制时发现）：
     左上 = 来源徽标（最重要）  右上 = 泡麵番
     左下 = 剧场版            右下 = 集数
     「无中文」挪到标题下 —— 它是标题的属性，不是封面的属性。      */
.tag{
  position:absolute; bottom:8px; left:8px; padding:3px 7px; border-radius:var(--r-xs);
  font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:.02em;
  background:rgba(255,255,255,.9); backdrop-filter:blur(8px); color:var(--ink2);
}
.tag.mv{background:var(--rose-soft); color:var(--rose-ink)}
.badge{
  position:absolute; bottom:8px; right:8px; padding:3px 7px; border-radius:var(--r-xs);
  font-family:var(--mono); font-size:10.5px; font-weight:700;
  background:rgba(10,16,32,.82); color:#fff; backdrop-filter:blur(6px);
}
.badge.none{background:var(--warn-soft); color:var(--warn-ink)}
/* ⭐ 全集入库（2026-10-27 §71）—— 绿底勾标，扫一屏就能看出哪部收全了。
   ⛔ 只改「集数徽章」这一枚，不新增封面角落：四个角已被 来源/泡麵番/剧场/集数 占满，
      再加元素必压图（0gq 尺寸回归）。 */
.badge.efull{
  background:var(--ok); color:#fff;
  box-shadow:0 1px 8px rgba(14,159,110,.5);
}
/* 部分入库：「5/9」，比全集淡、比未入库略轻 —— 只是进度，不是成就 */
.badge.epart{background:rgba(10,16,32,.55); color:#fff; font-weight:600}
.nozh{
  display:inline-block; padding:1px 6px; border-radius:var(--r-xs);
  font-size:10px; font-weight:600; background:var(--warn-soft); color:var(--warn-ink);
  font-family:var(--sans);
}

/* 溯源徽标 —— 颜色只表达「来源」，不暗示质量 */
.srcbadge{
  display:inline-flex; align-items:center; padding:2.5px 8px; border-radius:999px;
  font-size:11px; font-weight:700; letter-spacing:.01em; white-space:nowrap;
  border:1px solid transparent; vertical-align:middle;
}
.srcbadge.src2 { background:var(--ok-soft);     color:var(--ok-ink);     border-color:rgba(14,159,110,.28) }
.srcbadge.srcm { background:var(--info-soft);   color:var(--info-ink);   border-color:rgba(47,127,216,.28) }
.srcbadge.srch { background:var(--purple-soft); color:var(--purple-ink); border-color:rgba(124,92,214,.28) }
.srcbadge.src0 { background:var(--warn-soft);   color:var(--warn-ink);   border-color:rgba(192,120,0,.28) }
.srcbadge.pm   { background:var(--ok-soft);     color:var(--ok-ink);     border-color:rgba(14,159,110,.28) }
.srcbadge.sm{
  position:absolute; top:8px; left:8px; backdrop-filter:blur(8px);
  background:rgba(255,255,255,.92); font-size:10.5px; padding:2.5px 7px;
}
.srcbadge.sm.src2{background:rgba(225,246,237,.95); color:var(--ok-ink)}
.srcbadge.sm.srcm{background:rgba(231,240,252,.95); color:var(--info-ink)}
.srcbadge.sm.srch{background:rgba(240,235,253,.95); color:var(--purple-ink)}
.srcbadge.sm.src0{background:rgba(252,241,218,.95); color:var(--warn-ink)}
/* ⭐ §87/§89：泡麵番徽章**不再单独飘右上角** —— 它现在和来源徽标一起放进
   `.poster .tlb` 纵向容器，从左上角依次往下排（定义见文件末尾「封面左上角徽章堆」）。
   ⇒ 这里只保留配色，⛔ 不再写 left/right/top（否则会盖掉容器布局）。 */
.srcbadge.sm.pm{
  background:rgba(225,246,237,.95); color:var(--ok-ink);
}

/* 卡面下方文字 */
.cmeta{padding:9px 2px 0}
.ctitle{
  font-size:13.5px; font-weight:650; line-height:1.4; color:var(--ink);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  word-break:break-word; transition:color .15s var(--ease);
}
.csub{
  font-size:11.5px; color:var(--ink3); margin-top:4px; font-family:var(--mono);
  display:flex; gap:8px; align-items:center; flex-wrap:wrap;
}
.csub .cyr{
  font-family:var(--mono); font-size:11px; font-weight:600; color:var(--ink2);
  background:var(--surface-3); padding:1px 6px; border-radius:var(--r-xs);
  letter-spacing:.01em;
}
.csub .ja{font-family:var(--sans); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%}

/* ══ 决定性因素标签（溯源行内）══════════════════════════════════ */
.sfacts{display:flex; flex-wrap:wrap; gap:5px; margin-top:2px}
.fact{
  font-size:11px; font-family:var(--mono); line-height:1.5;
  padding:1.5px 8px; border-radius:99px;
  background:var(--surface-3); color:var(--ink2);
  border:1px solid transparent; white-space:nowrap;
}
.fact.f-ok{background:var(--ok-soft); color:var(--ok-ink); border-color:rgba(14,159,110,.32)}
.fact.f-warn{background:var(--warn-soft); color:var(--warn-ink); border-color:rgba(192,120,0,.34)}
.fact.f-bad{background:var(--bad-soft); color:var(--bad-ink); border-color:rgba(220,43,43,.36); font-weight:700}
.fact.f-unknown{background:var(--surface-3); color:var(--ink3)}
.fact.f-brand{background:var(--purple-soft); color:var(--purple-ink); border-color:rgba(124,92,214,.26)}
.fact.f-mt{background:var(--info-soft); color:var(--info-ink); border-color:rgba(47,127,216,.26)}

/* ══ 抽屉（点开某部片的二级菜单）══════════════════════════════════
   改造要点：① 顶部结论横幅先给答案
            ② 三个页签把「概览/溯源/季集」分开，不再一口气铺满
            ③ 溯源里决定性字段（年份）放大，次要字段收进一行灰字   */
/* ══ 逐集对照（2026-10-21 蛙哥提议）══════════════════════════════
   TMDB 的分季分集当骨架，每集一行，下面挂对应的源条目。
   缺源的集标红；没挂到任何集的源条目单列在下面。              */
.aln-sum{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.aln-chip{
  display:inline-flex;align-items:baseline;gap:5px;padding:3px 10px;
  border-radius:999px;font-size:11.5px;background:var(--surface-2);
  border:1px solid var(--line);color:var(--ink2);white-space:nowrap;
}
.aln-chip b{font-size:13px;font-weight:750;color:var(--ink)}
.aln-chip.ok{background:var(--ok-soft);border-color:rgba(14,159,110,.24);color:var(--ok-ink)}
.aln-chip.ok b{color:var(--ok-ink)}
.aln-chip.ok2{background:rgba(14,159,110,.09);border-color:rgba(14,159,110,.18);color:var(--ok-ink)}
.aln-chip.ok2 b{color:var(--ok-ink)}
.aln-chip.bad{background:var(--bad-soft);border-color:rgba(220,43,43,.24);color:var(--bad-ink)}
.aln-chip.bad b{color:var(--bad-ink)}
.aln-chip.warn{background:var(--warn-soft);border-color:rgba(192,120,0,.24);color:var(--warn-ink)}
.aln-chip.warn b{color:var(--warn-ink)}

/* ⚠️ 2026-10-22：`table-layout:fixed` 是**解决「标题缩在一起」的关键** ——
   不固定布局时浏览器按内容长度分配列宽，hanime 的长标题会把「季集」「判定」挤成竖条。
   固定布局 + <colgroup> 显式给宽 ⇒ 每列恒定，长标题只在自己列内换行。 */
.aln-tbl{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
.aln-tbl col.c-ep{width:90px}
.aln-tbl col.c-still{width:168px}
/* ⭐ §115：加了「画质对比」列 ⇒ 三个百分比列各收 2-4 个点给它腾位置。
   ⚠️ table-layout:fixed 下百分比是相对**表宽**算的，超过 100% 时浏览器会按比例压缩，
      所以这里宁可略挤也不要把固定列设死（设死就出横向滚动条）。 */
.aln-tbl col.c-name{width:19%}
.aln-tbl col.c-han{width:20%}
.aln-tbl col.c-mt{width:16%}
.aln-tbl col.c-q{width:178px}
.aln-tbl col.c-how{width:94px}
.aln-tbl col.c-store{width:100px}
.aln-tbl th{
  text-align:left;padding:13px 14px;background:var(--surface-2);
  color:var(--ink3);font-size:12px;font-weight:700;letter-spacing:.04em;
  border-bottom:1px solid var(--line2);
  position:sticky;top:0;z-index:1;white-space:nowrap;
}
.aln-tbl td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top}

/* ══════════ ⭐ §115 逐集体积/画质对照（2026-11-01 蛙哥）══════════
   蛙哥：「一眼就能看出我应该下哪一个，哪一个质量更高」
   ─────────────────────────────────────────────────────────────
   结构（⛔ 三块数据分开，不许合成一个「大小」）：
     .qm.lib  Emby 媒体库里那份（实测体积/画质）
     .qm.on   mteam 盘上实测（ffprobe：大小 + 分辨率 + 编码 + 码率）
     .qm.off  mteam 全量库**有**这一集，只是还没落盘（值得等）
     .qm.none mteam 全量库**没有**这一集（等也等不来 —— 别混成「未落盘」）
     .qm.src  hanime 源侧最高可下档位
     .qv      判定徽章（同一套取值见 docs/画质对比-问题与计划.md）
   ⚠️ 深色不该用（本看板只有浅色一套皮），所以颜色全部走 :root 变量。 */
.qm{margin-top:7px;padding:6px 9px;border-radius:8px;line-height:1.45;
    background:var(--surface-2);border:1px solid var(--line)}
.qm b{display:block;font-size:12px;font-weight:700;color:var(--ink2)}
.qm span{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:1px}
.qm.on{background:var(--ok-soft);border-color:rgba(14,159,110,.22)}
.qm.on b{color:var(--ok-ink)}
.qm.off{background:transparent;border-style:dashed;color:var(--ink4);font-size:11.5px;padding:4px 9px}
.qm.none{background:transparent;border-style:dotted;color:var(--ink4);font-size:11.5px;padding:4px 9px;opacity:.75}
.qm.lib{background:var(--info-soft);border-color:rgba(47,127,216,.18)}
.qm.lib b{color:var(--info-ink)}
.qm.src{background:transparent;border:0;padding:2px 0 0;margin-top:5px;
        font-size:11px;color:var(--ink4);font-family:var(--mono)}
/* ⭐⭐ §117（2026-11-01 蛙哥）：两块新的体积/画质块，跟 `.qm.on`（mteam 盘上）**同规格**。
     .qm.hnq   hanime **源侧**这一集（画质 + 体积）—— 用紫，和绿（盘上）/蓝（Emby 库里）分开：
               绿=已经在盘上，蓝=已经整理进库，紫=源站能下但还没下。三种状态不该同色。
     .qm.list  mteam **清单**里有、还没落盘 —— 灰底（不是"到手"，但体积是真的）
   ⚠️ 体积与画质**同一行**（`源侧 1080p · 438 MB`）：蛙哥说原来只有 9.5px 灰字很难看见，
      拆成两行反而更碎。第二行留给状态（直链可下 / 已过期 / 未落盘）。 */
.qm.hnq{background:var(--surface-3);border-color:rgba(124,92,214,.20)}
.qm.hnq b{color:var(--purple-ink);font-size:12.5px}
.qm.hnq.on{background:var(--purple-soft);border-color:rgba(124,92,214,.26)}
.qm.hnq.none{background:transparent;border-style:dashed;color:var(--ink4);
             font-size:11.5px;padding:4px 9px}
.qm.list{background:var(--surface-3);border-style:dashed;border-color:var(--line2)}
.qm.list b{color:var(--ink2);font-size:12.5px}
.qm.list span{color:var(--ink4)}
/* ⭐ §116（2026-11-01 蛙哥「26年落盘了，怎么不把文件名匹配上去，就只显示大小」）
   表头本来就写「mteam **标题** 盘上实测体积/画质」，但一直只画了体积/画质，标题没画。
   文件名是唯一能一眼确认「这集到底是哪一部 / 第几卷」的证据（番号+卷号都在里面）。
   ⇒ 双行 clamp（⛔ 不用 nowrap 单行省略：178px 只能露十几个字，等于没显示），
     全文走 title，多文件在下面补一行「共 N 个文件」。 */
/* ⭐ §146（2026-11-03 蛙哥「视频信息也展示完整吧，这样方便我和 mteam 标题和
   hanime 的日语原标题三方核对」）：绿框里的文件名**不再截两行**。
   这个名字是三方核对（TMDB 集名 / mteam 文件名 / hanime 日文原名）里唯一的
   「盘上到底是哪一个文件」的物证，截断等于核对不了。 */
.qm .qf{display:block;overflow:visible;
        font-family:var(--sans);font-size:11px;line-height:1.45;
        color:var(--ink2);margin-top:4px;word-break:break-all}
.qm.on .qf{color:var(--ok-ink)}
.qm .qf.more{display:block;font-family:var(--mono);font-size:10px;color:var(--ink4);
             margin-top:2px;-webkit-line-clamp:unset;overflow:visible}

.aln-q{font-size:12px}
.qv{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11.5px;
    font-weight:700;white-space:nowrap;line-height:1.6}
.q-mt{background:var(--ok-soft);color:var(--ok-ink)}
.q-mt2{background:rgba(14,159,110,.10);color:var(--ok-ink)}
.q-even{background:var(--surface-3);color:var(--ink2)}
.q-lib{background:var(--info-soft);color:var(--info-ink)}
.q-warn{background:var(--warn-soft);color:var(--warn-ink)}
.q-bad{background:var(--bad-soft);color:var(--bad-ink)}
.q-only{background:var(--surface-3);color:var(--ink3)}
.q-wait{background:rgba(47,127,216,.12);color:var(--info-ink)}
.q-same{background:var(--surface-3);color:var(--ink4)}
.qn{margin-top:5px;font-size:11px;line-height:1.5;color:var(--ink3)}

.aln-tbl tbody tr:hover td{background:var(--surface-2)}
/* 🔴 §117（2026-11-01 蛙哥「怎么26年的单独一个样式」）——
   **整行底色全部撤掉**。原来是按判定给整行铺色：未配上/卷号推定 米黄、缺源 淡红、
   季内对应 淡绿、整部包 淡蓝。结果 2026 那几部刚好都是「卷号推定 / 未配上」，
   整行铺满米黄 ⇒ 蛙哥看着像「26 年单独一套皮」，其实跟年份毫无关系。
   判定这件事**已经有一整列**（`.aln-how` 带字色 + 字重），⛔ 不需要再染整行；
   整行染色还会把「源侧 / mteam / 画质」三块的信息块背景全搅浑。 */
.aln-r.unmatched .aln-how{color:var(--warn-ink);font-weight:700}
/* ⭐ §123（2026-11-01 蛙哥「我点击就可以跳转到看板看匹配的对不对」）：
   mteam 页「→ S1E7」深链点进来时，把命中那一集标出来。
   ⚠️ 与 §117 撤掉的「按判定染整行」不是一回事：这里只是**一次性定位标记**
      （左侧竖条 + 2 秒闪一次背景），用完就没了，不表达任何判定倾向。 */
.aln-r.dl-hit{animation:dlflash 5s ease-out 1}
.aln-r.dl-hit td:first-child{border-left:3px solid var(--brand);padding-left:7px}
.aln-r.dl-hit .aln-code{color:var(--brand-ink)}
@keyframes dlflash{0%,26%{background:rgba(79,70,229,.16)}100%{background:transparent}}
.aln-code{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}
.aln-r.miss .aln-code{color:var(--bad-ink)}
.aln-ep{color:var(--ink);font-weight:650;font-size:14.5px;line-height:1.45;word-break:break-word}
.aln-date{display:block;font-family:var(--mono);font-size:11px;color:var(--ink4);font-weight:400;margin-top:4px}
/* ⭐⭐ §112（2026-10-31 蛙哥）：「剧集简介也可以安排上，全库安排剧集简介，格式自行决定，要看着顺眼」。
   放在**集名下方**、压成 2 行，点一下展开 —— ⛔ 不另起一整行表格：
   逐集表本来就 8 列，再插一行简介会把「一眼扫完」毁掉，而行高变化会让相邻集错位。
   字号比集名小一档、颜色退到 ink3，读的时候是「补充」不是「正文」。 */
.aln-epdesc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin-top:5px;font-size:11.5px;line-height:1.6;font-weight:400;color:var(--ink3);
  cursor:pointer;white-space:pre-wrap;word-break:break-word}
.aln-epdesc:hover{color:var(--ink2)}
.aln-epdesc.open{-webkit-line-clamp:unset;overflow:visible;color:var(--ink2)}
/* §112：hanime 标题改成中文优先后，`[中文字幕]` 这个信息不能跟着丢 ⇒ 单独出个小徽章 */
.aln-cc{margin-left:6px;font-size:10px;font-weight:700;color:var(--ok-ink);
  border:1px solid currentColor;border-radius:4px;padding:0 4px;vertical-align:1px}

/* ── 单集封面（TMDB 剧照）2026-10-22 ─────────────────────────────
   🔴 **剧照是横版，不是竖版海报**（蛙哥指出）—— 上一版按 2:3 竖版做（52×74），
      图被裁掉两侧，看着像竖条。
   🔴 第二版又错了一次（真浏览器实测才发现）：强制 `aspect-ratio:16/9` +
      `object-fit:cover` 对 **4:3 的剧照**（全库 466 张 / 12.9%）会**上下各裁 25%**，
      第 3 行人物的头直接被切掉 —— 截图里肉眼可见。
   ✅ 正确做法：**只给 max-width / max-height，不给确定的 width/height** ——
      浏览器按「等比缩放到能塞进 max 框」处理（CSS 2.1 §10.4 替换元素算法）：
        16:9 → 225×127   4:3 → 176×132
      两种都**完整显示、不裁切、也不出黑边**，且**和列宽解耦**
      （列宽在 fixed 布局下受 leftover 分配影响、不是写多少就多少，⛔ 不能拿它算图宽）。
   ⛔ 不要 `width:100%+aspect-ratio`（4:3 被裁）· ⛔ 不要写死 width（4:3 变形）
   · ⛔ 不要同时写死 height+max-width（出上下黑边）。
   实测比例分布：300×169 占 85.7%、300×225 占 12.9%、余下 1.2% 是 299×168 等近似值。 */
.aln-still{
  max-width:100%; max-height:132px; width:auto; height:auto;
  border-radius:8px; object-fit:contain;
  background:var(--surface-3);
  border:1px solid var(--line); display:block;
}
/* 无剧照占位块 —— 按 16:9 的视觉体量给，不留空洞 */
.aln-still.none{
  width:100%; max-width:235px; height:132px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:11.5px;color:var(--ink4);line-height:1.35;
}

.aln-src{font-size:13px;color:var(--ink2);word-break:break-word}
.aln-item{
  display:block;padding:9px 11px;border-radius:var(--r-s);
  background:var(--surface-2);margin:0 0 6px;border-left:3px solid var(--line2);
}
.aln-item:last-child{margin-bottom:0}
.aln-item .aln-t{
  display:block;font-size:14.5px;color:var(--ink);font-weight:600;line-height:1.45;
  word-break:break-word;
}
/* ⭐ §120（2026-11-01 蛙哥「26年的MTEAM也没改好」）：mteam 侧没有作品级源时，
   标题位改用**已匹配的文件名**顶 —— 文件名比源标题长得多（带 [260130][厂牌] 前缀），
   用 14.5px 会把整行撑高 ⇒ 降一档字号 + 双行 clamp（与 `.qm .qf` 同一套标准），
   全文走 title。⛔ 别改成单行省略：178px 只露十几个字，等于没显示。 */
/* ⭐ §146（2026-11-03 蛙哥「格式都不一样了」）：没有作品级源时用文件名顶标题位，
   **不能被降级成另一种版式** —— 原来字号降一档 + 双行 clamp，跟别的行一比就像另一个表格。
   ⇒ 与 `.aln-t` 同一字号/颜色/字重，只是内容不同；番号另外单独一行（与正常行同一位置）。
   ⛔ 也不再 clamp：文件名是核对的物证，截断就看不出是哪一集。 */
.aln-item .aln-t.is-file{
  font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.45;
  display:block;overflow:visible;
}
.aln-item .aln-id{
  display:block;font-family:var(--mono);font-size:11.5px;color:var(--ink3);margin-top:4px;
}
/* ⭐ 2026-10-22：日文原名**不再单行截断** —— 蛙哥反馈「标题缩在一起看不清」。
   ⭐ §142（2026-11-03 蛙哥「我说了要把 hanime 的日语原标题展示完整，你看又是省略，我都看不全」）：
   上一版改成「最多两行 clamp」仍然是省 —— 这格里的日文原标题经常 40~60 个字，
   两行装不下照样省略号，等于没显示。
   ⇒ **彻底去掉 clamp**：让它自然换行到完整（这格本来就是「看原名」用的，
     行高被撑开是可接受的；旁边中文标题/编号/标签仍在，不影响横向对齐）。 */
.aln-item .aln-ja{
  display:block;font-size:13px;color:var(--ink3);margin-top:4px;line-height:1.5;
  word-break:break-word;white-space:normal;
}
/* ⭐ 2026-10-21：源站播放清单编号
   同一清单号 = 源站把这几个视频归在同一部里 ⇒ 核对时的**客观分组证据**。
   只做小角标，不抢标题的注意力。 */
.aln-item .aln-pl{
  display:inline-block;font-family:var(--mono);font-size:10px;line-height:15px;
  color:var(--ink3);border:1px solid var(--line2);border-radius:4px;
  padding:0 4px;margin-top:3px;
}

/* ══════════════════════════════════════════════════════════════════════
   ⭐ 2026-10-31（§108）hanime 逐集标签 + 预览图
   ----------------------------------------------------------------------
   蛙哥：「hanime 的每一集都把他的标签抓下来放到对应的集数，看标签就知道类型……
          有的集数标签特别多，可能放不下，你自行评估应该怎么修改」

   尺寸决策（实测每集 6~27 个，最多见过 30+）：
     · 默认只摆前 8 个（`TAG_SHOW`），其余折进 `.aln-tagrest[hidden]` + 一枚「+N」
     · ⛔ 不能全摆：27 个 chip 大约要 5 行，等比撑高整张逐集对照表，
       而这张表是「扫一眼看哪集缺源」用的 —— 行高一乱就没法扫
     · chip 走 11px/20px 高度，和 `.aln-pl` 清单角标同族（不抢标题注意力）
   ══════════════════════════════════════════════════════════════════════ */
.aln-tags{
  display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;
}
.aln-tag{
  font-size:11px;line-height:18px;padding:0 6px;border-radius:999px;
  background:var(--rose-soft);color:var(--rose-ink);
  border:1px solid rgba(212,83,126,.18);
  white-space:nowrap;
}
.aln-tagrest{display:contents}          /* 展开后和前面的 chip 同一行流 */
.aln-tagrest[hidden]{display:none}
.aln-tagmore{
  font:inherit;font-size:11px;line-height:18px;padding:0 7px;border-radius:999px;
  cursor:pointer;white-space:nowrap;
  background:var(--surface-3);color:var(--ink3);
  border:1px dashed var(--line2);
  transition:background .12s,color .12s,border-color .12s;
}
.aln-tagmore:hover{background:var(--brand-soft);color:var(--brand-ink);border-color:rgba(43,92,230,.35)}

/* ══ §151/§153 标签档位（2026-11-04 蛙哥）══════════════════════════
   蛙哥原话：「扶他、伪娘我是避开的，但触手我能半接受，但我也想高亮突出，
   又不想和避开的一样分不清，多几个等级，我可以自由搭配」
   ⇒ **四档**（§153）：
      1 避开 = 红实心（绝对不要）
      2 谨慎 = 琥珀浅底深字（能看，但要多留个心眼）
      3 喜欢 = 绿实心
      4 本命 = 紫实心（特别喜欢）
      0 未标 = 灰（不关心，⛔ 不给它上色）

   🔴 配色三条原则：
      ① 红与琥珀**色相拉开 35°**，且红是实心白字、琥珀是浅底深字 ——
         即使色觉偏弱，也能靠「底色的深浅」区分，不会糊成一片。
      ② 紫只给「本命」，不进警示区；红/琥珀永远排最前，紫/绿在后，
         一眼扫下去先看到「要躲的」，再看到「想要的」。
      ③ 默认灰：一屏几十个粉 chip 里红色的「避开」根本跳不出来（§151 实测）。 */
.aln-tag{
  background:var(--surface-3); color:var(--ink3);
  border-color:var(--line2);
}
.aln-tag.mk1{
  background:var(--bad); color:#fff; border-color:var(--bad); font-weight:750;
  box-shadow:0 1px 4px -2px rgba(220,43,43,.6);
}
.aln-tag.mk2{
  background:#FBEBCF; color:#8A5300; border-color:#E0A33A; font-weight:750;
}
.aln-tag.mk3{
  background:var(--ok); color:#fff; border-color:var(--ok); font-weight:750;
}
.aln-tag.mk4{
  background:#7C3AED; color:#fff; border-color:#7C3AED; font-weight:750;
  box-shadow:0 1px 4px -2px rgba(124,58,237,.55);
}

/* ⛔ §152：这里原来是卡片级角标（.cmkline/.cmk）与封面红圈（.card.tagr .poster::after）。
   蛙哥「只想在二级看板里的 hanime 标签展示而已，而不是全局显示」⇒ 全部删除。
   标记只影响抽屉里来源列（hanime）的 chip：`.aln-tag.mk1~mk4`，见上文。 */

/* ══ §151 标签档位设置页 ══════════════════════════════════════ */
.tgm-tools{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px}
.tgm-tools input[type=search]{
  flex:1 1 220px; min-width:180px; font:inherit; font-size:12.5px;
  padding:6px 10px; border-radius:var(--r-s);
  border:1px solid var(--line2); background:var(--surface-2); color:var(--ink);
}
.tgm-tools input[type=search]:focus{outline:none; border-color:var(--ok); background:var(--surface)}
.tgm-sum{font-size:11.5px; color:var(--ink3); font-family:var(--mono)}
.tgm-sum b.r{color:var(--bad)}
.tgm-sum b.o{color:#C07800}
.tgm-sum b.g{color:var(--ok)}
.tgm-sum b.p{color:#7C3AED}
.tgm-list{
  max-height:64vh; overflow:auto; border:1px solid var(--line2);
  border-radius:var(--r-s); background:var(--surface);
}
.tgm-row{
  display:flex; align-items:center; gap:10px; padding:5px 10px;
  border-bottom:1px solid var(--line);
}
.tgm-row:last-child{border-bottom:0}
.tgm-row:hover{background:var(--surface-2)}
.tgm-row.pick-r{background:var(--bad-soft)}
.tgm-row.pick-o{background:#FCF1DA}
.tgm-row.pick-g{background:var(--ok-soft)}
.tgm-row.pick-p{background:#F3EEFE}
.tgm-name{flex:1 1 auto; font-size:12.5px; color:var(--ink); min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tgm-name em{font-style:normal; font-family:var(--mono); font-size:10.5px; color:var(--ink4); margin-left:6px}
.tgm-n{font-family:var(--mono); font-size:11px; color:var(--ink4); min-width:42px; text-align:right}
.tgm-btns{display:flex; gap:5px; flex:0 0 auto; flex-wrap:wrap; justify-content:flex-end}
.tgm-b{
  font:inherit; font-size:11px; font-weight:650; cursor:pointer; white-space:nowrap;
  padding:2px 9px; border-radius:999px;
  border:1px solid var(--line2); background:var(--surface-2); color:var(--ink3);
  transition:background .12s, color .12s, border-color .12s;
}
.tgm-b:hover{border-color:var(--ink3); color:var(--ink)}
.tgm-b.on.r{background:var(--bad); border-color:var(--bad); color:#fff}
.tgm-b.on.o{background:#C07800; border-color:#C07800; color:#fff}
.tgm-b.on.g{background:var(--ok); border-color:var(--ok); color:#fff}
.tgm-b.on.p{background:#7C3AED; border-color:#7C3AED; color:#fff}
.tgm-empty{padding:22px; text-align:center; font-size:12.5px; color:var(--ink3)}

/* hanime 预览图当集海报（TMDB 没这集剧照时的回退）
   ⚠️ 和 TMDB 剧照同样按 contain 显示：预览图多是 16:9，直接 cover 会裁掉上下。 */
.aln-still.hn{object-fit:cover}
/* 安全模式 blur 档：回退封面没有预生成模糊图 ⇒ 用 CSS 现场模糊（⛔ 不加载清晰图） */
.aln-still.hnblur{filter:blur(22px) saturate(.55);transform:scale(1.02)}
/* 同一集上挂了**不同清单**的源 —— 可能这一行混装了别的作品，标黄提醒 */
.aln-item.pl-conflict{border-left-color:var(--warn-ink)}
.aln-item.pl-conflict .aln-pl{color:var(--warn-ink);border-color:var(--warn-ink)}
.aln-none{color:var(--ink4)}
.aln-how{font-size:11.5px;font-weight:600;line-height:1.45}
/* ⭐ 「集名对上」档（2026-10-23）—— 源标题引号里的集名逐字命中 TMDB 集名。
   比「集号对上」更硬（内容级证据 vs 序号级证据），用 ok 色 + 最深字重。 */
.aln-r.named .aln-how{color:var(--ok-ink);font-weight:700}
.aln-r.strong .aln-how{color:var(--ok-ink);font-weight:700}
.aln-r.season .aln-how{color:var(--ok-ink);font-weight:600}
.aln-r.vol .aln-how{color:var(--info-ink);font-weight:600}
/* 整部包：源站只有一条、不标集号，一个种子覆盖整部（2026-10-22）——
   用 info 色，跟「卷号推定」同档视觉，但文字明确写「整部包」。
   ⛔ 不再给整行铺淡蓝底（§117 全部撤掉，见上面那条注释）。 */
.aln-r.pack .aln-how{color:var(--info-ink);font-weight:600}
.aln-r.year .aln-how{color:var(--warn-ink);font-weight:600}
.aln-r.unk .aln-how{color:var(--ink4)}
.aln-r.miss .aln-how{color:var(--bad-ink);font-weight:700}
/* 推定档只弱化**字号以外的字色**，⛔ 不铺整行底（那里留给三个信息块自己表达） */
.aln-r.vol .aln-t,.aln-r.year .aln-t{color:var(--ink2)}

/* ── 「入库判定」列（2026-10-22 新增）───────────────────────────
   数据源：local_file → local_work → tmdb_work（**两跳**关联）。
   只回答一个问题：**这一集在本地媒体库里到底有没有文件**。 */
.aln-store{font-size:11.5px;font-weight:700;line-height:1.5;white-space:nowrap}
.aln-store.yes{color:var(--ok-ink)}
.aln-store.no{color:var(--ink4);font-weight:500}
.aln-store.part{color:var(--warn-ink)}
.aln-store .aln-store-n{
  display:block;font-family:var(--mono);font-size:10px;color:var(--ink4);font-weight:500;
}

/* ── AI 总结（2026-10-22 · 蛙哥设计图新增区块）──────────────────
   ⚠️ 这是**规则归纳**，不是外部大模型调用 —— 数据全部来自这次接口返回的
      alignment / evidence / local，不产生任何新判断。
      标题里明确写「自动归纳」，避免被当成人工结论。 */
.ai-sum{
  border:1px solid var(--line);border-radius:var(--r-m);
  background:linear-gradient(180deg,var(--surface-2),var(--surface));
  padding:18px 20px;margin-bottom:20px;
}
.ai-sum .ai-h{
  display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:750;
  color:var(--ink3);letter-spacing:.03em;margin-bottom:11px;
}
.ai-sum .ai-h .tag{
  font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:99px;
  background:var(--brand-soft);color:var(--brand-ink);letter-spacing:0;
}
.ai-sum .ai-line{font-size:15.5px;font-weight:700;line-height:1.55;color:var(--ink)}
.ai-sum ul{margin:10px 0 0;padding:0;list-style:none}
.ai-sum li{
  font-size:13.5px;line-height:1.75;color:var(--ink2);
  padding-left:16px;position:relative;
}
.ai-sum li::before{content:'·';position:absolute;left:4px;color:var(--ink4);font-weight:800}
.ai-sum li.warn{color:var(--warn-ink)}
.ai-sum li.bad{color:var(--bad-ink)}
.ai-sum li.ok{color:var(--ok-ink)}

.mask{
  position:fixed; inset:0; background:rgba(10,16,32,.44); z-index:100;
  opacity:0; pointer-events:none; transition:opacity .24s var(--ease);
  backdrop-filter:blur(3px);
}
.mask.on{opacity:1; pointer-events:auto}
/* ══ 抽屉 / 二级看板（2026-10-22 按蛙哥设计图重排）══════════════════
   原问题：660px 宽的抽屉里塞 5 列表格 ⇒ 每列只剩 ~110px，
          长标题被挤成竖条、单行省略号截断 ⇒「看不清、不直观」。
   现在：① 放到 1280px（96vw 自适应），表格用 fixed 布局 + colgroup
        ② 头部封面 60×90 → 96×144，标题 18px → 22px
        ③ meta 压成设计图那一行：年份 | tmdbid | 剧集简介
        ④ 页签改成两段式大按钮（设计图里的两个框）
        ⑤ 表格 5 列 → 7 列：加了「单集封面」「入库判定」                     */
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:min(1720px,98vw);
  background:var(--surface); z-index:101; box-shadow:var(--sh-3);
  transform:translateX(100%); transition:transform .3s var(--ease);
  display:flex; flex-direction:column;
}
.drawer.on{transform:none}
.dhead{
  padding:22px 32px 20px; border-bottom:1px solid var(--line);
  display:flex; align-items:flex-start; gap:20px;
  background:linear-gradient(to bottom,#FBFCFE,#fff);
}
.dhead .dthumb{
  width:112px; height:168px; border-radius:var(--r-m); flex:0 0 auto;
  object-fit:cover; background:linear-gradient(160deg,#E9ECF2,#DDE2EA);
  border:1px solid var(--line); box-shadow:var(--sh-1);
}
.dhead .dmain{flex:1; min-width:0}
.dhead h3{
  font-size:25px; font-weight:780; line-height:1.28; letter-spacing:-.02em;
  word-break:break-word;
}
/* 「年份 | tmdbid | 剧集简介」—— 设计图那一行 */
.dhead .dmeta{
  font-size:14px; color:var(--ink3); margin-top:11px;
  display:flex; align-items:baseline; flex-wrap:wrap; line-height:1.6;
}
.dhead .dmeta b{color:var(--ink2); font-weight:650}
.dhead .dmeta .sep{color:var(--ink4); margin:0 12px; font-weight:400; flex:0 0 auto}
.dhead .dmeta .num{font-family:var(--mono); font-size:13px}
.dhead .dmeta .desc{color:var(--ink2); flex:1 1 340px; min-width:0; font-size:13.5px}
.xbtn{
  border:1px solid var(--line2); background:var(--surface); width:32px; height:32px;
  border-radius:10px; cursor:pointer; font-size:18px; color:var(--ink3); flex:0 0 auto;
  transition:all .14s var(--ease); line-height:1;
}
.xbtn:hover{background:var(--ink); color:#fff; border-color:var(--ink)}

/* 页签 —— 两段式大按钮（设计图里的两个框，等宽撑满） */
.dtabs{
  display:flex; gap:10px; padding:14px 32px; border-bottom:1px solid var(--line);
  background:var(--surface); flex:0 0 auto;
}
.dtabs button{
  flex:1; justify-content:center; border:1px solid var(--line);
  background:var(--surface-2); padding:13px 18px; font-size:15px;
  font-weight:700; color:var(--ink3); border-radius:var(--r-s);
  cursor:pointer; transition:.14s var(--ease); white-space:nowrap;
  display:inline-flex; align-items:center; gap:8px;
}
.dtabs button:hover{color:var(--ink2); border-color:var(--line2)}
.dtabs button.on{
  color:var(--brand-ink); background:var(--brand-soft);
  border-color:rgba(79,70,229,.32); box-shadow:var(--sh-1);
}
.dtabs .n{
  font:700 11px var(--mono); padding:1px 7px; border-radius:99px;
  background:var(--surface-3); color:var(--ink2);
}
.dtabs button.on .n{background:#fff; color:var(--brand-ink)}
.dtabs .n.alert{background:var(--bad-soft); color:var(--bad-ink)}

.dbody{flex:1; overflow-y:auto; padding:22px 32px 56px; overscroll-behavior:contain}

/* ══ §82 抽屉底部翻页条 ══════════════════════════════════════════════
   蛙哥 2026-10-29：「加一个上一部下一部的切换，让我一部一部切换核对」
   🔴 位置用的是 **flex 列第三段**（`.drawer` 是 `display:flex;flex-direction:column`），
      ⛔ 不用 `position:sticky` —— 多层 sticky 吃死 offset 必错位（0r4），
      而且 `.dbody` 才是滚动容器，sticky 反而会跟着内容跑。 */
.dnav{
  flex:0 0 auto; position:relative;
  display:flex; align-items:center; justify-content:center; gap:14px;
  padding:12px 32px; border-top:1px solid var(--line);
  background:linear-gradient(to top,#FBFCFE,#FFFFFF);
}
.dnav-b{
  height:34px; padding:0 16px; border-radius:var(--r-s);
  border:1px solid var(--line2); background:var(--surface);
  font-size:var(--fs-xs); font-weight:650; color:var(--ink2);
  transition:border-color .16s var(--ease), color .16s var(--ease), background .16s var(--ease);
}
.dnav-b:hover:not(:disabled){ border-color:var(--brand); color:var(--brand-ink); background:var(--brand-soft) }
.dnav-b:active:not(:disabled){ transform:translateY(1px) }
.dnav-b:disabled{ opacity:.36; cursor:not-allowed }
.dnav-pos{
  font-size:var(--fs-xs); color:var(--ink3);
  font-variant-numeric:tabular-nums; letter-spacing:.02em; min-width:104px; text-align:center;
}
.dnav-pos b{ color:var(--ink); font-weight:750; font-size:var(--fs-sm) }
.dnav-hint{
  position:absolute; right:32px; font-size:var(--fs-xx); color:var(--ink4);
}
.dsect{margin-bottom:22px}
.dsect:last-child{margin-bottom:0}
.dsect h4{
  font-size:var(--fs-xx); font-weight:750; color:var(--ink3); text-transform:uppercase;
  letter-spacing:.07em; margin-bottom:10px;
  display:flex; align-items:center; gap:8px;
}

/* 结论横幅 */
.dverdict{
  display:flex; gap:13px; align-items:flex-start;
  padding:13px 15px; border-radius:var(--r-l); border:1px solid var(--line);
  background:var(--surface-2); margin:0 0 14px;
}
.dverdict .dvi{
  width:30px; height:30px; border-radius:9px; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center;
  font-size:15px; font-weight:800;
  background:var(--surface-3); color:var(--ink3);
}
.dverdict .dvh{font-size:14.5px; font-weight:750; letter-spacing:-.01em; line-height:1.35}
.dverdict .dvt{font-size:12.5px; color:var(--ink2); margin-top:3px; line-height:1.5}
.dverdict.v-ok    {background:var(--ok-soft);    border-color:rgba(14,159,110,.26)}
.dverdict.v-ok    .dvi{background:var(--ok); color:#fff}
.dverdict.v-ok    .dvh{color:var(--ok-ink)}
.dverdict.v-warn  {background:var(--warn-soft);  border-color:rgba(192,120,0,.28)}
.dverdict.v-warn  .dvi{background:var(--warn); color:#fff}
.dverdict.v-warn  .dvh{color:var(--warn-ink)}
.dverdict.v-bad   {background:var(--bad-soft);   border-color:rgba(220,43,43,.28)}
.dverdict.v-bad   .dvi{background:var(--bad); color:#fff}
.dverdict.v-bad   .dvh{color:var(--bad-ink)}
.dverdict.v-unknown{background:var(--surface-2)}
.dverdict .dvcnt{margin-left:auto; text-align:right; flex:none}
.dverdict .dvcnt b{font-size:19px; font-weight:780; letter-spacing:-.03em; display:block; line-height:1.1}
.dverdict .dvcnt span{font-size:10.5px; color:var(--ink3); white-space:nowrap}

/* 键值表（抽屉最下面的「元信息」块用） */
.kv{display:grid; grid-template-columns:96px 1fr; gap:8px 16px; font-size:var(--fs-xs)}
.kv dt{color:var(--ink3)}
.kv dd{color:var(--ink); word-break:break-word}

/* 溯源页里的六因子小节 */
.fblk{margin-top:16px}
.fblk h4{
  font-size:var(--fs-xx); font-weight:750; color:var(--ink3); text-transform:uppercase;
  letter-spacing:.07em; margin-bottom:10px;
  display:flex; align-items:center; gap:8px;
}
.fblk h4 .srcn{font-family:var(--mono); font-size:11.5px; font-weight:500; color:var(--ink4);
  text-transform:none; letter-spacing:0}

/* 底部「元信息」块 —— 明确当成附录，视觉上比溯源轻一档 */
.metablk{
  margin-top:24px; padding-top:18px; border-top:1px dashed var(--line2);
}
.metablk h4{
  text-transform:none; letter-spacing:.03em; font-size:var(--fs-xs);
  color:var(--ink4); margin-bottom:9px;
}

/* 六因子网格 —— 原来是 6 行长句，现在 6 张小卡 */
.fgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:8px}
.fitem{
  border:1px solid var(--line); border-left:3px solid var(--ink4);
  border-radius:var(--r-s); padding:9px 11px; background:var(--surface-2);
}
.fitem .ff{
  font-size:12px; font-weight:750; display:flex; gap:6px; align-items:center;
  color:var(--ink);
}
.fitem .ff .m{font-size:12px; font-weight:800}
.fitem .ft{font-size:11.5px; color:var(--ink2); margin-top:3px; line-height:1.5}
.fitem.ok     {border-left-color:var(--ok)}
.fitem.ok .ff .m{color:var(--ok)}
.fitem.warn   {border-left-color:var(--warn)}
.fitem.warn .ff .m{color:var(--warn)}
.fitem.bad    {border-left-color:var(--bad); background:var(--bad-soft)}
.fitem.bad .ff .m{color:var(--bad)}
.fitem.unknown{border-left-color:var(--ink4)}
.fitem.unknown .ff .m{color:var(--ink4)}

/* 双口径对照条 */
.calib{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin:0 0 14px; padding:9px 12px; border-radius:var(--r-m);
  background:var(--info-soft); border:1px solid rgba(47,127,216,.18);
  font-size:12px; color:var(--info-ink); font-family:var(--mono);
}
.calib .cb b{font-size:15px; font-weight:780; margin:0 1px}
.calib .cs{opacity:.5; font-size:11px; letter-spacing:.5px}
.calib .cy{
  margin-left:auto; padding:2px 8px; border-radius:99px;
  background:rgba(255,255,255,.72); color:var(--ink2); font-size:11.5px;
}

/* 溯源分组 */
.srcgrp{margin-top:12px}
.srcgrp-h{display:flex; align-items:center; gap:8px; margin-bottom:8px}
.srcgrp-h .srcn{font-family:var(--mono); font-size:11.5px; color:var(--ink3)}

/* 单条源记录 —— 决定性字段放大成标签，次要字段一行灰字 */
.srow{
  border:1px solid var(--line); border-radius:var(--r-m);
  background:var(--surface); margin-bottom:8px; overflow:hidden;
  transition:box-shadow .16s var(--ease);
}
.srow:hover{box-shadow:var(--sh-1)}
.srow-h{display:flex; gap:10px; align-items:flex-start; padding:10px 12px 8px}
.srow-key{
  font:600 11px var(--mono); color:var(--ink2); background:var(--surface-3);
  padding:2px 7px; border-radius:var(--r-xs); white-space:nowrap; flex:none;
  max-width:150px; overflow:hidden; text-overflow:ellipsis;
}
.srow-title{font-size:13.5px; font-weight:650; line-height:1.4; flex:1; min-width:0; word-break:break-word}
.srow-year{
  font-size:11.5px; font-weight:750; padding:3px 9px; border-radius:99px;
  white-space:nowrap; flex:none;
}
.srow-year.ok{background:var(--ok-soft); color:var(--ok-ink)}
.srow-year.warn{background:var(--warn-soft); color:var(--warn-ink)}
.srow-year.bad{background:var(--bad-soft); color:var(--bad-ink)}
.srow-year.unknown{background:var(--surface-3); color:var(--ink3)}
.srow-sub{
  padding:0 12px 10px; display:flex; flex-wrap:wrap; gap:6px 12px;
  font-size:11.5px; color:var(--ink3); font-family:var(--mono);
  align-items:center;
}
.srow-sub .sep{color:var(--ink4)}
.srow-more{padding:0 12px 10px}

/* hanime 逐集明细 —— 默认收起，不再一进来就铺一整张表 */
.edt{margin-top:2px}
.edt>summary{
  cursor:pointer; font-size:11.5px; color:var(--ink2); font-family:var(--mono);
  padding:6px 9px; user-select:none; list-style:none;
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-s);
  display:inline-block;
}
.edt>summary::-webkit-details-marker{display:none}
.edt>summary::before{content:'▸ '; color:var(--ink3)}
.edt[open]>summary::before{content:'▾ '}
.edt>summary b{color:var(--ink); font-weight:700}
.etbl{
  width:100%; border-collapse:collapse; margin-top:6px;
  font-size:11.5px; font-family:var(--mono);
}
.etbl th{
  text-align:left; font-weight:600; color:var(--ink3);
  padding:5px 7px; border-bottom:1px solid var(--line); white-space:nowrap;
  background:var(--surface-2);
}
.etbl td{
  padding:5px 7px; border-bottom:1px solid var(--line);
  color:var(--ink2); vertical-align:top;
}
.etbl tbody tr:last-child td{border-bottom:none}
.etbl td.ec{color:var(--ink4); width:26px; text-align:right}
.etbl td.evid a{color:var(--info-ink); text-decoration:none}
.etbl td.evid a:hover{text-decoration:underline}
.etbl td.epg, .etbl td.ep2{color:var(--ink3); white-space:nowrap}
.etbl td.etl{
  font-family:var(--sans); color:var(--ink); word-break:break-word; min-width:170px;
}
.etbl td.etlja, .etbl th.etlja{
  font-family:var(--sans); color:var(--ink);
  background:rgba(47,127,216,.06);
  word-break:break-word; min-width:170px;
}

/* ══ 入库检测 ═══════════════════════════════════════════════════════ */
.intakebar{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px}
.ibox{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l);
  padding:15px 17px; position:relative; overflow:hidden; box-shadow:var(--sh-1);
}
.ibox::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px}
.ibox.ok::before{background:var(--ok)} .ibox.warn::before{background:var(--warn)}
.ibox.bad::before{background:var(--bad)} .ibox.gray::before{background:var(--ink4)}
.ibox .il{font-size:12px; color:var(--ink3); margin-bottom:4px}
.ibox .iv{font-size:30px; font-weight:780; letter-spacing:-.035em; line-height:1.1}
.ibox.ok .iv{color:var(--ok-ink)} .ibox.warn .iv{color:var(--warn-ink)}
.ibox.bad .iv{color:var(--bad-ink)} .ibox.gray .iv{color:var(--ink2)}
.ibox .ix{font-size:11px; color:var(--ink3); margin-top:3px; font-family:var(--mono)}

.covbar{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l);
  padding:15px 17px; margin-bottom:20px; box-shadow:var(--sh-1);
}
.covbar .ch{display:flex; align-items:baseline; gap:10px; margin-bottom:10px}
.covbar .ch b{font-size:21px; font-weight:780; letter-spacing:-.025em}
.covbar .ch span{font-size:12px; color:var(--ink3)}
.covtrack{height:9px; border-radius:999px; background:var(--surface-3); overflow:hidden; border:1px solid var(--line)}
.covfill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--ok) 0%,var(--ok-ink) 100%)}

.stable{width:100%; border-collapse:collapse; font-size:var(--fs-xs); background:var(--surface);
  border:1px solid var(--line); border-radius:var(--r-l); overflow:hidden}
.stable th{
  text-align:left; padding:10px 13px; border-bottom:1px solid var(--line);
  font-weight:700; color:var(--ink3); font-size:11px; text-transform:uppercase;
  letter-spacing:.05em; background:var(--surface-2);
}
.stable td{padding:10px 13px; border-bottom:1px solid var(--line); vertical-align:middle}
.stable tbody tr:last-child td{border-bottom:none}
.stable tbody tr{cursor:pointer}
.stable tbody tr:hover td{background:var(--surface-2)}
.stable .nm{font-weight:650; font-size:13.5px}
/* 🔴 2026-10-29：原为 `.stable .yr` —— 与年份轨道的 `.yr`（按钮）撞名，
   表格的年份格被当成按钮染上了边框/底色（截图里年份是深色胶囊），
   更要命的是 renderTrack 的全局 `.yr` 选择器把表格行也数进去 ⇒ 切视图必崩。
   ⇒ 单元格改名 `.iyear`，与按钮彻底分开。 */
.stable .iyear{font-family:var(--mono); color:var(--ink3); font-size:11.5px}
.stable .ms{font-family:var(--mono); font-size:11.5px; color:var(--bad-ink); letter-spacing:-.01em}
.stable .rt{font-family:var(--mono); font-size:11.5px; color:var(--ink3); text-align:right}

.seasons{display:flex; flex-direction:column; gap:18px}
.sghd{
  display:flex; align-items:center; gap:10px; padding-bottom:8px;
  border-bottom:1px solid var(--line); margin-bottom:12px;
}
.sghd h4{font-size:var(--fs-sm); font-weight:700}
.sghd .cnt{font-family:var(--mono); font-size:11.5px; color:var(--ink3)}
.sghd .badge{
  position:static; padding:3px 9px; border-radius:var(--r-xs); font-size:11px; font-weight:700;
  background:var(--ok-soft); color:var(--ok-ink);
}
.sghd .badge.part{background:var(--warn-soft); color:var(--warn-ink)}
.sghd .badge.miss{background:var(--bad-soft); color:var(--bad-ink)}
.sghd .tagsp{flex:1}

.epsgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:9px}
.epcell{
  display:flex; gap:10px; align-items:flex-start; padding:9px 11px;
  border:1px solid var(--line); border-radius:var(--r-m); background:var(--surface);
  transition:all .14s var(--ease);
}
.epcell.owned{border-left:3px solid var(--ok)}
.epcell.miss{ border-left:3px solid var(--bad); background:var(--bad-soft)}
.epcell:hover{box-shadow:var(--sh-1)}
.epno{
  font-family:var(--mono); font-size:11.5px; font-weight:700; flex:0 0 auto;
  padding:2px 6px; border-radius:var(--r-xs); background:var(--surface-2); color:var(--ink2);
  border:1px solid var(--line);
}
.epcell.owned .epno{background:var(--ok-soft); color:var(--ok-ink); border-color:rgba(14,159,110,.3)}
.epcell.miss .epno{background:var(--bad); color:#fff; border-color:var(--bad)}
.epinfo{min-width:0; flex:1}
.epname{
  font-size:12.5px; color:var(--ink); line-height:1.4; word-break:break-all;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.epfile{
  font-size:11px; color:var(--ink3); font-family:var(--mono); margin-top:3px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.epmissing{font-size:11.5px; color:var(--bad-ink); font-weight:700}

.empty{padding:64px 20px; text-align:center; color:var(--ink3)}
.empty b{display:block; font-size:var(--fs-md); color:var(--ink2); margin-bottom:7px}

/* 季集格子（抽屉「季集」页） */
.season{margin-bottom:18px}
.sname{
  font-size:var(--fs-xs); font-weight:750; color:var(--ink2);
  padding-bottom:6px; margin-bottom:9px; border-bottom:1px solid var(--line);
  display:flex; justify-content:space-between; align-items:baseline;
}
.sname .sp{font-family:var(--mono); color:var(--ink3); font-weight:400}

/* ⭐ 2026-10-26（§69 ⑥）：季级屏蔽按钮 + 「已屏蔽季」提示条。
   🔴 类名带 `whid` 前缀（0gq/0gr：⛔ 不用裸短词 —— `.chk` 套到 `.card` 上
      曾把整卡压成 60px；新类必须先 grep 确认不撞名再落地）。 */
.whid-btn{
  font:inherit; font-size:10.5px; font-weight:700;
  padding:2px 8px; border-radius:999px; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--ink3);
  transition:color .15s, border-color .15s, background .15s;
  white-space:nowrap;
}
.whid-btn:hover{color:var(--ink1); border-color:var(--ink3)}
.whid-btn.on{
  color:var(--c1b); border-color:currentColor; background:color-mix(in srgb, var(--c1b) 8%, transparent);
}
.whid-note{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:9px 12px; margin-bottom:16px; border-radius:var(--r-s);
  border:1px dashed var(--line); background:var(--surface-2, #F7F9FC);
  font-size:var(--fs-xs); color:var(--ink2);
}
.whid-note .whid-tag{
  font-family:var(--mono); font-weight:750; color:var(--ink1);
  background:var(--surface); border:1px solid var(--line);
  border-radius:999px; padding:1px 8px;
}
.whid-note .whid-hint{color:var(--ink3); font-size:11px}

.eps{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:9px}
.ep{border-radius:var(--r-s); overflow:hidden; border:1px solid var(--line); background:var(--surface)}
/* 🔴 2026-10-22：`cover` 在 4:3 剧照（12.9%）上会裁掉上下各 25%（人物头被切）。
   卡片是统一网格 ⇒ 盒子仍保持 16:9，但图改 `contain`：4:3 出左右细边，
   **完整显示不裁人**。视觉上比切头可接受得多。 */
.ep .st{aspect-ratio:16/9; background:#E9ECF2; position:relative}
.ep .st img{width:100%; height:100%; object-fit:contain; display:block}
.ep .st .nph{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:10.5px; color:var(--ink3);
}
.ep .lb{padding:6px 8px 7px}
.ep .en{font-family:var(--mono); font-size:10.5px; color:var(--info-ink); font-weight:700}
.ep .t{
  font-size:11.5px; color:var(--ink2); margin-top:2px; line-height:1.35;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}

/* ══ 逐件屏蔽 ═══════════════════════════════════════════════════════ */
.hiddenbar{
  display:flex; align-items:center; gap:8px; margin:2px 0 14px;
  padding:8px 13px; border-radius:var(--r-m); cursor:pointer;
  background:var(--surface-2); border:1px solid var(--line);
  font-size:var(--fs-xs); color:var(--ink3); user-select:none;
  transition:background .16s var(--ease);
}
.hiddenbar:hover{background:var(--surface-3)}
.hiddenbar .hn{font-weight:750; color:var(--ink2)}
.hiddenbar .htip{margin-left:auto; opacity:.7}
.card.hidden .poster{filter:grayscale(1) opacity(.42)}
.card.hidden .ct{opacity:.5}
.card.hidden::after{
  content:'已屏蔽'; position:absolute; top:8px; left:8px; z-index:3;
  font-size:10px; font-family:var(--mono); letter-spacing:.04em;
  padding:2px 6px; border-radius:var(--r-xs);
  background:rgba(30,34,44,.72); color:#fff;
}
#hdrawer{
  position:fixed; top:0; right:0; height:100%; width:min(430px,93vw);
  background:var(--surface); border-left:1px solid var(--line);
  box-shadow:var(--sh-3); z-index:60;
  transform:translateX(102%); transition:transform .26s var(--ease);
  display:flex; flex-direction:column;
}
#hdrawer.on{transform:none}
#hdrawer .hh{padding:16px 18px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px}
#hdrawer .hh h3{margin:0;font-size:var(--fs-lg);flex:1;min-width:0}
#hdrawer .hb{flex:1;overflow:auto;padding:10px 12px}
/* ⭐ 2026-10-31（§106）：已屏蔽清单搜索框 —— 与工具栏 .search 同一视觉 */
#hdrawer .hsearch{
  display:flex;align-items:center;gap:8px;margin:10px 12px 0;
  padding:7px 11px;border:1px solid var(--line2);border-radius:var(--r-m);
  background:var(--surface-2);transition:.15s var(--ease);
}
#hdrawer .hsearch:focus-within{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
#hdrawer .hsearch svg{flex:none;color:var(--ink3)}
#hdrawer .hsearch input{
  flex:1;min-width:0;border:0;background:transparent;font-family:var(--sans);
  font-size:var(--fs-sm);color:var(--ink);outline:0;
}
#hdrawer .hsearch input::-webkit-search-cancel-button{display:none}
#hdrawer .hclear{
  flex:none;width:20px;height:20px;padding:0;border:0;border-radius:50%;
  background:var(--surface-3);color:var(--ink2);font-size:14px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
#hdrawer .hclear:hover{background:var(--bad-soft);color:var(--bad-ink)}
/* 搜索命中词高亮 */
#hdrawer mark{background:var(--brand-soft);color:var(--brand-ink);border-radius:3px;padding:0 2px}
#hdrawer .hr{display:flex;align-items:center;gap:9px;padding:9px 10px;
  border-radius:var(--r-s);border:1px solid var(--line);margin-bottom:7px;
  background:var(--surface-2)}
#hdrawer .hr .hi{flex:1;min-width:0}
#hdrawer .hr .hin{font-size:var(--fs-sm);font-weight:650;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hdrawer .hr .him{font-size:10.5px;color:var(--ink3);font-family:var(--mono)}
#hdrawer .hbtn{font-size:11px;padding:4px 9px;border-radius:var(--r-xs);cursor:pointer;
  border:1px solid var(--line2);background:#fff;color:var(--ink2);white-space:nowrap}
#hdrawer .hbtn:hover{background:var(--surface-3)}
#hdrawer .hf{padding:11px 16px;border-top:1px solid var(--line);
  display:flex;gap:8px;align-items:center}
#hdrawer .hfoot-tip{font-size:11px;color:var(--ink3);margin-left:auto}
.dhidebtn{
  font-size:11.5px;padding:6px 12px;border-radius:var(--r-s);cursor:pointer;
  border:1px solid var(--line2);background:var(--surface);color:var(--ink2);
  white-space:nowrap; flex:none; transition:.14s var(--ease);
}
.dhidebtn:hover{background:var(--surface-2)}
.dhidebtn.on{background:var(--bad-soft);border-color:rgba(220,43,43,.3);color:var(--bad-ink);font-weight:700}

/* ══ 安全模式（隐私）═══════════════════════════════════════════════
   ⚠️ blur 档不是纯 CSS 效果 —— 图片改为懒加载占位，
      鼠标悬停时才真正请求 img 元素，图片不进网络传输。            */
.safe-on .poster img{
  filter:blur(26px) saturate(.55) brightness(1.06);
  transform:scale(1.14);
  transition:filter .28s var(--ease);
}
.safe-on .card:hover .poster img{filter:blur(13px) saturate(.7)}
.safe-hide .poster img,.safe-hide .poster .lockcover{display:none!important}
.safe-hide .poster{background:linear-gradient(160deg,#EDEFF3,#E2E5EA)}
.safe-hide .card:hover{transform:none}
.safe-hide .card{cursor:default}
.lockcover{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:6px;
  background:linear-gradient(160deg,#E9ECF2,#DDE2EA); color:var(--ink3);
}
.lockcover svg{opacity:.5}
.lockcover .lt{font-size:11px; font-family:var(--mono)}

@media(max-width:900px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
  .intakebar{grid-template-columns:repeat(2,1fr)}
  .statstrip{display:none}
  .brand .chain{display:none}
}
/* 2026-10-22：7 列表格在窄屏放不下 ⇒ 分两档退让，⛔ 不先砍其他列。
   1500px 以下：剧照列 226→170，图高同步 132→96（🔴 高度和列宽必须成对改，
               否则 16:9 图会被 max-width 压窄 ⇒ object-fit:contain 出上下黑边）
   1340px 以下：整列拿掉 + 列宽交回浏览器（table-layout:auto）
   🔴 为什么是 1340 而不是 1180：抽屉是 `98vw`，`.dbody` 还有 17px 竖滚动条，
      1366 的笔记本实际可用 ≈ 1322。实测列宽需求 = 固定列 424 + 66%×可用宽，
      正好在 1330 附近打平 ⇒ 取 1340 留 10px 余量（几何算过，不是拍的）。 */
@media(max-width:1500px){
  .aln-tbl col.c-still{width:170px}
  /* ⭐ §135：加了「来源」列 ⇒ hanime 列让 2 个点，来源列比默认窄一点（96px 够放两个 chip） */
  .aln-tbl col.c-han{width:23%}
  .aln-tbl col.c-pick{width:96px}
  .aln-still{max-height:96px}
  .aln-still.none{max-width:171px;height:96px}
}
@media(max-width:1340px){
  .aln-tbl{table-layout:auto}
  .aln-tbl col.c-still{width:0}
  .aln-tbl th:nth-child(2), .aln-tbl td:nth-child(2){display:none}
  .aln-tbl col.c-ep{width:76px}
  .aln-tbl col.c-how{width:74px}
  .aln-tbl col.c-store{width:84px}
  /* ⭐ §135：窄屏下来源列跟着收，⛔ 不能固定 106px（会把集名压成竖条） */
  .aln-tbl col.c-pick{width:88px}
}
@media(max-width:640px){
  .srcrow{grid-template-columns:1fr}
  .etbl td.epg, .etbl td.ep2{display:none}
  .drawer{width:100vw}
  .dtabs{padding:10px 12px} .dhead{padding:14px} .dbody{padding:14px}
  .dhead .dthumb{width:80px;height:120px}
  .dhead h3{font-size:19px}
  /* 手机上「入库判定」并到判定里显示太挤 ⇒ 隐藏，入库信息仍在 AI 总结里 */
  .aln-tbl th:nth-child(7), .aln-tbl td:nth-child(7){display:none}
}

/* ══════════════════════════════════════════════════════════════════════
   人工核对标记（2026-10-24 蛙哥）
   ----------------------------------------------------------------------
   蛙哥：「8848 看板目前有屏蔽该部但是没有已核对之类的，就是我到时候如果
          确认这一部没问题，我可以在 8848 看板上直接标记我核对过」

   ⛔ 与「逐件屏蔽」相反：核对过的部**照常显示**（不参与任何过滤），
      只加绿色描边 + ✓ + 计入「已核对 N/1456」进度。
   ----------------------------------------------------------------------
   🔴 类名纪律：⛔ 卡片状态类**绝不能叫 `chk`** —— `.chk` 是筛选栏复选框的类
      （`display:flex` + `padding:5px 9px` + 小字号），套到 `.card` 上会让整张卡
      变成一条小 flex 行、封面被挤到 60px。✅ 用 `wchk`（work-checked）这种带前缀的。

   角标位置纪律（沿用 2026-10-21 那套「四角互斥」）：
     左上=来源  右上=泡麵番  左下=剧场版  右下=集数
     ⇒ 已核对**不抢这四角**，改成「整卡绿色描边 + 标题前 ✓」，
        海报墙里一眼能扫出哪些核过，且不与任何已有角标压字。
   ══════════════════════════════════════════════════════════════════════ */
.card.wchk .poster{box-shadow:0 0 0 2px var(--ok), var(--sh-1)}
.card.wchk:hover .poster{box-shadow:0 0 0 2px var(--ok), var(--sh-2)}
.ctitle .chki{
  display:inline-flex; align-items:center; justify-content:center;
  width:15px; height:15px; margin-right:5px; border-radius:50%;
  background:var(--ok); color:#fff; font-size:10px; font-weight:700;
  vertical-align:1px; font-family:var(--mono);
}

/* 详情抽屉右上角「已核对」按钮 —— 与「屏蔽这部」并排 */
.dcheckbtn{
  font-size:11.5px; padding:5px 11px; border-radius:7px; cursor:pointer;
  border:1px solid var(--line); background:#fff; color:var(--ink2);
  white-space:nowrap; font-weight:600;
}
.dcheckbtn:hover{background:var(--ok-soft); border-color:rgba(14,159,110,.3); color:var(--ok-ink)}
.dcheckbtn.on{background:var(--ok); border-color:var(--ok); color:#fff; font-weight:700}

/* 年份标题下的「本年已核 N/M」小条 */
.yearhead .yck{
  font-family:var(--mono); font-size:11px; font-weight:700;
  padding:2px 7px; border-radius:var(--r-xs);
  background:var(--ok-soft); color:var(--ok-ink);
  border:1px solid rgba(14,159,110,.24);
}
.yearhead .yck.done{background:var(--ok); color:#fff; border-color:var(--ok)}

/* 已核对清单抽屉（版式与 #hdrawer 一致，独立 id 避免相互干扰） */
#cdrawer{
  position:fixed; top:0; right:0; height:100%; width:min(420px,92vw);
  background:var(--bg,#fff); border-left:1px solid var(--line);
  box-shadow:-14px 0 40px rgba(16,24,40,.14); z-index:60;
  transform:translateX(102%); transition:transform .24s var(--ease);
  display:flex; flex-direction:column;
}
#cdrawer.on{transform:none}
#cdrawer .hh{padding:16px 18px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:10px}
#cdrawer .hh h3{margin:0; font-size:var(--fs-lg); flex:1; min-width:0}
#cdrawer .hb{flex:1; overflow:auto; padding:10px 12px}
#cdrawer .hr{display:flex; align-items:center; gap:9px; padding:9px 8px;
  border-radius:8px; border:1px solid var(--line); margin-bottom:7px;
  background:var(--surface-1,#FAFBFC)}
#cdrawer .hr .hi{flex:1; min-width:0}
#cdrawer .hr .hin{font-size:var(--fs-sm); font-weight:600;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#cdrawer .hr .him{font-size:10.5px; color:var(--ink3); font-family:var(--mono)}
#cdrawer .hbtn{font-size:11px; padding:4px 9px; border-radius:6px; cursor:pointer;
  border:1px solid var(--line); background:#fff; color:var(--ink2)}
#cdrawer .hbtn:hover{background:var(--surface-2,#F4F5F7)}
#cdrawer .hf{padding:11px 16px; border-top:1px solid var(--line);
  display:flex; gap:8px; align-items:center}
#cdrawer .hfoot-tip{font-size:11px; color:var(--ink3); margin-left:auto}
@media print{#cdrawer{display:none}}

/* ══ 批量屏蔽（2026-10-26 蛙哥：「可以全选或者选择部分，然后一键屏蔽」）══
   ⚠️ 类名统一带 `bsel` 前缀（0gq）：裸短词如 `.sel` 会误命中 `.card`/`.ct` 等既有选择器，
      实测过一次「新类名撞 `.card` ⇒ 整卡被压成 60px」。这里全部三字母以上且带前缀。 */

/* 顶栏切换按钮的「已进入选择模式」态 */
.safebtn.bsel-on{
  background:var(--bad-soft); border-color:rgba(220,43,43,.32);
  color:var(--bad-ink); font-weight:750;
}

/* 选择模式：点卡片 = 勾选，⛔ 不开抽屉 ⇒ 光标要给提示 */
.card.bsel-mode{cursor:copy}
/* 选择模式让出封面左上角（那里平时是来源徽标），勾选框要独占
   ⛔ 只让 `.srcbadge.sm` 里**非泡麵番**的那枚退场。
   🔴 §89：选择器必须跟着 DOM 改 —— 徽章已经包进 `.poster .tlb` 容器，
      原来写 `>`（直接子元素）匹配不到 ⇒ 选择模式下来源徽标会压住勾选框。 */
.card.bsel-mode .poster .tlb .srcbadge.sm:not(.pm){display:none}

.bselbox{
  position:absolute; top:6px; left:6px; z-index:4;
  width:20px; height:20px; border-radius:6px;
  border:1.5px solid rgba(255,255,255,.92);
  background:rgba(24,28,36,.52);
  box-shadow:0 1px 5px rgba(12,16,24,.34);
  display:flex; align-items:center; justify-content:center;
  transition:.14s var(--ease);
}
.bselbox::before{
  content:''; width:9px; height:9px; border-radius:2px;
  background:transparent; transition:.14s var(--ease);
}
.card.bsel-on .bselbox{background:var(--bad); border-color:var(--bad)}
.card.bsel-on .bselbox::before{background:#fff}
.card.bsel-on{
  outline:2.5px solid var(--bad); outline-offset:2px;
  border-radius:calc(var(--r-s) + 3px);
}
.card.bsel-on .poster img{filter:saturate(1.06)}
.card.bsel-on .ctitle{color:var(--bad-ink)}

/* 底部悬浮操作条：默认藏在视口下方，⛔ 不用 display:none（那会丢过渡） */
#bselbar{
  position:fixed; left:50%; bottom:26px; z-index:70;
  display:flex; align-items:center; gap:9px;
  padding:9px 11px 9px 16px; border-radius:999px;
  background:rgba(24,28,36,.95); color:#fff;
  box-shadow:0 16px 44px rgba(16,20,28,.36);
  transform:translate(-50%,150%); opacity:0; pointer-events:none;
  transition:transform .26s var(--ease), opacity .2s var(--ease);
  backdrop-filter:blur(9px); max-width:calc(100vw - 24px);
}
#bselbar.on{transform:translate(-50%,0); opacity:1; pointer-events:auto}
#bselbar .bsel-n{
  font-size:12.5px; font-family:var(--mono); letter-spacing:.02em;
  white-space:nowrap; color:rgba(255,255,255,.86);
}
#bselbar .bsel-n b{color:#FF9A9A; font-size:15px; font-weight:750}
#bselbar button{
  font-size:12px; padding:7px 13px; border-radius:999px; cursor:pointer;
  border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.10);
  color:#fff; white-space:nowrap; transition:.14s var(--ease);
}
#bselbar button:hover{background:rgba(255,255,255,.20)}
#bselbar button:disabled{opacity:.38; cursor:not-allowed}
#bselbar button.bsel-go{
  background:var(--bad); border-color:var(--bad); font-weight:750;
}
#bselbar button.bsel-go:hover{filter:brightness(1.09)}

@media(max-width:640px){
  #bselbar{gap:6px; padding:8px 8px 8px 12px; bottom:14px}
  #bselbar .bsel-n{font-size:11.5px}
  #bselbar button{font-size:11px; padding:6px 9px}
}

/* ═══════════════════════════════════════════════════════════════════════
   ⭐ 2026-10-27（§73）详情抽屉单页化 + 人工确认入库
   -----------------------------------------------------------------------
   ① `.sbar` 分季概览行 —— 替代已下线的「季集」页签里的季卡片。
      季卡片上的集明细与「逐集对照」完全重复（蛙哥：「他和逐集对照其实是重复的」），
      唯一不重复的是**季级屏蔽** ⇒ 压成一行挂进元信息块。
   ② `.ever-btn` 人工确认入库按钮 —— 与 `.whid-btn` 同族但用 brand 色：
      它是**会改判定**的动作（`embyFull` 变 true），
      ⛔ 不能和季屏蔽那种「只改显示」的灰按钮长得一样。
   🔴 类名带前缀（0gq/0gr）：`sbar` / `ever` 已 grep 确认 stylesheet 内不撞名。
   ═══════════════════════════════════════════════════════════════════════ */
.sbar{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  margin-top:14px; padding:9px 12px;
  border-radius:var(--r-s);
  border:1px solid var(--line); background:var(--surface-2);
}
.sbar-lb{
  font-size:11px; font-weight:750; letter-spacing:.06em;
  color:var(--ink3); text-transform:uppercase;
}
.sbar-i{
  display:inline-flex; align-items:center; gap:7px;
  padding:3px 5px 3px 10px; border-radius:999px;
  background:var(--surface); border:1px solid var(--line);
}
.sbar-i b{font-size:11.5px; font-weight:750; color:var(--ink); font-family:var(--mono)}
.sbar-i em{font-style:normal; font-size:11px; color:var(--ink3); font-family:var(--mono)}
/* 已屏蔽的季：整块虚线 + 褪色，一眼看出「这块不算数」。
   ⛔ 不用 opacity 压整块 —— 压了按钮也跟着糊，反而点不准 */
.sbar-i.off{
  background:var(--surface-2); border-style:dashed; border-color:var(--line2);
}
.sbar-i.off b, .sbar-i.off em{color:var(--ink4)}

/* 人工确认入库：动作型按钮（会改判定）⇒ brand 描边，比季屏蔽显眼 */
.ever-btn{
  font:inherit; font-size:11px; font-weight:750;
  margin-left:8px; padding:3px 10px; border-radius:999px; cursor:pointer;
  border:1px solid var(--brand); background:var(--brand-soft); color:var(--brand-ink);
  transition:background .15s, color .15s, border-color .15s;
  white-space:nowrap; vertical-align:1px;
}
.ever-btn:hover{background:var(--brand); color:#fff}
.ever-btn:disabled{opacity:.55; cursor:default}
/* 已确认：实心 ok 绿 —— 与卡面「✓ 全集入库」绿标同一语义，不另造一套颜色 */
.ever-btn.on{background:var(--ok); border-color:var(--ok); color:#fff}
.ever-btn.on:hover{background:var(--ok-ink); border-color:var(--ok-ink)}

/* ═══════════════════════════════════════════════════════════════════════
   ⭐ 2026-10-27（§74）集级排除 + 确认入库改为右上角常驻
   -----------------------------------------------------------------------
   ① `.deverbtn` —— 「确认入库」搬到右上角与「标记已核对」「屏蔽这部」并排。
      蛙哥原话：「我希望是做成全局的，不是某一部ai确认我再人工确认，
                应该和标记核对放一起，由我手工判断，ai只是辅助」
      ⇒ 尺寸/字重与 `.dcheckbtn` 完全一致（同一排按钮不能有大小差），
        只把描边换成 brand 色：它是三个里唯一**会改判定**的动作。
   ② `.aln-tbl col.c-x` + `.epx-btn` —— 逐集对照每行一个「排除」入口。
   ③ `.epx-bar` —— 表尾「已排除 N 集 [恢复]」。这是**唯一恢复入口**：
      被排除的集已从后端 eps 里剔掉，表里根本没有它们（⛔ 不给这块 = 死锁）。
   🔴 类名全部带 `epx` / `dever` 前缀（0gq/0gr），已 grep 确认不撞名。
   ═══════════════════════════════════════════════════════════════════════ */

.deverbtn{
  font-size:11.5px; padding:5px 11px; border-radius:7px; cursor:pointer;
  border:1px solid var(--brand); background:var(--brand-soft); color:var(--brand-ink);
  white-space:nowrap; font-weight:600; flex:none;
  transition:background .14s, color .14s, border-color .14s;
}
.deverbtn:hover{background:var(--brand); color:#fff}
.deverbtn.on{background:var(--ok); border-color:var(--ok); color:#fff; font-weight:700}
.deverbtn.on:hover{background:var(--ok-ink); border-color:var(--ok-ink)}

/* ⭐ §139（2026-11-03）洗版一条龙 —— 与 .deverbtn 同尺寸（同排按钮不能有大小差），
   琥珀描边：介于普通（brand）与危险（bad）之间 —— 重下覆盖文件，提示「要花流量」但不吓人。 */
.dwashbtn{
  font-size:11.5px; padding:5px 11px; border-radius:7px; cursor:pointer;
  border:1px solid rgba(200,140,20,.55); background:rgba(255,190,60,.12); color:var(--ink-2, #8a6d1f);
  white-space:nowrap; font-weight:600; flex:none;
  transition:background .14s, color .14s, border-color .14s;
}
.dwashbtn:hover{background:#c88c14; border-color:#c88c14; color:#fff}
.dwashbtn:disabled{opacity:.5; cursor:wait}
/* 确认后数据变了：黄底提醒复核，但**仍算已确认**（人工优先，只是提示过期） */
.deverbtn.stale{
  background:var(--warn-soft); border-color:rgba(214,158,46,.45); color:var(--warn-ink);
}
.deverbtn.stale:hover{background:var(--warn); border-color:var(--warn); color:#fff}

/* ⭐ 2026-10-31（§108）抽屉动作条加「♥ 加入待下」
   蛙哥：「标记已核对右边加一个收藏或者加入待下，和加入待下同一个运行逻辑」
   ⇒ 尺寸/字重与 `.dcheckbtn` / `.deverbtn` **完全一致**（同一排不能有大小差），
     配色走 ♥ 玫瑰档 —— 与卡面 ♥ 同语义：点一下进待下清单。
   ⚠️ 已收（扫 Emby 收全）时用 ok 绿，和卡面 `.card.cwantdone` 一致。 */
.dwantbtn{
  font-size:11.5px; padding:5px 11px; border-radius:7px; cursor:pointer;
  border:1px solid var(--line); background:#fff; color:var(--ink2);
  white-space:nowrap; font-weight:600; flex:none;
  transition:background .14s, color .14s, border-color .14s;
}
.dwantbtn:hover{background:var(--rose-soft); border-color:rgba(212,83,126,.4); color:var(--rose-ink)}
.dwantbtn.on{background:var(--rose); border-color:var(--rose); color:#fff; font-weight:700}
.dwantbtn.on:hover{background:var(--rose-ink); border-color:var(--rose-ink); color:#fff}
.dwantbtn.done{background:var(--ok); border-color:var(--ok); color:#fff; font-weight:700}
.dwantbtn.done:hover{background:var(--ok-ink); border-color:var(--ok-ink); color:#fff}

/* ══════════ ⭐⭐ §135（2026-11-02 蛙哥）逐集「来源」列 ══════════
   蛙哥：「新增一个指定集数，比如我第一集打算从 hanime 下，第二集打算直接调取
          mteam 的本地视频，就是可以给我手动选择，哪一集我想要哪个资源」
   ⇒ 每行两个按钮，点哪个存哪个（写 work_ep_src），再点上方按钮统一执行。

   ⚠️ 列宽只给 106px：表已经 9 列、抽屉 660px，这列再宽会把「TMDB 集名」挤成竖条。
      完整信息（体积/画质/字幕/文件名）全部进 title，行内只留「H 1080p」「M 510M」。
   ⚠️ 已入库/已排除/未播出的行画灰字不画按钮 —— 那些集不该再选来源（0cs：别给假入口）。 */
.aln-tbl col.c-pick{width:106px}
.aln-pick{vertical-align:top}
.pk{display:flex; flex-direction:column; gap:3px; align-items:stretch}
.pk-b{
  font:inherit; font-size:10.5px; font-weight:750; cursor:pointer;
  display:flex; align-items:center; gap:4px; width:100%;
  padding:2px 6px; border-radius:6px;
  border:1px solid var(--line2); background:var(--surface); color:var(--ink3);
  transition:background .12s, border-color .12s, color .12s;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.pk-b b{font-family:var(--mono); font-size:10px; opacity:.8; flex:0 0 auto}
.pk-b span{overflow:hidden; text-overflow:ellipsis}
.pk-b:hover{border-color:var(--line2); background:var(--surface-2); color:var(--ink2)}
/* hanime 选 = 品牌紫；mteam 选 = 绿（本地已有，语义同「盘上」绿框） */
.pk-b.on.h{background:var(--brand-soft); border-color:var(--brand-2); color:var(--brand-ink)}
.pk-b.on.m{background:var(--ok-soft); border-color:var(--ok); color:var(--ok-ink)}
.pk-b:disabled{opacity:.42; cursor:not-allowed}
.pk-b:disabled:hover{background:var(--surface); color:var(--ink3); border-color:var(--line2)}
.pk-auto{font-size:9.5px; color:var(--ink4); padding-left:1px}
.pk-na{font-size:10.5px; color:var(--ink4); font-family:var(--mono)}
/* 集位是「推定」的提醒：mteam 那个文件是按卷号/顺序排的，可能错位 */
.pk-warn{font-size:9.5px; line-height:1.15; color:var(--warn-ink);
  background:var(--warn-soft); border-radius:5px; padding:1px 4px; margin-top:2px}
/* ⭐ §142「已入库」从一句死字改成角标 —— 这集的 H/M 仍可点（换源洗版用） */
.pk-own{font-size:9.5px; line-height:1.2; color:var(--ok-ink); background:var(--ok-soft);
  border-radius:5px; padding:1px 4px; margin-top:2px; text-align:center}
/* ⭐ §142 单集洗版：虚线小按钮，与「排除」同族的克制视觉，⛔ 不抢 H/M 的注意力 */
.pk-wash{
  font:inherit; font-size:10px; font-weight:750; cursor:pointer; margin-top:2px;
  padding:1px 6px; border-radius:6px; border:1px dashed var(--line2);
  background:transparent; color:var(--ink3); transition:all .12s;
}
.pk-wash:hover{border-color:var(--warn-ink); color:var(--warn-ink); background:var(--warn-soft)}
.pk-wash:disabled{opacity:.45; cursor:not-allowed}

/* ══════════ §135 「按选择执行」条（表格上方，aln-sum 下一行）══════════ */
.pkbar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin:10px 0 4px; padding:9px 12px;
  border-radius:var(--r-s);
  background:var(--brand-soft);
  border:1px solid rgba(79,70,229,.20);
}
.pkbar-lb{font-size:12px; font-weight:750; color:var(--brand-ink); letter-spacing:.02em}
.pkbar-n{font-size:12px; color:var(--ink2)}
.pkbar-n b{font-family:var(--mono); font-weight:800; color:var(--ink)}
.pkbar-btn{
  font:inherit; font-size:12.5px; font-weight:750; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 14px; border-radius:999px; border:1px solid var(--brand);
  background:var(--brand); color:#fff; transition:filter .13s, opacity .13s;
}
.pkbar-btn:hover{filter:brightness(1.07)}
.pkbar-btn:disabled{opacity:.55; cursor:default; filter:none}
.pkbar-btn.ghost{background:var(--surface); color:var(--brand-ink)}
.pkbar-msg{font-size:11.5px; color:var(--ink2); flex:1 1 100%}

.aln-tbl col.c-x{width:58px}
.aln-x{text-align:center; white-space:nowrap}
.epx-btn{
  font:inherit; font-size:11px; font-weight:650; cursor:pointer;
  padding:2px 8px; border-radius:999px;
  border:1px solid var(--line2); background:var(--surface); color:var(--ink3);
  transition:background .13s, color .13s, border-color .13s;
}
.epx-btn:hover{background:var(--bad-soft); border-color:rgba(220,43,43,.35); color:var(--bad-ink)}
.epx-btn:disabled{opacity:.5; cursor:default}
.epx-gone{font-size:11px; color:var(--ink4); font-family:var(--mono)}

/* 表尾「已排除」条：虚线框 + 弱化底色，与正常行区分开 */
.epx-bar{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  margin-top:12px; padding:9px 12px;
  border-radius:var(--r-s);
  border:1px dashed var(--line2); background:var(--surface-2);
}
.epx-lb{
  font-size:11px; font-weight:750; letter-spacing:.06em;
  color:var(--ink3); text-transform:uppercase;
}
.epx-chip{
  display:inline-flex; align-items:center; gap:7px;
  padding:3px 5px 3px 10px; border-radius:999px;
  background:var(--surface); border:1px solid var(--line);
}
.epx-chip b{font-size:11.5px; font-weight:750; color:var(--ink2); font-family:var(--mono)}
.epx-chip em{font-style:normal; font-size:11px; color:var(--ink3); max-width:180px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.epx-restore{
  font:inherit; font-size:11px; font-weight:700; cursor:pointer;
  padding:2px 8px; border-radius:999px;
  border:1px solid rgba(14,159,110,.3); background:var(--ok-soft); color:var(--ok-ink);
}
.epx-restore:hover{background:var(--ok); border-color:var(--ok); color:#fff}
.epx-hint{font-size:11px; color:var(--ink4)}

/* ═══════════════════════════════════════════════════════════════
   ⭐ §79 定期更新检测 —— 设置页
   cron 表达式由蛙哥在 8848 看板直接改，不用 SSH。
   ═══════════════════════════════════════════════════════════════ */
.set-wrap{max-width:920px; margin:0 auto; padding:18px 4px 40px}
.set-card{
  background:var(--surface); border:1px solid var(--line2);
  border-radius:var(--r-m); padding:16px 18px; margin-bottom:14px;
}
.set-card h3{
  margin:0 0 4px; font-size:14px; font-weight:750; color:var(--ink);
  display:flex; align-items:center; gap:8px;
}
.set-card .set-sub{font-size:12px; color:var(--ink3); margin:0 0 14px; line-height:1.6}
.set-row{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px}
.set-fld{flex:1 1 260px; min-width:220px}
.set-fld label{
  display:block; font-size:11px; font-weight:700; letter-spacing:.04em;
  color:var(--ink3); margin-bottom:5px; text-transform:uppercase;
}
.set-fld input[type=text]{
  width:100%; font:inherit; font-size:13px; font-family:var(--mono);
  padding:7px 10px; border-radius:var(--r-s);
  border:1px solid var(--line2); background:var(--surface-2); color:var(--ink);
}
.set-fld input[type=text]:focus{outline:none; border-color:var(--ok); background:var(--surface)}
.set-fld input.bad{border-color:var(--bad); background:var(--bad-soft)}
.set-desc{font-size:11.5px; color:var(--ink4); margin-top:5px; line-height:1.5}
.set-desc.err{color:var(--bad-ink)}
.set-desc.ok{color:var(--ok-ink)}
.set-presets{display:flex; gap:6px; flex-wrap:wrap; margin-top:7px}
.set-preset{
  font:inherit; font-size:11px; font-weight:650; cursor:pointer;
  padding:3px 9px; border-radius:999px;
  border:1px solid var(--line2); background:var(--surface-2); color:var(--ink3);
  transition:background .13s, color .13s, border-color .13s;
}
.set-preset:hover{background:var(--ok-soft); border-color:rgba(14,159,110,.3); color:var(--ok-ink)}
.set-preset.on{background:var(--ok); border-color:var(--ok); color:#fff}
.set-btns{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-top:14px}
.set-save{
  font:inherit; font-size:12.5px; font-weight:700; cursor:pointer;
  padding:7px 18px; border-radius:var(--r-s);
  border:1px solid var(--ok); background:var(--ok); color:#fff;
  transition:opacity .13s;
}
.set-save:hover{opacity:.88}
.set-save:disabled{opacity:.45; cursor:default}
.set-run{
  font:inherit; font-size:12.5px; font-weight:700; cursor:pointer;
  padding:7px 15px; border-radius:var(--r-s);
  border:1px solid var(--line2); background:var(--surface-2); color:var(--ink2);
}
.set-run:hover{background:var(--surface); border-color:var(--ok); color:var(--ok-ink)}
.set-run:disabled{opacity:.45; cursor:default}
.set-toggle{
  display:inline-flex; align-items:center; gap:8px; cursor:pointer;
