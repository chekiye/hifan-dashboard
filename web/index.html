  const MEDIA = ctx.media || {};
  /* ⭐ §135：MB 已提升为全局函数（来源格与这张表必须显示同一个体积）——
     ⛔ 别再在这里定义局部 const MB，那会让两处口径分叉。 */
  const MPS = (n) => n == null ? '' : (n >= 1000 ? (n/1000).toFixed(1)+' Gbps' : n.toFixed(1)+' Mbps');
  /* ⚠️ 判语取值必须与 docs/画质对比-问题与计划.md「四、判定口径」一字不差，
     ⛔ 前端不许自己另算一套阈值（0lx：判据多处拷贝必分叉）。 */
  /* ⭐⭐ §127（2026-11-02）：`lib_*` 改成 **Emby 媒体库里那份**（不再是 10-14 旧快照）
     ⇒ 这张表的「库内」两个字全部换成「Emby 库里」——
        · `ha_better` = Emby 库里那份更好（不是「115 已整理」）
        · `only_mt`   = Emby 库里没有这一集（mteam 盘上有）
        · `only_lib`  = Emby 里有、mteam 全量库没有这一集（不用等）
     ⚠️ 判语取值必须与 `scripts/sync_ep_media.py::verdict_of()` 一致（0lx）。 */
  const QV = {
    same:      ['同一份文件', 'q-same', '两侧字节完全相同 —— 比了也白比'],
    mt_better: ['mteam 更好', 'q-mt',   'mteam 盘上那份画质明显更好'],
    mt_slight: ['mteam 略优', 'q-mt2',  'mteam 略好一点'],
    even:      ['基本持平',   'q-even', '两者接近'],
    ha_better: ['Emby 库里更好','q-lib','Emby 库里正在播的那份画质更好'],
    ha_maybe:  ['mteam 非顶格','q-warn','mteam 这份到不了 1080，源侧有 1080 档'],
    mt_low:    ['mteam 偏低', 'q-bad',  'mteam 这份分辨率太低，建议留 Emby 库里那份'],
    only_mt:   ['只有 mteam', 'q-only', 'Emby 库里没有这一集'],
    only_lib:  ['Emby 里有',  'q-only', 'mteam 全量库里没有这一集（已经在库里了，不用等）'],
    mt_pending:['mteam 待落盘','q-wait','mteam 全量库有这一集，还在下载中'],
    /* ⭐⭐ §127（2026-11-02）**集号错位闸门**：
       实测 1168 集「两边都有」里 **105 集（9.0%）时长对不上**（35 部作品）——
       两种形态：① mt E1 的内容在 Emby 是 E2（纯集号互换）
                 ② 同一集的两个版本时长本就有差
       ⇒ 这类**不下画质结论**，只提示「先别信这个比较」（否则会把两集互比的结论
       当成「同一集的质量差」—— 结论精确但完全指错对象）。 */
    misalign:  ['疑似错位', 'q-warn', '两侧时长对不上 —— 集号可能错位，或同一集的不同版本，先别信这个比较'],
  };
  /* ⭐ §108：这一集挂的 hanime 条目里第一个**有预览图**的（一集可能挂多条源）。
     ⛔ 只认 video_tag.cover_local 落盘的本地图，⛔ 不用带签名的外链（两周后会集体裂图）。 */
  const hnCoverOf = (r) => {
    for(const x of (r && r.hanime) || []){
      const m = (x && x.id) ? videoMeta[String(x.id)] : null;
      if(m && m.cover) return m.cover;
    }
    return null;
  };

  // 单集封面：安全模式三档跟卡片一致（off 正常 / blur 模糊图 / hide 不加载）
  const stillCell = (item, coverAlt) => {
    const still = item ? item.still : null;
    const stillBlur = item ? item.stillBlur : null;
    /* ⚠️ 文案说清「TMDB 侧没有」——全库 6212 集里 4801 有 still_path，
       剩下 1411 是 TMDB 自己就没收录这集剧照，⛔ 不是我们没抓到。
       占位块按 16:9 的体量给（235×132），跟真剧照同一个视觉体量，行高不变。 */
    if(!still){
      /* ⭐ §108 蛙哥：「针对 tmdb 剧集无图的，但有 hanime 的，抓取 hanime 的预览图做剧集海报」
         ⇒ TMDB 没剧照时退到 hanime 预览图；两样都没有才写「无剧照」。
         🔴 安全模式三档同等对待（隐私铁律：宁可不显示，也不传了再遮）。 */
      if(coverAlt){
        if(S.safe === 'hide') return `<div class="aln-still none">已隐藏</div>`;
        if(S.safe === 'blur')
          return `<img class="aln-still hnblur" src="${esc(coverAlt)}" alt="" loading="lazy"
            title="hanime 预览图（已模糊）" onerror="this.style.opacity=0">`;
        return `<img class="aln-still hn" src="${esc(coverAlt)}" alt="" loading="lazy"
          title="TMDB 没有这一集的剧照 · 这是 hanime 源站的预览图" onerror="this.style.opacity=0">`;
      }
      return `<div class="aln-still none" title="TMDB 没有收录这一集的剧照">TMDB 无剧照</div>`;
    }
    if(S.safe === 'hide') return `<div class="aln-still none">已隐藏</div>`;
    /* 🔴 blur 档：只加载模糊图 ⇒ 悬停也不会出清晰图 */
    if(S.safe === 'blur') {
      return stillBlur
        ? `<img class="aln-still" src="${esc(stillBlur)}" alt="" loading="lazy" onerror="this.style.opacity=0">`
        : `<div class="aln-still none">无模糊图</div>`;
    }
    /* ⚠️ onerror 兜底：图文件万一丢了（抓取中途、磁盘清理）⇒ 透明化，
       ⛔ 不留浏览器「裂图」图标；16:9 灰底由 CSS 撑着，布局不塌。 */
    return `<img class="aln-still" src="${esc(still)}" alt="" loading="lazy"
      onerror="this.style.opacity=0">`;
  };

  const rows = al.rows.map(r=>{
    const code = `S${String(r.season).padStart(2,'0')}E${String(r.episode).padStart(2,'0')}`;
    const key = `${r.season}-${r.episode}`;
    const n = r.hanime.length + r.mteam.length;
    // ⭐ 播放清单（源站分组编号）：同一清单号 = 源站自己归为同一部
    const pls = new Set(r.hanime.map(x=>x.playlistId).filter(Boolean));
    const plConflict = pls.size > 1;
    /* ⭐ §87：每一条源条目的「下载链接」徽章 —— 与标题同格，集对集对齐。
       三态：可下（画质）/ 需重抓（签名过期）/ 无链接（源站有这条但没抓到直链）。
       ⛔ m3u8 单独标（本轮不支持下载，别给「下载」的假希望）。 */
    const lkBadge = (x) => {
      const L = x.link;
      if(!L) return `<span class="aln-lk na" title="源站有这一条视频，但 source_link 里没有直链 —— 需要补抓">无链接</span>`;
      if(L.isM3u8) return `<span class="aln-lk na" title="HLS(m3u8) 切片流，本轮不支持下载">m3u8</span>`;
      const exp = L.expiresAt != null && L.expiresAt*1000 <= Date.now();
      const q = L.quality ? `${L.quality}p` : '画质?';
      /* 🔴 §117（2026-11-01 蛙哥「hanime 的视频信息做明显一点，这样看着很费劲」）：
         体积从这一行**搬走**了 —— 它原来挤在 id 行末尾（9.5px 灰字），
         跟 `408112 · 卷1 · 2026` 混成一片，扫不出来。现在单独成一个块（见 hnVideo）。
         这里只剩「操作入口」，⛔ 不再是唯一能看画质的地方。 */
      if(exp) return `<button class="aln-lk exp" data-showlink="${esc(x.id||'')}"
        title="签名已过期（TTL 约 11 小时）。点开看详情/重抓">需重抓</button>`;
      return `<button class="aln-lk ${L.quality>=1080?'hd':'sd'}" data-showlink="${esc(x.id||'')}"
        title="已抓到直链 · 点开看完整 URL / 复制 / 重抓${L.rateLimit?`（源站限速 ${(L.rateLimit/1024).toFixed(0)}KB/s）`:''}">${q}</button>`;
    };
    /* ⭐⭐ §117 hanime 视频信息块 —— 与 mteam 那个绿框**同规格**（体积打头、画质第二行），
       一眼就能并排比「源侧 438 MB」和「盘上 510 MB」。
       ⚠️ 三态：有体积（绿框）/ 有画质没体积（灰框，体量待补）/ 没直链（灰虚线）。
       🔴 体积**不受链接过期影响**（文件不会自己变大变小）⇒ 过期也照样显示体积。 */
    const hnVideo = (x) => {
      const L = x.link;
      /* ⚠️ 没直链 / m3u8 ⇒ **不画块**，只保留 id 行里那枚 `无链接`/`m3u8` 小徽章。
         否则一部作品里十来条源会摞出十几个虚线空块，整格都是噪声（蛙哥要的是
         「视频信息明显」，不是「没有信息也占一格」）。 */
      if(!L || L.isM3u8) return '';
      const q = L.quality ? `${L.quality}p` : '画质未知';
      const exp = L.expiresAt != null && L.expiresAt*1000 <= Date.now();
      const sz = L.size ? MB(L.size) : null;
      return `<div class="qm hnq${sz?' on':''}" title="hanime 源侧这一集：${q}${sz?' · '+sz:'（体积还没补到，源站那栏写 N/A，要问 CDN 才知道）'}${exp?' · 直链签名已过期，但体积是永久事实':''}">
           <b>${sz?'✓ ':''}源侧 ${q}${sz?' · '+sz:' · 体量待补'}</b>
           <span>${exp?'直链已过期 · 体积仍有效':'CDN 直链实测'}</span>
         </div>`;
    };
    /* ⭐ §108（2026-10-31 蛙哥）：「hanime 的每一集都把他的标签抓下来放到对应的集数，
       看标签就知道这部剧的类型……有的集数标签特别多，可能放不下」
       ⇒ 一行 chip。实测每集 6~27 个（多的能到 30+），所以：
         · 默认只摆 **前 8 个**，剩下的折成 `+N` 一枚（⛔ 不能全摆——27 个标签会把
           这一行撑到 5 行高，整张逐集对照表就没法扫了）
         · 点 `+N` 原地展开全部，按钮变「收起」；再点收回。
         · 展开状态**不进后端**（纯展示），重开抽屉回到折叠态。
       ⛔ 没有标签数据（没抓 / 老库 / 该集没有 hanime 条目）⇒ 什么都不画，不留空壳。 */
    const tagsOf = (x) => {
      const m = (x && x.id) ? videoMeta[String(x.id)] : null;
      return (m && Array.isArray(m.tags)) ? m.tags : [];
    };
    const TAG_SHOW = 8;
    const tagRow = (x) => {
      const tags = tagsOf(x);
      if(!tags.length) return '';
      /* ⭐ §151：**你标过的标签必须排在最前面**（红 → 绿 → 其它，各自保持源站原序）。
         🔴 不排序的话：一集 27 个标签里"猎奇"排第 15 个，折叠进 `+N` 里
            ⇒ 高亮等于没做（蛙哥要的是"一眼看出来"）。
         且标过的**全部展开**（showN 至少覆盖它们），⛔ 不让红标被折叠。 */
      /* §153 四档排序：避开(1) → 谨慎(2) → 本命(4) → 喜欢(3) → 未标(0)
         🔴 警示类永远最前：扫一眼先看到「要躲的」，再看到「想要的」；未标垫底不抢注意力。
         ⚠️ 不能按 level 数值直接排（3=喜欢 排在 4=本命 前面），ordered 表写死才可控。 */
      const ORD = { 1: 0, 2: 1, 4: 2, 3: 3 };
      const ord = t => { const lv = tagLevel(t); return lv === 0 ? 9 : (ORD[lv] ?? 9); };
      const sorted = tags.map((t,i)=>({t,i}))
        .sort((a,b)=> ord(a.t) - ord(b.t) || a.i - b.i).map(o=>o.t);
      const markedN = sorted.filter(t => tagLevel(t) > 0).length;
      const showN = Math.max(TAG_SHOW, markedN);
      const head = sorted.slice(0, showN);
      const tail = sorted.slice(showN);
      const TAG_TIP = { 1:'避开', 2:'谨慎', 3:'喜欢', 4:'本命' };
      const chip = t => {
        const lv = tagLevel(t);
        const cls = lv ? ` mk${lv}` : '';
        const tip = lv ? ` title="你标记为「${TAG_TIP[lv]}」的标签"` : '';
        return `<span class="aln-tag${cls}"${tip}>${esc(t)}</span>`;
      };
      return `<span class="aln-tags">${
        head.map(chip).join('')
      }${tail.length ? `<span class="aln-tagrest" hidden>${
        tail.map(chip).join('')
      }</span><button class="aln-tagmore" type="button" data-tagmore="${esc(x.id||'')}"
        data-n="${tail.length}" title="这一集共有 ${tags.length} 个标签，点开看全部">+${tail.length}</button>` : ''}</span>`;
    };
    /* ⭐⭐ §112（2026-10-31 蛙哥「这一部 hanime 的标题全不对，全是日语原标题，中文原标题缺失」）——
       原来大标题**只认 `titlePage`**（hanime 视频页的 `<title>`，一律带日文原名），
       而库里 `entry_detail[].title` 常常存着**中文名**（#73128 是「漸進曲 ～天使們的私人課程～ 5」），
       两个字段都在、却只画了日文的那个 ⇒ 看着像「中文缺失」。
       ⇒ 标题改成**中文优先**：`title` 是中文（含汉字、无平假名）就用它，
         否则仍用 `titlePage`（日文原名 + `[中文字幕]` 这类标记）。
       ⛔ 不能无条件用 `title`：燐月/鬼父那批的 `title` 本身就是日文，只会把 `[中文字幕]` 弄丢。 */
    const hnTitle = (x) => isZhTitle(x.title) ? x.title : (x.titlePage || x.title || '（无标题）');
    const hnCc = (x) => (!isZhTitle(x.title) ? '' : (/中文字幕/.test(String(x.titlePage||''))
      ? '<span class="aln-cc" title="hanime 源站标注：中文字幕">中文字幕</span>' : ''));
    const hn = r.hanime.length
      ? r.hanime.map(x=>`<span class="aln-item${plConflict?' pl-conflict':''}">
          <span class="aln-t">${esc(hnTitle(x))}${hnCc(x)}</span>
          ${(()=>{ const _ja = hnJaFull(x.titleJa, x.titlePage);
            return _ja?`<span class="aln-ja" title="hanime 原标题（日文）">${esc(_ja)}</span>`:''; })()}
          <span class="aln-id">${esc(x.id||'')}${x.vol?` · 卷${x.vol}`:''}${
            x.year?` · ${x.year}`:''}${lkBadge(x)}</span>
          ${hnVideo(x)}
          ${x.playlistId?`<span class="aln-pl" title="源站播放清单编号：同号 = 源站归为同一部${
            plConflict?'｜⚠️ 本集挂的源分属不同清单，可能混装了别的作品':''}">清单 ${esc(x.playlistId)}</span>`:''}
          ${tagRow(x)}
        </span>`).join('')
      : '<span class="aln-none">—</span>';
    /* ⭐ §115（2026-11-01 蛙哥「一眼看出该下哪一个」）：这个的三块数据是**分开**的 ——
       ① `MD.mt`  = mteam 盘上原始文件（ffprobe 实测，有真分辨率/编码/码率/时长）
       ② `MD.lib` = **Emby 媒体库里正在播的那份**（§127：ffprobe 实测体积/画质）
       ③ `MD.srcQuality` = hanime 源侧**最高可下档**（1080/720/480，不是「本地就是 1080」）
       ⛔ 三块不许合成一个「大小」相加 —— 那是三份不同的文件（75 集里确实是同一份）。 */
    const MD = MEDIA[key] || null;
    /* ⭐ §116（2026-11-01 蛙哥「26年落盘了，怎么不把文件名匹配上去，就只显示大小」）
       表头本来就写「mteam **标题** 盘上实测体积/画质」，但标题那半句一直没画 ——
       体积只能说明「下下来了」，文件名才能说明「下的是哪一部、第几卷」。
       `mt_files` / `lib_files` 里本来就有 name（DB 层一直在存），纯前端漏渲染。
       ⇒ 多文件时列第一个 + 「共 N 个」，全文进 title（⛔ 不在行内铺开，列宽只有 ~180px）。 */
    const _fn = a => (Array.isArray(a) ? a : []).map(f => (f && f.name) ? String(f.name) : '').filter(Boolean);
    /* ⭐ §120（2026-11-01 蛙哥「26年的MTEAM也没改好」＋「你自己看看有什么不一样」）：
       2026 那批走的是**月度合集**（源作品就是「2026年01月合集」一个包），mteam 侧压根没有
       「单部作品」的源条目 ⇒ `r.mteam` 为空 ⇒ 这一格只剩一个「—」，
       可盘上文件、清单体积、番号全都在（绿块里就写着）。
       实测 1335 部有 mteam 媒体的作品里 **31 部**是这个形态（28 部 2026 + 2009/2003/1999 各 1）。
       ⇒ 没有作品级源时，拿**已经匹配到这一集的文件名**顶标题位（剥扩展名/语言后缀），
         多文件补一句「共 N 个」，全文进 title。
       ⚠️ 这时绿块/灰块里就**不再重复**画同一个文件名（`skipFirst`），只留「共 N 个」提示。
       ⛔ 别把它当成「兜底成没有」——文件确实在，缺的只是源条目（0cs 的另一面）。 */
    const _mtFilesOf = md => {
      if (!md) return [];
      const a = (md.mt && md.mt.files) || [];
      if (Array.isArray(a) && a.length) return a;
      const b = (md.mtList && md.mtList.files) || [];
      return Array.isArray(b) ? b : [];
    };
    const _mtFileNames = _fn(_mtFilesOf(MD));
    const mtTitleIsFile = !r.mteam.length && _mtFileNames.length > 0;
    const mt = r.mteam.length
      ? r.mteam.map(x=>`<span class="aln-item">
          <span class="aln-t">${esc(x.title||'（无标题）')}</span>
          <span class="aln-id">${esc(x.id||'')}${x.year?` · ${x.year}`:''}</span>
        </span>`).join('')
      : mtTitleIsFile
        ? (() => {
          /* ⭐ §146（2026-11-03 蛙哥「格式都不一样了」）：
             作品级源缺失时用文件名顶标题位，但**版式要和别的行一致** ——
             标题一行、番号一行。番号从文件名里的 `[XXX-123]` 取（取不到就写「无番号」）；
             多文件的「共 N 个」按**实际后缀**算，⛔ 不再写死「CHS / CHT / RAW」。 */
          const _first = _mtFileNames[0];
          const _base = _first.replace(/\.(mp4|mkv|avi|wmv|rmvb)$/i, '').replace(/\.(chs|cht|raw|jpn|sc|tc)$/i, '');
          const _cm = /[[(]([A-Za-z]{1,6}[-_]?\d{3,}[A-Za-z0-9-]*)[\])]/.exec(_first);
          const _code = _cm ? _cm[1].toUpperCase() : '';
          const _langs = [...new Set(_mtFileNames.map(n => {
            const mm2 = /\.(chs|cht|raw|jpn|sc|tc)\.(mp4|mkv|avi|wmv|rmvb)$/i.exec(n);
            return mm2 ? mm2[1].toUpperCase() : '';
          }).filter(Boolean))];
          const _more = _mtFileNames.length > 1
            ? `共 ${_mtFileNames.length} 个文件${_langs.length ? `（${_langs.join(' / ')}）` : ''}`
            : '';
          return `<span class="aln-item">
          <span class="aln-t is-file" title="${esc(_mtFileNames.join('\n'))}">${esc(_base)}</span>
          <span class="aln-id">${_code ? esc(_code) : '无番号'}${_more ? ` · ${esc(_more)}` : ''}</span>
        </span>`;
        })()
        : '<span class="aln-none">—</span>';
    const fBlock = (list, skipFirst) => !list.length ? ''
      : skipFirst
        ? ''   /* §120：文件名已经在标题位了（还带「共 N 个」），这里⛔ 不再重复画一遍 */
        : `<span class="qf" title="${esc(list.join('\n'))}">${esc(list[0])}</span>`
          + (list.length > 1 ? `<span class="qf more" title="${esc(list.join('\n'))}">↑ 共 ${list.length} 个文件，悬停看全部</span>` : '');
    const mtQ = !MD ? '' : (MD.mt
      ? (() => {
          /* 🔴 §136（2026-11-02 蛙哥「为什么大小对不上」）：
             `MD.mt.size` = ep_media.mt_size = 这一集**最大**的文件（实测 build_mt_disk_match.py
             的 `rep = sorted(fl, key=size, reverse=True)[0]`）⇒ 显示的是 RAW/mkv 那份。
             但**实际会被取的那个**是来源列排序第 1（语言优先：CHS > CHT > 裸名 > RAW）。
             ⇒ 同一行出现两个数（绿块 510 vs 来源列 465）指两个不同文件，看着像对不上。
             ⇒ 这里改成：多文件且体积不同 ⇒ 显示**范围**（`465~510 MB`），
               单文件才显示单个数。口径与来源列一致（0lx）。 */
          const _sizes = ((MD.mt.files || []).map(f=>Number(f.size||0))).filter(x=>x>0);
          const _mn = _sizes.length ? Math.min(..._sizes) : null;
          const _mx = _sizes.length ? Math.max(..._sizes) : null;
          const _spread = _sizes.length > 1 && _mx !== _mn;
          const _szTxt = _spread ? `${MB(_mn)}~${MB(_mx)}` : MB(MD.mt.size);
          return `<div class="qm on" title="mteam 全量库盘上实测（ffprobe）：${MD.mt.code ? '番号 '+esc(MD.mt.code)+' · ' : ''}${MD.mt.n>1 ? MD.mt.n+' 个文件 · ' : ''}${MD.mt.sec ? Math.round(MD.mt.sec/60)+' 分钟' : '时长未知'}${_spread ? '\n⚠ 盘上这一集有多个文件，体积各不相同 ⇒ 这里是范围；实际入库取「来源列」标★的那个' : ''}">
           <b>✓ 盘上 ${_szTxt}</b>
           <span>${MD.mt.h ? MD.mt.h+'p' : '分辨率未知'}${MD.mt.codec ? ' · '+esc(String(MD.mt.codec).toUpperCase()) : ''}${MPS(MD.mt.mbps) ? ' · '+MPS(MD.mt.mbps) : ''}</span>
           ${fBlock(_fn(MD.mt.files), mtTitleIsFile)}
         </div>`;
        })()
      /* ⭐⭐ §117（2026-11-01 蛙哥「hanime 和 mteam 的视频信息是 8848 全库都要做」）：
         没落盘的集以前只写一句「⏳ 待落盘」，**体积/文件名全空** —— 930 部作品的
         mteam 那格只剩番号，画质对比整列是「—」（截图 #97776 色气豆豆 就是这种）。
         但种子清单里 3594 个视频**全部带体积**（1223 GB）⇒ 不用等下载就能报出来。
         ⚠️ 与上面的绿框**分成两种块**，⛔ 不合并：绿框 = 已经在盘上、ffprobe 量过；
            灰框 = 只在清单里，没有分辨率/编码（清单没这些字段）⇒ 别假装知道。
         ⚠️ 必须分两句：`mt_pending`（清单有·等得到）vs 压根没有（等也等不来）。 */
      : (MD.verdict === 'mt_pending'
          ? (MD.mtList
              ? `<div class="qm list" title="mteam 全量种子清单里有这一集，还没下到本地盘。体积是种子清单里写的，不是实测">
                   <b>清单 ${MB(MD.mtList.size)}</b>
                   <span>未落盘 · 待下</span>
                   ${fBlock(_fn(MD.mtList.files), mtTitleIsFile)}
                 </div>`
              : `<div class="qm off" title="mteam 全量种子清单里有这一集，但还没下到本地盘">⏳ 待落盘</div>`)
          : `<div class="qm none" title="mteam 全量种子清单里没有这一集 —— 等也等不来">mteam 无</div>`));
    /* ⭐⭐ §127（2026-11-02）**口径大改**：
       此前这块写「库内 XXX MB」，数据来自 `local_file`（扫 115 `/library/已整理`）——
       那批是 **10-14 的旧快照、目录在 NAS 上已不存在** ⇒ 和同一行「未入库」自相矛盾
       （实测 1044 集 / 540 部）。
       ⇒ 现在 `lib_*` = **Emby 媒体库里正在播的那份**（ffprobe 实测体积/分辨率/码率）。
       ⇒ 文案跟着改：不能再叫「库内」（那是第 ④ 条失效路径的名字），
          改成「Emby 库里」并写明它就是**已经在库里的那一份**。
       ⚠️ 与「入库判定」列**同源**（都认 Emby）⇒ 两边不再打架。 */
    const libQ = !MD || !MD.lib ? '' : `<div class="qm lib" title="Emby 媒体库里正在播的这一集（你已经在库里的那份）：${MD.lib.n>1 ? MD.lib.n+' 个文件 · ' : ''}${MD.lib.h?MD.lib.h+'p · ':''}实测体积">
           <b>Emby 库里 ${MB(MD.lib.size)}</b>${MD.lib.h?`<span>${MD.lib.h}p</span>`:''}${MD.lib.n>1 ? `<span>${MD.lib.n} 个文件</span>` : ''}
           ${fBlock(_fn(MD.lib.files))}
         </div>`;
    /* ⚠️ §117：`.qm.src`（源侧最高 Np 那行灰字）**不再画** —— hanime 每条源现在都带
       自己的 `源侧 Np · 体积` 块（见 hnVideo），作品级那句「源侧最高 720p」跟它重复，
       而且粒度更粗（它说的是整部最高档，不是这一集）。数据仍在 `MD.srcQuality` 里
       （`ha_maybe` 判定要用），只是⛔ 不在界面上再写一遍。 */
    const qv = MD && MD.verdict && QV[MD.verdict] ? QV[MD.verdict] : null;
    const qCell = !MD ? `<span class="aln-none">—</span>`
      : !qv ? `<span class="aln-none">—</span>`
      : `<span class="qv ${qv[1]}" title="${esc(qv[2])}">${qv[0]}</span>`
        + (MD.note ? `<div class="qn">${esc(MD.note)}</div>` : '');

    const how = !n ? (enough ? 'unmatched' : 'miss')
      : r.how==='pack' ? 'pack'
      : (r.how==='named' || r.how==='strong' || r.how==='marker' || r.how==='override') ? 'strong'
      : r.how==='season' ? 'season'
      : r.how==='vol' ? 'vol'
      : r.how==='year' ? 'year' : 'unk';
    const howTxt = !n ? (enough ? '未配上' : '缺源')
      : r.how==='pack' ? '整部包'
      : r.how==='override' ? '人工指定'
      : r.how==='named' ? '集名对上'
      : r.how==='marker' ? '集号对上'
      : r.how==='strong' ? '逐字对上'
      : r.how==='season' ? '季内对应'
      : r.how==='vol' ? '卷号推定'
      : r.how==='year' ? '同年推定' : '未确定';
    // ⭐ 入库判定（2026-10-27 判据换成 Emby「动画里番」库）
    //    三档 —— 有这集 / 作品在 Emby 但缺这集 / Emby 里整部都没有
    //    ⛔ 未同步时显示「—」而不是「未入库」（0cs：别把「不知道」写成「没有」）
    const fn = localMap.get(key);
    const store = !localKnown ? `<span class="aln-store no" title="Emby 库未同步，无法判定">—</span>`
      : fn != null ? `<span class="aln-store yes" title="Emby：${esc(fn||'')}">✓ 在库</span>`
      : localHasWork ? `<span class="aln-store part">缺这集</span>`
      : `<span class="aln-store no">未入库</span>`;
    return `<tr class="aln-r ${how}" id="ep-${r.season}-${r.episode}">
      <td class="aln-code">${code}</td>
      <td>${stillCell(stillMap.get(key), hnCoverOf(r))}</td>
      <td class="aln-ep">${esc(r.epName||'（无集名）')}${
        r.airDate?`<span class="aln-date">${esc(String(r.airDate).slice(0,10))}</span>`:''}${
        /* ⭐ §112：分集简介（TMDB `tmdb_episode.overview`）。默认压 2 行，点一下展开 ——
           展开状态纯展示、不进后端，重开抽屉回到折叠态（与标签 +N 同一套交互）。 */
        epOvMap.get(key)
          ? `<span class="aln-epdesc" data-epdesc="${esc(key)}" title="点一下展开/收起">${esc(epOvMap.get(key))}</span>`
          : ''}</td>
      <td class="aln-src">${hn}${libQ}</td>
      <td class="aln-src">${mt}${mtQ}</td>
      <td class="aln-q">${qCell}</td>
      <td class="aln-pick" data-pick="${key}" data-how="${esc(r.how || '')}">${pickCellHtml(key, r.how)}</td>
      <td class="aln-how">${howTxt}</td>
      <td>${store}</td>
      <td class="aln-x">${
        /* ⭐ §74 集级排除：每行一个入口。排除后这一行会被后端剔掉（不再出现在表里），
           恢复入口统一在表尾「已排除」那一块 ⇒ ⛔ 不会出现「点了就找不回来」。 */
        ctx.hiddenEps && ctx.hiddenEps.has(key)
          ? `<span class="epx-gone" title="已排除（恢复入口在表格下方）">已排除</span>`
          : `<button class="epx-btn" data-ep-exclude="${key}" title="TMDB 有这一集，但实际不存在/没资源 —— 排除后不计入集数与入库检测，随时可恢复，⛔ 不删任何数据">排除</button>`}</td>
    </tr>`;
  }).join('');

  /* ⭐ §74 表尾「已排除的集」—— 唯一的恢复入口。
     🔴 被排除的集已从 `al.rows` 里剔掉（后端过滤 eps），表里根本没有它们；
        ⛔ 不给这块就是死锁：点了排除，那行凭空消失、再也找不到（0cs / 0gh 家族）。 */
  const hiddenEpBlock = (ctx.hiddenEpRows && ctx.hiddenEpRows.length) ? `
    <div class="epx-bar">
      <span class="epx-lb">已排除 ${ctx.hiddenEpRows.length} 集</span>
      ${ctx.hiddenEpRows.map(e=>`
        <span class="epx-chip">
          <b>S${String(e.season).padStart(2,'0')}E${String(e.episode).padStart(2,'0')}</b>
          <em>${esc(e.name || '无集名')}</em>
          <button class="epx-restore" data-ep-restore="${e.season}-${e.episode}"
                  title="恢复这一集：重新计入集数与入库检测">恢复</button>
        </span>`).join('')}
      <span class="epx-hint">排除的集不计入集数、逐集对照与入库检测，⛔ 不删任何数据</span>
    </div>` : '';

  const extra = (al.extra && al.extra.length) ? `
    <div class="aln-extra">
      <div class="aln-t">未对上任何集（${al.extra.length}）—— 可能是绑错了别的作品，或 TMDB 没收录</div>
      ${al.extra.map(x=>`<div class="aln-extra-row">
        <span class="aln-tag ${x.kind}">${x.kind==='hanime'?'hanime':'mteam'}</span>
        ${x.id?`<span class="aln-id">${esc(x.id)}</span>`:''}
        <span class="aln-title">${esc(x.title||'')}</span>
        ${x.playlistId?`<span class="aln-pl" title="源站播放清单编号">清单 ${esc(x.playlistId)}</span>`:''}
        ${x.year?`<span class="aln-yr">${x.year}</span>`:''}
      </div>`).join('')}
    </div>` : '';

  // ⭐ 分开显示「确定对上」和「推定对上」—— 推定不可信，别和确定的混在一起
  const strongN  = al.rows.filter(r => r.how === 'strong' || r.how === 'marker').length;
  const markerN  = al.rows.filter(r => r.how === 'marker').length;
  const seasonN  = al.rows.filter(r => r.how === 'season').length;
  const inferN   = al.rows.filter(r => r.how === 'vol' || r.how === 'year').length;
  const packN    = al.rows.filter(r => r.how === 'pack').length;
  return `<div class="aln-sum">
      <span class="aln-chip">TMDB <b>${s.tmdbEps}</b> 集</span>
      <span class="aln-chip ok">逐字对上 <b>${strongN}</b></span>
      ${markerN ? `<span class="aln-chip ok">集号对上 <b>${markerN}</b></span>` : ''}
      ${seasonN ? `<span class="aln-chip ok2">季内对应 <b>${seasonN}</b></span>` : ''}
      ${packN ? `<span class="aln-chip ok2">整部包 <b>${packN}</b></span>` : ''}
      ${inferN ? `<span class="aln-chip warn">推定 <b>${inferN}</b></span>` : ''}
      <span class="aln-chip ${s.missing?'bad':'ok'}">缺源 <b>${s.missing}</b></span>
      ${enough ? `<span class="aln-chip warn">未配上 <b>${s.missing}</b></span>` : ''}
      <span class="aln-chip ${s.extra?'warn':'ok'}">源多出 <b>${s.extra}</b></span>
      <span class="aln-chip">源条目 <b>${s.sourceItems}</b></span>
      ${dl ? `<span class="aln-chip ${dl.missing?'warn':'ok'}" title="源站条目里抓到直链的有几条（分母 = 源站这部的 vid 数，现算）">直链 <b>${dl.withLink}/${dl.srcItems}</b></span>` : ''}
      ${dl && dl.expired ? `<span class="aln-chip warn" title="签名 TTL 约 11 小时，过期的点画质徽章可单个重抓">需重抓 <b>${dl.expired}</b></span>` : ''}
      ${dl && dl.m3u8 ? `<span class="aln-chip warn" title="HLS 切片流，本轮不支持下载">m3u8 <b>${dl.m3u8}</b></span>` : ''}
    </div>${inferN ? `<div class="aln-warn">标「推定」的 ${inferN} 集是按**卷号/年份**配的，源站与 TMDB 的用字对不上时
      可能配错（多子作品合集尤其容易错位）；「逐字对上」最可信，「集号对上」是源站标题自带【第NN話】
      与集号相等（同样确定），「季内对应」是季名+数量对上后季内按序配的。</div>` : ''}
    ${pickBarHtml()}
    <table class="aln-tbl">

        <th title="这一集从哪儿取：hanime（下载）/ mteam（盘上已有的本地文件，0 秒不用下）。点一下存选择，再点上方「按选择执行」走完下载→改名→刮削→入库">来源</th>
        <th>判定</th>

      </tr></thead>

}

/* ── 结论横幅（概览页顶）────────────────────────────────
   把「六项核对有没有矛盾」压成一句话 + 一个数字，
   不用让人读完 6 行长句才知道结论。                          */
function verdictBannerHtml(CC, ccBad, ccWarn){
  if(!CC) return `<div class="dverdict v-unknown">
    <div class="dvi">?</div>
    <div><div class="dvh">未做自动核对</div>
    <div class="dvt">这条没有可比对的数据字段（多为老库数据），只能人工看。</div></div></div>`;
  const META = {
    bad:    ['✗', `${ccBad} 项反证`,    '存在硬矛盾，几乎可以判定不是同一部作品'],
    warn:   ['!', `${ccWarn} 项待确认`, '有差异但可能是 Re:/续作/只抓到部分，需人眼确认'],
    ok:     ['✓', '六项均无矛盾',      '仅代表各维度数据互不冲突，仍不等于已确认同一部作品'],
    unknown:['·', '数据不足',          '关键字段缺失，无法自动核对'],
  }[CC.level] || ['·','—','—'];
  return `<div class="dverdict v-${CC.level}">
    <div class="dvi">${META[0]}</div>
    <div style="flex:1;min-width:0">
      <div class="dvh">${esc(META[1])}</div>
      <div class="dvt">${esc(META[2])}</div>
    </div>
    <div class="dvcnt"><b>${CC.items.length}</b><span>核对项</span></div>
  </div>`;
}

/* ── 溯源区块（用户 2026-10-15 要求）─────────────────────────
   回答「这条 TMDB 记录是靠哪部片匹配出来的」。
   匹配错了要能立刻看到源站原本的片名 + 番号，才好回去改。
   ⚠️ 只展示溯源，不放审核按钮 —— 审核在独立审核台做。            */
const SRC_LABEL = { mteam:'M-TEAM', hanime:'hanime' };

function srcBadgeCls(kinds){
  if(!kinds || !kinds.length) return 'src0';
  if(kinds.length>=2) return 'src2';
  return kinds[0]==='mteam' ? 'srcm' : 'srch';
}

/* ── 年份一致性判定（用户 2026-10-15 17:05 要求）──────────────
   双源是否同步对应同一个 TMDB，**年份是最强的单项反证**：
   源站 2008 vs TMDB 2025 差 17 年 → 一定不是同一部作品。
   ⚠️ 阈值取 3 年：里番常见「Re:/续作」跨年发行，差 1~2 年属正常。
   ⚠️ hanime 的 years 是数组（一作横跨多年），要跟 TMDB 年**区间相交**才算同步，
      不能只比单年 —— 否则「2025-2026 跨年作」会被误判成冲突。          */
function yrSet(s){
  const out = new Set();
  if(Array.isArray(s.years)) s.years.forEach(y=>{ const n=Number(y); if(n) out.add(n); });
  if(s.year!=null){ const n=Number(s.year); if(n) out.add(n); }
  return [...out].sort((a,b)=>a-b);
}
function yearLabel(s, TMDB_YEAR){
  const ys = yrSet(s);
  if(!ys.length) return {text:'源站年份 —', short:'无年份', cls:'f-unknown', ycls:'unknown',
    tip:'源站没给年份，核对时无法用年份反证'};
  const t = TMDB_YEAR;
  if(t==null) return {text:`源站年份 ${ys.join('/')}`, short:ys.join('/'), cls:'', ycls:'unknown',
    tip:'源站年份（TMDB 年份未知）'};
  const hit = ys.some(y=>Math.abs(y-t)<=2);
  const gap = Math.min(...ys.map(y=>Math.abs(y-t)));
  if(hit) return {text:`源站年份 ${ys.join('/')} ✓ 与 TMDB ${t} 同年`, short:`${ys[0]} ✓`,
    cls:'f-ok', ycls:'ok',
    tip:`源站年份与 TMDB ${t} 一致 —— 年份维度通过`};
  if(gap<=5) return {text:`源站年份 ${ys.join('/')} ≈ TMDB ${t}（差${gap}年）`, short:`${ys[0]} ≈`,
    cls:'f-warn', ycls:'warn',
    tip:`相差 ${gap} 年，在里番 Re:/续作的常见范围内，仍需看标题与集数确认`};
  return {text:`⚠ 年份冲突：源站 ${ys.join('/')} vs TMDB ${t}（差${gap}年）`, short:`${ys[0]} ✗`,
    cls:'f-bad', ycls:'bad',
    tip:`相差 ${gap} 年 —— 年份是判定错配的最强反证，这极可能不是同一部作品`};
}

function srcBlockHtml(w, ev, tmdbEps){
  const kinds = w.srcKinds || [];
  const badge = w.srcBadge;
  const rows  = (ev && ev.sources) || [];
  const TMDB_YEAR = (w.year!=null) ? Number(w.year) : null;

  /* 🔴 双口径必须并排写出来（用户 2026-10-15 抽查时被坑过一次）
     「源站 N 条」= hanime 清单里的视频个数 / MT 番号条数
     「TMDB M 集」 = TMDB 自己收录的分集数
     两者不等 **不一定是漏抓** —— 源站可能把多集合并成一个视频，反之亦然。
     只显示一个数会让人以为是 bug，所以两个都摆出来。
     🔴 但**必须分开报**：M-TEAM 是「番号数」（分卷数，一个番号≠一集），
        hanime 是「视频数」（=集数）。混在一起求和会得出无意义的数。 */
  const hnEps = rows.filter(s=>s.src==='hanime').reduce((a,s)=> a + (s.episodes||0), 0);
  const mtCnt = rows.filter(s=>s.src==='mteam').length;
  const srcYears = [...new Set(rows.flatMap(s=> s.years||[]))].sort();
  /* ⭐ 源站**官方**集数（2026-10-21 新增，来自作品播放列表页）
     —— 这才是「我们该抓多少」的基准。
     区分两件事：
       官方 N 集 vs 我们 M 条  →  我们漏抓了多少（可修）
       官方 N 集 vs TMDB K 集  →  源站与 TMDB 口径不同（绑定问题）
     没有它，看板上只看到「N 条 vs K 集」，会把两种问题混成一个。 */
  const hnOfficial = rows.filter(s=>s.src==='hanime' && s.officialEpisodes!=null)
                          .reduce((a,s)=> a + (s.officialEpisodes||0), 0);
  const hasOfficial = rows.some(s=>s.src==='hanime' && s.officialEpisodes!=null);

  /* 🔴 六因子自动核对（2026-10-16）
     判定「hanime/mteam 是否同步对应 TMDB」的决定性因素共六项：
       年份 / 双源互证 / 集数 / 源站类型 / 题材 / 匹配方式
     这些数据全部在库里，后端已逐条核对并给出 ok/warn/bad/unknown，
     前端只负责呈现 —— 不让人眼去比年份、比集数。
     ⚠️ 全绿 = **六项都不矛盾**，不等于「已确认是同一部作品」。
     ⭐ 2026-10-21 视觉重制：原来是 6 行长句竖排（文字墙），
        现在改成 6 张小卡横排 —— 扫一眼就知道哪一项不对。          */
  const CC = (ev && ev.crossCheck) || null;
  /* ⭐ 2026-10-21 蛙哥定调后调整顺序：
     结论横幅（这条有没有问题）→ 双口径（源站 vs TMDB）→ 六因子（哪一项不对）→ 逐条源记录
     以前六因子在最前面，结论横幅被压在「概览」页里，得先点页签才看得到。 */
  const ccBad  = CC ? CC.items.filter(i=>i.level==='bad').length : 0;
  const ccWarn = CC ? CC.items.filter(i=>i.level==='warn').length : 0;
  const fgrid = CC ? `<div class="fblk">
      <h4>六因子核对
        <span class="srcn">${CC.items.length} 项 · 只看数据之间是否矛盾</span></h4>
      <div class="fgrid">${CC.items.map(i=>{
        const mark = i.level==='ok'?'✓':i.level==='warn'?'!':i.level==='bad'?'✗':'·';
        return `<div class="fitem ${i.level}">
          <div class="ff"><span class="m">${mark}</span>${esc(i.factor)}</div>
          <div class="ft">${esc(i.text)}</div>
        </div>`;}).join('')}</div>
    </div>` : '';

  const caliber = rows.length ? `<div class="calib">
      ${rows.some(s=>s.src==='hanime') ? `<span class="cb" title="hanime 清单内的视频个数，等价于集数"><b>${hnEps}</b> 条 hanime 视频</span>` : ''}
      ${hasOfficial ? `<span class="cb" title="源站作品播放列表上的官方集数 —— 这是「我们该抓多少」的基准"><b>${hnOfficial}</b> 集源站官方</span>` : ''}
      ${mtCnt ? `<span class="cb" title="M-TEAM 按番号分条发布，番号数≠集数">${mtCnt} 个 MT 番号</span>` : ''}
      <span class="cs">vs</span>
      <span class="cb"><b>${tmdbEps || 0}</b> 集 TMDB 元数据</span>
      ${TMDB_YEAR!=null ? `<span class="cy">TMDB 年份 ${TMDB_YEAR}</span>` : ''}
      ${srcYears.length ? `<span class="cy">源站年份 ${srcYears.join('/')}</span>` : ''}
    </div>` : '';

  const head = badge
    ? `<h4>匹配溯源
         <span class="srcbadge ${srcBadgeCls(kinds)}">${esc(badge)}</span>
         <span class="srcn">${rows.length} 条源作品</span>
       </h4>`
    : `<h4>匹配溯源 <span class="srcn">无源记录</span></h4>`;

  if(!rows.length){
    return `<div class="dsect">${head}
      <div style="color:var(--ink3);font-size:13px">${
        badge ? '源记录缺失（老库数据无溯源链）' : '这条没有对应的源作品，请检查入库来源'
      }</div></div>`;
  }

  // 按来源分组：MT 一组、hanime 一组
  const groups = new Map();
  rows.forEach(s=>{ (groups.get(s.src)||groups.set(s.src,[]).get(s.src)).push(s); });

  /* ⭐ 2026-10-21 视觉重制 —— 源记录卡片：
     决定性字段（年份一致性）**放大成一枚显眼的标签**；
     次要字段（厂牌/条目数/匹配方式/题材）收进**一行灰字**。
     以前这些挤在同一排等宽 pill 里，看不出哪个是结论。            */
  const groupHtml = [...groups.entries()].map(([src, list])=>`
    <div class="srcgrp">
      <div class="srcgrp-h">
        <span class="srcbadge ${srcBadgeCls([src])}">${esc(SRC_LABEL[src]||src)}</span>
        <span class="srcn">${list.length} 条</span>
      </div>
      ${list.map(s=>{
        const yl = yearLabel(s, TMDB_YEAR);
        const bits = [];
        if(s.brand) bits.push(`厂牌 ${s.brand}`);
        bits.push(s.src==='mteam'
          ? (s.episodes? s.episodes+' 个番号（≠集数）':'番号数 —')
          : (s.episodes? s.episodes+' 条源条目':'源条目数 —'));
        if(s.genre) bits.push(`源站类型 ${s.genre}`);
        if(s.matchBy) bits.push(`${s.matchBy}${s.matchScore!=null?' '+s.matchScore:''}`);
        if(s.workJa) bits.push(`作品原名 ${s.workJa}`);
        return `
        <div class="srow">
          <div class="srow-h">
            <span class="srow-key" title="${esc(s.srcKey||'')}">${esc(s.srcKey||'—')}</span>
            <span class="srow-title">${esc(s.title||'—')}</span>
            <span class="srow-year ${yl.ycls}" title="${esc(yl.tip)}">${esc(yl.short)}</span>
          </div>
          <div class="srow-sub">
            ${bits.map((b,i)=>`${i?'<span class="sep">·</span>':''}<span>${esc(b)}</span>`).join('')}
          </div>
          <div class="srow-more">${entryTableHtml(s)}</div>
        </div>`;}).join('')}
    </div>`).join('');

  /* 溯源页的最终顺序（2026-10-21 蛙哥定调：溯源在上，概览在下）：
     匹配溯源标题 → 结论横幅 → 双口径条 → 六因子网格 → 逐条源记录 */
  return `<div class="dsect">${head}
    ${verdictBannerHtml(CC, ccBad, ccWarn)}
    ${caliber}
    ${fgrid}
    ${groupHtml}
  </div>`;
}

/* ── hanime 逐集明细 ────────────────────────────────────
   用户 2026-10-15 抽查发现源站 4 集、旧库只抓 3 集，根因是分页正则从未匹配。
   修好之后必须把每个源视频的 vid / 年份 / 源标题 / 抓取页码都摊开，
   以后核对「源站 N 条」和「TMDB M 集」对不对得上，一眼就能看出来。

   ⚠️ 两个口径不是一回事，不能互相替代：
      episodes       = 源站条目数（hanime 清单里的视频个数）
      work.episodeTotal = TMDB 集数（TMDB 自己收录的分集数）
      两者不等不一定是漏抓 —— 源站可能把多集合成一个视频，或反过来。
      所以两个数必须同时显示，不允许只显示其中一个。            */
function entryTableHtml(s){
  const det = s.entryDetail;
  if(!det || !det.length) return '';
  // 🔴 日文原名（title_ja）来自 hanime **视频详情页**，与清单页中文译名并存。
  //    没有它，中文译名 ↔ TMDB 日文原名 判据形同虚设（实测 dice 恒 0）。
  //    有则整列显示；全都没有时整列隐藏，不留一个空列误导成"没抓到"。
  //    ⭐ §140：title_ja 缺失的存量条目（全库 76/3555）用 title_page 剥站方标记兜底
  //      （hnJaFull，0lx 共用函数）——「展示完整」从数据原样透传，⛔ 不改 entry_detail 快照。
  const hasJa = det.some(e=>hnJaFull(e.title_ja, e.title_page));
  // 中文标题（视频页 description 里那截）—— 与清单页译名常常不同
  const hasZh = det.some(e=>e.title_zh);
  const rows = det.map((e,i)=>`
    <tr>
      <td class="ec">${i+1}</td>
      <td class="evid"><a href="https://hanime1.me/video/${esc(e.vid)}"
          target="_blank" rel="noopener"
          title="在 hanime1.me 打开这个源视频">${esc(e.vid)}</a></td>
      <td>${e.year ?? '—'}</td>
      <td class="epg">${e.genre ? esc(e.genre) : '—'}</td>
      <td class="ep2">${e.page ?? '—'}</td>
      <td class="etl">${esc(e.title || '—')}</td>
      ${hasZh ? `<td class="etlzh">${e.title_zh ? esc(e.title_zh) : '<span style="opacity:.45">—</span>'}</td>` : ''}
      ${hasJa ? `<td class="etlja">${(()=>{ const _j = hnJaFull(e.title_ja, e.title_page);
        return _j ? esc(_j) : '<span style="opacity:.45">—</span>'; })()}</td>` : ''}
    </tr>`).join('');
  const span = det.length;
  const jaCol = hasJa ? '<th class="etlja">日文原名<br><span style="font-weight:400;opacity:.6">详情页 /watch?v=</span></th>' : '';
  const zhCol = hasZh ? '<th class="etlzh">中文标题<br><span style="font-weight:400;opacity:.6">详情页 description</span></th>' : '';
  /* ⭐ 2026-10-21 视觉重制：**默认收起**。
     以前条目 ≤8 时自动展开 ⇒ 点开一部片先被一整张明细表糊脸。
     现在收成一枚可点的胶囊，想看细节时再点开。 */
  return `<details class="edt">
    <summary>源站逐集明细 · <b>${span}</b> 条${hasJa?` · <b>${det.filter(e=>hnJaFull(e.title_ja, e.title_page)).length}</b> 条带日文原名`:''}</summary>
    <table class="etbl">
      <thead><tr>
        <th>#</th><th>vid</th><th>年份</th><th>分类</th><th>抓取页</th><th>源标题（清单页·中文译名）</th>${zhCol}${jaCol}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </details>`;
}

/* ══ 入库检测视图 ══════════════════════════════════════════ */

const STATUS_LABEL = {
  complete:    '已齐集',
  partial:     '缺集',
  missing_work:'未下载',
  unlisted:    'TMDB 未收录',
};

/* ═══════════════════════════════════════════════════════════════
   ⭐ §86（2026-10-30）链接健康页
   ───────────────────────────────────────────────────────────────
   蛙哥的原话：
   > 「hanime 还是一直在更新的，所以 hanime 的剧集和下载链接后期还需要继续抓，
   >   我需要确定后期抓的剧集和下载链接是真的落地到看板」

   ⇒ 这一页就是那个「验收器」。回答四个问题：
   1. 源站到底收录了多少集？→ `srcTotal`（分母，从 entry_detail 现算）
   2. 有多少集已经挂上链接？→ `linked`（分子）
   3. 缺哪些？→ `missing` 清单（可逐条补抓）
   4. 上次什么时候抓的？→ `lastFetchedAt`（证明增量抓取在跑）
   ═══════════════════════════════════════════════════════════════ */

function lhNum(n){
  return String(n ?? 0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function lhWhen(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return String(iso);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/** 相对时间（多久前抓的） */
function lhAgo(iso){
  if(!iso) return '—';
  const t = new Date(iso).getTime();
  if(isNaN(t)) return '—';
  const s = Math.floor((Date.now()-t)/1000);
  if(s < 60) return s + ' 秒前';
  if(s < 3600) return Math.floor(s/60) + ' 分钟前';
  if(s < 86400) return Math.floor(s/3600) + ' 小时前';
  return Math.floor(s/86400) + ' 天前';
}

/* ══════════════════════════════════════════════════════════════════
   ⭐ §88（2026-10-30）下载中心

   蛙哥：「能否做进 8848 看板，下载进度能否看见」
   ⇒ 这一页就是答案：队列每 1 秒自刷新，逐集进度条 + 速度 + **走的哪条通道**。
     通道很重要 —— direct（直连）不烧机场流量，proxy0 才烧。

   ⛔ 不用截图验收：状态全来自 /api/dl/queue 的 JSON。
   ══════════════════════════════════════════════════════════════════ */
let DLPOLL = null;

function dlSize(n){
  if(n==null||isNaN(n)) return '—';
  let x=Number(n), i=0; const u=['B','KB','MB','GB','TB'];
  while(x>=1024 && i<u.length-1){ x/=1024; i++; }
  return (i<=0 ? Math.round(x) : x.toFixed(1)) + ' ' + u[i];
}
function dlRate(kbps){
  if(!kbps) return '';
  return kbps>=1024 ? (kbps/1024).toFixed(1)+' MB/s' : Math.round(kbps)+' KB/s';
}
function dlRest(p,total,kbps){
  if(!total||!kbps||kbps<=0) return '';
  const left=(total-p)/1024;  // KB
  const s=Math.round(left/kbps);
  if(s<=0) return '';
  if(s<60) return s+' 秒';
  return Math.floor(s/60)+' 分 '+(s%60)+' 秒';
}
function dlChName(id){
  if(!id) return '—';
  if(id==='direct') return '直连';
  /* ⭐ §89：worker 在「重抓签名」和「刚开工还没选通道」时会写这两个内部值 ——
     直接把它们显示成人话，否则表上出现 `…` / `relink` 像报错。 */
  if(id==='relink') return '重抓签名中';
  if(id==='…') return '连接中';
  return id.startsWith('proxy') ? '代理'+(Number(id.slice(5))+1) : id;
}
function dlWorkName(tmdbId){
  try{
    const w = (S.works||[]).find(x=>String(x.id)===String(tmdbId));
    return w ? (w.nameZh || w.name || w.nameOriginal || ('tmdb '+tmdbId)) : ('tmdb '+tmdbId);
  }catch(e){ return 'tmdb '+tmdbId; }
}

async function renderDownload(){
  if(DLPOLL){ clearTimeout(DLPOLL); DLPOLL=null; }
  const el = $('#main');
  const keep = el.scrollTop;
  let d = null;
  try{ d = await fetch('/api/dl/queue?limit=200').then(r=>r.json()); }
  catch(e){
    el.innerHTML = '<div class="set-wrap"><div class="set-card"><div class="set-msg err show">读下载队列失败：'+setEsc(e.message)+'</div></div></div>';
    return;
  }
  if(!d || !d.ok){
    el.innerHTML = '<div class="set-wrap"><div class="set-card"><div class="set-msg err show">接口返回异常</div></div></div>';
    return;
  }

  const c = d.counts || {queued:0,running:0,done:0,failed:0};
  const wk = d.worker || {};
  const items = d.items || [];

  /* 通道流量：直连省下的流量 = 直连字节；代理字节 = 真正烧掉的机场流量 */
  const traffic = (d.traffic||[]);
  const sumAll = traffic.reduce((a,b)=>a+b.bytes,0) || 1;
  const proxyBytes = traffic.filter(t=>t.channel && t.channel.startsWith('proxy')).reduce((a,b)=>a+b.bytes,0);
  const directBytes = traffic.filter(t=>t.channel==='direct').reduce((a,b)=>a+b.bytes,0);
  const chRows = traffic.length ? traffic.map(t=>{
    const pct = Math.max(2, Math.round(t.bytes/sumAll*100));
    const isProxy = t.channel && t.channel.startsWith('proxy');
    /* ⚠️ 「未记录」= §85 那一批同步下载（当时还没有 channel 字段），
       ⛔ 不要把它算成直连 —— 那批实际是走代理下的，图标要区分开。 */
    const unknown = !t.channel || t.channel === '(未记录)';
    const icon = unknown ? '❓' : (isProxy ? '☁️' : '⚡');
    return `<div class="dl-chrow ${isProxy?'proxy':''}">
      <span class="dl-chname">${icon} ${setEsc(unknown?'历史（未记录通道）':dlChName(t.channel))}</span>
      <span class="dl-chbar"><i style="width:${pct}%"></i></span>
      <span class="dl-chval"><b>${dlSize(t.bytes)}</b> <em>· ${t.count} 集</em></span>
    </div>`;
  }).join('') : '<div class="set-empty">还没有下载记录</div>';

  const running = items.filter(x=>x.state==='running');
  const queued = items.filter(x=>x.state==='queued');
  const failed = items.filter(x=>x.state==='failed');
  const done = items.filter(x=>x.state==='done');

  const order = [...running, ...queued, ...failed, ...done.slice(0,40)];
  const rows = order.length ? order.map(it=>{
    const p = Number(it.progressBytes||0);
    const total = it.totalBytes==null ? null : Number(it.totalBytes);
    const pct = total ? Math.min(100, Math.round(p/total*100)) : 0;
    const indet = it.state==='running' && !total;
    const isDirect = it.channel==='direct';
    const nm = dlWorkName(it.tmdbId);
    const ep = `S${String(it.season||0).padStart(2,'0')}E${String(it.episode||0).padStart(2,'0')}`;
    const stText = {running:'下载中',queued:'排队中',done:'已完成',failed:'失败'}[it.state] || it.state;
    const meta = [
      total ? `<b>${dlSize(p)}</b> / ${dlSize(total)}` : `<b>${dlSize(p)}</b>`,
      it.state==='running'
        ? (it.channel==='relink' ? '重抓签名中（解 CF 约 8~20 秒）' : (dlRate(it.speedKbps) || '连接中…'))
        : '',
      it.state==='running' ? dlRest(p,total,it.speedKbps) : '',
      it.channel ? `<span class="ch ${isDirect?'direct':''}">${setEsc(dlChName(it.channel))}</span>` : '',
      it.error ? `<span class="err">${setEsc(String(it.error).slice(0,80))}</span>` : '',
    ].filter(Boolean).join(' · ');
    const acts = [];
    if(it.state==='failed') acts.push(`<button data-dlreq="${setEsc(it.vid)}" data-dlwid="${it.tmdbId}">重试</button>`);
    if(it.state==='queued'||it.state==='running') acts.push(`<button data-dlcancel="${setEsc(it.vid)}">取消</button>`);
    return `<div class="dl-row ${it.state}">
      <div class="dl-hd">
        <span class="dl-ti">${setEsc(nm)} · ${ep}</span>
        <span class="dl-st ${it.state}">${stText}</span>
      </div>
      <div class="dl-bar ${it.state==='done'?'done':''} ${it.state==='failed'?'failed':''} ${indet?'indet':''}">
        <i style="width:${indet?35:pct}%"></i>
      </div>
      <div class="dl-meta">${meta}</div>
      ${acts.length?`<div class="dl-rowact">${acts.join('')}</div>`:''}
    </div>`;
  }).join('') : '<div class="dl-empty">队列是空的。在「入库检测」里点「⬇ 下载整部缺集」，或单集上的「下载」按钮。</div>';

  const isPaused = !!wk.paused;
  const dk = d.disk || {};
  /* ⭐ §90 通道策略（默认 off = 永不代理，机场 15G/月扛不住一集 500MB） */
  const pm = d.proxyMode || 'off';
  const pmDesc = pm==='off'
    ? '只直连。不消耗任何机场流量；万一 CDN 把直连 IP 全拒了，这一集会如实报错，不偷偷走代理。'
    : pm==='fallback'
      ? '直连优先，所有 IP 都被拒才降级到代理。机场流量只花在失败的那几集。'
      : '只用代理，直连一次都不试。速度最快，但全程烧机场流量 —— 只在应急时用。';
  const diskTxt = dk.freeGb == null
    ? ''
    : ` · 落盘盘剩余 <b>${Number(dk.freeGb).toFixed(1)} GB</b>${dk.blocked?' <span style="color:var(--bad-ink);font-weight:700">（不足，已自动停）</span>':''}`;
  el.innerHTML = `
  <div class="set-wrap">
    <div class="set-card">
      <h3>下载中心</h3>
      <p class="set-sub">
        下载在 <b>NAS 服务端</b>跑，关掉浏览器也不停。
        <b>${pm==='off'?'仅直连':pm==='fallback'?'直连优先':'仅代理'}</b> —— ${setEsc(pmDesc)}
        逐集进度每秒刷新。
      </p>

      <div class="dl-kpis">
        <div class="dl-kpi run"><b>${c.running||0}</b><span>正在下载</span></div>
        <div class="dl-kpi"><b>${c.queued||0}</b><span>排队中</span></div>
        <div class="dl-kpi ok"><b>${c.done||0}</b><span>已完成</span></div>
        <div class="dl-kpi ${c.failed?'bad':''}"><b>${c.failed||0}</b><span>失败</span></div>
      </div>

      <div class="dl-toolbar">
        <button class="set-run" id="dlPauseBtn">${isPaused?'▶ 继续队列':'⏸ 暂停队列'}</button>
        <span class="set-hint">
          ${wk.running ? (isPaused?'已暂停，正在下的那一集下完后会停':'worker 在跑') : 'worker 未启动'}
          ${wk.current?` · 当前 <b class="mono">${setEsc(wk.current)}</b>`:''}${diskTxt}
        </span>
        <span class="sp"></span>
      </div>

      <div class="dl-chanmode">
        <span class="cm-lbl">下载通道</span>
        <button class="cm-btn${pm==='off'?' on':''}" data-pm="off">仅直连</button>
        <button class="cm-btn${pm==='fallback'?' on':''}" data-pm="fallback">直连失败再用代理</button>
        <button class="cm-btn${pm==='always'?' on':''}" data-pm="always">仅代理</button>
        <span class="cm-note">改完<b>下一集</b>立即生效，不用重启 · 只管下视频，抓链接不受影响</span>
      </div>

      <h4 style="margin:18px 0 8px; font-size:13px; color:var(--ink2)">通道 · 流量消耗</h4>
      <p class="set-sub" style="margin:0 0 10px">
        已下 <b>${dlSize(sumAll)}</b>，其中走代理 <b style="color:var(--warn-ink)">${dlSize(proxyBytes)}</b>
        （= 机场实际消耗），直连省下 <b style="color:var(--ok-ink)">${dlSize(directBytes)}</b>。
      </p>
      <div class="dl-chs">${chRows}</div>

      <h4 style="margin:18px 0 8px; font-size:13px; color:var(--ink2)">队列</h4>
      <div class="dl-list">${rows}</div>
    </div>
  </div>`;
  el.scrollTop = keep;

  /* ⭐ 暂停 / 继续 */
  const pb = $('#dlPauseBtn');
  if(pb) pb.onclick = async ()=>{
    pb.disabled = true;
    try{
      await fetch(isPaused?'/api/dl/resume':'/api/dl/pause', {method:'POST'});
    }catch(e){}
    renderDownload();
  };

  /* ⭐ §90 下载通道切换（仅直连 / 直连失败再代理 / 仅代理） */
  el.querySelectorAll('.dl-chanmode .cm-btn').forEach(b=>{
    b.onclick = async ()=>{
      const next = b.dataset.pm;
      if(next === pm) return;
      el.querySelectorAll('.dl-chanmode .cm-btn').forEach(x=>x.disabled=true);
      try{
        const r = await fetch('/api/dl/settings', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({proxyMode: next}),
        }).then(r=>r.json());
        if(!r || !r.ok) throw new Error((r&&r.error)||'切换失败');
        toast('通道已切换：'+(next==='off'?'仅直连':next==='fallback'?'直连失败再用代理':'仅代理'));
      }catch(e){
        toast('切换失败：'+(e.message||e), 'err');
      }
      renderDownload();
    };
  });

  /* ⭐ 重试 / 取消（事件委托到 main，只绑一次 —— ⛔ 每轮重绘都 addEventListener 会叠 N 层） */
  DLPOLL = setTimeout(()=>{ if(VIEW==='dl') renderDownload(); }, 1000);
}

/* ══════════════════════════════════════════════════════════════════
   ⭐ §93 刮削中心（2026-10-30）

   ## 蛙哥原话
   「抓取、下载、刮削，这几个步骤都需要在 8848 看板上体现出来，
     就是我能看到记录，我能看到进度」

   ## 这一页存在的唯一理由
   刮削以前是个黑盒：点了按钮只有「成功/失败」两种回声。
   卡在「拉季详情」还是「复制 800MB 进 115」看不出来 —— 而这恰恰是
   排查「为什么这部一直不入库」唯一需要知道的事。

   ## 三段结构
   | 区块 | 回答什么问题 |
   |---|---|
   | 当前任务 + 八格步骤条 | 现在在刮哪一集、第几步、这步卡了多久 |
   | 队列 | 还有多少集在等、多少集失败（失败点「重试」）|
   | 最近入库 | 这段到底入了哪些（作品 · 集 · 时间 · 落到哪）|

   ## 🔴 2 秒轮询，切走必须停
   和 §88 下载页同款：`stopScrapePoll()` 在 switchView 里切走时调用。
   ⛔ 不能让轮询跟着全局跑 —— 切到别的页还在 fetch 是白烧 CPU 与带宽。

   ## ⛔ 用 /api/dl/scrape/list 一个接口，不在前端拼三个请求
   三个接口的返回时刻不同 ⇒ 进度条和数字对不上（0cs：口径要讲出来）。
   ══════════════════════════════════════════════════════════════════ */
/* ⛔ 用 var 不用 let：switchView 里可能在任何时刻被调用，
   let 在文件更后面声明时会撞 TDZ（`Cannot access before initialization`） */
var SCRAPE_POLL = null;
function stopScrapePoll(){ if(SCRAPE_POLL){ clearTimeout(SCRAPE_POLL); SCRAPE_POLL = null; } }

/** 毫秒 → 人话时长 */
function scDur(ms){
  const s = Math.max(0, Math.round(Number(ms || 0) / 1000));
  if(s < 60) return s + ' 秒';
  const m = Math.floor(s / 60);
  if(m < 60) return m + ' 分 ' + (s % 60) + ' 秒';
  return Math.floor(m / 60) + ' 时 ' + (m % 60) + ' 分';
}
/** 作品名：优先用刮削时写进库的中文名（work_ingest.title），回落到全库数据 */
function scName(it){
  if(it && it.title) return it.title;
  return dlWorkName(it && it.tmdbId);
}
function scEp(it){
  return 'S' + String((it && it.season) || 0).padStart(2,'0')
       + 'E' + String((it && it.episode) || 0).padStart(2,'0');
}
/** ISO → 本地时间（今天只显示时分，早于今天就显示月-日 时:分） */
function scWhen(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  const now = new Date();
  const hm = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  if(d.toDateString() === now.toDateString()) return '今天 ' + hm;
  return (d.getMonth()+1) + '-' + d.getDate() + ' ' + hm;
}

async function renderScrape(){
  stopScrapePoll();
  const el = $('#main');
  const keepY = window.scrollY || 0;

  let d = null;
  try{ d = await fetch('/api/dl/scrape/list?doneLimit=60').then(r=>r.json()); }
  catch(e){
    el.innerHTML = '<div class="set-wrap"><div class="set-card"><div class="set-msg err show">读刮削队列失败：'+setEsc(e.message)+'</div></div></div>';
    return;
  }
  if(!d || !d.ok){
    const msg = (d && d.enabled === false)
      ? '刮削通道未启用：缺 TMDB key，或媒体库目录没挂进容器'
      : '接口返回异常';
    el.innerHTML = '<div class="set-wrap"><div class="set-card"><div class="set-msg err show">'+setEsc(msg)+'</div></div></div>';
    return;
  }

  const wk = d.worker || {};
  const steps = d.steps || [];
  const c = d.counts || {total:0,done:0,running:0,queued:0,waiting:0,failed:0};
  const active = d.active || [];
  const doneRows = d.done || [];

  /* ── ① 当前任务卡 + 八格步骤条 ───────────────────────────── */
  const busy = !!wk.busy && !!wk.current;
  const curRow = busy ? active.find(x => String(x.vid) === String(wk.current)) : null;
  const curIdx = wk.step ? Number(wk.step.idx) : 0;
  const stepMs = wk.step && wk.step.at ? (Date.now() - Date.parse(wk.step.at)) : 0;

  const stepsHtml = steps.map((s,i)=>{
    const n = i + 1;
    const cls = (curIdx && n < curIdx) ? 'done' : (curIdx && n === curIdx ? 'cur' : 'todo');
    let sub = '';
    if(cls === 'cur' && wk.step && wk.step.sub){
      const sm = wk.step.sub;
      sub = (sm.unit === 'B')
        ? '<i>' + Math.min(100, Math.round(Number(sm.done||0) / Math.max(1, Number(sm.total||0)) * 100)) + '%</i>'
        : '<i>' + Number(sm.done||0) + '/' + Number(sm.total||0) + '</i>';
    }
    return '<div class="sc-step '+cls+'"><b>'+(n<10?'0':'')+n+'</b><span>'+setEsc(s.label)+'</span>'+sub+'</div>';
  }).join('');

  let nowHtml;
  if(busy){
    const nm = curRow ? scName(curRow) : (wk.lastTarget ? String(wk.lastTarget).split('/').pop() : wk.current);
    const ep = curRow ? scEp(curRow) : '';
    const stepName = wk.step ? wk.step.label : '准备中';
    const stat = wk.step && wk.step.sub
      ? (wk.step.sub.unit === 'B'
          ? dlSize(wk.step.sub.done) + ' / ' + dlSize(wk.step.sub.total)
          : Number(wk.step.sub.done||0) + ' / ' + Number(wk.step.sub.total||0) + ' ' + wk.step.sub.unit)
      : '';
    nowHtml = '<div class="sc-now run">'
      + '<div class="sc-now-hd">'
      +   '<span class="sc-now-t"><span class="sc-pulse"></span>刮削中 · '+setEsc(nm)+(ep?' · '+ep:'')+'</span>'
      +   '<span class="sc-now-tm">本步已 '+scDur(stepMs)+'</span>'
      + '</div>'
      + '<div class="sc-steps">'+stepsHtml+'</div>'
      + '<div class="sc-now-sub">第 <b>'+curIdx+'</b>/'+steps.length+' 步 · <b>'+setEsc(stepName)+'</b>'
      +   (stat ? ' · <span class="sc-mono">'+setEsc(stat)+'</span>' : '')
      +   (wk.step && wk.step.sub && wk.step.sub.unit === 'B' ? '（复制进 115，这步最慢）' : '')
      + '</div>'
      + '</div>';
  } else {
    /* 空闲：八格全灰，但仍然画出来 —— 让人知道「一共八步」，
       下次开工时能立刻对上号，而不是看到一堆陌生格子。 */
    const idleSteps = steps.map((s,i)=>'<div class="sc-step todo"><b>'+((i+1)<10?'0':'')+(i+1)+'</b><span>'+setEsc(s.label)+'</span></div>').join('');
    nowHtml = '<div class="sc-now">'
      + '<div class="sc-now-hd"><span class="sc-now-t">当前空闲</span>'
      +   '<span class="sc-now-tm">'+(wk.lastAt ? '上次跑 '+scWhen(wk.lastAt) : '还没跑过')+'</span></div>'
      + '<div class="sc-steps">'+idleSteps+'</div>'
      + '<div class="sc-now-sub">'
      +   (c.waiting + c.queued > 0
            ? '队列里还有 <b>'+(c.waiting + c.queued)+'</b> 集待处理，worker 会自己接着跑'
            : '队列是空的。在「待下」页点「⚡ 一条龙」，或在作品页点「入库」')
      +   (wk.lastErr ? ' · 上次失败：<span class="wbad">'+setEsc(String(wk.lastErr).slice(0,90))+'</span>' : '')
      + '</div></div>';
  }

  /* ── ② 四个数字 ────────────────────────────────────────────── */
  const kpiHtml = '<div class="sc-kpi">'
    + '<div><b>'+c.total+'</b><span>登记总集数</span></div>'
    + '<div class="ok"><b>'+c.done+'</b><span>已入库</span></div>'
    + '<div class="run"><b>'+(c.running + c.queued + c.waiting)+'</b><span>待处理</span></div>'
    + '<div class="bad"><b>'+c.failed+'</b><span>失败</span></div>'
    + '</div>';

  /* ── ③ 队列（未完成的全部）───────────────────────────────── */
  const ORDER = {running:0, queued:1, waiting:2, failed:3};
  const actSorted = [...active].sort((a,b)=>{
    const oa = ORDER[a.state] == null ? 9 : ORDER[a.state];
    const ob = ORDER[b.state] == null ? 9 : ORDER[b.state];
    if(oa !== ob) return oa - ob;
    return (Number(a.tmdbId||0) - Number(b.tmdbId||0)) || (Number(a.episode||0) - Number(b.episode||0));
  });
  const ST_TXT = {running:'刮削中', queued:'排队中', waiting:'等下载', failed:'失败', done:'已入库'};
  const actRows = actSorted.length ? actSorted.slice(0,200).map(it=>{
    const st = it.state || 'queued';
    const cls = st === 'running' ? 'running' : (st === 'failed' ? 'failed' : '');
    const meta = [
      st === 'waiting' ? '这条集还没下完；下载完成后会自动排进来' : '',
      it.attempts ? '已试 '+it.attempts+' 次' : '',
      it.err ? '<span class="err">'+setEsc(String(it.err).slice(0,110))+'</span>' : '',
      it.dest ? '<span class="sc-mono">'+setEsc(String(it.dest).split('/').pop())+'</span>' : '',
    ].filter(Boolean).join(' · ');
    const act = st === 'failed'
      ? '<div class="dl-rowact"><button data-scretry="'+setEsc(it.vid)+'" data-scwid="'+(it.tmdbId||0)+'">重试</button></div>'
      : '';
    return '<div class="dl-row '+cls+'">'
      + '<div class="dl-hd"><span class="dl-ti">'+setEsc(scName(it))+' · '+scEp(it)+'</span>'
      +   '<span class="dl-st '+cls+'">'+(ST_TXT[st]||st)+'</span></div>'
      + (meta ? '<div class="dl-meta">'+meta+'</div>' : '')
      + act + '</div>';
  }).join('') : '<div class="dl-empty">没有待处理的集。刮削一集大约 5~40 秒（拷贝大文件时更久）。</div>';

  /* ── ④ 最近入库记录 ──────────────────────────────────────── */
  const doneHtml = doneRows.length ? doneRows.map(it=>{
    const meta = [
      '<span class="sc-time">'+scWhen(it.doneAt)+'</span>',
      it.year ? String(it.year) : '',
      it.epTitle ? setEsc(String(it.epTitle).slice(0,40)) : '',
      it.err ? '<span class="err">'+setEsc(String(it.err).slice(0,80))+'</span>' : '',
    ].filter(Boolean).join(' · ');
    const path = it.dest ? '<div class="sc-mono" style="margin-top:3px">'+setEsc(String(it.dest))+'</div>' : '';
    /* ⭐ 重刮：命名/字段规则改过之后，已落位的要能跟着更新（⛔ 不是「重试」，那条是给失败用的） */
    const act = '<div class="dl-rowact"><button data-screscrape="'+setEsc(it.vid)+'" data-scwid="'+(it.tmdbId||0)+'" title="用当前规则重做这一集（不动已下载的文件）">重刮</button></div>';
    return '<div class="dl-row done">'
      + '<div class="dl-hd"><span class="dl-ti">'+setEsc(scName(it))+' · '+scEp(it)+'</span>'
      +   '<span class="dl-st done"><span class="sc-ok">已入库</span></span></div>'
      + '<div class="dl-meta">'+meta+'</div>'+path+act+'</div>';
  }).join('') : '<div class="dl-empty">还没有入库记录。</div>';

  const rootTxt = d.libraryRoot
    ? '<span class="sc-ld">写到 <span class="sc-mono">'+setEsc(d.libraryRoot)+'</span></span>'
    : '';

  /* 🔴 入库是**两步**：我们写的是 115 原件目录，**Emby 读的是 CMS 生成的 strm 库**。
     以前这步要人去 CMS 网页手动点「增量同步」；§93-3 起看板自己触发，
     但必须让用户看得见「同步了没有 / 上次成没成」，否则又会以为流程坏了。 */
  const cms = d.cms || {};
  const cmsLast = cms.last;
  let cmsLine;
  if(!cms.configured){
    cmsLine = '<b class="sc-cmsbad">CMS 未配置</b>（缺 CMS_USER / CMS_PASS）—— 入库后 Emby 不会出现新集';
  }else if(cmsLast && cmsLast.ok){
    /* ⚠️ at 是 UTC（后端 new Date().toISOString()）⇒ 直接 slice(11,19) 会把上午 10:46 显示成 02:46，
       蛙哥只看板，差 8 小时会让他以为流程是半夜跑的。必须转本地时间。 */
    const t = cmsLast.at ? new Date(cmsLast.at).toLocaleTimeString('zh-CN', { hour12: false }) : '';
    cmsLine = '<b class="sc-cmsok">已同步</b> <span class="sc-mono">' + setEsc(t) + '</span>（' + (cmsLast.ms || 0) + 'ms）· ' + setEsc(String(cmsLast.message || ''));
  }else if(cmsLast && !cmsLast.ok){
    cmsLine = '<b class="sc-cmsbad">上次同步失败</b>：' + setEsc(String(cmsLast.message || ''));
  }else{
    cmsLine = '入库收工会自动触发（这台还没触发过）';
  }
  const cmsBtn = cms.configured ? ' <button class="sc-cmsbtn" data-cmssync="1" title="手动触发一次 CMS 增量同步（只做增量，不碰全量）">同步 CMS</button>' : '';
  /* 🔴 §97 「触发成功」不算成功 —— 要回头看到 strm 文件真的在。
     文件刚落盘时 115 还没上传完，CMS 那一轮会空跑，所以要显示「还差几集、正在重试」。 */
  const st = wk.strm || {};
  let strmLine = '';
  if(st.pending > 0){ strmLine = ' · <b class="sc-cmsbad">strm 还差 ' + st.pending + ' 集</b>（115 还没上传完，自动重试中）'; }
  else if(st.ok > 0){ strmLine = ' · <span class="sc-cmsok">strm 已确认 ' + st.ok + ' 集</span>'; }
  if(st.failed && st.failed.length){ strmLine += ' · <b class="sc-cmsbad">' + st.failed.length + ' 集重试用尽，点「同步 CMS」补</b>'; }
  const strmTip = '<div class="sc-strm"><span>ℹ️</span><span>入库写的是 <b>115 原件目录</b>（mp4 + nfo + 图片）；'
    + 'Emby 读的是 <b>CMS 生成的 strm 库</b>，所以入完要让 CMS 跑一次增量同步。'
    + cmsLine + cmsBtn + strmLine + '</span></div>';

  el.innerHTML = '<div class="sc-wrap">'
    + nowHtml + kpiHtml + strmTip
    + '<div class="sc-hd">队列<em>'+active.length+' 条未完成</em>'+rootTxt+'</div>' + actRows
    + '<div class="sc-hd">最近入库<em>最近 '+doneRows.length+' 条</em></div>' + doneHtml
    + '</div>';

  /* 重绘会回到顶部 ⇒ 还原滚动位置（2 秒一次，不还原就没法往下看） */
  if(keepY) window.scrollTo(0, keepY);

  SCRAPE_POLL = setTimeout(()=>{ if(VIEW === 'scrape') renderScrape(); }, 2000);
}

/* 刮削失败行「重试」（委托，只绑一次） */
document.addEventListener('click', async e=>{
  const bt = e.target.closest('[data-scretry]');
  if(!bt) return;
  bt.disabled = true;
  try{
    const r = await fetch('/api/dl/ingest/retry', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ vid: bt.dataset.scretry, workId: Number(bt.dataset.scwid) || 0 }),
    }).then(r=>r.json());
    /* 接口两种返回：按 vid 给 { ok:boolean }，按 workId 给 { ok:true, retried:N } */
    const good = !!(r && r.ok);
    toast(good ? (r.retried ? '已重新排队 '+r.retried+' 集' : '已重新排队这一集') : '重试失败（可能已经不在失败态了）', good ? 'ok' : 'bad');
  }catch(e){ toast('重试失败：' + (e.message || e), 'bad'); }
  if(VIEW === 'scrape') renderScrape();
});

/* 刮削页「同步 CMS」—— 手动触发一次增量同步（入库完成但 Emby 没出现时点） */
document.addEventListener('click', async e=>{
  const bt = e.target.closest('[data-cmssync]');
  if(!bt) return;
  const old = bt.textContent;
  bt.disabled = true; bt.textContent = '同步中…';
  try{
    const r = await fetch('/api/dl/cms/sync', { method:'POST' }).then(r=>r.json());
    toast(r && r.ok ? ('CMS 已触发：' + (r.message || '')) : ('同步失败：' + ((r && (r.message || r.error)) || '未知')), r && r.ok ? 'ok' : 'bad');
  }catch(err){ toast('同步失败：' + (err.message || err), 'bad'); }
  bt.disabled = false; bt.textContent = old;
  if(VIEW === 'scrape') renderScrape();
});

/* 已入库行「重刮」—— 用当前规则重做这一集（⛔ 不删文件，只是重跑八步） */
document.addEventListener('click', async e=>{
  const bt = e.target.closest('[data-screscrape]');
  if(!bt) return;
  bt.disabled = true;
  try{
    const r = await fetch('/api/dl/ingest/rescrape', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ vid: bt.dataset.screscrape }),
    }).then(r=>r.json());
    toast(r && r.ok ? '已排回队列，稍后按新规则重写' : '这条已不在"已入库"状态，没法重刮', r && r.ok ? 'ok' : 'warn');
  }catch(e){ toast('重刮失败：' + (e.message || e), 'bad'); }
  if(VIEW === 'scrape') renderScrape();
});

/* 下载队列的行内操作（委托，只绑一次） */
document.addEventListener('click', async e=>{
  const rt = e.target.closest('[data-dlreq]');
  if(rt){
    rt.disabled = true;
    try{
      await fetch('/api/dl/requeue', {
        method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({vid: rt.dataset.dlreq, workId: Number(rt.dataset.dlwid)}),
      });
    }catch(e){}
    if(VIEW==='dl') renderDownload();
    return;
  }
  const cc = e.target.closest('[data-dlcancel]');
  if(cc){
    cc.disabled = true;
    try{
      await fetch('/api/dl/cancel', {
        method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({vid: cc.dataset.dlcancel}),
      });
    }catch(e){}
    if(VIEW==='dl') renderDownload();
  }
});

async function renderLinkHealth(){
  const el = $('#main');
  el.innerHTML = '<div class="empty"><b>正在对账…</b></div>';
  let a;
  try{
    a = await fetch('/api/dl/audit?limit=300').then(x=>x.json());
  }catch(e){
    el.innerHTML = '<div class="set-wrap"><div class="set-card"><div class="set-msg err show">读对账数据失败：'+setEsc(e.message)+'</div></div></div>';
    return;
  }
  if(!a || !a.ok || !a.summary){
    el.innerHTML = '<div class="set-wrap"><div class="set-card"><div class="set-msg err show">接口返回异常</div></div></div>';
    return;
  }
  const s = a.summary;
  const cov = Math.round((s.coverage||0)*100);
  /* ⭐ §89：覆盖率必须按「真能下」算。
     linked 只说明链接表里有这条，但 youjizz（域名被污染 + 470）和 m3u8（不支持）
     是**有链接也下不动**的 ⇒ 拿 linked 当覆盖率报 99.9%，点下载一片失败 = 假绿。 */
  const covDl = Math.round((s.coverageDownloadable != null ? s.coverageDownloadable : (s.coverage||0))*100);
  const undBy = s.undownloadableBy || {youjizz:0, m3u8:0, other:0};
  const undN = s.undownloadable != null ? s.undownloadable : ((undBy.youjizz||0)+(undBy.m3u8||0)+(undBy.other||0));
  const dlN = s.downloadable != null ? s.downloadable : s.linked;
  /* 签名到期倒计时 —— 3548 条是同一批抓的 ⇒ 会在同一分钟集体失效 */
  const exMin = (s.expireInMin == null ? -1 : s.expireInMin);
  /* 🔴 §89：`expireInMin = -1` 有两种含义，必须分开：
     ① 一条都没写过 expires_at（noExpiry == linkRows）⇒ 真的「未记录」
     ② 最早那批已经过期（分钟数为负）⇒ 应该显示「已过期」，⛔ 不是「未记录」
     混淆过一次：过期后会显示「未记录」，看着像数据缺失。 */
  const allNoExp = s.noExpiry != null && s.linkRows != null && s.linkRows > 0 && s.noExpiry >= s.linkRows;
  const exTxt = (exMin <= 0 || allNoExp) ? '' : (exMin >= 60
      ? `${Math.floor(exMin/60)} 小时 ${exMin%60} 分`
      : `${exMin} 分钟`);
  const exLabel = allNoExp ? '未记录' : (exMin > 0 ? `还有 ${exTxt}` : '已过期');
  let expireBanner = '';
  if (!allNoExp && exMin > 0 && exMin <= 240) {
    expireBanner = `<div class="lh-alert ${exMin<=60?'bad':'warn'}">
      <b>⏳ 最早一批签名还有 ${exTxt} 到期</b>
      <span>（2 小时内到期的有 <b>${lhNum(s.expiringSoon)}</b> 条）</span>
      <span class="lh-alert-x">不用手动刷 —— 点下载时会<b>自动重抓签名再下</b>，只有真下不动的才会失败。</span>
    </div>`;
  } else if (s.expired > 0) {
    expireBanner = `<div class="lh-alert bad">
      <b>⚠️ 已有 ${lhNum(s.expired)} 条签名过期</b>
      <span class="lh-alert-x">点下载会自动重抓（每集多等约 13 秒）；也可以点下面「刷新即将过期」手动批量换。</span>
    </div>`;
  }

  /* 时间线：按天统计抓了多少条 —— ⭐ 这是「增量抓取真的在持续」的证据 */
  const maxN = Math.max(1, ...(a.timeline||[]).map(t=>t.n));
  const timeline = (a.timeline||[]).slice().reverse().map(t=>`
    <div class="lh-tlrow">
      <span class="lh-tlday">${setEsc(t.day)}</span>
      <span class="lh-tlbar"><i style="width:${Math.round(t.n/maxN*100)}%"></i></span>
      <span class="lh-tln">${lhNum(t.n)} 条</span>
    </div>`).join('') || '<div class="set-empty">还没有抓取记录</div>';

  /* 缺口清单 */
  const missing = a.missing||[];
  const missRows = missing.map(m=>`
    <tr>
      <td class="mono">${setEsc(m.vid)}</td>
      <td>${setEsc(m.title || '—')}</td>
      <td>${setEsc(m.workTitle || '—')}</td>
      <td class="mono">${m.workId!=null ? setEsc(String(m.workId)) : '—'}</td>
      <td><button class="set-run" data-lhsync="${setEsc(m.vid)}">补抓这一条</button></td>
    </tr>`).join('');

  el.innerHTML = `
  <div class="set-wrap">
    <div class="set-card">
      <h3>下载链接 · 覆盖与新鲜度</h3>
      <p class="set-sub">
        源站（hanime）一直在出新集，这一页是验收器：<b>源侧多少集</b>、<b>多少集已挂链接</b>、
        <b>缺哪些</b>、<b>上次什么时候抓的</b>。分母从源站明细现算，不认任何缓存数字。
      </p>

      <div class="lh-kpis">
        <div class="lh-kpi"><b>${lhNum(s.srcTotal)}</b><span>源站集数（分母）</span></div>
        <div class="lh-kpi ${cov>=99?'ok':(cov>=90?'warn':'bad')}"><b>${lhNum(s.linked)}</b><span>已挂链接</span></div>
        <div class="lh-kpi ${covDl>=99?'ok':(covDl>=90?'warn':'bad')}"><b>${lhNum(dlN)}</b><span>其中真能下</span></div>
        <div class="lh-kpi ${covDl>=99?'ok':(covDl>=90?'warn':'bad')}"><b>${covDl}%</b><span>可下载覆盖率</span></div>
        <div class="lh-kpi ${s.missing?'bad':''}"><b>${lhNum(s.missing)}</b><span>缺口（待补）</span></div>
        <div class="lh-kpi ${s.expired?'bad':(s.expiringSoon?'warn':'')}"><b>${lhNum(s.expired)}</b><span>签名已过期</span></div>
      </div>

      ${expireBanner}

      <div class="lh-fresh">
        <div class="lh-freshitem">
          <span class="lh-fk">上次抓链接</span>
          <span class="lh-fv">${lhWhen(s.lastFetchedAt)} <em>（${lhAgo(s.lastFetchedAt)}）</em></span>
        </div>
        <div class="lh-freshitem">
          <span class="lh-fk">首次抓取</span>
          <span class="lh-fv">${lhWhen(s.firstFetchedAt)}</span>
        </div>
        <div class="lh-freshitem">
          <span class="lh-fk">抓取天数</span>
          <span class="lh-fv">${lhNum(s.fetchDays)} 天</span>
        </div>
        <div class="lh-freshitem">
          <span class="lh-fk">最早一批到期</span>
          <span class="lh-fv">${exLabel}</span>
        </div>
        <div class="lh-freshitem">
          <span class="lh-fk">2 小时内到期</span>
          <span class="lh-fv">${lhNum(s.expiringSoon)} 条</span>
        </div>
        <div class="lh-freshitem">
          <span class="lh-fk">有链接但下不动</span>
          <span class="lh-fv">${lhNum(undN)} 条<em>（youjizz ${lhNum(undBy.youjizz||0)} · m3u8 ${lhNum(undBy.m3u8||0)}）</em></span>
        </div>
        <div class="lh-freshitem">
          <span class="lh-fk">无过期时间</span>
          <span class="lh-fv">${lhNum(s.noExpiry)} 条</span>
        </div>
        <div class="lh-freshitem">
          <span class="lh-fk">孤儿链接</span>
          <span class="lh-fv">${lhNum(s.orphans)} 条<em>（源站已无此条目）</em></span>
        </div>
        <div class="lh-freshitem">
          <span class="lh-fk">链接表总行数</span>
          <span class="lh-fv">${lhNum(s.linkRows)} 条</span>
        </div>
      </div>

      <div class="set-btns">
        <button class="set-run" id="lhSyncMissing">补抓缺口（≤20 条）</button>
        <button class="set-run" id="lhRefreshExpiring">刷新即将过期（≤20 条）</button>
        <button class="set-save" id="lhReload">刷新本页</button>
      </div>
      <div class="set-msg" id="lhMsg"></div>
      <div class="set-note">
        <b>口径</b>：源侧集数 = 源站明细里<b>有 vid 的条目数</b>（去重）；
        已挂链接 = 其中能在链接表里找到的；缺口 = 源侧有、链接表没有。<br>
        <b>「真能下」和「已挂链接」为什么是两个数</b>：youjizz 源（域名被污染，直连必被 reset，走代理也只有 300KB/s 或 470）
        和 m3u8（播放清单，本轮不支持）**有链接也下不动** ⇒ 单拎出来，不掺进覆盖率。剩下那批缺口才是真要去补的。<br>
        <b>孤儿链接</b> = 链接表有、源侧没有（源站删了或换了 vid 重发），不影响下载。<br>
        <b>签名有效期</b>约 11 小时（源站写死），而且这批是<b>同一轮抓的</b> ⇒ 会在同一分钟集体失效，属于正常。
        <b>点下载时 worker 会自动重抓签名再下</b>（每集多等 8~20 秒），所以不用追着刷。
        想提前批量换就点「刷新即将过期」，走源站解 Cloudflare，每条约 8~20 秒，所以每次限量。
      </div>
    </div>

    <div class="set-card">
      <h3>抓取时间线</h3>
      <p class="set-sub">按天的抓取条数。持续有新增天数 ⇒ 增量抓取真的在跑，不是只灌过一次。</p>
      <div class="lh-tl">${timeline}</div>
    </div>

    <div class="set-card">
      <h3>缺口清单 <span class="set-count">${lhNum(missing.length)}${s.missing>missing.length?'+':''}</span></h3>
      <p class="set-sub">源站收录了但还没抓到链接的条目。点「补抓这一条」单独补，或用上面批量补。</p>
      ${missing.length ? `<table class="set-tbl">
        <thead><tr><th>vid</th><th>源站标题</th><th>所属作品</th><th>TMDB id</th><th>操作</th></tr></thead>
        <tbody>${missRows}</tbody></table>`
        : `<div class="set-empty">${s.srcTotal ? '全部源侧条目都已挂上链接 🎉' : '源侧还没有条目'}</div>`}
    </div>
  </div>`;

  bindLinkHealth();
}

function bindLinkHealth(){
  const msg = (txt, kind)=>{
    const m = $('#lhMsg');
    if(!m) return;
    m.className = 'set-msg show ' + (kind||'info');
    m.textContent = txt;
  };

  const reload = $('#lhReload');
  if(reload) reload.addEventListener('click', ()=>renderLinkHealth());

  const syncMissing = $('#lhSyncMissing');
  if(syncMissing) syncMissing.addEventListener('click', async ()=>{
    syncMissing.disabled = true;
    const old = syncMissing.textContent;
    syncMissing.textContent = '补抓中…（每条 8~20 秒）';
    msg('正在补抓缺口，请稍候（源站解 Cloudflare，较慢）…', 'info');
    try{
      const r = await fetch('/api/dl/sync', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({limit:20})
      }).then(x=>x.json());
      if(r.ok) msg(`补抓完成：成功 ${r.succeeded} / 尝试 ${r.attempted}`, 'ok');
      else msg('补抓失败：'+(r.error||'未知原因'), 'err');
      renderLinkHealth();
    }catch(e){
      msg('补抓失败：'+e.message, 'err');
    }finally{
      syncMissing.disabled = false;
      syncMissing.textContent = old;
    }
  });

  const refreshExp = $('#lhRefreshExpiring');
  if(refreshExp) refreshExp.addEventListener('click', async ()=>{
    refreshExp.disabled = true;
    const old = refreshExp.textContent;
    refreshExp.textContent = '刷新中…（每条 8~20 秒）';
    msg('正在刷新即将过期的签名…', 'info');
    try{
      const r = await fetch('/api/dl/refresh-expiring', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({limit:20})
      }).then(x=>x.json());
      if(r.ok) msg(`刷新完成：成功 ${r.succeeded} / 尝试 ${r.attempted}`, 'ok');
      else msg('刷新失败：'+(r.error||'未知原因'), 'err');
      renderLinkHealth();
    }catch(e){
      msg('刷新失败：'+e.message, 'err');
    }finally{
      refreshExp.disabled = false;
      refreshExp.textContent = old;
    }
  });

  /* 单条补抓 */
  document.querySelectorAll('[data-lhsync]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const vid = b.dataset.lhsync;
      b.disabled = true;
      const old = b.textContent;
      b.textContent = '补抓中…';
      try{
        const r = await fetch('/api/dl/sync', {
          method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({vids:[vid]})
        }).then(x=>x.json());
        if(r.ok && r.succeeded>0) msg(`vid ${vid} 已补到链接`, 'ok');
        else msg(`vid ${vid} 补抓失败：${(r.errors&&r.errors[0]&&r.errors[0].error)||'未知原因'}`, 'err');
      }catch(e){
        msg('补抓失败：'+e.message, 'err');
      }finally{
        b.disabled = false;
        b.textContent = old;
      }
    });
  });
}

/* ═══════════════════════════════════════════════════════════════
   ⭐ §151 标签标记设置页（2026-11-04 蛙哥）
   §152 范围收口：只做「打标记」，效果只落在二级看板（作品抽屉 · 来源列 hanime chip）。
   「我可能会不定期增加会删减标签，可以让我自己手动选择标签的高亮就好」
   ⇒ 全库 249 个标签一次列全，按关联视频数降序；每行两个按钮（🚫 避开 / ♥ 喜欢），
     再点一次同一个按钮 = 取消（回到灰）。⛔ 不做「不关心」按钮 —— 取消就是不关心。
   ⚠️ 改完立刻生效：保存后重拉 /api/board（作品级命中是后端算的并集），
      ⛔ 不能只改前端颜色 —— 那样刷新一下就回退，等于没存。
   ═══════════════════════════════════════════════════════════════ */
let TGM_Q = '';              // 搜索词（页面内过滤，不影响 mark）
let TGM_SAVE_T = null;       // 连续点击的合并重拉定时器

/** 某个标签在库里有多少部作品带它（用后端给的 tagHits 数，纯统计，不参与筛选/着色）
    §153：四档分别数 —— tagHits 结构是 { l1, l2, l3, l4 }。 */
function tagWorkCount(tag){
  const c = { 1:0, 2:0, 3:0, 4:0 };
  for(const w of S.works){
    const h = w.tagHits;
    if(!h) continue;
    for(const k of [1,2,3,4]){
      const arr = h['l' + k];
      if(arr && arr.includes(tag)) c[k]++;
    }
  }
  return c;
}

/** 某一档现在标了多少个标签 */
const tagCountOf = (lv) => TAGS.list.filter(x => tagLevel(x.tag) === lv).length;

async function renderTagSettings(){

/** 列表 HTML —— 频次降序；搜索词按子串过滤 */
function tgmRows(){
  const kw = TGM_Q.toLowerCase();

        btn(4, 'p', '★ 本命', '标记为「本命」：chip 变紫，表示特别喜欢') +
        btn(3, 'g', '♥ 喜欢', '标记为「喜欢」：chip 变绿')
      }</span>
    </div>`;
  }).join('');
}

async function onTagMarkClick(e){
  const b = e.target.closest('button[data-tag]');
  if(!b) return;
  const tag = b.dataset.tag;
  const want = Number(b.dataset.lv);
  const cur = tagLevel(tag);
  const next = cur === want ? 0 : want;    // 再点同一个按钮 = 取消
  b.disabled = true;
  try{
    const r = await fetch('/api/tag-mark', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ tag, level: next }),
    });
    const d = await r.json().catch(()=>({}));
    if(!r.ok || !d.ok){
      alert('保存失败：' + (d.error || ('HTTP ' + r.status)));
      return;
    }
    TAGS.marks = (d.marks && typeof d.marks === 'object') ? d.marks : TAGS.marks;
    /* 只更新这一行 + 统计，⛔ 不整份重排 —— 改完行跳走会让人以为点错了 */
    const row = b.closest('.tgm-row');
    if(row){
      const lvNow = tagLevel(tag);
      row.classList.toggle('pick-r', lvNow === 1);
      row.classList.toggle('pick-o', lvNow === 2);
      row.classList.toggle('pick-g', lvNow === 3);
      row.classList.toggle('pick-p', lvNow === 4);
      const TIP = { 1:'标记为「避开」：chip 变红并排到最前',
                    2:'标记为「谨慎」：chip 变琥珀，紧随避开之后',
                    3:'标记为「喜欢」：chip 变绿',
                    4:'标记为「本命」：chip 变紫，表示特别喜欢' };
      row.querySelectorAll('button[data-lv]').forEach(x=>{
        const lv = Number(x.dataset.lv);
        x.classList.toggle('on', lvNow === lv);
        x.title = lvNow === lv ? '再点一次取消' : (TIP[lv] || '');
      });
      /* 库内部数也要立刻跟着换档位（不然从「避开」改到「谨慎」，数字还是红档的） */
      const name = row.querySelector('.tgm-name');
      if(name){
        name.querySelector('em')?.remove();
        if(lvNow){
          const em = document.createElement('em');
          em.textContent = `库内 ${tagWorkCount(tag)[lvNow]} 部`;
          name.appendChild(em);
        }
      }
    }
    const sum = document.getElementById('tgmSum');
    if(sum) sum.innerHTML = tgmSumText();
    refreshTagHits();      // 先更新「库内 N 部」，再防抖重拉看板（§152：paintTagHint 已随全局筛选删除）
    scheduleBoardReload();
  }catch(err){
    alert('保存失败：' + (err && err.message ? err.message : err));
  }finally{
    b.disabled = false;
  }
}

/**
 * 改完标记后重拉看板数据（作品级 tagHits 是后端算的并集，前端算不出来）。
 * 🔴 必须防抖：连续点十个标签不能拉十次 /api/board（1218 部 + 标签 JOIN）。
 * ⚠️ 只更新内存，不强制切视图 —— 当前在设置页，切回全览时自然就是新数据。
 */
function scheduleBoardReload(){
  clearTimeout(TGM_SAVE_T);
  TGM_SAVE_T = setTimeout(async ()=>{
    await reloadBoard();
    refreshTagHits();   // 只改「命中 N 部」这几个字，⛔ 不重绘列表
  }, 700);
}

/**
 * 重拉之后刷新每行的「命中 N 部」。
 * 🔴 必须**原地改文字**，⛔ 不能 drawTagSettings() 整页重绘 ——
 *    重绘会把列表滚回顶部、并把鼠标下的按钮换成新节点（实测点击第二次就
 *    "Element is not attached to the DOM"）。列表结构在进页面时定死。
 */
function refreshTagHits(){
  if(VIEW !== 'tags') return;
  document.querySelectorAll('.tgm-row').forEach(row=>{
    const tag = row.dataset.row;
    const lv = tagLevel(tag);
    const name = row.querySelector('.tgm-name');
    if(!name) return;
    name.querySelector('em')?.remove();
    if(!lv) return;                       // 没标 ⇒ 不显示命中数
    const em = document.createElement('em');
    em.textContent = `库内 ${tagWorkCount(tag)[lv]} 部`;
    name.appendChild(em);
  });
}

/* ═══════════════════════════════════════════════════════════════
   ⭐ §79 定期更新检测 —— 设置页
   cron 表达式由蛙哥直接在这里改（不用 SSH 上 NAS）。
   ═══════════════════════════════════════════════════════════════ */
const SET_PRESETS = [
  {expr:'0 4 * * 1',  label:'每周一 04:00'},
  {expr:'30 4 * * 1', label:'每周一 04:30'},
  {expr:'0 4 * * *',  label:'每天 04:00'},
  {expr:'0 5 * * 0',  label:'每周日 05:00'},
  {expr:'0 3 * * 2',  label:'每周二 03:00'},
  {expr:'0 4 1 * *',  label:'每月 1 号 04:00'},
];

function setEsc(s){
  return String(s ?? '').replace(/[&<>"']/g, c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* 🔴 下次触发时间 = **本地时间**显示。
   ⛔ 不能直接 slice ISO 串 —— 那是 UTC，比本地时间差 8 小时 ⇒ 显示的触发时刻是错的。
   ⇒ 用 Date 对象转本地时区再格式化。 */
function setLocalTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return String(iso);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* 🔴 描述行 = 「cron 中文描述 · 下次触发 本地时间」
   ⭐ 初次渲染与保存后**共用这一个函数** —— 两处各写一遍必然漂移（0lx 判据多处拷贝）。
   ⚠️ which 传的是 DOM id 后缀（'Hanime'/'Tmdb'，首字母大写），
      但接口字段名是小写（hanime/tmdb）⇒ 这里做一次映射，别直接拼。 */
function setDescText(which, cfg){
  const el = $('#desc'+which);
  if(!el) return;
  const key = which.toLowerCase();
  const d = (cfg.descriptions && cfg.descriptions[key]) || '';
  const nx = cfg.nextRuns && cfg.nextRuns[key];
  const t = setLocalTime(nx);
  el.textContent = d + (t ? ' · 下次 ' + t : '');
}

const SYS_GROUPS = [
