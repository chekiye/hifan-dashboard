];

const SYS_SRC = {override:'面板值', env:'环境变量', default:'默认值'};

function sysSetHtml(sys){
  if(!sys || !sys.ok || !Array.isArray(sys.items)){
    return '<div class="set-msg err show">读不到 /api/app-config（服务端版本较旧或接口异常）</div>';
  }
  const grp = g => sys.items.filter(i => i.group === g);
  return SYS_GROUPS.map(g => {
    const rows = grp(g.id).map(i => {
      const src = SYS_SRC[i.source] || i.source;
      if(i.secret){
        const ph = i.set ? `已设置（${src}）—— 留空保持不变` : '未设置';
        return `<div class="set-fld">
          <label>${setEsc(i.label)} <span class="set-desc" style="display:inline">（${setEsc(src)}）</span></label>
          <input type="password" id="sys-${setEsc(i.key)}" placeholder="${setEsc(ph)}" autocomplete="new-password">
          <div class="set-desc">${setEsc(i.help || '')}</div>
        </div>`;
      }
      return `<div class="set-fld">
        <label>${setEsc(i.label)}</label>
        <input type="text" id="sys-${setEsc(i.key)}" value="${setEsc(i.value ?? '')}" spellcheck="false">
        <div class="set-desc">${setEsc(i.help || '')}</div>
      </div>`;
    }).join('');
    const keys = grp(g.id).map(i => i.key);
    const testKeys = keys.filter(k =>
      ['tmdb.proxy','hanime.proxy','download.proxy','hanime.flaresolverr','tmdb.apiKey',
       'emby.base','emby.apiKey','cms.baseUrl','cms.user'].includes(k));
    const testBtns = testKeys.map(k => {
      const lbl = (sys.items.find(i=>i.key===k)||{}).label || k;
      return `<button class="set-run" data-sys-test="${setEsc(k)}">测: ${setEsc(lbl)}</button>`;
    }).join('');
    return `<div style="margin:18px 0 6px">
      <b>${setEsc(g.name)}</b>
      <div class="set-desc">${setEsc(g.desc)}</div>
    </div>
    <div class="set-row">${rows}</div>
    <div class="set-btns">
      <button class="set-save" data-sys-save="${g.id}">保存${setEsc(g.name)}</button>
      ${testBtns}
    </div>
    <div class="set-msg" id="sysMsg-${g.id}"></div>`;
  }).join('');
}

function sysMsg(gid, html, isErr){
  const el = $('#sysMsg-' + gid);
  if(!el) return;
  el.innerHTML = html;
  el.classList.add('show');
  el.classList.toggle('err', !!isErr);
}

function bindSysSettings(){
  // 保存（按分组）
  document.querySelectorAll('[data-sys-save]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const gid = btn.getAttribute('data-sys-save');
      const values = {};
      document.querySelectorAll('[id^="sys-"]').forEach(inp => {
        const key = inp.id.slice(4);
        const v = String(inp.value ?? '').trim();
        // secret 留空不上送（= 保持不变）；非 secret 原样送（后端空串=清覆盖）
        if(inp.type === 'password' && v === '') return;
        values[key] = v;
      });
      btn.disabled = true; btn.textContent = '保存中…';
      try{
        const r = await fetch('/api/app-config', {
          method:'POST', headers:{'content-type':'application/json'},
          body: JSON.stringify({values}),
        }).then(x=>x.json());
        if(!r.ok) throw new Error(r.error || JSON.stringify(r.errors || r));
        sysMsg(gid, '已保存，立即生效（保存了 ' + (r.saved||[]).length + ' 项）');
        // 不整页重渲染：来源标记下次进设置页时刷新，提示不能被吞
      }catch(e){
        sysMsg(gid, '保存失败：' + setEsc(e.message), true);
        btn.disabled = false; btn.textContent = '保存';
      }
    });
  });
  // 测试连接（单个键）
  document.querySelectorAll('[data-sys-test]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const key = btn.getAttribute('data-sys-test');
      const gid = (key.split('.')[0] === 'hanime' || key.split('.')[0] === 'download') ? 'proxy'
        : key.split('.')[0];
      const old = btn.textContent;
      btn.disabled = true; btn.textContent = '测试中…';
      try{
        const r = await fetch('/api/app-config/test', {
          method:'POST', headers:{'content-type':'application/json'},
          body: JSON.stringify({key}),
        }).then(x=>x.json());
        const ms = r.ms != null ? `（${r.ms}ms）` : '';
        if(r.ok) sysMsg(gid, '✅ ' + setEsc(r.message) + ms);
        else sysMsg(gid, '❌ ' + setEsc(r.error || '失败') + ms, true);
      }catch(e){
        sysMsg(gid, '❌ ' + setEsc(e.message), true);
      }
      btn.disabled = false; btn.textContent = old;
    });
  });
}

function setRecsHtml(recs){
  if(!recs || !recs.length) return '<div class="set-empty">还没有执行记录</div>';
  const badge = s => {
    if(s==='ok')    return '<span class="set-badge ok">成功</span>';
    if(s==='failed')return '<span class="set-badge err">失败</span>';
    if(s==='running')return '<span class="set-badge run">进行中</span>';
    return '<span class="set-badge skip">跳过</span>';
  };
  const rows = recs.map(r=>{
    const t = r.task==='hanime' ? 'hanime' : 'TMDB';
    const dur = r.durationMs!=null ? (r.durationMs/1000).toFixed(1)+'s' : '—';
    const sum = r.summary || {};
    let what = '';
    if(r.task==='hanime'){
      /* 🔴 有判定就走判定口径 —— 用户要看的不是「差集算出几条」，而是
         「分集更新几部 / 新番几部」。判定没跑（judge 未启用）才退回旧口径。 */
      if(sum.judged){
        what = `分集更新 ${sum.episodeUpdates??0} · 新番 ${sum.newAnime??0}` +
               (sum.oldAnime? ` · 往年漏匹配 ${sum.oldAnime}`:'') +
               (sum.needsManual? ` · 待人工 ${sum.needsManual}`:'') +
               ` · 已落库 ${sum.applied??0}`;
      }else{
        const n = (sum.newWorks??0) + (sum.continued??0);
        what = n
          ? `新收录 ${sum.newWorks??0} · 续更 ${sum.continued??0} · 已落库 ${sum.applied??0}` +
            (sum.pending? ` · 待匹配 ${sum.pending}`:'') + (sum.skipped? ` · 留人工 ${sum.skipped}`:'')
          : '无更新';
      }
    }else{
      /* 🔴 TMDB 任务已改为「兜底补分集」，⛔ 不再 discover 新作品 */
      const b = sum.behind ?? 0, rf = sum.refetched ?? 0, sb = sum.stillBehind ?? 0;
      what = b ? `检出落后 ${b} 部 · 已重拉 ${rf} 部 · 仍落后 ${sb} 部` : '分集已齐平，无事可做';
    }
    const when = setLocalTime(r.startedAt) || '—';
    return `<tr>
      <td class="mono">${setEsc(when)}</td>
      <td>${setEsc(t)}</td>
      <td>${badge(r.status)}</td>
      <td>${setEsc(r.trigger==='manual'?'手动':'定时')}</td>
      <td class="mono">${setEsc(dur)}</td>
      <td>${setEsc(what)}</td>
    </tr>`;
  }).join('');
  return `<table class="set-tbl">
    <thead><tr><th>开始时间</th><th>任务</th><th>结果</th><th>触发</th><th>耗时</th><th>结果摘要</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function bindSettings(cfg){
  const msg = (txt, kind)=>{
    const m = $('#setMsg');
    m.className = 'set-msg show ' + (kind||'info');
    m.textContent = txt;
  };

  // 预设按钮
  document.querySelectorAll('.set-preset').forEach(b=>{
    b.addEventListener('click', ()=>{
      const input = b.dataset.w==='hanime' ? $('#setHanimeCron') : $('#setTmdbCron');
      input.value = b.dataset.e;
      document.querySelectorAll('.set-preset[data-w="'+b.dataset.w+'"]').forEach(x=>x.classList.toggle('on', x===b));
    });
  });

  // 输入框变化时清掉「预设高亮」（说明值已被手改）
  ['setHanimeCron','setTmdbCron'].forEach(id=>{
    $('#'+id).addEventListener('input', ()=>{
      document.querySelectorAll('.set-preset').forEach(x=>x.classList.remove('on'));
    });
  });

  // 保存
  $('#setSave').addEventListener('click', async ()=>{
    const btn = $('#setSave'); btn.disabled = true;
    try{
      const body = {
        hanimeCron: $('#setHanimeCron').value.trim(),
        tmdbCron: $('#setTmdbCron').value.trim(),
        enabled: $('#setEnabled').checked,
        autoApply: $('#setAutoApply').checked,
        hanimeYears: $('#setYears').value.split(',').map(s=>s.trim()).filter(Boolean),
      };
      const r = await fetch('/api/scheduler/config', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
      }).then(x=>x.json());
      if(!r.ok){
        msg(r.error || '保存失败', 'err');
        return;
      }
      /* 🔴 保存成功后**不重渲染整个设置页** ——
         重渲染会把刚写的「已保存」提示冲掉（用户看不到反馈，还以为没存上）。
         ⇒ 只更新「描述/下次触发」这两处动态文字，保留消息框。 */
      const nx = r.config.nextRuns || {};
      /* ⭐ 与初次渲染共用 setDescText —— 不在这里重写一遍判据（0lx） */
      setDescText('Hanime', r.config);
      setDescText('Tmdb', r.config);
      msg('已保存。下次触发：hanime ' + (setLocalTime(nx.hanime)||'—') +
          ' · TMDB ' + (setLocalTime(nx.tmdb)||'—'), 'ok');
      // 顺带刷新执行记录表（⛔ 只换 #setRecs 的内容，不动消息框）
      fetch('/api/scheduler/records').then(x=>x.json()).then(rr=>{
        const box = $('#setRecs');
        if (box && rr && rr.records) box.innerHTML = setRecsHtml(rr.records);
      }).catch(()=>{});
    }catch(e){
      msg('保存失败：'+e.message, 'err');
    }finally{
      btn.disabled = false;
    }
  });

  // 立即执行
  const run = async(task, btn)=>{
    btn.disabled = true;
    msg('已启动 '+task+' 扫描，抓取需要几十秒到几分钟，完成后企微会通知你。', 'info');
    try{
      const r = await fetch('/api/scheduler/run', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({task})
      }).then(x=>x.json());
      if(!r.ok){ msg(r.error||'启动失败', 'err'); btn.disabled=false; return; }
      // 轮询记录表
      const poll = setInterval(async ()=>{
        const rr = await fetch('/api/scheduler/records').then(x=>x.json()).catch(()=>null);
        if(!rr) return;
        const recs = rr.records || [];
        $('#setRecs').innerHTML = setRecsHtml(recs);
        const hit = recs.find(x=>x.task===task && x.trigger==='manual');
        if(hit && hit.status!=='running'){
          clearInterval(poll);
          btn.disabled = false;
          msg(hit.status==='ok' ? task+' 扫描完成' : (task+' 扫描失败：'+(hit.error||'未知错误')),
              hit.status==='ok' ? 'ok' : 'err');
        }
      }, 3000);
      setTimeout(()=>{ clearInterval(poll); btn.disabled=false; }, 30*60*1000);
    }catch(e){
      msg('启动失败：'+e.message, 'err');
      btn.disabled = false;
    }
  };
  $('#setRunHanime').addEventListener('click', e=>run('hanime', e.currentTarget));
  $('#setRunTmdb').addEventListener('click', e=>run('tmdb', e.currentTarget));
}

/* ══ 逐集比对抽屉（同名剧集对齐用）═════════════════════════ */

/**
 * 🔴 2026-10-29（§81 蛙哥 #3）「入库检测的二级看板很简陋」—— 重做。
 *
 * 原来只有一张结论卡 + 6 行 dl，看不出「哪几季」「哪几集是排除的」「集照长什么样」，
 * 也没有任何操作入口。现在：
 *   概览   = 封面 + 结论卡 + 四个数字 + 缺集徽章 + 已排除徽章 + 分季进度 + 路径/操作
 *   逐集   = 按季分行，每集带集名/播出日/状态，**每一集都能当场排除或恢复**
 *
 * ⛔ 排除/恢复只走 `/api/hidden/toggle`（与看板「逐集对照」同一入口），
 *    操作完必须重开抽屉 + 重画入库检测页 —— 排除是**后端把该集剔出分母**，
 *    只改 DOM 是假闭环（0gh）。
 */
async function openIntake(id, opt={}){
  const d = opt.preloaded || await fetch('/api/intake/work/'+id).then(r=>r.json());
  if(!d || d.error){ alert((d && d.error) || '读取失败'); return; }
  INTAKE.cur = Number(id);

  const st = STATUS_LABEL[d.status] || d.status;
  const pct = d.totalEpisodes>0 ? Math.round(d.ownedEpisodes/d.totalEpisodes*100) : 0;
  const missingN = d.missingEpisodes.length;
  const exN = Number(d.excludedEpisodes||0);
  const futN = Number(d.futureEpisodes||0);
  const okAll = d.status === 'complete' || d.status === 'unlisted';
  const empty = d.ownedEpisodes === 0;
  const vClass = okAll ? 'ok' : (empty ? 'bad' : 'warn');
  const vIcon  = okAll ? '✓' : (empty ? '✗' : '!');

  const seLabel = sn => sn===0 ? 'Specials' : `Season ${sn}`;
  const epCode = (sn,en) => `S${String(sn).padStart(2,'0')}E${String(en).padStart(2,'0')}`;

  /* ⭐ §82：源站供给汇总（hanime 分集 / mteam 发布数）—— 作品级只报数，逐集看下表 */
  const src = d.source || {};
  const hSrc = src.hanime || null;
  /* ⭐ §87（2026-10-30 蛙哥：「hanime 更新了没」）：
     total = 源站这部一共几个视频；resolved = 其中成功落到某一集上的。
     total > resolved ⇒ 源站有我们没归位的条目 —— 大概率就是**新更的那几集**，
     或者标题没写集号配不上的。⛔ 不能默不作声，否则「源站 12 条、看板只有 9 集」永远没人解释。 */
  const unplacedN = hSrc ? Math.max(0, Number(hSrc.total||0) - Number(hSrc.resolved||0)) : 0;
  const srcLine = hSrc
    ? `hanime <b>${hSrc.total}</b> 条${hSrc.mappable ? `（集号已逐集落位${Number(hSrc.guessed||0)>0?`，其中 <b>${hSrc.guessed}</b> 条是推定（标题没写集号，按空缺顺序对上的）`:''}）` : `（多季作品，集号不逐季落位）`}`
      + (unplacedN ? ` · <span style="color:var(--warn-ink);font-weight:700">${unplacedN} 条没落到集上</span>`
          + `<span style="color:var(--ink3)">（源站新更 / 标题没写集号，见下方逐集表）</span>` : '')
      + (src.mteamCount ? ` · mteam <b>${src.mteamCount}</b> 个发布` : '')
    : (src.mteamCount ? `hanime 未收录 · mteam <b>${src.mteamCount}</b> 个发布` : '两侧源站都没有对应记录');

  /* ⭐ §85：下载汇总（作品级）—— 逐集直链的统计。
     🔴 只统计**带链接**的集；已入库的集不给下载（不缺它）。
     ⭐ §86（2026-10-30）：补上**源侧分母**（源站收录了多少集），
        这样「直链 12 集」才有一个参照 —— 不然不知道是全齐了还是漏了一半。 */
  const dlSummary = (()=>{
    let total=0, withLink=0, done=0, expired=0, m3u8=0;
    for(const sg of (d.seasons||[])){
      for(const e of (sg.episodes||[])){
        if(e.excluded) continue;
        if(!e.link) continue;
        total++;
        if(e.dl && e.dl.state==='done'){ done++; continue; }
        if(e.link.isM3u8){ m3u8++; continue; }
        if(e.link.expiresAt!=null && e.link.expiresAt*1000 <= Date.now()) expired++;
        else withLink++;
      }
    }
    /* 🔴 源侧供给（§82 的 source.hanime.total）—— 分母。
       ⚠️ 多季作品源站集号不逐集落位 ⇒ total 只报条数（不可直接当「集数」比）。 */
    const srcTotal = hSrc ? Number(hSrc.total||0) : 0;
    if(!total && !srcTotal) return '';
    const bits = [];
    if(srcTotal) bits.push(`源站 <b>${srcTotal}</b> 条`);
    bits.push(`直链 <b>${total}</b> 集`);
    if(withLink) bits.push(`可下 <b>${withLink}</b>`);
    if(done) bits.push(`已下好 <b>${done}</b>`);
    if(expired) bits.push(`<span style="color:var(--bad-ink)">需重抓 <b>${expired}</b></span>`);
    if(m3u8) bits.push(`m3u8 <b>${m3u8}</b>`);
    /* 🔴 覆盖率徽章：源侧条数 vs 已挂链接条数。
       ⛔ 只在「能逐集对得上」时才算百分比（hSrc.mappable）——
          多季作品源站集号是线性的，对不上 ⇒ 只报两个数，不报百分比。 */
    if(srcTotal && total && hSrc && hSrc.mappable){
      const cov = Math.round(total/srcTotal*100);
      bits.push(`覆盖 <b>${cov}%</b>`);
    }
    return bits.join(' · ');
  })();

  /* 逐集：按季分组，每集一行 —— 四路一眼可辨：
     TMDB 有这集（行本身）/ Emby 有没有 / hanime 有没有 / 结论 */
  const seasonsHtml = d.seasons.length    ? d.seasons.map(sg=>{
        const live = sg.total;
        const fut = Number(sg.future||0);
        const cls = live===0 ? 'ex' : (sg.missing.length===0 ? 'ok' : (sg.owned===0 ? 'bad' : 'part'));
        const txt = live===0 ? `全部已排除（${sg.excluded} 集）`
                  : sg.missing.length===0 ? (sg.excluded ? `齐集（另排除 ${sg.excluded} 集）` : '齐集')
                  : sg.owned===0 ? `全缺 ${sg.missing.length} 集` : `缺 ${sg.missing.length} 集`;
        return `
        <div class="iseason">
          <div class="isghd">
            <b>${seLabel(sg.season)}</b>
            <span class="isgnum">${sg.owned}/${live}</span>
            <span class="isgbadge ${cls}">${txt}</span>
            ${fut?`<span class="isgbadge mute">${fut} 集未播出</span>`:''}
          </div>
          ${sg.episodes.map(e=>{
            const key = `${e.season}:${e.episode}`;
            /* ⭐ §82 五档结论 —— 判据顺序即优先级，改这里前先看 intake.ts 循环里的同一套顺序
               ⭐ §83：Special（S00）在源站没有集号可言（源站集号是线性的，不按季切），
                  所以它的「没有」不等于资源不存在 ⇒ 单独给「Special 不比对」，
                  ⛔ 不能和「源站未收录」混着说，否则蛙哥会以为源站真的没有这一集。 */
            const specialNoCmp = e.season === 0 && hSrc && hSrc.mappable;
            const V = e.excluded ? ['ex','已排除']
                    : e.owned    ? ['ok','已入库']
                    : e.future   ? ['mute','未播出']
                    : e.src      ? (e.src.guessed ? ['info','可补?'] : ['info','可补'])
                    : specialNoCmp ? ['na','Special 不比对']
                    : ['warn','源站未收录'];
            const act = e.excluded
              ? `<button class="iepact restore" data-irst="${key}" title="恢复这一集：重新计入集数与入库检测">恢复</button>`
              : `<button class="iepact" data-iex="${key}" title="TMDB 有这一集但实际没资源时用：排除后不计入缺集与入库检测，随时可恢复，⛔ 不删任何数据">排除</button>`;
            /* 源站那一列：有就给播放页直链（新窗口），没有就是一个短横 */
            const srcCell = e.src
              ? `<a class="iepsrc on" href="${esc(e.src.url)}" target="_blank" rel="noopener"
                    title="${esc(e.src.titleJa || e.src.titleZh || '')}">第${e.src.ep}話${e.src.guessed?'?':''}</a>`
              : `<span class="iepsrc off">—</span>`;
            /* ⭐ §85（蛙哥：「我希望下载链接也在看板上呈现，和剧集一一对应」）：
               这一集在 source_link 表里的下载链接 —— 画质 / 签名过期 / 下载按钮。
               ⚠️ 已入库的集不给下载按钮（不缺它）。
               ⚠️ m3u8 标出来但禁点（蛙哥：暂不处理这部分）。 */
            const dlCell = (()=>{
              const L = e.link;
              if(!L) return `<span class="iepdlhint">无直链</span>`;
              const exp = L.expiresAt!=null && L.expiresAt*1000 <= Date.now();
              const qCls = L.quality>=1080 ? 'hd' : (L.quality>=720 ? 'sd' : 'sd');
              const qTxt = L.quality ? `${L.quality}p` : '画质未知';
              /* 🔴 §86（2026-10-30，蛙哥：「我在看板哪里能看到你抓下来的下载链接」）：
                 画质徽章**改成可点的按钮** —— 点一下弹完整 URL + 一键复制。
                 ⛔ 不直接把长 URL 铺在表格里（会撑爆布局、且签名串太长没法一眼看）。
                 ⛔ URL 不进 HTML 属性（签名串含 & 会被转义坏）⇒ 点开时再调接口取。 */
              const qBadge = `<button class="iepq ${exp?'exp':qCls}" data-showlink="${esc(L.vid)}"
                      title="${exp?'签名已过期，需要重新抓取链接':'源站提供的最高画质档 · 点此查看完整下载链接'}">${qTxt}</button>`;
              /* 🔴 §85（2026-10-29 实测发现）：源站签名里写死了速率上限
                 （youjizz 的 `rate=NNNNNN`）⇒ 300MB 的集要下 30+ 分钟。
                 ⛔ 绕不过（hash 对整个 query 签名）⇒ 如实告诉用户预期速度，
                 否则「一直下不完」会被误当成看板卡死。 */
              const rateBadge = (L.rateLimit && L.rateLimit < 2*1024*1024)
                ? `<span class="iepq rate" title="源站签名里写死了速率上限（${(L.rateLimit/1024).toFixed(0)} KB/s），改不了——下载慢是源站限速，不是看板卡住">⏱ ${(L.rateLimit/1024).toFixed(0)}KB/s</span>`
                : '';
              /* 下载状态 */
              const st = e.dl ? e.dl.state : null;
              if(st==='done'){
                return `${qBadge}${rateBadge}<span class="iepdlbtn done" title="${esc(e.dl.filePath||'')}">已下好</span>`;
              }
              if(st==='failed'){
                /* 🔴 §85（2026-10-29 浏览器点击实测发现）：
                   失败时**光给「重试」是坑** —— 签名失效（403/470）的集，
                   重试一万次还是同一个错，用户只能干等。
                   ⇒ 失败态给**两个**入口：「重试」+「重抓」。
                   「重抓」只在「错误像是签名问题」时才显示（⛔ 404 这种 CDN 无副本的
                   重抓也白搭，别给假希望）。 */
                const err = e.dl.error || '';
                const looksExpired = /403|470|签名|expire|过期|Unauthorized/i.test(err);
                const retryBtn = `<button class="iepdlbtn fail" data-dl="${esc(L.vid)}" data-dlwork="${d.workId}"
                        title="${esc(err||'下载失败')}，点此重试">重试</button>`;
                const relinkBtn = looksExpired
                  ? `<button class="iepdlbtn exp" data-relink="${esc(L.vid)}"
                        title="签名可能已失效。点此重新抓取链接（走源站解 Cloudflare，约 10~20 秒）">重抓</button>`
                  : '';
                return `${qBadge}${rateBadge}${retryBtn}${relinkBtn}`;
              }
              if(st==='running'){
                return `${qBadge}${rateBadge}<span class="iepdlbtn run">下载中</span>`;
              }
              if(exp){
                /* 🔴 §85：签名 TTL ~11h ⇒ 过期是常态，必须能一键重抓。
                   走 FlareSolverr 解 CF 取新签名（慢，8~20 秒）⇒ 按钮要有 loading 态。 */
                return `${qBadge}${rateBadge}<button class="iepdlbtn exp" data-relink="${esc(L.vid)}"
                        title="签名已过期。点此重新抓取链接（走源站解 Cloudflare，约 10~20 秒）">需重抓</button>`;
              }
              if(L.isM3u8){
                return `${qBadge}${rateBadge}<span class="iepdlbtn" style="opacity:.6" title="HLS(m3u8) 本轮暂不支持下载">m3u8</span>`;
              }
              return `${qBadge}${rateBadge}<button class="iepdlbtn" data-dl="${esc(L.vid)}" data-dlwork="${d.workId}"
                      title="下载这一集到 NAS 的「待整理」目录${L.fileBase?'\n落盘文件名：'+esc(L.fileBase)+'.mp4':''}">下载</button>`;
            })();
            /* ⭐ §83（蛙哥：「逐集判断我希望加上剧集图，这样我可以大致判断是真剧集还是假剧集」）：
               真剧集 TMDB 一般有剧照，虚构的 Special 往往没有。
               ⚠️ 只是辅助证据，⛔ 不当判据 —— 房东小姐的 S00 两集也有图，但它们是假的。
               🔴 安全模式 blur/hide 档**不发 <img>**（隐私铁律：宁可不显示，也不「传了再遮挡」）。 */
            /* ⭐ 2026-10-29（蛙哥：「图太小了，看不清，再放大一点」）：
               盒子 64×36 → 128×72；再包一层 <a>，点开就是新窗口里的原图（TMDB 300 宽），
               比在抽屉里塞一张巨图省地方。⚠️ blur 档点开的也是**糊图本身**，不泄露清晰版。 */
            const stillCell = (()=>{
              if(!e.still) return `<div class="iepst none" title="TMDB 没有收录这一集的剧照 —— 多半是虚假剧集，可点右侧「排除」">无图</div>`;
              if(S.safe === 'hide') return `<div class="iepst none" title="安全模式 hide 档：不加载剧照">略</div>`;
              /* blur 档只吃预生成糊图（与对齐表同一套，原图不进网络） */
              if(S.safe === 'blur') return e.stillBlur
                ? `<div class="iepst"><a href="${esc(e.stillBlur)}" target="_blank" rel="noopener"><img src="${esc(e.stillBlur)}" alt="" loading="lazy" onerror="this.closest('.iepst').classList.add('none');this.remove()"></a></div>`
                : `<div class="iepst none" title="没有预生成模糊剧照">无糊图</div>`;
              return `<div class="iepst"><a href="${esc(e.still)}" target="_blank" rel="noopener"><img src="${esc(e.still)}" alt="" loading="lazy"
                        title="TMDB 剧照 · ${esc(e.name||'')}（点击看大图）"
                        onerror="this.closest('.iepst').classList.add('none');this.remove()"></a></div>`;
            })();
            return `
            <div class="iep ${e.excluded?'ex':(e.owned?'owned':(e.future?'future':'miss'))}">
              ${stillCell}
              <span class="iepno">${epCode(e.season,e.episode)}</span>
              <div class="iepmain">
                <div class="iepname" ${e.fileName?`title="${esc(e.fileName)}"`:''}>${esc(e.name||'（无集名）')}</div>
                <div class="iepmeta">${esc(e.airDate||'无播出日')}${e.excluded?' · 不计入缺集':(e.future?' · 还没播出':'' )}</div>
              </div>
              ${srcCell}
              <div class="iepdl">${dlCell}</div>
              <span class="ieptag ${V[0]}">${V[1]}</span>
              ${act}
            </div>`;
          }).join('')}
        </div>`;
      }).join('')
    : '<div class="empty"><b>该作品尚无季集元数据</b>TMDB 侧没有拉到分集</div>';

  /* 概览：结论 → 数字 → 源站供给 → 缺集 → 已排除/未播出 → 分季 → 路径 → 操作
     🔴 §82：封面和标题**不再放在这里** —— 抽屉头部已经有了。
        之前上下各放一份，上面那块还是「无 src 的空 img」画出来的灰方块，
        蛙哥截图里一眼就看出「很奇怪：上面没封面，下面有封面」。 */
  const ovHtml = `
    <div class="idtl">
      <div class="dverdict v-${vClass}">
        <div class="dvi">${vIcon}</div>
        <div style="flex:1;min-width:0">
          <div class="dvh">${st}${missingN?` · 缺 ${missingN} 集`:''}</div>
          <div class="dvt">${d.ownedEpisodes} / ${d.totalEpisodes} 集在 Emby（${pct}%）</div>
        </div>
        <div class="dvcnt"><b>${pct}%</b><span>入库率</span></div>
      </div>
      <div class="covbar" style="margin:10px 0 0">
        <div class="covtrack"><div class="covfill" style="width:${pct}%"></div></div>
      </div>

      <div class="istat">
        <div class="istat-i"><b>${d.totalEpisodes}</b><span>应入库</span></div>
        <div class="istat-i ok"><b>${d.ownedEpisodes}</b><span>已在 Emby</span></div>
        <div class="istat-i ${missingN?'bad':''}"><b>${missingN}</b><span>缺集</span></div>
        ${futN?`<div class="istat-i mute"><b>${futN}</b><span>未播出</span></div>`:''}
        <div class="istat-i ${exN?'ex':''}"><b>${exN}</b><span>已排除</span></div>
      </div>

      <div class="dsect" style="margin-top:20px"><h4>源站供给</h4>
        <div class="isrc">${srcLine}</div>
      </div>

      <div class="dsect"><h4>缺集（${missingN}）</h4>
        ${missingN ? `<div class="ibadges">${(d.missingLabeled||[]).map(x=>`<span class="ibadge bad">${esc(x)}</span>`).join('')}</div>
          <div class="ihint">去 Emby 补齐后点顶栏「扫 Emby」，这里会自动变成齐集。</div>`
        : `<div class="ihint ok">没有缺集 —— 有效集数已全部在 Emby 里。</div>`}
      </div>

      ${exN ? `<div class="dsect"><h4>已排除（${exN}）· 不计入缺集</h4>
        <div class="ibadges">${(d.excludedLabeled||[]).map(x=>`<span class="ibadge ex">${esc(x)}</span>`).join('')}</div>
        <div class="ihint">这些集是你在「逐集比对」里手动排除的（TMDB 有、实际没资源）。
          想让它重新计入，到「逐集比对」页签点「恢复」。</div>
      </div>` : ''}

      ${futN ? `<div class="dsect"><h4>未播出（${futN}）· 不计入缺集</h4>
        <div class="ibadges">${(d.futureLabeled||[]).map(x=>`<span class="ibadge mute">${esc(x)}</span>`).join('')}</div>
        <div class="ihint">播出日还没到，现在当然收不到 —— 到日子补上，这里会自动变成缺集。</div>
      </div>` : ''}

      <div class="dsect"><h4>分季进度</h4>
        <div class="iseason-mini">
          ${d.seasons.map(sg=>{
            const live = sg.total;
            const p = live>0 ? Math.round(sg.owned/live*100) : 0;
            return `<div class="isgm">
              <span class="isgm-n">${seLabel(sg.season)}</span>
              <span class="isgm-v">${sg.owned}/${live}${sg.excluded?` <i>+${sg.excluded} 排除</i>`:''}</span>
              <span class="isgm-bar"><i style="width:${p}%"></i></span>
            </div>`;
          }).join('')}
        </div>
      </div>

      <div class="dsect"><h4>比对信息</h4><dl class="kv">
        ${d.unparsedFiles?`<dt>无法解析</dt><dd style="color:var(--warn-ink)">${d.unparsedFiles} 个文件（文件名里没有 S/E 标记，未计入判定）</dd>`:''}
        <dt>Emby 路径</dt><dd class="imono">${esc(d.localDir||'—')}</dd>
        <dt>TMDB</dt><dd><a href="https://www.themoviedb.org/${d.mediaType==='tv'?'tv':'movie'}/${d.workId}"
           target="_blank" rel="noopener" style="color:var(--info-ink)">查看词条</a></dd>
      </dl></div>

      <div class="iact">
        ${WANT.keys.has(`${d.mediaType}:${d.workId}`)
          ? `<button class="iact-b want on" disabled>已在待下</button>`
          : `<button class="iact-b want" data-iact="want">♥ 加入待下</button>`}
        <button class="iact-b" data-iact="rescan">重新扫 Emby 后刷新</button>
        ${dlSummary ? `<button class="iact-b" data-iact="dlall" title="把这部的缺集逐集下载到 NAS 的「待整理」目录（串行下载，⛔ 不并发）">⬇ 下载整部缺集</button>` : ''}
        ${dlSummary ? `<button class="iact-b" data-iact="relinkall" title="把这部所有已过期的签名重新抓一遍（走源站解 Cloudflare，慢，约 10~20 秒/集）">⟳ 批量重抓过期</button>` : ''}
      </div>

      ${dlSummary ? `<div class="dsect"><h4>下载（源站直链）</h4>
        <div class="isrc">${dlSummary}</div>
        <div class="ihint">下载链接来自 hanime 的最高画质直链，落盘到 NAS 的「hanime里番下载/待整理」。
          签名有效期约 11~12 小时；过期的点「需重抓」可单独重签，或用上面的「批量重抓过期」。
          源站不提供直链的（youjizz 部分集）会显示 404/470，属源站限制。</div>
      </div>` : ''}
    </div>`;

  /* ⭐ §87：入库检测这条路**不该出现**「标记已核对 / 加入待下 / 确认入库 / 屏蔽这部」——
     这四个动作是给看板详情（改判定）用的，在入库检测里点会串味。
     ⚠️ 四个都要显式隐藏：以前只藏了 dHideBtn，另外几个会**残留上一部的显示状态**
        （蛙哥截图里「概览/逐集比对」页签旁边莫名冒出三个按钮，就是这么来的）。
     ⚠️ §108 加了 dWantBtn 后**必须一起写** —— 漏一个就会在入库检测里冒出来。
     ⚠️ §139 加了 dWashBtn（洗版）同理 —— 危险按钮更不能残留在不该出现的路径上。 */
  ['#dCheckBtn','#dWantBtn','#dEverBtn','#dWashBtn','#dHideBtn'].forEach(sel => {
    const b = $(sel); if(b) b.style.display = 'none';
  });
  /* ⭐ §82：抽屉头也带封面 —— 与详情抽屉**同一套三档**（off 原图 / blur 模糊图 / hide 不挂图）。
     之前传的是 null ⇒ 一个没有 src 的 <img> 被 `img{display:block}` 顶成了灰方块。 */
  const thumb = S.safe === 'off'  ? (d.posterLocal || null)
              : S.safe === 'blur' ? (d.posterBlur  || null)
              : null;
  ensureIntakeSeq(Number(id));
  prefetchNeighbor(1);
  mountDrawer(
    d.nameZh || d.nameOriginal || '(无标题)',
    `<span>${d.year||'—'}</span><span>tmdb ${d.workId}</span><span>${st}</span>`,
    thumb,
    [
      {key:'ov', label:'概览', html: ovHtml},
      {key:'eps', label:'逐集比对', count: d.totalEpisodes, html:
        d.seasons.length ? `<div class="seasons">${seasonsHtml}</div>` : seasonsHtml},
    ],
    DRAWER.cur === 'eps' ? 'eps' : 'ov',
    navFooterHtml()
  );
}

/* ── 入库检测抽屉里的操作：排除/恢复某一集、加入待下、扫完刷新 ──────────
   🔴 为什么单独挂一个监听（⛔ 不复用上面 #dBody 那个）：
      那个用 `S.detail` 认身份，而入库检测抽屉**不设 S.detail**（会与看板详情串味）。
      这里用 `INTAKE.cur` 认身份，两套语义各自独立。
   🔴 操作完必须「重开抽屉 + 重画入库检测页」：
      排除是**后端把这一集从分母里剔掉**，只删 DOM 是假闭环（0gh），
      而且概览里的「应入库/缺集/已排除」三个数不会跟着变。 */
$('#dBody').addEventListener('click', async (e)=>{
  /* 🔴 §85：`data-relink` 必须在这个选择器里，否则「需重抓」按钮点了没反应
     （2026-10-29 补：原来只有 dl/iex/irst/iact，漏了 relink）。
     ⭐ §86：`data-showlink` = 点画质徽章看完整链接（蛙哥：「我在看板哪里能看到下载链接」）。 */
  const btn = e.target.closest('[data-iex],[data-irst],[data-iact],[data-dl],[data-relink],[data-showlink]');
  if(!btn || btn.disabled) return;

  /* 🔴 §86：看链接**不需要** workId（接口只按 vid 查）⇒ 必须放在 wid 校验之前，
     否则会先被「wid 非法」挡掉。 */
  if(btn.hasAttribute('data-showlink')){
    e.preventDefault(); e.stopPropagation();
    openLinkModal(btn.dataset.showlink);
    return;
  }

  const wid = Number(INTAKE.cur);
  if(!Number.isFinite(wid) || !wid) return;
  e.preventDefault(); e.stopPropagation();
  btn.disabled = true;

  try{
    /* ⭐ §85：签名重抓 —— 走 FlareSolverr 解 CF 取新签名（慢，8~20 秒）。
       🔴 重抓完**不自动下载**（重抓可能拿到更低画质的可下载版，
          交给用户看完徽章再决定要不要下）。 */
    if(btn.hasAttribute('data-relink')){
      const vid = btn.dataset.relink;
      const old = btn.textContent;
      btn.textContent = '重抓中…';
      btn.classList.add('run');
      btn.disabled = true;
      try{
        const r = await fetch('/api/dl/relink', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ vid }),
        });
        const j = await r.json();
        if(!j.ok){
          btn.textContent = old;
          btn.classList.remove('run');
          btn.disabled = false;
          btn.title = j.error || ('HTTP ' + r.status);
          toast('重抓失败：' + (j.error || ('HTTP ' + r.status)), 'bad');
          return;
        }
        /* 重抓成功 ⇒ 重画整个抽屉，让画质徽章/过期态刷新到最新 */
        await openIntake(wid);
        toast('重抓成功，链接已刷新', 'ok');
      }catch(err){
        btn.textContent = old;
        btn.classList.remove('run');
        btn.disabled = false;
        toast('重抓失败：' + (err && err.message ? err.message : err), 'bad');
      }
      return;
    }
    /* ⭐ §85：下载单集 —— 走服务端（⛔ 不在浏览器下，
       浏览器下载会落到运行浏览器的那台机器，不是 NAS）。
       ⭐ §88（2026-10-30）：改成**入队**，立刻返回。
       原来这里是同步等整集下完（一集 250MB / 6MB/s ≈ 40 秒），
       等的时候页面没有任何反馈，整部下更是几分钟没动静。
       ⇒ 现在只写队列，下载由服务端常驻 worker 跑，进度去「下载」页看。 */
    if(btn.hasAttribute('data-dl')){
      const vid = btn.dataset.dl;
      const workId = Number(btn.dataset.dlwork || wid);
      btn.textContent = '加入队列…';
      btn.classList.add('run');
      try{
        const r = await fetch('/api/dl/enqueue', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ workId, vids:[vid] }),
        });
        const j = await r.json();
        /* 🔴 F31（2026-10-31 审查）：`enqueued:0` 是**成功**语义 ——
           后端对「已下过 / 没有可下目标」返回 {ok:true, enqueued:0}。
           原来用 `if(!j.ok || !j.enqueued)` 一起判 ⇒ 已下过的集点一下会弹
           「加入队列失败：HTTP 200」，把人骗去查日志。⛔ 只有 !ok 才是失败。 */
        if(!j.ok){
          btn.textContent = '下载';
          btn.classList.remove('run');
          btn.disabled = false;
          toast('加入队列失败：' + (j.error || ('HTTP ' + r.status)), 'bad');
          return;
        }
        if(!j.enqueued){
          btn.textContent = '下载';
          btn.classList.remove('run');
          btn.disabled = false;
          /* F17 起后端会把「已下过」的集剔掉 ⇒ 这里能分清两种「没排上」 */
          toast(j.alreadyDownloaded ? '这一集已经下载过了，不重复下（进度去「下载」页看）' : '这一集没有可下载的链接（或已入库）', 'warn');
          return;
        }
        btn.textContent = '已排队';
        btn.classList.remove('run');
        btn.disabled = true;
        toast('已加入下载队列 · 去「下载」页看进度', 'ok');
        /* 抽屉里刷新一下状态（会显示「下载中」徽章） */
        setTimeout(()=>{ openIntake(wid); }, 800);
      }catch(err){
        btn.textContent = '下载';
        btn.classList.remove('run');
        btn.disabled = false;
        toast('加入队列失败：' + (err && err.message ? err.message : err), 'bad');
      }
      return;
    }
    if(btn.dataset.iact === 'want'){
      const w = S.works.find(x=>Number(x.id)===wid) || {};
      await toggleWant(wid, 'tv', w.embyEps, w.embyNeed);
      await openIntake(wid);
      return;
    }
    if(btn.dataset.iact === 'rescan'){
      await scanEmbyNow();
      await renderIntake();
      await openIntake(wid);
      return;
    }
    /* ⭐ §85：批量重抓这部所有已过期的签名（串行，⛔ 不并发 —— FlareSolverr 开真浏览器） */
    if(btn.dataset.iact === 'relinkall'){
      btn.textContent = '重抓中…';
      btn.disabled = true;
      try{
        const r = await fetch('/api/dl/relink-expired', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ limit: 20 }),
        });
        const j = await r.json();
        if(!j.ok){
          btn.textContent = '⟳ 批量重抓过期'; btn.disabled = false;
          toast('重抓失败：' + (j.error || ('HTTP ' + r.status)), 'bad');
          return;
        }
        btn.textContent = `重抓 ${j.succeeded}/${j.total}`;
        if(j.failed) btn.title = `${j.failed} 条失败`;
        await openIntake(wid);      // 重开抽屉，画质徽章/过期态刷新
        toast(`批量重抓 ${j.succeeded}/${j.total} 成功`, j.failed?'warn':'ok');
        return;
      }catch(err){
        btn.textContent = '⟳ 批量重抓过期'; btn.disabled = false;
        toast('重抓失败：' + (err && err.message ? err.message : err), 'bad');
      }
      return;
    }
    /* ⭐ §85：整部下载 —— 串行，⛔ 不并发（会打爆代理与 CDN） */
    if(btn.dataset.iact === 'dlall'){
      /* ⭐ §88：改成入队（立刻返回）。原来同步下整部，12 集要挂 8 分钟，
         中途页面无反馈、刷新就丢。现在队列在服务端跑，进度去「下载」页看。 */
      btn.textContent = '加入队列…';
      btn.disabled = true;
      try{
        const r = await fetch('/api/dl/enqueue', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ workId: wid, onlyMissing: true }),
        });
        const j = await r.json();
        if(!j.ok){
          btn.textContent = '⬇ 下载整部缺集'; btn.disabled = false;
          toast('加入队列失败：' + (j.error || ('HTTP ' + r.status)), 'bad');
          return;
        }
        btn.textContent = j.enqueued ? `已排队 ${j.enqueued} 集` : '没有要下的集';
        /* F17 起后端会剔掉「已下好」的集 ⇒ 若它们都没排上，说明缺的集其实都下过了，
           该去「刮削」页入库，⛔ 不是「没有缺集」那种空话 */
        const already = Number(j.alreadyDownloaded || 0);
        toast(
          j.enqueued
            ? `已把 ${j.enqueued} 集加入队列 · 去「下载」页看进度（关掉浏览器也会继续下）`
            : (already ? `缺的 ${already} 集都已经下载过了 · 去「刮削」页入库` : '这部没有缺集需要下载'),
          j.enqueued ? 'ok' : 'warn',
        );
        setTimeout(()=>{ openIntake(wid); }, 900);
        return;
      }catch(err){
        btn.textContent = '⬇ 下载整部缺集'; btn.disabled = false;
        toast('加入队列失败：' + (err && err.message ? err.message : err), 'bad');
      }
      return;
    }
    const raw = btn.getAttribute('data-iex') || btn.getAttribute('data-irst');
    const [sn, en] = String(raw||'').split(':').map(Number);
    if(!Number.isFinite(sn) || !Number.isFinite(en)){ btn.disabled = false; return; }
    const excluding = btn.hasAttribute('data-iex');
    const ok = await toggleHide('episode', `${wid}:S${sn}:E${en}`,
      excluding ? '入库检测「逐集比对」排除假集' : '入库检测「逐集比对」恢复');
    if(!ok){ btn.disabled = false; return; }
    await renderIntake();          // 后面那一页（缺集清单/四色概览）同步刷新
    await openIntake(wid);         // 抽屉原位重开（保留在「逐集比对」页签）
  }catch(err){
    btn.disabled = false;
    alert('操作失败：' + (err && err.message ? err.message : err));
  }
});

/* ── 轻提示（toast）──────────────────────────────────────────
   ⭐ 2026-10-29（§85 浏览器点击实测时发现）：
   原生 `alert()` 会**阻塞浏览器主线程** ⇒ 页面整块假死、
   CDP 自动化也读不到响应（实测直接 socket 超时）。
   ⇒ 下载/重抓这类「慢但可预期」的操作一律用 toast，不阻塞页面。
   🔴 但「操作失败」这类真异常仍保留 alert（要用户明确看到）。 */
function toast(msg, kind='info', ms=4200){
  let box = document.getElementById('toastBox');
  if(!box){
    box = document.createElement('div');
    box.id = 'toastBox';
    document.body.appendChild(box);
  }
  const el = document.createElement('div');
  el.className = 'toastitem ' + kind;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 300); }, ms);
}

/* ── §86 链接详情弹层（点画质徽章看完整 URL）────────────────────
   🔴 蛙哥（2026-10-30）：「我在看板哪里能看到你抓下来的下载链接」
   ⇒ 逐集行的画质徽章变成可点按钮 ⇒ 弹层里给完整 URL + 一键复制。
   ⛔ URL 不写进 HTML 属性（签名串含 & 会被转义坏）⇒ 点开时再调接口取。
   ⛔ 复制用剪贴板 API，失败降级成「选中文本手动复制」（不给假成功）。 */
const LNK = { url:'', vid:'', open:false };

async function openLinkModal(vid){
  const modal = $('#lnkModal');
  if(!modal) return;
  modal.classList.add('on');
  LNK.vid = vid; LNK.url = ''; LNK.open = false;
  $('#lnkModalVid').textContent = 'vid ' + vid;
  $('#lnkModalUrl').textContent = '加载中…';
  $('#lnkModalKv').innerHTML = '';
  $('#lnkOpen').disabled = true;
  $('#lnkWatch').disabled = true;
  try{
    const j = await fetch('/api/dl/link/' + encodeURIComponent(vid)).then(x=>x.json());
    if(!j.ok || !j.link){
      $('#lnkModalUrl').textContent = j.error || '这一集没有链接';
      return;
    }
    const L = j.link;
    LNK.url = L.url; LNK.open = true;
    const remain = L.remainSec!=null
      ? (L.remainSec > 0 ? `还有 ${Math.floor(L.remainSec/60)} 分钟` : '已过期')
      : '未知';
    const rate = (L.url.match(/[?&]rate=(\d+)/))
      ? `${(Number(RegExp.$1)/1024).toFixed(0)} KB/s（源站写死）` : '不限速';
    $('#lnkModalKv').innerHTML = `
      <dt>画质</dt><dd>${L.quality ? L.quality + 'p' : '未知'}</dd>
      <dt>源类型</dt><dd>${esc(L.srcKind || '—')}</dd>
      <dt>签名剩余</dt><dd>${esc(remain)}${L.expired ? ' ⚠️ 已过期，建议重抓' : ''}</dd>
      <dt>过期时刻</dt><dd>${L.expiresAt ? new Date(L.expiresAt*1000).toLocaleString() : '—'}</dd>
      <dt>速率上限</dt><dd>${esc(rate)}</dd>
      <dt>类型</dt><dd>${L.isM3u8 ? 'HLS (m3u8) · 本轮不支持下载' : 'MP4 直链'}</dd>`;
    $('#lnkModalUrl').textContent = L.url;
    $('#lnkOpen').disabled = false;
    $('#lnkWatch').disabled = false;
  }catch(e){
    $('#lnkModalUrl').textContent = '读取失败：' + (e && e.message ? e.message : e);
  }
}

function closeLinkModal(){
  const modal = $('#lnkModal');
  if(modal) modal.classList.remove('on');
  LNK.open = false;
}

function bindLinkModal(){
  $('#lnkClose').addEventListener('click', closeLinkModal);
  $('#lnkModal').addEventListener('click', e=>{ if(e.target.id === 'lnkModal') closeLinkModal(); });
  $('#lnkCopy').addEventListener('click', async ()=>{
    if(!LNK.url){ toast('还没有链接可复制', 'warn'); return; }
    try{
      await navigator.clipboard.writeText(LNK.url);
      toast('链接已复制到剪贴板', 'ok');
    }catch(err){
      /* 🔴 剪贴板 API 在非 https / 无权限时会失败 ⇒ 降级：选中全文让用户自己按 Ctrl+C
         ⛔ 不给「已复制」的假成功。 */
      const u = $('#lnkModalUrl');
      const r = document.createRange(); r.selectNodeContents(u);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      toast('剪贴板不可用，已选中链接，请手动复制（Ctrl+C）', 'warn');
    }
  });
  $('#lnkOpen').addEventListener('click', ()=>{
    if(!LNK.url) return;
    window.open(LNK.url, '_blank', 'noopener');
  });
  $('#lnkWatch').addEventListener('click', ()=>{
    if(!LNK.vid) return;
    window.open('https://hanime1.me/watch?v=' + encodeURIComponent(LNK.vid), '_blank', 'noopener');
  });
}

/* ── 安全模式 ───────────────────────────────────────────── */

/**
 * 三档循环：off（正常）→ blur（模糊）→ hide（隐藏）→ off
 *
 * 隐私要点：
 *   blur/hide 档下页面**不写 <img> 标签**，图片不会出现在网络请求里。
 *   纯 CSS filter:blur 是「传了再遮挡」，对旁边的同事毫无意义。
 *   模糊档只在鼠标悬停单张时才请求那一张 —— 既能自己确认，
 *   又不会一屏几百张全部拉走。
 */
const SAFE_LABEL = { off:'安全模式', blur:'安全模式 · 模糊', hide:'安全模式 · 隐藏' };
const SAFE_CHIP  = { off:'安全模式 · 关闭', blur:'安全模式 · 模糊中', hide:'安全模式 · 封面已隐藏' };
/* 🔴 2026-10-23：`bindStillHover` 已删除（连同 `data-still` 悬停机制）。
   原因同 armHoverLoad —— 悬停取原图本身就是泄漏路径。
   现在 blur 档的剧照在**渲染时**就换成模糊图，不需要任何运行时绑定。 */

function applySafe(){
  const body = document.body;
  body.classList.toggle('safe-on',  S.safe === 'blur');
  body.classList.toggle('safe-hide', S.safe === 'hide');

  const btn = $('#safebtn');
  btn.classList.toggle('active', S.safe !== 'off');
  btn.classList.toggle('blur',   S.safe === 'blur');
  btn.classList.toggle('hide',   S.safe === 'hide');
  $('#safebtnText').textContent = SAFE_LABEL[S.safe];

  const chip = $('#safechip');
  chip.classList.add('show');
  chip.classList.toggle('ok',         S.safe === 'off');
  chip.classList.toggle('hide-mode',  S.safe === 'hide');
  $('#safechipText').textContent = SAFE_CHIP[S.safe];

  /* 抽屉开着时按**新档位重渲染同一部**（头图 / 剧照一起切）。
     🔴 2026-10-22 改：原来这里是 `closeDetail()` —— 切档直接把抽屉关掉，体验差；
        而且已经 innerHTML 出来的剧照仍留在 #dBody 里（模糊档悬停换出来的原图，
        切到 hide 档也压不住）。改成重渲染后，切档结果与「重新打开」完全一致。 */
  if ($('#drawer').classList.contains('on')) {
    /* 🔴 隐私铁律：切到 blur/hide 档要**立刻**把已经挂上的图摘掉，
       不能等异步重渲染回来（那几百毫秒里原图还挂在 DOM 上）。 */
    if (S.safe !== 'off') {
      const th = $('#dThumb');
      if (th) { th.removeAttribute('src'); th.hidden = true; }
    }
    /* ⭐ §82：入库检测抽屉也要按新档位重渲染 —— 它现在头部也带封面了，
       不重渲染就会在 hide 档继续显示上一档的图。 */
    if (DRAWER.seqKind === 'intake' && INTAKE.cur) {
      openIntake(INTAKE.cur);
    } else {
      const d = S.detail;
      if (d) openDetail(d.id, d.media); else closeDetail();
    }
  }

  /* 🔴 只重画**当前真的在显示卡片**的视图。
     原来这里无条件 `render()` —— 在独立视图（设置 / 标签高亮 / 链接健康 / 下载 / 刮削）
     里调一下 applySafe 就会把 #main 整片换成海报墙，等于「把人踢出当前页」。
     §151 实测：在标签高亮页点一下标红，700ms 后被弹回全览（reloadBoard → applySafe → render）。 */
  if (VIEW === 'all') render();
  else if (VIEW === 'want') renderWantWall();
  /* 🔴 2026-10-23：blur 档不再有任何「悬停取原图」的绑定 ——
     模糊图在 render 时就是最终形态，切档只靠重渲染，无残留状态要清。 */

  try { localStorage.setItem(SAFE_KEY, S.safe); } catch { /* 隐私模式忽略 */ }
}

function cycleSafe(){
  S.safe = S.safe === 'off' ? 'blur' : S.safe === 'blur' ? 'hide' : 'off';
  applySafe();
}

  VIEW = b.dataset.v;
  /* §80：年份轨道在「全览 / 待下」两个视图里都要在（两个视图都按年份铺卡片）；
     入库检测/设置是独立页，轨道没意义 ⇒ 连整条 trackwrap 一起藏，
     ⛔ 只藏 #track 会在吸顶区留一条空白。 */
  const tw = document.querySelector('.trackwrap');
  if(tw) tw.style.display = (VIEW==='all' || VIEW==='want') ? '' : 'none';
  // 找年份那批老逻辑（兼容：万一 trackwrap 不在，至少轨道本身要藏）
  if($('#track')) $('#track').style.display = (VIEW==='want' || VIEW==='all') ? '' : 'none';
  /* ⭐ §75：入库检测视图**自带**四色概览框（Emby 在库/未下载/缺集/TMDB 未收录），
     口径是「overview」那一套（missingWork/partial），与主看板的 embyEps 分档
     ⛔ 不是同一套数。两个控件同时在 ⇒ 用户看到两个不同的「未入库」数字 ⇒ 打架。
     ⇒ intake 视图下隐藏这个分段控件（不删，切回来还在）。 */
  const segSt = document.getElementById('segSt');
  if(segSt) segSt.style.display = VIEW==='all' ? '' : 'none';
  /* ⭐ §79：设置页与入库检测一样，不认入库档 ⇒ 切过去时清档 + 点亮「不限」 */
  if (VIEW!=='all' && S.st.size){
    S.st.clear();
    [...(segSt?.children||[])].forEach(x=>x.classList.toggle('on', x.dataset.st===''));
  }
  /* ⭐ §75/§77：intake 视图不认入库档 ⇒ 切过去时清掉选择 + 把「不限」按钮点亮，
     免得切回来「莫名其妙只剩一档」。 */
  if (VIEW==='intake' && S.st.size){
    S.st.clear();
    [...(segSt?.children||[])].forEach(x=>x.classList.toggle('on', x.dataset.st===''));
  }
  $('#q').placeholder = ({
    all:    '搜剧名 / 原名 / 年份',
    want:   '搜剧名 / 原名 / 年份',
    intake: '搜作品名 / 年份',
    settings: '（设置页不搜索）',
    links:  '（链接健康页不搜索）',
    dl:     '（下载页不搜索）',
    scrape: '（刮削页不搜索）',
    tags:   '（标签高亮页用自己的搜索框）',
  })[VIEW] || '搜剧名 / 原名 / 年份';
  /* ⭐ §79：设置页 —— 独立视图，不画卡片也不画入库检测
     ⭐ §80：待下 —— 只画「喜欢过的」那批（含已收），不走 filtered()
     ⭐ §86：链接健康 —— 独立视图，验收「后期抓的剧集和链接有没有真的落地」 */
  /* ⭐ §91：只有待下页要轮询「一条龙」进度，切走就停（⛔ 别让 3 秒轮询跟着全局跑） */
  if (VIEW!=='want') stopWantPoll();
  /* ⭐ §93：刮削页自己管 2 秒轮询，切走必须停 */
  if (VIEW!=='scrape') stopScrapePoll();
  if (VIEW==='settings') renderSettings();
  else if (VIEW==='tags') renderTagSettings();     /* ⭐ §151/§152 标签标记（设置用，只在二级看板生效） */
  else if (VIEW==='links') renderLinkHealth();
  else if (VIEW==='dl') renderDownload();          /* ⭐ §88 下载中心（自己管理 1 秒轮询） */
  else if (VIEW==='scrape') renderScrape();        /* ⭐ §93 刮削中心（自己管理 2 秒轮询） */
  else if (VIEW==='intake') renderIntake();
  else if (VIEW==='want') { renderStats(); renderTrack(); renderWantWall();
    /* ⭐ §87：先把「直链 N/M」拉回来再重画一次海报墙（首帧先出，数字稍后补齐） */
    loadWantAudit().then(()=>{ if(VIEW==='want') renderWantWall(); });
    startWantPoll(); }
  else { renderStats(); renderTrack(); render(); }   /* ← 切回必须恢复原顶栏统计 */
});

/* ⭐ 入库状态分段筛选（§75 三档互斥 → §77 **多选**）：
   ⭐ §77 蛙哥「多勾选、随意组合」⇒ 勾几档就是几档的**并集**。
   - 点「不限」(data-st="") ⇒ 清空所有勾选（reset）。
   - 点某档 ⇒ 切换该档的勾选状态（可同时点亮多个）。
   - 与「只看未核对/已核对/有封面/泡麵番」是 **AND 叠加**关系（各条件同时成立）。 */
$('#segSt').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  const st = b.dataset.st || '';
  if(!st){
    S.st.clear();                       // 「不限」= 清空选择
  }else{
    if(S.st.has(st)) S.st.delete(st);    // 再点一次 ⇒ 取消这一档
    else S.st.add(st);                  // ⛔ 不清空其它已勾的 ⇒ 多选
  }
  // 高亮同步：「不限」仅在**一个都没勾**时点亮；三档各按 S.st 独立点亮
  [...e.currentTarget.children].forEach(x=>{
    const k = x.dataset.st || '';
    x.classList.toggle('on', k ? S.st.has(k) : S.st.size===0);
  });
  rerenderCurrent();
});

   标签标记不再参与海报墙筛选，只在作品抽屉的来源列展示。 */

/* ══════════════════════════════════════════════════════════════════════
   ⭐ §80 筛选面板 / 吸顶 / 年份轨道翻页
   ----------------------------------------------------------------------
   ① 筛选面板：把「类型 / 来源 / 入库 / 状态 / 覆盖体检」收进浮层
      ⇒ 吸顶区只剩三行，工具栏不再挤 12 个控件（蛙哥需求⑤）
   ② filterN：面板关着的时候也能一眼看出「现在有几个筛选是开着的」
      ⇒ 不点开也能知道为什么列表只剩 39 部（0cs：口径讲出来别让人猜）
   ③ 吸顶阴影：滚过顶部后给 sticky 容器加 .pinned，明确「这块是固定的」
   ④ 年份轨道左右翻页：年份多（1997-2026 = 30 个），窄屏横滚不好拖
   ══════════════════════════════════════════════════════════════════════ */
function filterCount(){
  let n = 0;
  if(S.type) n++;
  if(S.src) n++;
  n += S.st.size;
  if(S.onlyCover) n++;
  if(S.onlyPm) n++;
  if(S.onlyUnchecked) n++;
  if(S.onlyChecked) n++;
  if(S.onlyWant) n++;
  return n;
}

function paintFilterCount(){
  const n = filterCount();
  const btn = document.getElementById('filterBtn');
  const cnt = document.getElementById('filterN');
  if(cnt) cnt.textContent = n;
  if(btn) btn.classList.toggle('has', n > 0);
  // 面板底部的口径说明：让人一眼看懂「现在为什么只有这几部」
  const h = document.getElementById('filterHint');
  if(h){
    const parts = [];
    if(S.type) parts.push(S.type === 'tv' ? '剧集' : '剧场版');
    if(S.src) parts.push({both:'MT+hanime', mteam:'仅 MT', hanime:'仅 hanime'}[S.src] || S.src);
    const STL = {full:'全部入库', part:'部分入库', none:'未入库'};
    if(S.st.size) parts.push([...S.st].map(k=>STL[k]).join('+'));
    if(S.onlyUnchecked) parts.push('未核对');
    if(S.onlyChecked) parts.push('已核对');
    if(S.onlyWant) parts.push('待下');
    if(S.onlyCover) parts.push('有封面');
    if(S.onlyPm) parts.push('泡麵番');
    h.textContent = parts.length ? `已开 ${parts.length} 项：${parts.join(' · ')}` : '当前没有开任何筛选（全部作品都在）';
  }
}

function bindFilterPanel(){
  const btn = document.getElementById('filterBtn');
  const panel = document.getElementById('filterpanel');
  if(!btn || !panel) return;

  const close = ()=>{ panel.classList.remove('open'); btn.classList.remove('open'); };
  btn.addEventListener('click', e=>{
    e.stopPropagation();
    const open = !panel.classList.contains('open');
    panel.classList.toggle('open', open);
    btn.classList.toggle('open', open);
    if(open) paintFilterCount();
  });
  // 点面板内部不算「点外面」
  panel.addEventListener('click', e=>e.stopPropagation());
  // 点页面任何地方收起（含搜索结果区）；Esc 也收
  document.addEventListener('click', ()=>{ if(panel.classList.contains('open')) close(); });
  document.addEventListener('keydown', e=>{ if(e.key === 'Escape') close(); });

  // 清空全部筛选
  document.getElementById('filterReset')?.addEventListener('click', ()=>{
    S.type=''; S.src=''; S.st.clear();
    S.onlyCover=false; S.onlyPm=false; S.onlyUnchecked=false; S.onlyChecked=false; S.onlyWant=false;
    S.q='';
    const q = document.getElementById('q'); if(q) q.value = '';
    document.querySelectorAll('#segType button').forEach(b=>b.classList.toggle('on', b.dataset.t===''));
    document.querySelectorAll('#segSrc button').forEach(b=>b.classList.toggle('on', b.dataset.s===''));
    document.querySelectorAll('#segSt button').forEach(b=>b.classList.toggle('on', b.dataset.st===''));
    ['onlyCover','onlyPm','onlyUnchecked','onlyChecked','onlyWant'].forEach(id=>{
      const el = document.getElementById(id); if(el) el.checked = false;
    });
    paintFilterCount();
    rerenderCurrent();
  });

  paintFilterCount();
}

/* ══════════ 季级屏蔽（2026-10-26 · §69 ⑥）════════════════════════════
   蛙哥原话：「壳中的小鸟的 S02 可以屏蔽不显示」。

   ⭐ 数据层：`work_hidden` 新增 `scope='season'`，key = `<tmdb_id>:S<季号>`。
      后端 `board.detail()` 在**查 eps 那一处**就 `AND season NOT IN (...)` ——
      一处过滤同时管住 ①集数 ②对齐表 ③前端季标签，不存在「显示藏了、数据没藏」。
      ⚠️ 故意不动 `season_count` / `episode_total`（TMDB 元数据快照，
         改了会和 `stats()` 的口径分裂）。

   ⭐ 前端：必须**事件委托**到常驻的 `#dBody`（0cx）。
      `mountDrawer()` 只渲染当前 tab ⇒ 季集 tab 是切过去时才 innerHTML 出来的，
      在 openDetail 里 querySelectorAll('[data-whid-season]') 一个都绑不到。

   ⭐ 操作完必须 `openDetail()` 重开 —— 季卡片的有无由后端 eps 决定，
      前端只改按钮文案或删 DOM = 假闭环（0gh：只改显示不改数据）。
   ══════════════════════════════════════════════════════════════════ */
$('#dBody').addEventListener('click', async (e)=>{
  /* ⚠️ §74 起「确认入库」按钮**不在 `#dBody` 里了** —— 蛙哥要求它跟「标记已核对」
     并排放在右上角（`#dEverBtn`），所以确认逻辑挂在那个按钮自己身上。
     ⛔ 别在这里再留一份：同一动作两个入口，迟早分叉。 */

  /* ⭐ §108：逐集对照里 hanime 标签的「+N / 收起」。
     纯展示、不写库、不发请求 ⇒ 只切 DOM，⛔ 不重渲染（重渲染会把滚动位置丢掉）。 */
  const tb = e.target.closest('[data-tagmore]');
  if(tb){
    e.preventDefault(); e.stopPropagation();
    const box = tb.closest('.aln-tags');
    const rest = box && box.querySelector('.aln-tagrest');
    if(!rest) return;
    const willOpen = rest.hidden;
    rest.hidden = !willOpen;
    tb.textContent = willOpen ? '收起' : `+${tb.dataset.n || ''}`;
    tb.title = willOpen ? '收起其余标签' : '展开全部标签';
    return;
  }

  /* ⭐ §112（2026-10-31 蛙哥「全库安排剧集简介」）：分集简介「压 2 行 ⇄ 展开全文」。
     纯展示：只切 class，⛔ 不重渲染（重渲染会丢滚动位置，也与标签 +N 的交互不一致）。 */
  const ed = e.target.closest('[data-epdesc]');
  if(ed){
    e.preventDefault(); e.stopPropagation();
    ed.classList.toggle('open');
    return;
  }

  /* ⭐ 2026-10-27（§74）逐集对照里的**集级排除 / 恢复**。
     key 是 `<season>-<episode>`（与 localMap 同款），后端要 `<id>:S<season>:E<episode>`。
     🔴 操作完必须 `reloadBoard()` + `openDetail()` 重开：
        被排除的集是**后端从 eps 里剔掉的**，前端只删 <tr> = 假闭环，
        而且分季行/集数徽章/入库标全都不会跟着变（0gh）。 */
  const epb = e.target.closest('[data-ep-exclude],[data-ep-restore]');
  if(epb && !epb.disabled){
    const dt = S.detail;
    if(!dt) return;
    e.preventDefault(); e.stopPropagation();
    const raw = epb.getAttribute('data-ep-exclude') || epb.getAttribute('data-ep-restore');
    const [sn, en] = String(raw||'').split('-').map(Number);
    if(!Number.isFinite(sn) || !Number.isFinite(en)) return;
    epb.disabled = true;
    const key = `${dt.id}:S${sn}:E${en}`;
    const act = await toggleHide('episode', key,
      epb.hasAttribute('data-ep-exclude') ? '看板「逐集对照」排除假集' : '看板「逐集对照」恢复');
    if(!act){ epb.disabled = false; return; }
    await reloadBoard();
    await openDetail(dt.id, dt.media, DRAWER.cur || 'align');
    return;
  }

  const b = e.target.closest('[data-whid-season],[data-whid-restore]');
  if(!b || b.disabled) return;
  const dt = S.detail;                 // 抽屉身份；已关闭则什么都不做
  if(!dt) return;
  e.preventDefault(); e.stopPropagation();   // ⛔ 别让卡片/遮罩抢走这次点击
  const tab = DRAWER.cur || 'align';    // 记下当前页签，重开后留在原地
  b.disabled = true;
  try{
    if(b.hasAttribute('data-whid-season')){
      await toggleHide('season', `${dt.id}:S${b.getAttribute('data-whid-season')}`,
                       '看板「屏蔽本季」');
    }else{
      const list = String(b.getAttribute('data-whid-restore')||'')
        .split(',').map(x=>parseInt(x,10)).filter(n=>Number.isFinite(n));
      for(const sn of list)
        await toggleHide('season', `${dt.id}:S${sn}`, '看板「恢复本季」');
    }
  }catch(err){ alert('季级屏蔽失败：' + err); }
  await openDetail(dt.id, dt.media, tab);   // 🔴 必须重开，不能只改 DOM
});

/* ⭐ §123（2026-11-01 蛙哥）：「我不需要指向 tmdb，我需要指向 8848 看板的哪一集，
   我点击就可以跳转到看板看匹配的对不对」。
   mteam 页每个文件行现在是「→ S1E7 · 作品名」，链接 `/?w=<id>&s=<季>&e=<集>`。
   这里把深链接住：自动打开那部作品的抽屉，滚到那一集并临时标记。 */
async function bootDeepLink(){
  const q = new URLSearchParams(location.search);
  const wid = q.get('w');
  if(!wid) return;
  const s = Number(q.get('s')), e = Number(q.get('e'));
  try{ await openDetail(wid, q.get('m') || 'tv', 'align'); }catch(_){ return; }
  if(!Number.isFinite(s) || !Number.isFinite(e)) return;
  const tr = document.getElementById(`ep-${s}-${e}`);
  if(!tr) return;
  tr.classList.add('dl-hit');
  tr.scrollIntoView({ block: 'center', behavior: 'smooth' });
  setTimeout(() => tr.classList.remove('dl-hit'), 6000);
}

boot().then(bootDeepLink);

/* ⭐ §86：链接详情弹层的按钮绑定（弹层是全局的，不随抽屉开合） */
bindLinkModal();

/* ⭐⭐ §135（2026-11-02）来源选择的两类点击 —— 用事件委托，
   因为来源格和「执行条」都会被 fillPickCells()/refreshPickBar() 整块替换，
   逐个 bind 会失效（§129 同一类坑：换掉 DOM 就丢监听）。 */
document.addEventListener('click', async (e)=>{
  /* ⭐ §142 单集洗版（每行一个 ♻）—— 必须放在 [data-pk] 之前判断：
     两个按钮在同一个 .pk 里，closest 会先命中祖先，抢走洗版的点击。 */
  const wash = e.target.closest('[data-wash-ep]');
  if(wash){
    e.stopPropagation();
    await washEp(PICK.workId, String(wash.dataset.washEp), wash);
    return;
  }
  const pk = e.target.closest('[data-pk]');
  if(pk){
    e.stopPropagation();
    const [s, en] = String(pk.dataset.pk).split('-').map(Number);
    if(!Number.isFinite(s) || !Number.isFinite(en)) return;
    await pickOne(PICK.workId, s, en, pk.dataset.src, pk);
    return;
  }
  const run = e.target.closest('[data-pkrun]');
  if(run){
    e.stopPropagation();
    const wid = Number(run.dataset.pkrun) || PICK.workId;
    await runPicks(wid, run);
    return;
  }
});
</script>
