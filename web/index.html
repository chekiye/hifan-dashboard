  font-size:12.5px; color:var(--ink2); user-select:none;
}
.set-toggle input{width:15px; height:15px; cursor:pointer}
.set-msg{
  font-size:12px; padding:7px 11px; border-radius:var(--r-s);
  margin-top:10px; display:none;
}
.set-msg.show{display:block}
.set-msg.ok{background:var(--ok-soft); color:var(--ok-ink); border:1px solid rgba(14,159,110,.24)}
.set-msg.err{background:var(--bad-soft); color:var(--bad-ink); border:1px solid rgba(220,43,43,.24)}
.set-msg.info{background:var(--warn-soft); color:var(--warn-ink); border:1px solid rgba(192,120,0,.24)}
.set-tbl{width:100%; border-collapse:collapse; font-size:12px}
.set-tbl th{
  text-align:left; font-size:10.5px; font-weight:750; letter-spacing:.05em;
  color:var(--ink3); text-transform:uppercase;
  padding:7px 9px; border-bottom:1px solid var(--line2); white-space:nowrap;
}
.set-tbl td{padding:7px 9px; border-bottom:1px solid var(--line); color:var(--ink2); vertical-align:top}
.set-tbl tr:last-child td{border-bottom:none}
.set-tbl .mono{font-family:var(--mono); font-size:11px; color:var(--ink3); white-space:nowrap}
.set-badge{
  display:inline-block; font-size:10.5px; font-weight:700;
  padding:2px 8px; border-radius:999px; white-space:nowrap;
}
.set-badge.ok{background:var(--ok-soft); color:var(--ok-ink)}
.set-badge.err{background:var(--bad-soft); color:var(--bad-ink)}
.set-badge.warn{background:var(--warn-soft); color:var(--warn-ink)}
.set-badge.run{background:var(--surface-2); color:var(--ink3)}
.set-badge.skip{background:var(--surface-2); color:var(--ink4)}
.set-empty{font-size:12px; color:var(--ink4); padding:14px 2px; text-align:center}
.set-note{
  font-size:11.5px; color:var(--ink4); line-height:1.65;
  margin-top:12px; padding-top:12px; border-top:1px dashed var(--line2);
}
.set-note b{color:var(--ink3)}

/* ═══════════════════════════════════════════════════════════════════════
   LUMEN-3 · 2026-10-28 §80 布局重排（蛙哥五条需求）
   ---------------------------------------------------------------------------
   问题（蛙哥原话）：
     ① 「头部要不固定一下，往下滑选不到年份」→ 年份轨道不在吸顶区
     ② 功能越加越多 ⇒ 工具栏一行塞 12 个控件，换行后 109px 高，内容被挤
   做法：
     · 把「顶栏 + 年份轨道 + 工具栏」装进**一个 sticky 容器**（只有一层 sticky，
       高度自适应 ⇒ 不用 JS 算 offsetTop，也不会出现两层叠不住的缝）
     · 筛选条件收进**下拉面板**（绝对定位浮层，⛔ 不占吸顶高度）
     · 保留全部既有 id（JS 绑定不动），只改外层容器与视觉
   ⛔ 本节只覆盖视觉，不新增业务语义。
   ═══════════════════════════════════════════════════════════════════════ */

/* ── 吸顶容器：唯一 sticky 层 ─────────────────────────────────── */
.stickywrap{
  position:sticky; top:0; z-index:60;
  background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(10,16,32,.04);
}
.stickywrap .top,
.stickywrap .bar{position:static; background:transparent; backdrop-filter:none; border-bottom:0}
/* 下滑时（吸附后）加一层阴影，明确「这块是固定的」 */
.stickywrap.pinned{box-shadow:0 8px 24px -18px rgba(10,16,32,.45), 0 1px 0 var(--line)}

/* ── 第一行：品牌 + 读数 + 动作（压扁到 46px）──────────────────── */
.stickywrap .top-row1{padding:8px 22px 6px; gap:14px; min-height:46px}
.stickywrap .brand .mark{width:26px; height:26px; border-radius:8px; font-size:12.5px}
.stickywrap .brand h1{font-size:16.5px; letter-spacing:-.02em}
.stickywrap .brand .sub{font-size:10.5px; margin-top:0; opacity:.85}
.stickywrap .statstrip{margin-left:4px; gap:0}
.stickywrap .tstat{padding:0 12px}
.stickywrap .tstat b{font-size:16px; letter-spacing:-.02em}
.stickywrap .tstat span{font-size:9.5px; letter-spacing:.02em}
.stickywrap .top-actions{gap:7px}
.stickywrap .unconf-link{padding:5px 10px; font-size:11.5px; border-radius:9px}
.stickywrap .safechip{padding:3px 9px; font-size:10.5px}

/* ── 第二行：年份轨道（今年 = 高亮胶囊，横滚 + 左右微调按钮）──────── */
.trackwrap{position:relative; display:flex; align-items:center; padding:0 16px 7px}
.stickywrap .track{padding:0 4px; gap:5px; scroll-behavior:smooth}
.stickywrap .yr{
  min-width:40px; padding:4px 8px 5px; border-radius:8px;
  box-shadow:none; border-color:transparent; background:var(--surface-2);
}
.stickywrap .yr:hover{transform:none; background:var(--surface-3)}
.stickywrap .yr-c{font-size:13.5px; line-height:1.25}
.stickywrap .yr-n{font-size:9px}
.stickywrap .yr.on{box-shadow:0 4px 12px -6px rgba(10,16,32,.5)}
.tracknav{
  flex:0 0 auto; width:22px; height:30px; border-radius:7px;
  display:flex; align-items:center; justify-content:center;
  color:var(--ink3); font-size:15px; font-weight:700; background:transparent;
}
.tracknav:hover{background:var(--surface-3); color:var(--ink)}

/* ── 第三行：工具栏（装不下的都进筛选面板）────────────────────── */
.stickywrap .bar{padding:7px 22px 8px; gap:8px; flex-wrap:wrap; row-gap:6px; overflow:visible}
/* 🔴 2026-10-29：原来是 nowrap —— 控件变多后一旦超宽就只能溢出/被裁。
   改 wrap 后：宽屏一行（放得下就不换），窄屏自动折成两行（吸顶变高但**不丢控件**）。 */
.stickywrap .bar .search{flex:0 0 210px; max-width:210px; padding:6px 11px}
.stickywrap .bar .seg button{padding:5px 11px; font-size:12px}
.stickywrap .bar .safebtn{padding:6px 11px; font-size:12px}
.stickywrap .bar .hint{
  font-size:11px; color:var(--ink4); margin-left:auto; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; max-width:280px;
}

/* 筛选按钮：未选任何条件时灰，选了 N 项亮紫 + 角标 */
.filterbtn{
  display:flex; align-items:center; gap:6px; padding:6px 12px;
  border:1px solid var(--line2); border-radius:var(--r-m);
  background:var(--surface); font-size:12px; font-weight:650; color:var(--ink2);
  white-space:nowrap; transition:.15s var(--ease); flex:0 0 auto;
}
.filterbtn:hover{border-color:var(--ink3)}
.filterbtn.has{border-color:rgba(79,70,229,.42); background:var(--brand-soft); color:var(--brand-ink)}
.filterbtn .fn{
  font-family:var(--mono); font-size:10.5px; font-weight:800;
  background:var(--brand); color:#fff; border-radius:999px;
  padding:1px 6px; line-height:1.45;
}
.filterbtn:not(.has) .fn{display:none}
.filterbtn .caret{font-size:9px; opacity:.6; transition:transform .16s var(--ease)}
.filterbtn.open .caret{transform:rotate(180deg)}

/* 筛选面板：绝对定位浮层（⛔ 不占吸顶高度 —— 否则展开时内容被推走） */
.filterpanel{
  display:none; position:absolute; left:0; right:0; top:100%;
  background:rgba(255,255,255,.985);
  backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid var(--line2);
  box-shadow:0 22px 48px -28px rgba(10,16,32,.42);
  padding:14px 22px 16px; z-index:5;
}
.filterpanel.open{display:block}
.frow{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:7px 0}
.frow + .frow{border-top:1px dashed var(--line)}
.flabel{
  flex:0 0 52px; font-size:10.5px; font-weight:750; letter-spacing:.06em;
  color:var(--ink4); text-transform:uppercase;
}
.fsep{width:1px; height:18px; background:var(--line2); margin:0 4px}
.fpanel-foot{
  display:flex; align-items:center; gap:10px; margin-top:10px;
  padding-top:11px; border-top:1px solid var(--line);
}
.fpanel-foot .hint2{font-size:11.5px; color:var(--ink4); margin-left:auto}
.freset{
  font-size:12px; font-weight:650; color:var(--ink2);
  padding:5px 11px; border-radius:9px; border:1px solid var(--line2);
}
.freset:hover{border-color:var(--ink3); background:var(--surface-2)}

/* 覆盖体检条在面板里恢复成原始尺寸（吸顶区不再放它） */
.filterpanel .covline{padding:0; margin:0}

/* ── 卡片：♥ 待下按钮（§80）─────────────────────────────────────
   位置 = 封面右上。与「泡麵番」徽标的冲突用固定下移解决：
   泡麵番统一放 top:38px（原本 top:8px），这样两枚永不重叠。 */
.wantbtn{
  position:absolute; top:8px; right:8px; z-index:3;
  width:26px; height:26px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.86); backdrop-filter:blur(6px);
  border:1px solid rgba(10,16,32,.14);
  color:var(--ink2); box-shadow:0 1px 3px rgba(10,16,32,.14);
  transition:all .15s var(--ease); opacity:0; transform:scale(.86);
}
.card:hover .wantbtn, .card.want .wantbtn{opacity:1; transform:scale(1)}
.wantbtn svg{width:14px; height:14px}
.wantbtn:hover{background:#fff; color:var(--rose); border-color:rgba(212,83,126,.5); transform:scale(1.06)}
.card.want .wantbtn{
  background:var(--rose); border-color:var(--rose); color:#fff;
  box-shadow:0 3px 10px -3px rgba(212,83,126,.7);
}
/* 已喜欢：整卡玫瑰色描边（与「已核对」的绿描边并列，互不覆盖 ——
   核对是事实凭证，喜欢是待办，两个都可能同时成立 ⇒ 用双色描边） */
.card.want .poster{box-shadow:0 0 0 2px var(--rose), var(--sh-1)}
.card.wpending .ctitle::after{
  content:'待下'; margin-left:6px; font-size:9.5px; font-weight:800;
  color:var(--rose-ink); background:var(--rose-soft);
  padding:1px 5px; border-radius:4px; vertical-align:1px;
}
.card.want.wchk .poster{box-shadow:0 0 0 2px var(--ok), 0 0 0 4px var(--rose), var(--sh-1)}
/* 🔴 §89 删掉了「泡麵番下移 top:38px 给 ♥ 让位」——
   泡麵番已经不在右上角了（进了左上角 `.tlb` 纵向堆），♥ 独占右上，不再互相压。 */
.card.cwantdone .wantbtn{background:var(--ok); border-color:var(--ok); color:#fff}

/* ── 批量操作条：一个模式，三种动作（§80 需求②③）────────────── */
#bselbar{gap:8px}
.bsel-acts{display:flex; align-items:center; gap:6px; margin-left:6px}
.bsel-act{
  display:flex; align-items:center; gap:6px; padding:7px 13px;
  border-radius:11px; font-size:12.5px; font-weight:700;
  border:1px solid var(--line2); background:var(--surface); color:var(--ink2);
  transition:.15s var(--ease); white-space:nowrap;
}
.bsel-act:hover:not(:disabled){border-color:var(--ink3); transform:translateY(-1px)}
.bsel-act:disabled{opacity:.42; cursor:not-allowed}
.bsel-act.ok{color:var(--ok-ink); background:var(--ok-soft); border-color:rgba(14,159,110,.3)}
.bsel-act.want{color:var(--rose-ink); background:var(--rose-soft); border-color:rgba(212,83,126,.3)}
.bsel-act.bad{color:var(--bad-ink); background:var(--bad-soft); border-color:rgba(220,43,43,.3)}
.bsel-sep{width:1px; height:22px; background:var(--line2)}

/* ── 待下清单抽屉（§80 需求③）────────────────────────────────── */
#wdrawer{
  position:fixed; top:0; right:0; height:100%; width:min(460px,94vw);
  background:var(--surface); z-index:120; display:flex; flex-direction:column;
  transform:translateX(102%); transition:transform .28s var(--ease);
  box-shadow:-24px 0 60px -30px rgba(10,16,32,.4);
}
#wdrawer.on{transform:none}
#wdrawer .wh{
  display:flex; align-items:center; gap:10px; padding:16px 18px;
  border-bottom:1px solid var(--line); flex:0 0 auto;
}
#wdrawer .wh h3{font-size:15px; font-weight:760; letter-spacing:-.01em}
#wdrawer .wbody{flex:1; overflow-y:auto; padding:12px 14px 20px}
#wdrawer .wf{
  display:flex; align-items:center; gap:8px; padding:11px 16px;
  border-top:1px solid var(--line); flex:0 0 auto; background:var(--surface-2);
}
.witem{
  display:flex; gap:11px; padding:9px; border-radius:12px;
  border:1px solid var(--line); background:var(--surface); margin-bottom:8px;
  transition:.14s var(--ease);
}
.witem:hover{border-color:var(--line2); box-shadow:var(--sh-1)}
.witem img, .witem .wph{
  width:44px; height:64px; border-radius:8px; object-fit:cover; flex:0 0 auto;
  background:var(--surface-3); display:flex; align-items:center; justify-content:center;
  font-size:9px; color:var(--ink4); text-align:center;
}
.witem .wm{flex:1; min-width:0}
.witem .wn{font-size:13px; font-weight:650; line-height:1.35; color:var(--ink)}
.witem .wd{font-size:11px; color:var(--ink3); margin-top:2px}
/* ⭐ §115：待下清单的「mteam 落盘了几集」汇总 —— 蛙哥要「一眼看出该下哪个」 */
.wq{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-top:5px}
.wq b{font-size:11.5px; font-weight:700; color:var(--ok-ink); background:var(--ok-soft);
      padding:2px 7px; border-radius:999px}
.wq span{font-family:var(--mono); font-size:10.5px; color:var(--ink3)}
.wq em{font-style:normal; font-size:10.5px; color:var(--info-ink); background:var(--info-soft);
       padding:2px 7px; border-radius:999px}
.wq.none{font-size:11px; color:var(--ink4)}
.witem .wacts{display:flex; flex-direction:column; gap:5px; flex:0 0 auto}
.witem .wact{
  font-size:11px; font-weight:650; padding:4px 9px; border-radius:7px;
  border:1px solid var(--line2); color:var(--ink2); white-space:nowrap;
}
.witem .wact:hover{border-color:var(--ink3)}
.witem .wact.ok{color:var(--ok-ink); border-color:rgba(14,159,110,.35); background:var(--ok-soft)}
.witem.done{opacity:.62}
.witem.done .wn{text-decoration:line-through; text-decoration-color:var(--ink4)}
.wtag{
  display:inline-block; font-size:9.5px; font-weight:800; padding:1px 6px;
  border-radius:5px; margin-left:6px; vertical-align:1.5px;
}
.wtag.want{background:var(--rose-soft); color:var(--rose-ink)}
.wtag.done{background:var(--ok-soft); color:var(--ok-ink)}

/* 扫描按钮的忙碌态 */
.safebtn.busy{pointer-events:none; opacity:.7}
.safebtn.busy .spin{
  width:11px; height:11px; border-radius:50%;
  border:2px solid var(--brand-soft); border-top-color:var(--brand);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 待下视图的空态 / 概览 ─────────────────────────────────────── */
.wanthero{
  display:flex; align-items:center; gap:14px; margin:0 0 22px;
  padding:16px 18px; border-radius:var(--r-l);
  background:linear-gradient(120deg,var(--rose-soft) 0%,var(--surface) 62%);
  border:1px solid rgba(212,83,126,.22);
}
.wanthero .wi{
  width:38px; height:38px; border-radius:11px; flex:0 0 auto;
  background:var(--rose); color:#fff; display:flex; align-items:center; justify-content:center;
}
.wanthero h2{font-size:17px; font-weight:770; letter-spacing:-.02em}
.wanthero p{font-size:12px; color:var(--ink2); margin-top:2px}
.wanthero .wstat{margin-left:auto; display:flex; gap:18px; text-align:right}
.wanthero .wstat b{display:block; font-size:19px; font-weight:770; letter-spacing:-.02em}
.wanthero .wstat span{font-size:10.5px; color:var(--ink3)}

/* ── 移动端（≤900px）：吸顶区允许两行，年份轨道横滚 ────────────── */
@media (max-width:900px){
  .stickywrap .top-row1{padding:8px 12px 4px; gap:8px; flex-wrap:wrap}
  .stickywrap .statstrip{display:none}
  .stickywrap .trackwrap{padding:0 8px 6px}
  .stickywrap .bar{padding:6px 12px 7px; gap:6px; overflow-x:auto; scrollbar-width:none}
  .stickywrap .bar::-webkit-scrollbar{display:none}
  .stickywrap .bar .hint{display:none}
  .filterpanel{padding:12px 12px 14px}
  .flabel{flex:0 0 auto}
  main{padding:16px 12px 60px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:14px 10px}
}

/* ── 批量条里的三动作：深色胶囊内必须提高特异性才盖得住 #bselbar button ── */
#bselbar .bsel-act{
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.26);
  color:#fff; border-radius:999px; font-size:12px; padding:7px 13px;
  display:inline-flex; align-items:center; gap:6px;
}
#bselbar .bsel-act:hover:not(:disabled){background:rgba(255,255,255,.22); border-color:rgba(255,255,255,.4)}
#bselbar .bsel-act:disabled{opacity:.38}
#bselbar .bsel-act.ok{background:rgba(14,159,110,.28); border-color:rgba(14,159,110,.6); color:#B8F1DA}
#bselbar .bsel-act.want{background:rgba(212,83,126,.28); border-color:rgba(212,83,126,.62); color:#FFD3E1}
#bselbar .bsel-act.bad{background:rgba(220,43,43,.26); border-color:rgba(220,43,43,.6); color:#FFC9C9}
#bselbar .bsel-sep{background:rgba(255,255,255,.2)}

/* ── §80 补丁：窄屏与触摸设备的兜底 ─────────────────────────────
   ① 用户的屏幕约 1220-1300 CSS px ⇒ 工具栏 9 个控件加 hint 会溢出
      ⇒ <1420px 直接藏 hint（口径说明已挪进筛选面板底部，不丢信息）
   ② 触摸设备没有 hover ⇒ ♥ 必须常驻，否则平板上根本看不见这个功能 */
@media (max-width:1420px){
  .stickywrap .bar .hint{display:none}
  .stickywrap .bar .search{flex:0 0 190px; max-width:190px}
}
@media (max-width:1240px){
  .stickywrap .bar{padding-bottom:9px}
  .stickywrap .bar .search{flex:0 0 160px; max-width:160px}
  .stickywrap .tstat{padding:0 9px}
  .stickywrap .tstat b{font-size:15px}
}
@media (hover:none){
  .card .wantbtn{opacity:1; transform:scale(1)}
}

/* ═══════════════════════════════════════════════════════════════════════
   §81 入库检测 · 二级看板（2026-10-29 蛙哥「很简陋」⇒ 重做）
   ---------------------------------------------------------------------
   结构：封面 + 名/原名/芯片 → 结论卡 → 四个数字 → 缺集徽章 → 已排除徽章
        → 分季进度 → 路径 → 操作
   逐集页签：按季分组，每集一行（集号 / 集名 / 播出日 / 状态 / 排除或恢复）
   ⚠️ 全部用既有 CSS 变量，⛔ 不引入新的色值体系（0cp 样式只有一个事实来源）
   ═══════════════════════════════════════════════════════════════════════ */
.idtl-hero{display:flex; gap:16px; align-items:flex-start; margin-bottom:4px}
.idtl-ph{width:104px; height:156px; border-radius:var(--r-s); object-fit:cover;
  background:var(--surface-3); flex:0 0 auto; box-shadow:var(--sh-1)}
.idtl-ph.none{display:flex; align-items:center; justify-content:center; text-align:center;
  font-size:11px; color:var(--ink4); padding:8px; line-height:1.4}
.idtl-info{flex:1; min-width:0}
.idtl-name{font-size:var(--fs-md); font-weight:750; letter-spacing:-.01em; line-height:1.35}
.idtl-orig{color:var(--ink3); font-size:var(--fs-xx); margin-top:3px; overflow-wrap:anywhere}
.idtl-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
.idtl-chips span{font-family:var(--mono); font-size:11px; color:var(--ink2);
  background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:2px 9px}

.istat{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:14px 0 2px}
.istat-i{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-s);
  padding:9px 6px; text-align:center}
.istat-i b{display:block; font-size:19px; font-weight:750; letter-spacing:-.02em; line-height:1.2}
.istat-i span{font-size:11px; color:var(--ink3)}
.istat-i.ok b{color:var(--ok-ink)}
.istat-i.bad b{color:var(--bad-ink)}
.istat-i.ex b{color:var(--purple-ink)}

.ibadges{display:flex; flex-wrap:wrap; gap:6px; margin:7px 0}
.ibadge{font-family:var(--mono); font-size:11.5px; padding:2.5px 8px; border-radius:var(--r-xs)}
.ibadge.bad{background:var(--bad-soft); color:var(--bad-ink)}
.ibadge.ex{background:var(--purple-soft); color:var(--purple-ink)}
.ihint{font-size:12px; color:var(--ink3); margin-top:5px; line-height:1.6}
.ihint.ok{color:var(--ok-ink)}

.iseason{border:1px solid var(--line); border-radius:var(--r-m); overflow:hidden;
  margin-bottom:12px; background:var(--surface)}
.isghd{display:flex; align-items:center; gap:9px; padding:9px 13px;
  background:var(--surface-2); border-bottom:1px solid var(--line); font-size:12.5px}
.isgnum{font-family:var(--mono); color:var(--ink3)}
.isgbadge{margin-left:auto; font-size:11.5px; padding:2px 9px; border-radius:999px;
  background:var(--surface-3); color:var(--ink2); white-space:nowrap}
.isgbadge.ok{background:var(--ok-soft); color:var(--ok-ink)}
.isgbadge.part{background:var(--warn-soft); color:var(--warn-ink)}
.isgbadge.bad{background:var(--bad-soft); color:var(--bad-ink)}
.isgbadge.ex{background:var(--purple-soft); color:var(--purple-ink)}

/* §83 放大剧照后行高跟着长，内边距和间距同步放宽，否则图贴着上一行显得挤 */
.iep{display:flex; align-items:center; gap:12px; padding:10px 13px;
  border-bottom:1px solid var(--line)}
.iep:last-child{border-bottom:0}
.iepno{font-family:var(--mono); font-size:11.5px; color:var(--ink3); flex:0 0 62px}
.iepmain{flex:1; min-width:0}
.iepname{font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.iepmeta{font-size:11px; color:var(--ink3); font-family:var(--mono)}
.ieptag{font-size:11px; padding:1.5px 7px; border-radius:999px; flex:0 0 auto; white-space:nowrap}
.ieptag.ok{background:var(--ok-soft); color:var(--ok-ink)}
.ieptag.bad{background:var(--bad-soft); color:var(--bad-ink)}
.ieptag.ex{background:var(--purple-soft); color:var(--purple-ink)}
.iepact{font-size:11.5px; padding:3px 9px; border:1px solid var(--line2);
  border-radius:var(--r-xs); color:var(--ink2); background:var(--surface); flex:0 0 auto}
.iepact:hover{border-color:var(--brand); color:var(--brand-ink); background:var(--brand-soft)}
.iepact.restore{color:var(--purple-ink); border-color:var(--purple-soft); background:var(--purple-soft)}
.iep.miss .iepname{color:var(--bad-ink)}
.iep.ex{background:var(--surface-2)}
.iep.ex .iepname{color:var(--ink4); text-decoration:line-through}

/* ══ §82 逐集对照：源站列 + 五档结论 ═════════════════════════════════
   蛙哥 2026-10-29：「我希望看到 tmdb 有哪些集数、已经有哪几集、还缺哪几集、
   hanime 有没有对应的集数」⇒ 一行里同时给出这四件事。 */
.iepsrc{
  flex:0 0 78px; text-align:center; font-family:var(--mono); font-size:11px;
  padding:1.5px 6px; border-radius:var(--r-xs); white-space:nowrap;
  transition:background .14s var(--ease), color .14s var(--ease);
}
.iepsrc.on{background:var(--info-soft); color:var(--info-ink)}
.iepsrc.on:hover{background:var(--info); color:#fff}
.iepsrc.off{color:var(--ink4)}

.ieptag.mute{background:var(--surface-3); color:var(--ink3)}
.ieptag.info{background:var(--info-soft); color:var(--info-ink)}
.ieptag.warn{background:var(--warn-soft); color:var(--warn-ink)}

/* 未播出：整行压暗一档，跟「缺」区分开 —— 缺是你的任务，未播出是日历的事 */
.iep.future{background:#FBFCFE}
.iep.future .iepname{color:var(--ink3)}
.iep.future .iepno{color:var(--ink4)}

/* 五个数字卡时不能还固定四列 */
.istat{grid-template-columns:repeat(auto-fit,minmax(108px,1fr))}
.istat-i.mute b{color:var(--ink3)}
.istat-i.ex b{color:var(--purple-ink)}
.ibadge.mute{background:var(--surface-3); color:var(--ink3)}
.isgbadge.mute{background:var(--surface-3); color:var(--ink3); margin-left:6px}
.isrc{font-size:12.5px; color:var(--ink2); line-height:1.7}
.isrc b{color:var(--ink); font-weight:700}

.iseason-mini{display:flex; flex-direction:column; gap:8px; margin-top:7px}
.isgm{display:grid; grid-template-columns:100px 110px 1fr; align-items:center; gap:10px; font-size:12px}
.isgm-n{color:var(--ink2)}
.isgm-v{font-family:var(--mono); color:var(--ink3)}
.isgm-v i{font-style:normal; color:var(--purple-ink)}
.isgm-bar{height:6px; background:var(--surface-3); border-radius:999px; overflow:hidden}
.isgm-bar i{display:block; height:100%;
  background:linear-gradient(90deg, var(--ok) 0%, #3FC08F 100%)}

.iact{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; padding-top:12px;
  border-top:1px dashed var(--line)}
.iact-b{padding:7px 14px; border-radius:var(--r-s); border:1px solid var(--line2);
  font-size:12.5px; background:var(--surface)}
.iact-b:hover{border-color:var(--ink); color:var(--ink)}
.iact-b.want{color:var(--rose-ink); border-color:var(--rose); background:var(--rose-soft)}
.iact-b.want.on{opacity:.55; cursor:default}
.imono{font-family:var(--mono); font-size:11px; overflow-wrap:anywhere}

/* ══ §83 逐集剧照（蛙哥：用图大致判断真剧集还是假剧集）═══════════════════
   真剧集 TMDB 一般有剧照；虚构的 Special 常常一张都没有。
   ⚠️ 只是辅助证据 —— 房东小姐的 S00 两集也有图，但它们是假的（蛙哥人工判断过）。
   🔴 安全模式 blur/hide 档不渲染 <img>，只留占位块（隐私铁律：宁可不显示，也不传了再遮）。 */
/* ⭐ 2026-10-29（蛙哥：「图太小了，看不清，再放大一点」）：64×36 → 160×90（2.5 倍）。
   64 宽时只能看出「有色块/没色块」，看不出画面内容 ⇒ 判不了真假；
   抽屉宽 1720px，行里有富余，取 160（约为 TMDB 原图 300 宽的一半）能看清人物和构图。
   ⛔ 再大就会把集名那一列挤窄、清单也被拉长到要翻好几屏。 */
.iepst{
  flex:0 0 160px; width:160px; height:90px; border-radius:6px; overflow:hidden;
  background:var(--surface-3); border:1px solid var(--line2); position:relative;
}
.iepst a{display:block; width:100%; height:100%}
.iepst img{width:100%; height:100%; object-fit:cover; display:block}
/* 悬停给一点「可点」的反馈 —— 点开是新窗口里的原图，比抽屉里再放大省事 */
.iepst a:hover img{opacity:.86}
.iepst.none::after{
  content:'无图'; position:absolute; inset:0; display:flex; align-items:center;
  justify-content:center; font-size:12px; color:var(--ink4); letter-spacing:.4px;
}
/* 已排除的行整行压暗，剧照也跟着退一档，避免「灰行里一张亮图」抢眼 */
.iep.ex .iepst{opacity:.5}

/* Special 在源站没有集号可言 ⇒ 结论单列一档，⛔ 不与「源站未收录」混说 */
.ieptag.na{background:var(--surface-3); color:var(--ink4)}

/* ── 轻提示 toast（2026-10-29 §85）────────────────────────────
   ⭐ 为什么不用原生 alert：alert 会**阻塞浏览器主线程** ⇒ 页面假死，
   自动化测试也读不到响应（实测 CDP socket 直接超时）。
   ⇒ 下载/重抓这类「慢但可预期」的操作一律用 toast。 */
#toastBox{
  position:fixed; right:18px; bottom:18px; z-index:9999;
  display:flex; flex-direction:column; gap:8px; align-items:flex-end;
  pointer-events:none; max-width:min(460px, 80vw);
}
.toastitem{
  pointer-events:auto; font-size:12.5px; line-height:1.5;
  padding:9px 13px; border-radius:var(--r-sm, 6px);
  background:var(--surface); color:var(--ink);
  border:1px solid var(--line2);
  box-shadow:0 6px 20px rgba(10,16,32,.13);
  animation:toastIn .2s var(--ease, ease);
  white-space:pre-wrap; word-break:break-word;
}
.toastitem.ok{background:var(--ok-soft); color:var(--ok-ink); border-color:transparent}
.toastitem.bad{background:var(--bad-soft); color:var(--bad-ink); border-color:transparent}
.toastitem.warn{background:var(--warn-soft); color:var(--warn-ink); border-color:transparent}
.toastitem.info{background:var(--info-soft); color:var(--info-ink); border-color:transparent}
.toastitem.out{opacity:0; transform:translateY(6px); transition:.28s ease}
@keyframes toastIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

/* ── 入库检测 · 逐集下载区（2026-10-29 §85）────────────────────
   🔴 为什么这段在 css 事实来源里而不是 index.html：
   index.html 的 <style> 块是本文件的**快照**（由 _splice_main_style.py 注入），
   直接改 index.html 里的样式 ⇒ 下次跑拼接就被冲掉 ⇒ 样式凭空消失。
   （2026-10-29 本轮真踩过：iepq / iepdlbtn 就是这么没的。） */
.iepq{
  font-family:var(--mono); font-size:10.5px; padding:1.5px 5px;
  border-radius:var(--r-xs); background:var(--surface-3); color:var(--ink2);
  white-space:nowrap; font-weight:600;
}
.iepq.hd{background:#E7F3EC; color:#0E6B4A}
.iepq.sd{background:var(--surface-3); color:var(--ink3)}
.iepq.exp{background:var(--bad-soft); color:var(--bad-ink)}
/* 源站写死的速率上限（youjizz `rate=NNNNNN`）—— 告诉用户「慢是源站限速」 */
.iepq.rate{background:var(--warn-soft); color:var(--warn-ink); font-weight:500}
.iepdlbtn{
  font-size:11px; padding:2.5px 8px; border:1px solid var(--line2);
  border-radius:var(--r-xs); background:var(--surface); color:var(--ink2);
  cursor:pointer; white-space:nowrap; transition:.14s var(--ease);
}
.iepdlbtn:hover{border-color:var(--brand); color:var(--brand-ink); background:var(--brand-soft)}
.iepdlbtn:disabled{opacity:.55; cursor:default}
.iepdlbtn.done{background:var(--ok-soft); color:var(--ok-ink); border-color:transparent}
.iepdlbtn.fail{background:var(--bad-soft); color:var(--bad-ink); border-color:transparent}
.iepdlbtn.run{background:var(--info-soft); color:var(--info-ink); border-color:transparent}
/* 签名过期 —— 可点的一键重抓（TTL ~11h，过期是常态不是意外） */
.iepdlbtn.exp{background:var(--warn-soft); color:var(--warn-ink); border-color:transparent}
.iepdlhint{font-size:10.5px; color:var(--ink4); font-family:var(--mono); white-space:nowrap}

/* ── §86 链接健康页 + 链接详情弹层（2026-10-30）─────────────────
   🔴 蛙哥：「我需要确定后期抓的剧集和下载链接是真的落地到看板」
   ⇒ 新增一个「链接健康」视图页（验收器）+ 逐集点画质徽章看完整链接。 */

/* KPI 数字块 */
.lh-kpis{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(112px,1fr));
  gap:9px; margin-bottom:14px;
}
.lh-kpi{
  background:var(--surface-2); border:1px solid var(--line2);
  border-radius:var(--r-s); padding:10px 12px; display:flex;
  flex-direction:column; gap:2px;
}
.lh-kpi b{font-size:19px; font-weight:760; color:var(--ink); letter-spacing:-.02em; line-height:1.15}
.lh-kpi span{font-size:10.5px; color:var(--ink4)}
.lh-kpi.ok b{color:var(--ok-ink)}
.lh-kpi.ok{background:var(--ok-soft); border-color:rgba(14,159,110,.22)}
.lh-kpi.warn b{color:var(--warn-ink)}
.lh-kpi.warn{background:var(--warn-soft); border-color:rgba(192,120,0,.22)}
.lh-kpi.bad b{color:var(--bad-ink)}
.lh-kpi.bad{background:var(--bad-soft); border-color:rgba(220,43,43,.22)}

/* 新鲜度小表 */
.lh-fresh{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr));
  gap:7px 18px; margin-bottom:12px;
}
.lh-freshitem{display:flex; align-items:baseline; gap:8px; font-size:12px}
.lh-fk{color:var(--ink4); font-size:11px; min-width:88px; flex:0 0 auto}
.lh-fv{color:var(--ink2); font-weight:600}
.lh-fv em{font-style:normal; font-weight:400; color:var(--ink4); font-size:11px}

/* 抓取时间线 */
.lh-tl{display:flex; flex-direction:column; gap:5px}
.lh-tlrow{display:flex; align-items:center; gap:10px; font-size:12px}
.lh-tlday{font-family:var(--mono); font-size:11px; color:var(--ink3); min-width:78px; flex:0 0 auto}
.lh-tlbar{flex:1 1 auto; height:9px; background:var(--surface-3); border-radius:999px; overflow:hidden}
.lh-tlbar i{display:block; height:100%; background:var(--ok); border-radius:999px}
.lh-tln{font-family:var(--mono); font-size:11px; color:var(--ink3); min-width:64px; text-align:right; flex:0 0 auto}
.set-count{
  font-family:var(--mono); font-size:11px; font-weight:600;
  background:var(--surface-3); color:var(--ink3);
  padding:1px 7px; border-radius:999px;
}

/* ── 链接详情弹层（点画质徽章弹出来）──────────────────────────── */
.lnkmodal{
  position:fixed; inset:0; z-index:220; display:none;
  align-items:center; justify-content:center; padding:20px;
  background:rgba(10,16,32,.5); backdrop-filter:blur(3px);
}
.lnkmodal.on{display:flex}
.lnkmodal-box{
  background:var(--surface); border:1px solid var(--line2);
  border-radius:var(--r-m); padding:16px 18px; width:min(760px, 94vw);
  max-height:86vh; overflow:auto; box-shadow:0 24px 60px -22px rgba(10,16,32,.5);
}
.lnkmodal-box h4{margin:0 0 10px; font-size:14px; font-weight:750; color:var(--ink); display:flex; align-items:center; gap:8px}
.lnkmodal-kv{
  display:grid; grid-template-columns:84px 1fr; gap:5px 10px;
  font-size:12px; margin-bottom:12px;
}
.lnkmodal-kv dt{color:var(--ink4); font-size:11px}
.lnkmodal-kv dd{margin:0; color:var(--ink2); font-weight:600; word-break:break-all}
.lnkmodal-url{
  font-family:var(--mono); font-size:11px; line-height:1.6;
  background:var(--surface-2); border:1px solid var(--line2);
  border-radius:var(--r-s); padding:9px 11px; color:var(--ink2);
  word-break:break-all; user-select:all; margin-bottom:12px;
}
.lnkmodal-acts{display:flex; gap:8px; flex-wrap:wrap}
.lnkmodal-acts button{
  font:inherit; font-size:12px; font-weight:650; cursor:pointer;
  padding:5px 12px; border-radius:var(--r-s);
  border:1px solid var(--line2); background:var(--surface-2); color:var(--ink2);
  transition:.14s var(--ease);
}
.lnkmodal-acts button:hover{border-color:var(--brand); color:var(--brand-ink); background:var(--brand-soft)}
.lnkmodal-acts button.primary{background:var(--brand); border-color:var(--brand); color:#fff}
.lnkmodal-acts button.primary:hover{opacity:.88}

/* ══════════════════════════════════════════════════════════════════
   ⭐ §88（2026-10-30）下载中心
   —— 蛙哥：「能否做进 8848 看板，下载进度能否看见」
   ⇒ 队列 + 逐集进度条 + 通道（直连/代理）+ 流量统计
   ══════════════════════════════════════════════════════════════════ */
.dl-kpis{
  display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:16px 0 18px;
}
@media(max-width:720px){.dl-kpis{grid-template-columns:repeat(2,1fr)}}
.dl-kpi{
  border:1px solid var(--line2); border-radius:var(--r-m);
  background:var(--surface-2); padding:12px 14px;
}
.dl-kpi b{display:block; font-size:22px; font-weight:760; color:var(--ink); letter-spacing:-.02em; line-height:1.2}
.dl-kpi span{display:block; font-size:11px; color:var(--ink4); margin-top:3px}
.dl-kpi.run b{color:var(--info-ink)}
.dl-kpi.ok b{color:var(--ok-ink)}
.dl-kpi.bad b{color:var(--bad-ink)}

/* ⭐ §90 下载通道切换（仅直连 / 直连失败再代理 / 仅代理）
   🔴 蛙哥的机场只有 15G/月，一集 500MB ⇒ 默认「仅直连」，
      这个开关存在的意义是：万一 CDN 把直连 IP 全拒了，能手动开一下救场，
      而不是让代码自己偷偷烧流量。 */
.dl-chanmode{
  display:flex; align-items:center; flex-wrap:wrap; gap:6px;
  margin:0 0 16px; padding:8px 10px;
  border:1px solid var(--line2); border-radius:var(--r-m);
  background:var(--surface-2, #F7F9FC);
}
.dl-chanmode .cm-lbl{
  font-size:12px; font-weight:700; color:var(--ink3); margin-right:2px;
}
.cm-btn{
  appearance:none; cursor:pointer;
  padding:5px 11px; border-radius:99px;
  border:1px solid var(--line2); background:var(--surface);
  font:inherit; font-size:12px; color:var(--ink2);
  transition:border-color .15s, background .15s, color .15s;
}
.cm-btn:hover{border-color:var(--brand); color:var(--brand-ink)}
.cm-btn.on{
  background:var(--brand-soft); border-color:var(--brand);
  color:var(--brand-ink); font-weight:700;
}
.cm-btn:disabled{opacity:.5; cursor:default}
.dl-chanmode .cm-note{
  margin-left:auto; font-size:11px; color:var(--ink4);
}
.dl-chanmode .cm-note b{color:var(--ink3); font-weight:700}
@media(max-width:720px){
  .dl-chanmode .cm-note{margin-left:0; flex-basis:100%}
}

/* 通道流量条 —— 一眼看出机场烧了多少 */
.dl-chs{margin:6px 0 20px; display:flex; flex-direction:column; gap:7px}
.dl-chrow{display:flex; align-items:center; gap:10px; font-size:12px}
.dl-chname{
  flex:0 0 84px; font-weight:700; color:var(--ink2);
  display:flex; align-items:center; gap:5px;
}
.dl-chbar{
  flex:1; height:9px; border-radius:99px; background:var(--surface-3, #EEF1F6);
  overflow:hidden; min-width:60px;
}
.dl-chbar i{display:block; height:100%; border-radius:99px; background:var(--ok)}
.dl-chrow.proxy .dl-chbar i{background:var(--warn)}
.dl-chval{flex:0 0 auto; color:var(--ink3); font-variant-numeric:tabular-nums}
.dl-chval em{color:var(--ink4); font-style:normal}

/* 队列 */
.dl-list{display:flex; flex-direction:column; gap:8px}
.dl-empty{
  padding:26px 0; text-align:center; color:var(--ink4); font-size:13px;
}
.dl-row{
  border:1px solid var(--line2); border-radius:var(--r-m);
  background:var(--surface); padding:10px 12px;
}
.dl-row.running{border-color:rgba(79,70,229,.34); background:var(--brand-soft)}
.dl-row.failed{border-color:rgba(220,38,38,.28)}
.dl-hd{display:flex; align-items:center; gap:8px; margin-bottom:7px}
.dl-ti{
  flex:1; font-size:13px; font-weight:650; color:var(--ink);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.dl-st{
  flex:0 0 auto; font-size:10.5px; font-weight:700; padding:2px 8px;
  border-radius:99px; background:var(--surface-2); color:var(--ink3);
  border:1px solid var(--line2);
}
.dl-st.running{background:var(--info-soft); color:var(--info-ink); border-color:transparent}
.dl-st.done{background:var(--ok-soft); color:var(--ok-ink); border-color:transparent}
.dl-st.failed{background:var(--bad-soft); color:var(--bad-ink); border-color:transparent}
.dl-bar{
  height:7px; border-radius:99px; background:var(--surface-3, #EEF1F6);
  overflow:hidden; display:flex;
}
.dl-bar i{display:block; height:100%; background:var(--brand); border-radius:99px; transition:width .5s linear}
.dl-bar.done i{background:var(--ok)}
.dl-bar.failed i{background:var(--bad)}
.dl-bar.indet i{
  width:35% !important; background:linear-gradient(90deg,transparent,var(--brand),transparent);
  animation:dlslide 1.1s ease-in-out infinite;
}
@keyframes dlslide{0%{margin-left:-35%}100%{margin-left:100%}}
.dl-meta{
  display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;
  font-size:11px; color:var(--ink4); font-variant-numeric:tabular-nums;
}
.dl-meta b{color:var(--ink2); font-weight:650}
.dl-meta .ch{color:var(--brand-ink); font-weight:650}
.dl-meta .ch.direct{color:var(--ok-ink)}
.dl-meta .err{color:var(--bad-ink)}
.dl-rowact{display:flex; gap:6px; margin-top:8px}
.dl-rowact button{
  font:inherit; font-size:11px; font-weight:650; cursor:pointer;
  padding:4px 10px; border-radius:var(--r-s);
  border:1px solid var(--line2); background:var(--surface-2); color:var(--ink2);
  transition:.14s var(--ease);
}
.dl-rowact button:hover{border-color:var(--brand); color:var(--brand-ink); background:var(--brand-soft)}
.dl-toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px}
.dl-toolbar .sp{flex:1}

/* ⭐ §89 签名到期倒计时横幅 —— 3548 条是同一批抓的，会在同一分钟集体失效。
   与其等过期后显示一片红，不如提前喊「还有 N 分钟」，并说清「下载会自动重抓」。 */
.lh-alert{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin:14px 0 4px; padding:11px 14px;
  border:1px solid var(--line2); border-left:3px solid var(--info);
  border-radius:var(--r-s); background:var(--surface-2);
  font-size:12.5px; color:var(--ink2); line-height:1.5;
}
.lh-alert b{color:var(--ink); font-weight:720}
.lh-alert.warn{border-left-color:var(--warn); background:var(--warn-soft)}
.lh-alert.bad{border-left-color:var(--bad); background:var(--bad-soft)}
.lh-alert .lh-alert-x{color:var(--ink3)}
.lh-alert .lh-alert-x b{color:var(--brand-ink)}

/* ⭐ §89 修正：`.lkat` 系列徽章（待下卡片的「直链 N/M」「已下 N」）
   🔴 这是 §87 遗留漏洞 —— 当时把样式写进了 index.html 的 <style>，
      被 _splice_main_style.py 整段覆盖掉（0cp 铁律：css 文件才是事实源），
      结果徽章三个月来一直是**裸 span**，跟着副标题字号显示，根本不是徽章。 */
.lkat{
  display:inline-flex; align-items:center; gap:3px;
  font-size:10px; font-weight:700; padding:1px 6px; border-radius:99px;
  border:1px solid var(--line2); background:var(--surface-2); color:var(--ink3);
  margin-left:5px; vertical-align:middle; white-space:nowrap;
  letter-spacing:.01em;
}
.lkat.ok{background:var(--ok-soft); color:var(--ok-ink); border-color:transparent}
.lkat.warn{background:var(--warn-soft); color:var(--warn-ink); border-color:transparent}
.lkat.none{background:transparent; color:var(--ink4); border-style:dashed}
.lkat.dl{background:var(--brand-soft); color:var(--brand-ink); border-color:transparent}

/* ══════════════════════════════════════════════════════════════════
   ⭐ §89（2026-10-30）封面左上角徽章堆 + 逐集对照的直链徽章
   —— 这两块样式是 §87 加的，但当时写进了 index.html 的 <style>，
      被 _splice_main_style.py 整段覆盖掉了（0cp 铁律：css 文件才是事实源）。
      后果肉眼可见：① 泡麵番又飘回右上角 ② 直链徽章变成裸按钮。
   ══════════════════════════════════════════════════════════════════ */

/* ① 左上角纵向容器：来源徽标 → 泡麵番，依次往下排 */
.poster .tlb{
  position:absolute; top:8px; left:8px; z-index:2;
  display:flex; flex-direction:column; align-items:flex-start; gap:4px;
  max-width:calc(100% - 42px);   /* 给右上角的 ♥ 留出位置，长徽标挤不进去 */
  pointer-events:none;           /* 容器不吃鼠标，避免挡住整张卡片的点击 */
}
/* 徽章回到「跟着容器走」的普通流布局（⛔ 不能留 absolute，否则又回到角落） */
.poster .tlb .srcbadge.sm{
  position:static; inset:auto;
  backdrop-filter:blur(8px); pointer-events:auto;
  max-width:100%; overflow:hidden; text-overflow:ellipsis;
}
/* 显式兜一层：万一别处还有 `.srcbadge.sm.pm{top/right}` 的旧规则，这里压掉 */
.poster .tlb .srcbadge.sm.pm{top:auto; right:auto; left:auto; bottom:auto}

/* ② 逐集对照表里每一条源条目后面的「直链画质」徽章
      （可点开看完整 URL / 复制 / 重抓；⛔ m3u8 和无链接只显示文字，不给假希望） */
.aln-lk{
  display:inline-flex; align-items:center; gap:3px;
  font:inherit; font-size:9.5px; font-weight:700; font-family:var(--mono);
  padding:1px 5px; margin-left:5px; border-radius:var(--r-xs);
  border:1px solid transparent; white-space:nowrap; vertical-align:1px;
  cursor:pointer; transition:.14s var(--ease);
  background:var(--surface-3); color:var(--ink2); line-height:1.45;
}
.aln-lk.hd{background:var(--ok-soft); color:var(--ok-ink); border-color:rgba(14,159,110,.26)}
.aln-lk.sd{background:var(--info-soft); color:var(--info-ink); border-color:rgba(47,127,216,.24)}
.aln-lk.exp{background:var(--warn-soft); color:var(--warn-ink); border-color:rgba(192,120,0,.28)}
.aln-lk.na{
  background:transparent; color:var(--ink4);
  border-color:var(--line2); border-style:dashed; cursor:default;
}
.aln-lk:not(.na):hover{filter:brightness(.96); box-shadow:var(--sh-1)}
.aln-lk:not(.na):active{transform:translateY(.5px)}
/* ⭐ §116（2026-11-01 蛙哥「下载按钮无法获取视频大小吗」）：源侧这一集的真实体积。
   🔴 刻意**不做成按钮**：它是事实，不是操作入口（点它没有任何事发生会让人困惑）。
   🔴 也刻意跟画质徽章**分开**：链接过期时按钮变「需重抓」，但大小仍然有效
      （文件不会自己变大变小）—— 合进按钮就会连有用信息一起变灰。 */
.aln-sz{
  display:inline-block; margin-left:4px; vertical-align:1px;
  font-family:var(--mono); font-size:9.5px; font-weight:600;
  color:var(--ink3); white-space:nowrap;
}

/* ⭐ §89：入库检测逐集行的「下载」格子（§87 把下载列挪到 hanime 旁边后新加的容器）
   ⛔ 缺这条就是默认 block ⇒ 下载按钮被挤到下一行，「hanime → 下载」的并排关系就断了。
   固定宽度让每一行的下载列左边界对齐，扫下来不会左右跳。 */
.iepdl{
  display:flex; align-items:center; gap:4px; flex-wrap:wrap;
  flex:0 0 92px; width:92px;
}

/* ══════════════════════════════════════════════════════════════════
   ⭐ §91（2026-10-30）待下页「一条龙 / 入库」按钮 + 进行中进度条
   —— 蛙哥要的「抓取 → 下载 → 刮削 → 入库 一条龙」的入口。
   🔴 样式必须写在这个文件（0cp 铁律）：index.html 的 <style> 会被
      _splice_main_style.py 整段覆盖，§87 就是在那里丢的。
   ══════════════════════════════════════════════════════════════════ */

/* 「入库 N」徽章 —— 与「已下 N」用不同色，避免两个数字混成同一个概念 */
.lkat.ing{background:var(--ok-soft); color:var(--ok-ink); border-color:transparent}

/* 卡片底部两动作（只在待下页渲染，见 wantActions()） */
.wact{display:flex; align-items:center; gap:6px; margin-top:7px; flex-wrap:wrap}
.wactb{
  display:inline-flex; align-items:center; gap:4px;
  font-size:11px; font-weight:700; padding:4px 9px;
  border-radius:99px; border:1px solid var(--line2);
  background:var(--surface-2); color:var(--ink2);
  cursor:pointer; white-space:nowrap; font-family:inherit;
  transition:background .15s, border-color .15s, color .15s;
}
.wactb b{font-weight:800}
.wactb:hover:not(:disabled){border-color:var(--brand); color:var(--brand-ink); background:var(--brand-soft)}
.wactb.go{background:var(--brand); border-color:var(--brand); color:#fff}
.wactb.go:hover:not(:disabled){background:var(--brand-2); border-color:var(--brand-2); color:#fff}
.wactb:disabled{opacity:.5; cursor:default}
.wactb.busy{opacity:.8}
.wacthint{font-size:10px; color:var(--ink4); white-space:nowrap}

/* 进行中进度条（读 /api/dl/ingest/active 的真实数字） */
.wprog{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin:-8px 0 20px; padding:9px 14px; border-radius:var(--r-m);
  background:var(--surface-2); border:1px solid var(--line2);
  font-size:11.5px; color:var(--ink2);
}
.wprog[hidden]{display:none}
.wprogt{font-size:10px; font-weight:800; letter-spacing:.06em; color:var(--ink4)}
.wprogi{display:inline-flex; align-items:center; gap:5px}
.wprogi i{font-style:normal; font-weight:700; color:var(--ink)}
.wprogi b{font-weight:800; color:var(--brand-ink)}
.wbad{color:var(--bad-ink); font-weight:700}
.wdot{width:6px; height:6px; border-radius:50%; background:var(--brand); animation:wdotpulse 1.1s infinite}
@keyframes wdotpulse{0%,100%{opacity:.25} 50%{opacity:1}}

/* ══════════════════════════════════════════════════════════════════
   ⭐ §93 刮削中心（2026-10-30 蛙哥：刮削要能在看板看到进度）
   一条「这一集走到哪一步」的八格进度条 + 队列 + 记录。
   🔴 样式只写这里（css 文件是事实源），⛔ 不写 index.html 的 <style>
      —— 那个是快照，会被 _splice_main_style.py 整体冲掉（§85 踩过）。
   ══════════════════════════════════════════════════════════════════ */
.sc-wrap{display:flex; flex-direction:column; gap:15px; padding-bottom:44px}

/* ── 当前任务卡 ─────────────────────────────────────────────── */
.sc-now{
  border:1px solid var(--line2); border-radius:var(--r-l);
  background:var(--surface); padding:13px 15px 14px;
}
.sc-now.run{border-color:rgba(79,70,229,.34); background:var(--brand-soft)}
.sc-now-hd{display:flex; align-items:baseline; gap:9px; margin-bottom:10px; flex-wrap:wrap}
.sc-now-t{font-size:13px; font-weight:700; color:var(--ink)}
.sc-now-tm{margin-left:auto; font-size:11.5px; color:var(--ink4); font-variant-numeric:tabular-nums}
.sc-now-sub{font-size:11.5px; color:var(--ink2); margin-top:9px; line-height:1.55}
.sc-now-sub b{color:var(--ink); font-weight:700}
.sc-pulse{
  display:inline-block; width:7px; height:7px; border-radius:50%;
  background:var(--brand); margin-right:6px; vertical-align:middle;
  animation:wdotpulse 1.1s infinite;
}

/* ── 八格步骤条 ─────────────────────────────────────────────── */
.sc-steps{display:flex; gap:5px; flex-wrap:wrap}
.sc-step{
  flex:1 1 0; min-width:60px; padding:6px 5px 7px;
  border:1px solid var(--line2); border-radius:var(--r-s);
  background:var(--surface-2); text-align:center; overflow:hidden;
}
.sc-step b{display:block; font-size:9.5px; font-weight:800; color:var(--ink4); letter-spacing:.06em}
.sc-step span{
  display:block; font-size:10.5px; color:var(--ink3); margin-top:1px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.sc-step i{
  display:block; font-style:normal; font-size:10.5px; font-weight:800;
  color:var(--brand-ink); margin-top:2px; font-variant-numeric:tabular-nums;
}
.sc-step.done{background:var(--ok-soft); border-color:transparent}
.sc-step.done b,.sc-step.done span{color:var(--ok-ink)}
.sc-step.cur{border-color:var(--brand); background:var(--surface); box-shadow:0 0 0 2px rgba(79,70,229,.13)}
.sc-step.cur b,.sc-step.cur span,.sc-step.cur i{color:var(--brand-ink)}

/* ── 四个数字 ───────────────────────────────────────────────── */
.sc-kpi{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px}
.sc-kpi > div{
  border:1px solid var(--line2); border-radius:var(--r-m);
  background:var(--surface); padding:9px 12px;
}
.sc-kpi b{display:block; font-size:19px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; line-height:1.2}
.sc-kpi span{display:block; font-size:10.5px; color:var(--ink4); margin-top:1px}
.sc-kpi .ok b{color:var(--ok-ink)}
.sc-kpi .bad b{color:var(--bad-ink)}
.sc-kpi .run b{color:var(--brand-ink)}

/* ── 分组标题 ───────────────────────────────────────────────── */
.sc-hd{
  display:flex; align-items:center; gap:8px;
  font-size:11px; font-weight:800; color:var(--ink2);
  letter-spacing:.06em; margin:1px 0 -5px;
}
.sc-hd em{font-style:normal; font-weight:700; color:var(--ink4); font-size:10.5px; letter-spacing:0}
.sc-hd .sc-ld{margin-left:auto; font-weight:600; color:var(--ink4); letter-spacing:0; font-size:10.5px}

/* 🔴 入库 ≠ Emby 能看见：入库写 115 原件目录，Emby 读的是 CMS 生成的 strm 库。
   不写这一句，用户点完看到「已入库」却搜不到，会以为流程坏了（§93 实测踩到）。 */
.sc-strm{
  display:flex; align-items:flex-start; gap:7px;
  margin:2px 0 8px; padding:8px 11px; border-radius:9px;
  background:var(--warnbg,rgba(217,119,6,.09));
  border:1px solid var(--warnline,rgba(217,119,6,.28));
  font-size:11.5px; line-height:1.55; color:var(--ink3); font-weight:600;
}
.sc-strm b{color:var(--warn, #d97706)}
.sc-strm .sc-mono{font-size:10.5px}

/* ── §93-3 CMS 同步状态（入库第二步：115 原件 → strm 库，Emby 只认 strm 库）── */
.sc-cmsok{color:var(--ok-ink); font-weight:700}
.sc-cmsbad{color:var(--bad-ink); font-weight:700}
.sc-cmsbtn{
  margin-left:6px; padding:2px 8px; border-radius:999px; cursor:pointer;
  border:1px solid var(--brand-soft); background:var(--brand-soft); color:var(--brand-ink);
  font-size:10.5px; font-weight:700; letter-spacing:0;
}
.sc-cmsbtn:hover{background:var(--brand); color:#fff; border-color:var(--brand)}
.sc-cmsbtn:disabled{opacity:.55; cursor:default}

/* ── 记录行补充（骨架复用 .dl-row）──────────────────────────── */
.sc-time{font-size:10.5px; color:var(--ink4); font-variant-numeric:tabular-nums}
.sc-ok{color:var(--ok-ink); font-weight:700}
.sc-mono{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:10.5px; color:var(--ink3); word-break:break-all;
}

</style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════════════════════
     ⭐ §80 吸顶区（2026-10-28 蛙哥：头不固定，往下滑选不到年份）
     ---------------------------------------------------------------------
     **整块一个 sticky 容器**，里面三行：
       ① 品牌 + 读数 + 动作   ② 年份轨道（横滚）   ③ 工具栏
     ⛔ 不用「header sticky + bar sticky top:Npx」两层叠 ——
        顶栏高度随内容变（窄屏换行），写死 offset 必然错位；一层容器自适应。
     ⛔ 筛选条件收进**绝对定位浮层**（filterpanel），不占吸顶高度 ——
        否则一展开，下面的海报墙被推出屏幕。
     所有既有 id 全部保留（JS 绑定一行都没改）。
     ══════════════════════════════════════════════════════════════════════ -->
<div class="stickywrap" id="stickywrap">
<header class="top">
  <div class="top-row1">
    <div class="brand">
      <div class="mark">里</div>
      <div class="bt">
        <h1>里番缺口看板</h1>
        <span class="sub">TMDB 全览 · <span id="chain"></span></span>
      </div>
      <span class="safechip ok" id="safechip">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6">
          <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/>
        </svg>
        <span id="safechipText">安全模式 · 关闭</span>
      </span>
    </div>
    <div class="statstrip" id="tstats"></div>
    <div class="top-actions">
      <!-- ⭐ §80 需求④：一键扫 Emby（服务端直连 API，扫完顺手闭环「待下」） -->
      <button class="safebtn" id="scanBtn"
              title="扫 Emby「动画里番」库：拉一次全库 → 算出这次新进了哪几部/几集 → 入库检测立刻用新数据；顺手把已收全的「待下」自动标成已收">
        <span class="dot" style="background:var(--info);box-shadow:0 0 0 3px var(--info-soft)"></span>
        <span id="scanBtnText">扫 Emby</span>
      </button>
      <a class="unconf-link" href="/unconfirmed/" target="_blank"
         title="展示尚未确定 TMDB 的源记录，含 hanime/mteam 两源原标题与日文标题，可复制去 TMDB 查证">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="12" r="9"/><path d="M9.2 9a3 3 0 015.6 1c0 2-3 2.2-3 4"/><path d="M12 17.5h.01"/>
        </svg>
        <span>未确定看板</span>
      </a>
      <a class="unconf-link" href="/mteam.html" target="_blank"

<script>
'use strict';

const SAFE_KEY = 'hifan-safe-mode';
/* ── 逐件屏蔽（2026-10-20 蛙哥）──────────────────────────────────
   ⛔ 屏蔽状态**存服务端** work_hidden 表，不存 localStorage
      ⇒ 多设备/多浏览器一致，且「取消屏蔽」有审计留痕。
   屏蔽只影响**前端视图** + 核对页过滤，⛔ 不动任何数据。      */
const HIDDEN = { board:new Set(), unconfirmed:new Set(), showAll:false, yearsOpen:new Set() };
/* ⭐ 2026-10-31（§106）：已屏蔽清单的搜索词（纯前端过滤，不打后端）。
   ⛔ 服务端 `/api/hidden/list` 已**全量**返回（185 条），所以搜索不需要接口支持。 */
const HIDDEN_SEARCH = { q:'' };
const HIDDEN_KEY = 'hifan-hidden-years-open';
/* ── 人工核对标记（2026-10-24 蛙哥）──────────────────────────────
   ⛔ 与屏蔽相反：核对过的部**照常显示**，不参与任何过滤。
   状态存服务端 work_checked 表（⛔ 不存 localStorage —— 换浏览器就丢，
   且助手读不到，0gh 已踩过这个坑）。                              */
const CHECKED = { board:new Set(), list:[], stats:{board:0,total:0} };
const chkOn = w => CHECKED.board.has(String(w.id));
/* 🔴 落库时间是 UTC ISO（`...Z`），直接 slice(0,10) 会在本地 00:00~08:00 之间
   把日期显示成前一天（例：本地 10-29 00:11 显示成 10-28）。⇒ 先解析再按东八区取日期。
   解析失败才退回截前 10 位（老库里可能有非 ISO 值）。 */
const ckDate = s => {
  const t = String(s||'');
  if (!t) return '';
  const d = new Date(t);
  if (Number.isNaN(d.getTime())) return t.slice(0,10);
  try{
    return d.toLocaleDateString('sv-SE', { timeZone:'Asia/Shanghai' });  // YYYY-MM-DD
  }catch(e){ return t.slice(0,10); }
};

/* ── ⭐ §80 喜欢 / 待下 / 订阅（2026-10-28 蛙哥）────────────────────────
   蛙哥：「点一下，这一部进入一个待下状态，空了我去补下载+入库。这功能也要做批量」
   ---------------------------------------------------------------------
   三态（同一张 work_want 表，靠时间戳表达）：
     待下中 = keys 里有、done 里没有   已收 = done 里有   撤销 = 两边都没有
   ⛔ 与「已核对」相反：核对是「我验过了」，待下是「我还没收」——
      一部完全可以「待下且未核对」⇒ 两个维度各自独立，⛔ 别用同一个 Set。
   ⛔ 状态存服务端 work_want（不存 localStorage —— 换浏览器就丢，助手也读不到，0gh）。 */
const WANT = { keys:new Set(), done:new Set(), list:[], stats:{want:0,done:0,total:0}, showDone:false };
/* ⭐ §87：待下清单的「源站条目 ⇄ 直链」对账（key = `media:id`）。
   由 /api/dl/want-audit 提供，只覆盖待下的那几十部 ⇒ 其它视图不显示。 */
const WANTAUDIT = new Map();
async function loadWantAudit(){
  try{
    const j = await fetch('/api/dl/want-audit').then(r=>r.ok?r.json():null);
    if(!j || !Array.isArray(j.rows)) return;
    WANTAUDIT.clear();
    for(const r of j.rows) if(r && r.key) WANTAUDIT.set(r.key, r);
  }catch(e){ /* 接口没上线也不该让待下页白屏 */ }
}
const wantKeyOf = w => `${w.mediaType}:${w.id}`;
const wantOn = w => WANT.keys.has(wantKeyOf(w));
const wantDone = w => WANT.done.has(wantKeyOf(w));
/** 待下但还没收 ⇒ 卡面挂「待下」小标；已收的不挂（否则永远提醒你） */
const wantPending = w => wantOn(w) && !wantDone(w);
// 🔴 2026-10-20 12:5x：声明必须**在 loadHidden() 调用之前**（734 行），
//    否则 `let` 的 TDZ 会抛 `Cannot access before initialization`。
//    （原来它声明在 922 行、赋值在 827 行的 loadHidden 里 ⇒ 启动即炸。）
let HIDDEN_LIST_CACHE = [];
let VIEW = 'all';   // 'all' 全览海报墙| 'intake' 入库检测
/* ⭐ 2026-10-21 修：原为 null，但 renderIntake() 上来就读 INTAKE.includeHidden
   ⇒ 首次点「入库检测」抛 TypeError（Cannot read properties of null），
   页面永远停在「正在核对入库情况…」。这是**既有 bug**，不是重制引入的。
   现在初始化成对象，并让读取端对 null 也安全。 */
let INTAKE = { includeHidden:false, cur:null };  // 入库检测数据缓存（cur=抽屉当前是哪一部）
const S = { raw:null, stats:null, years:[], works:[], year:null, type:'', q:'', onlyCover:false, onlyPm:false,
            onlyUnchecked:false,
            // ⭐ §77：只看已核对（与 onlyUnchecked 互斥 —— 核对只有「已核对/未核对」两态）
            onlyChecked:false,
            // ⭐ §80：只看待下（我点过♥、还没收全的）
            onlyWant:false,
            // st: Set —— §77 起是**多选**（并集）：'full' 全集入库 | 'part' 部分入库 | 'none' 未入库
            // ⛔ 空 Set = 不按入库状态筛（对应「不限」按钮 = 清空选择）
            st:new Set(),
            // src: '' 全部 | 'both' MT+hanime | 'mteam' 仅 MT | 'hanime' 仅 hanime
            src:'',
            // safe: 'off' 正常 | 'blur' 模糊（悬停才加载）| 'hide' 完全隐藏
            // detail: 抽屉当前打开的 {id, media} —— 切安全档时要按新档位**重渲染**，
            //         原来直接 closeDetail() 会把抽屉粗暴关掉、且旧 DOM 残留旧档位的图
            safe:'off', detail:null };

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ⭐⭐ §112（2026-10-31 蛙哥「简介依旧缺失」）——
   TMDB 的词条被境外垃圾站刷过：#287596 的 `name` 本身就是「淫片网 4488329.com」，
   它的 S1E1 `overview` 就是字符串 **`Episode nothing`**（看板照实显示，看着像 bug）。
   ⇒ 简介必须过一道闸：宁可显示「TMDB 确实没简介」，⛔ 不能把广告词/占位串当真简介（0cs）。
   ⚠️ 只做「明显是垃圾」的拦截，不做语义判断 —— 短不等于假（「性欲强是隐藏配方？」是真简介）。 */
const isJunkOverview = t => {
  const s = String(t??'').trim();
  if (s.length < 6) return true;
  const low = s.toLowerCase();
  if (/(episode nothing|no overview|watch free|免费观看|在线观看|高清在线|在线播放)/.test(low)) return true;
  if (/(https?:\/\/|www\.|\.com|\.net|\.cc\b|．)/.test(low)) return true;
  return false;
};
const cleanOverview = t => {
  const raw = String(t??'').trim();
  if (!raw) return '';
  /* ⚠️ 整条丢还是只丢那一行？—— TMDB 被刷过的词条常常是「广告行 + 正文」粘在一起，
     实测 #79641 S1E1 = 「看黄铯片网：4488𝟥29.com\n\n学生高城博子…」。
     ⇒ 按行剥：脏行丢掉，正文留下；全被剥光才算「没简介」。 */
  const keep = raw.split(/\n+/).map(s => s.trim())
    .filter(s => s && !isJunkOverview(s));
  const s = keep.join('\n').trim();
  return (!s || isJunkOverview(s)) ? '' : s;
};
/* §114：分集简介取用口径 —— 有中文译文就用译文，没有才回退 TMDB 原文。
   ⛔ 不覆盖原文：库里 `overview` 始终是 TMDB 原值，译文单独存在 `overview_zh`
      （migration #22）⇒ 下次重抓 TMDB 不会把译文冲掉，也能随时复翻。 */
const epOvText = e => cleanOverview(e?.overviewZh) || cleanOverview(e?.overview);
/* 中文判定：含汉字**且不含平假名**。
   实测 #73128 的 hanime `title` = 「漸進曲 ～天使們的私人課程～ 5」（含汉字、无平假名 ⇒ 中文），
   而「燐月-リンゲツ- THE ANIMATION 第一話…」「鬼父 Rebuild Vol.2「清楚に跨がる…」含平假名 ⇒ 日文。
   ⛔ 不用「有没有汉字」单判 —— 日文标题里遍布汉字。 */
const isZhTitle = t => { const s = String(t??''); return /[\u4e00-\u9fff]/.test(s) && !/[\u3040-\u309f]/.test(s); };

/* ⭐ §140（2026-11-03 蛙哥「全库的 hanime 的日语原标题展示完整，目前存在缩写的情况」）：
   hanime 条目 3555 条里 **76 条缺 `title_ja`**（抓取早于该字段落地的存量），
   这些在逐集比对里只剩缩写的系列名+卷号（如「Space Ofera 阿卡魯達 1」），
   完整日文原标题其实一直都在 `title_page` 里（视频页 <title>，带 [中文字幕] 等站方标记）。
   ⇒ 共用兜底：`titleJa` 缺失时用 `title_page` 剥掉 `[...]` 标记补上（70/76 可救，6 条两个都空才真无）。
   ⛔ 有 `title_ja` 的 3479 条原样不动 —— page 版多一串标记，整页换会噪音（§67 同款口径）。 */
const hnJaFull = (ja, page) => {
  const a = String(ja ?? '').trim();
  if (a) return a;
  return String(page ?? '').replace(/\[[^\]]*\]/g, '').trim();
};

async function boot(){
  const r = await fetch('/api/board');
  // 401 = 会话失效（进程重启或被登出）→ 回登录页，别弹「加载失败」
  if(r.status === 401){ location.href = '/login?next=' + encodeURIComponent(location.pathname); return; }
  if(!r.ok){ $('#main').innerHTML = '<div class="empty"><b>加载失败</b>请确认服务已启动</div>'; return; }
  const d = await r.json();
  S.stats=d.stats; S.years=d.years; S.works=d.works;
  S.year = d.years[0]?.year ?? null;

  // ⭐ 逐件屏蔽：拉屏蔽集合（老库没跑 migration ⇒ 接口返空集，不崩）
  await loadHidden();
  // ⭐ 人工核对标记：拉已核集合 + 进度（同上，老库返空不崩）
  await loadChecked();
  // ⭐ §80 待下集合 + 进度（表不存在也返空，不崩）
  await loadWant();
  // ⭐ §151/§152 标签档位（避开/喜欢）：只给二级看板的 hanime chip 上色，缺了不崩
  await loadTagMarks();
  bindHidden();
  bindChecked();
  bindWant();
  bindFilterPanel();
  bindStickyShadow();
  bindTrackNav();
  bindScan();

  // 恢复上次的安全模式（默认 off）
  try {
    const saved = localStorage.getItem(SAFE_KEY);
    if (saved === 'blur' || saved === 'hide' || saved === 'off') S.safe = saved;
  } catch { /* 隐私模式禁用 storage */ }

  renderStats(); renderTrack(); renderStCounts(); applySafe();
}

/**
 * 🔴 2026-10-20 12:5x：屏蔽/取消屏蔽后**重新拉一次看板数据**。
 *
 * ⭐ 为什么必须重拉：服务端现在会过滤被屏蔽的作品（`board.ts` `visibleEx`），
 *   而 `render()` 只是拿内存里的 `S` 重绘 ⇒ 不重拉的话，屏蔽后这部**还留在页面上**
 *   （要刷新浏览器才消失）—— 违背「屏蔽了就真的看不见」。
 */
async function reloadBoard(){
  try{
    const r = await fetch('/api/board');
    if(!r.ok) return;
    const d = await r.json();
    S.stats=d.stats; S.years=d.years; S.works=d.works;
    if(d.years && d.years.length && !d.years.some(y=>y.year===S.year)) S.year = d.years[0]?.year ?? null;
    await loadHidden();
    renderStats(); renderTrack(); renderStCounts(); applySafe();
  }catch(e){ /* 拉失败就保持现状，⛔ 不清空页面 */ }
}

/* ── 入库状态分档计数（§75 → §77 多选）────────────────────────────────────
   ⭐ §77：数字 = 该档在**当前其它筛选条件下**的部数
      （勾「只看未核对」后，数字立刻变成「还剩多少未核对的」，这才是有用的信息）
      ⇒ 复用 filtered({skipSt:true, skipYear:true})，判据只写一份（0cs：显示的数=筛出来的数）。
   ⛔ skipSt=true ⇒ 算某档时**不套用入库状态本身**（否则「全部入库」永远只剩自己那档）。
   ⛔ skipYear=true ⇒ 不受年份锁影响（跨年份看全量，§75 起就是这口径）。
   ⭐ 三档之和 + 未同步 = 全库部数（守恒，0ay：解口径限制要同口径一起放开）。 */
function renderStCounts(){
  const c = {full:0, part:0, none:0, unknown:0};
  // ⭐ 基数 = 其它筛选条件（类型/来源/核对/封面/泡麵番/搜索）下的集合，⛔ 不含入库状态本身
  const base = filtered({skipSt:true, skipYear:true});
  for(const w of base){
    const st = embyStatus(w);
    if(st) c[st]++; else c.unknown++;
  }
  const set = (id,n)=>{ const el=document.getElementById(id); if(el) el.textContent = n; };
  // 🔴 §78：「不限」按钮**不挂数字** —— 它是清空重置，不是状态档。
  //    旧版挂全库基数（如 1268）会被读成「已入库 1268 部」，且点它实际只得当年数 ⇒ 数字与结果对不上。
  //    全库总数看顶部「全集总数」；「不限」的当前结果数由 hint 说（口径讲出来，0cs）。
  set('sbFull', c.full); set('sbPart', c.part); set('sbNone', c.none);
  // ⭐ §77：多选 ⇒ title 说清「可多选」+ 当前已勾哪几档（口径讲出来别让人猜，0cs）
  const seg = document.getElementById('segSt');
  if(seg){
    const on = [...S.st];
    const L = {full:'全部入库', part:'部分入库', none:'未入库'};
    seg.title = `按 Emby 里番库的入库状态筛（可多选，同时点亮几档就看几档的并集）`
      + `\n全部入库 ${c.full} 部 · 部分入库 ${c.part} 部 · 未入库 ${c.none} 部`
      + (c.unknown ? `\n未同步 ${c.unknown} 部（还没同步过，不算未入库）` : '')
      + `\n「不限」= 不按入库状态筛（清空勾选）`
      + (on.length ? `\n当前已勾：${on.map(k=>L[k]).join(' + ')}` : `\n当前未勾任何档 = 不按入库状态筛`);
  }
}

/* ── 顶部读数：变化在前、存量小字在后（沿用 SW 看板口径）── */
function renderStats(){
  const s = S.stats;
  const cv = s.coverage || null;
  const items = [
    [s.total,      '全集总数'],
    [s.withPoster, '有封面'],
    [s.tv+'/'+s.movie, '剧集/剧场'],
    [s.yearSpan? s.yearSpan.from+'-'+s.yearSpan.to : '—', '年份跨度'],
  ];
  $('#tstats').innerHTML = items.map(([v,l])=>
    `<div class="tstat"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('');
  /* 顶栏副标只说「全集规模」，不解释「怎么进来的」——
     收录来源属于核对内部信息，留在 /review/ 与库里，不印在主看板。 */
  $('#chain').textContent = `共 ${s.totalEpisodes} 集 · 覆盖 ${s.yearSpan? s.yearSpan.from+'-'+s.yearSpan.to : '—'}`;

  /* ⭐ 双源覆盖体检（用户 2026-10-15）
     必须把「仅 hanime」拆开：泡麵番只有 hanime 是**正常**（M-TEAM 不收短篇），
     裏番只有 hanime 才是**真缺口**。混成一个数会让用户追着一个不存在的目标。 */
  const cov = $('#covline');
  if(!cov) return;
  if(!cv){ cov.innerHTML=''; return; }
  const t = cv.total || 1;
  const pct = (n)=> (n/t*100).toFixed(1)+'%';
  cov.innerHTML =
    `<span class="cov-line-lb">覆盖体检</span>`+
    `<span class="cov-i cov-ok"  title="M-TEAM 与 hanime 都指向这一部，双源互证最可信">双源 <b>${cv.both}</b><i>${pct(cv.both)}</i></span>`+
    `<span class="cov-i cov-mt"  title="只有 M-TEAM 匹配出来，hanime 侧缺失或没桥上">仅 MT <b>${cv.onlyMt}</b><i>${pct(cv.onlyMt)}</i></span>`+
    `<span class="cov-i cov-pm"  title="泡麵番只有 hanime 有记录是正常的 —— M-TEAM 不收短篇，不是数据缺口">泡麵番·仅hanime <b>${cv.onlyHnPaomian}</b><i>${pct(cv.onlyHnPaomian)}</i></span>`+
    `<span class="cov-i cov-gap" title="裏番却只有 hanime —— 这才是真缺口">裏番·仅hanime <b>${cv.onlyHnRifan}</b><i>${pct(cv.onlyHnRifan)}</i></span>`+
    (cv.onlyHnUnknown ? `<span class="cov-i cov-unk" title="源站未标类型，无法判断">类型不明 <b>${cv.onlyHnUnknown}</b></span>` : '');
}

/* ── 年份轨道 ─────────────────────────────────────────── */
function renderTrack(){
  const max = Math.max(...S.years.map(y=>y.total));
  // ⭐ 2026-10-18：搜索是跨年的，此时高亮某个年份会让人误以为「只搜了那年」。
  //    搜索期间不高亮任何年份轨道，改为在 hint 里说明搜索范围。
  // ⭐ §75：选入库档同理 —— 按钮上写的是**全库**档位部数，
  //    若还锁着年份，进去只有那一年 ⇒ 数字对不上（0cs：口径讲出来别让人猜）。
  const searching = S.q.trim().length>0;
  const crossYear = searching || S.st.size>0;
  $('#track').innerHTML = S.years.map(y=>
    `<button class="yr${(!crossYear && y.year===S.year)?' on':''}"
       data-y="${y.year}" title="${y.year} 年 · ${y.total} 部（剧集 ${y.tv} · 剧场 ${y.movie}）">
       <span class="yr-c">${y.total}</span><span class="yr-n">${String(y.year).slice(2)}</span>
     </button>`).join('');
  // 柱状高度提示：--pct 驱动伪元素（2026-10-21 视觉重制，改成真正的迷你柱状图）
  /* 🔴🔴 2026-10-29 修（蛙哥：「点了入库检测之后怎么按都切不回看板」）：
     原来这里是**全局** `document.querySelectorAll('.yr')` —— 而入库检测的
     缺集清单表格里，年份那一格写的正是 `<td class="yr">`（后来已改名为 .iyear）。
     表格行数 > 年份按钮数时，`S.years[i]` 越界成 undefined ⇒ `y.total` 抛 TypeError
     ⇒ renderTrack() 崩在切换视图的那一次点击里 ⇒ #main 永远停在上一个视图。
     ⇒ ① 选择器**必须限定容器** `#track .yr`（全局类名选择器是定时炸弹）
       ② 顺手 i<len 兜底，将来再有别处写 class="yr" 也不会把主视图打挂。 */
  const yrEls = [...document.querySelectorAll('#track .yr')];
  yrEls.forEach((el,i)=>{
    const y = S.years[i]; if(!y) return;
    const pct = Number.isFinite(max) && max > 0 ? Math.round(y.total/max*100) : 0;
    el.style.setProperty('--pct', pct+'%');
  });
}

/* ── 入库状态分档（§75）─────────────────────────────────────────────────
   判据全部来自后端已算好的字段（§70 Emby 口径），⛔ 前端不自己比大小。

   三档互斥、互不重叠、且**把能判的都判完**：
     full  = embyFull === true                 （全集入库；人工确认也归这里）
     part  = embyEps > 0 且 !embyFull          （收了但缺几集）
     none  = embyEps === 0                     （一集都没有）
   ⚠️ embyEps === null = **未同步过**，不是「未入库」（0cs：不知道 ≠ 没有）
     ⇒ 它不属于任何一档 ⇒ 三档之和 = 可判定部数（可能 < 全库部数）。
     ⚠️ 人工确认入库的这部：embyFull=true ⇒ 归 full。
   返回 null 表示「这一档不成立」（含未同步）⇒ 过滤器里直接 return false。 */
function embyStatus(w){
  const eps = w.embyEps, need = w.embyNeed;
  if(w.embyFull === true) return 'full';
  if(eps == null) return null;            // 未同步 ⇒ 不判（0cs）
  if(eps === 0) return 'none';
  if(typeof need === 'number' && need > 0 && eps < need) return 'part';
  // 理论上不该走到这（eps>need 之类），但**不静默塞进 part** —— 归不了就归不了
  return eps > 0 ? 'part' : null;
}

/* ── 过滤 ───────────────────────────────────────────────
   ⭐ §77：加 opts 开关，供「分档计数」复用同一套判据：
     skipSt   —— 跳过入库状态筛选（算某一档的部数时用）
     skipYear —— 跳过年份锁（§75 起分档数字是**全库**口径，不受年份影响）
   ⛔ 判据只写一份 ⇒ 前端显示的数与实际筛出来的数**必然一致**。 */
function filtered(opts){
  opts = opts || {};
  const skipSt = !!opts.skipSt, skipYear = !!opts.skipYear;
  const q = S.q.trim().toLowerCase();
  // ⭐ 2026-10-18 全局搜索：S.year 默认锁最新年份，原实现 `if(S.year && w.year!==S.year) return false`
  //    在搜索时同样生效 → 「搜鬼父」只能搜到当前年份里的鬼父，等于没有搜索。
  //    现在只要有搜索词就解除年份约束（年份轨道仍然高亮，但不再参与过滤）。
  const searching = q.length > 0;
  return S.works.filter(w=>{
    if(S.type && w.mediaType!==S.type) return false;
    if(S.onlyCover && !w.posterLocal) return false;
    // ⭐ 泡麵番筛选（用户 2026-10-15）：泡麵番只有 hanime 是正常的，可单独筛出来核对
    if(S.onlyPm && !w.isPaomian) return false;
    // ⭐ 只看未核对（2026-10-24）：核对过的部跳过 ⇒ 核完一部少一部，能一路往下推
    if(S.onlyUnchecked && chkOn(w)) return false;
    // ⭐ §77 只看已核对：与 onlyUnchecked 互斥（核对只有「已核对/未核对」两态）
    if(S.onlyChecked && !chkOn(w)) return false;
    // ⭐ §80 只看待下：只留「点过♥、还没收」的（已收的不算待办 ⇒ 清单能真正清空）
    if(S.onlyWant && !wantPending(w)) return false;
    // ⭐ 入库状态筛选（§75 三档互斥 → §77 多选并集）：
    //    勾了哪几档就取哪几档的**并集**；未勾任何档 = 不按入库状态筛。
    //    ⛔ 未同步(embyEps=null)的部不属于任何一档 ⇒ 勾了任意一档它就不出现。
    if(!skipSt && S.st.size){
      const st = embyStatus(w);
      if(!st || !S.st.has(st)) return false;
    }
    // ⭐ 溯源筛选：both=双源互证，mteam=仅 MT，hanime=仅 hanime
    if(S.src){
      const k = w.srcKinds || [];
      if(S.src==='both' && k.length<2) return false;
      if(S.src!=='both' && !(k.length===1 && k[0]===S.src)) return false;
    }
    /* ⛔ §152：这里原来按作品级 tagHits 做三档标签筛选。
       蛙哥只要「二级看板里的 hanime 标签展示」⇒ 海报墙不做标签筛选，整段删除。 */
    if(q){
      const hay = [w.nameZh,w.nameOriginal,w.year,w.id].filter(Boolean).join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    // ⭐ §75/§77：选了入库档 ⇒ 跨年份（按钮上写的是全库档位部数，锁年份会让数字对不上）
    if(!searching && !skipYear && !S.st.size && S.year && w.year!==S.year) return false;
    return true;
  });
}

/* ══════════ 逐件屏蔽：数据加载 ══════════ */
async function loadHidden(){
  try{
    const rs = await Promise.all([
      fetch('/api/hidden/list').then(r=>r.ok?r.json():{rows:[]}),
      fetch('/api/hidden/list?scope=unconfirmed').then(r=>r.ok?r.json():{rows:[]}),
    ]);
    HIDDEN.board    = new Set((rs[0].rows||[]).filter(x=>x.scope==='board').map(x=>x.key));
    HIDDEN.unconfirmed = new Set((rs[1].rows||[]).map(x=>x.key));
    // 🔴 2026-10-20 12:5x：屏蔽清单必须**启动时就装进缓存** ——
    //    年份里的「已屏蔽 N 部」折叠条要靠它渲染（⛔ 不再从作品列表里找）。
    HIDDEN_LIST_CACHE = (rs[0].rows||[]).filter(x=>x.scope==='board');
  }catch(e){ /* 老库没跑 migration ⇒ 接口返空集，天然不屏蔽 */ }
  try{
    const o = JSON.parse(localStorage.getItem(HIDDEN_KEY)||'{}');
    HIDDEN.yearsOpen = new Set(Array.isArray(o)?o:Object.keys(o||{}).filter(k=>o[k]));
  }catch(e){}
  const btn = document.getElementById('hiddenbtn');
  if(btn) btn.style.display = HIDDEN.board.size ? '' : 'none';
  const n = document.getElementById('hiddenN');
  if(n) n.textContent = HIDDEN.board.size;
}

function saveYearsOpen(){
  try{ localStorage.setItem(HIDDEN_KEY, JSON.stringify([...HIDDEN.yearsOpen])); }catch(e){}
}

async function toggleHide(scope, key, reason){
  const r = await fetch('/api/hidden/toggle', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({scope, key, reason}),
  });
  if(!r.ok){ alert('屏蔽失败：' + r.status); return false; }
  const d = await r.json();
  /* 🔴 2026-10-26（§69 ⑥）：加了 season 之后这里**必须**分四支（§74 又加 episode）。
     原写法 `scope==='board' ? HIDDEN.board : HIDDEN.unconfirmed` 会把
     season / episode 的 key 塞进 unconfirmed 集合 ⇒ 未确定看板的名单被污染。
     ⚠️ episode 刻意**不塞进 HIDDEN.season** —— 那是「哪些季被屏了」的集合，
        混进去会让分季行把 S1 标成已屏蔽（而实际只排了一集）。 */
  const set = scope === 'board' ? HIDDEN.board
            : scope === 'season' ? (HIDDEN.season || (HIDDEN.season = new Set()))
            : scope === 'episode' ? (HIDDEN.episode || (HIDDEN.episode = new Set()))
            : HIDDEN.unconfirmed;
  if (set) {
    if(d.action === 'unhidden' || d.action === 'noop') set.delete(key);
    else set.add(key);
  }
  // 🔴 2026-10-20 12:5x：屏蔽/取消后**重新拉清单** ——
  //    年份里的「已屏蔽 N 部」折叠条靠 HIDDEN_LIST_CACHE 渲染 ⇒ 不同步就显示旧数。
  if(scope==='board'){
    try{
      const rr = await fetch('/api/hidden/list?scope=board');
      HIDDEN_LIST_CACHE = rr.ok ? (await rr.json()).rows||[] : HIDDEN_LIST_CACHE;
    }catch(e){}
  }
  const n = document.getElementById('hiddenN');
  if(n) n.textContent = HIDDEN.board.size;
  const btn = document.getElementById('hiddenbtn');
  if(btn) btn.style.display = HIDDEN.board.size ? '' : 'none';
  // 🔴 2026-10-20 12:5x：服务端已过滤 ⇒ 必须重拉看板数据，这一部才会真的消失
  if(scope==='board') await reloadBoard();
  return true;
}

/* ══════════ 批量屏蔽（2026-10-26 蛙哥）══════════════════════════════
   需求原话：「出一个批量屏蔽功能，就是可以全选或者选择部分，然后一键屏蔽」。

   ⭐ 后端 `/api/hidden/bulk` **早就有**（index.ts），只是前端从来没调过 ——
      所以本次只做前端，⛔ 不动接口、⛔ 不新增表。
   ⭐ 与「逐件屏蔽」同一条链路（`work_hidden` 表 + `hidden.hide()`）⇒
      多设备一致、「已屏蔽」抽屉里能逐部/全部恢复、有 hidden_at 审计。

   ⚠️ 两个必须守住的点：
     ① **选择模式与抽屉冲突**：进入选择模式后点卡片=勾选，⛔ 不能再开详情，
        否则每点一次就弹一个抽屉，根本没法连续选。
     ② 屏蔽后必须 `reloadBoard()`（服务端 visibleEx 会过滤）——
        只重绘的话被屏蔽的部**还留在页面上**，跟没屏蔽一样（0gp 的老坑）。
   ══════════════════════════════════════════════════════════════════ */
const SEL = new Set();       // 当前勾选的 tmdb id（字符串，和 work_hidden.key 同口径）
let SEL_MODE = false;

function selSync(){
  const n = SEL.size;
  const num = document.getElementById('bselN');
  if(num) num.textContent = n;
  /* §80：三个动作按钮（标记已核对 / 加入待下 / 屏蔽）统一跟着勾选数禁用 ——
     🔴 原来只控制 bselGo 一个，加动作后漏掉另外两个会变成「没选也能点」。 */
  ['bselCheck','bselWant','bselGo'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.disabled = n === 0;
  });
  const bar = document.getElementById('bselbar');
  if(bar) bar.classList.toggle('on', SEL_MODE);
  const all = document.getElementById('bselAll');
  if(all && SEL_MODE){
    const list = filtered();
    const allOn = list.length > 0 && list.every(w=>SEL.has(String(w.id)));
    all.textContent = allOn ? '取消全选' : '全选当前列表';
  }
}

function setSelMode(on){
  SEL_MODE = Boolean(on);
  if(!SEL_MODE) SEL.clear();
  const btn = document.getElementById('bselbtn');
  if(btn){
    btn.classList.toggle('bsel-on', SEL_MODE);
    // ⭐ §80：从「批量屏蔽」升级成「批量」—— 一个模式，三种动作
    btn.textContent = SEL_MODE ? '选择中…' : '批量';
  }
  selSync();
  render();               // 重绘：卡片上的勾选框/描边跟着出现或消失
}

/** 一键屏蔽：一次请求打 /api/hidden/bulk，⛔ 不逐条 toggle（N 部 = N 次往返） */
async function bulkHide(){
  const keys = [...SEL];
  if(!keys.length) return;
  const go = document.getElementById('bselGo');
  if(go) go.disabled = true;
  try{
    const r = await fetch('/api/hidden/bulk', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({scope:'board', keys, reason:'批量屏蔽（看板）'}),
    });
    if(!r.ok){ alert('批量屏蔽失败：HTTP ' + r.status); return; }
    const d = await r.json();
    // 本地先记账（和 toggleHide 同口径），避免 reloadBoard 之前 banner 数字是旧的
    keys.forEach(k=>HIDDEN.board.add(k));
    try{
      const rr = await fetch('/api/hidden/list?scope=board');
      HIDDEN_LIST_CACHE = rr.ok ? ((await rr.json()).rows||[]) : HIDDEN_LIST_CACHE;
    }catch(e){ /* 清单拉失败不影响屏蔽结果 */ }
    const n = document.getElementById('hiddenN');
    if(n) n.textContent = HIDDEN.board.size;
    const hb = document.getElementById('hiddenbtn');
    if(hb) hb.style.display = HIDDEN.board.size ? '' : 'none';
    setSelMode(false);
    await reloadBoard();
    /* 报告口径：`newlyHidden` 是**真新增**的条数（已经在屏蔽里的不算），
       和 `count` 一起说清楚，避免「选了 10 部却说屏蔽 7 部」的困惑。 */
    const cnt = d.count ?? keys.length, added = d.newlyHidden;
    alert(added == null ? `已屏蔽 ${cnt} 部`
                        : `已屏蔽 ${cnt} 部（其中 ${added} 部为新增，其余此前已屏蔽）`);
  }catch(e){
    alert('批量屏蔽失败：' + (e && e.message ? e.message : e));
  }finally{
    if(go) go.disabled = SEL.size === 0;
  }
}

/**
 * 🔴 2026-10-20 12:5x：改成「可展开 + 每条带恢复按钮」。
 *
 * ⭐ 为什么不再直接渲染作品卡片：
 *   服务端已过滤被屏蔽的作品（board.ts `visibleEx`）⇒ 作品列表里**没有**它们了，

 *   ⭐ 这也正好符合蛙哥的选择：「完全藏起来 + 单独入口可恢复」—— 不在年份里铺卡片。
 */

/* ══════════ 逐件屏蔽：抽屉清单 ══════════ */
/**
 * ⭐ 2026-10-31（§106）：加搜索。
 *   - 搜索范围：中文名 / tmdb id / 年份 / 原因（reason）
 *   - ⛔ 纯前端过滤：`/api/hidden/list` 已全量返回，不打后端、不改接口。
 *   - ⛔ 大小写不敏感；多关键词以空格分隔 ⇒ **全部命中**（AND）。
 *   - 命中词高亮（<mark>），⛔ 高亮前必须 esc，避免把库里的内容当 HTML 注入。
 */
function hiddenMatch(row, terms){
  if(!terms.length) return true;
  const hay = [row.nameZh||'', row.key||'', row.year!=null?String(row.year):'', row.reason||'']
    .join(' ').toLowerCase();
  return terms.every(t => hay.includes(t));
}

/** 把命中词包成 <mark>；⛔ 先 esc 再插标签 ⇒ 库里的尖括号不会被当 HTML 执行 */
function hl(text, terms){
  const s = String(text ?? '');
  if(!terms.length) return esc(s);
  let out = esc(s);
  for(const t of terms){
    if(!t) continue;
    // ⛔ 用户输入当正则 ⇒ 先转义特殊字符，否则搜 "(" 会抛错
    const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    // 用两个不同哨兵包住命中片段，最后一次性换成标签
    out = out.replace(re, m => `\u0001${m}\u0002`);
  }
  return out.replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>');
}

function renderHiddenDrawer(){
  const body = document.getElementById('hBody');
  const stat = document.getElementById('hstat');
  if(!body) return;
  const all = HIDDEN_LIST_CACHE || [];
  const terms = String(HIDDEN_SEARCH.q||'').trim().toLowerCase().split(/\s+/).filter(Boolean);
  const rows = terms.length ? all.filter(x=>hiddenMatch(x, terms)) : all;

  if(stat) stat.textContent = rows.length
    ? (terms.length ? `${rows.length} / ${all.length} 部` : `${rows.length} 部`)
    : '';
  // 🔴 §106：搜索时按钮语义要跟着变 —— 否则「全部取消屏蔽」在有搜索词时
  //    到底是全量还是命中数，用户无从判断。
  const unhideAll = document.getElementById('hUnhideAll');
  if(unhideAll) unhideAll.textContent = terms.length ? `取消这 ${rows.length} 部` : '全部取消屏蔽';
  const ftip = document.getElementById('hfootTip');
  if(ftip) ftip.textContent = terms.length
    ? `搜的是「${HIDDEN_SEARCH.q}」，只影响命中项`
    : '核对漏集/缺集时会自动跳过';
  if(!all.length){
    body.innerHTML = '<div class="empty" style="padding:26px 10px"><b>还没有屏蔽任何作品</b>'
      + '<div style="margin-top:8px">在作品详情里点「屏蔽这部」即可</div></div>';
    return;
  }
  if(!rows.length){
    // ⛔ 搜索无命中 ≠ 库里没有 ⇒ 文案要说清是「没搜到」，别让人以为屏蔽丢了。
    body.innerHTML = `<div class="empty" style="padding:26px 10px"><b>没有匹配「${esc(HIDDEN_SEARCH.q)}」的屏蔽记录</b>`
      + `<div style="margin-top:8px">共 ${all.length} 部已屏蔽，换个关键词试试</div></div>`;
    return;
  }
  body.innerHTML = rows.map(x=>`
    <div class="hr">
      <div class="hi">
        <div class="hin">${hl(x.nameZh||x.key, terms)}</div>
        <div class="him">tmdb ${hl(x.key, terms)}${x.year?` · ${hl(x.year, terms)}`:''}${x.reason?` · ${hl(x.reason, terms)}`:''}</div>
      </div>
      <button class="hbtn" data-unhide="${esc(x.key)}">取消屏蔽</button>
    </div>`).join('');
}

/* ══════════ 逐件屏蔽：事件绑定 ══════════ */
function bindHidden(){
  const drawer = document.getElementById('hdrawer');
  if(!drawer) return;

  document.getElementById('hiddenbtn')?.addEventListener('click', async ()=>{
    try{
      const r = await fetch('/api/hidden/list?scope=board');
      HIDDEN_LIST_CACHE = r.ok ? (await r.json()).rows||[] : [];
    }catch(e){ HIDDEN_LIST_CACHE = []; }
    // ⭐ 每次打开抽屉都重置搜索词 ⇒ 上次搜的残留不该影响这次浏览
    HIDDEN_SEARCH.q = '';
    const si = document.getElementById('hSearch');
    if(si) si.value = '';
    renderHiddenDrawer();
    drawer.classList.add('on');
    // 打开后自动聚焦搜索框 ⇒ 直接就能打字搜
    setTimeout(()=>si?.focus(), 60);
  });
  document.getElementById('hClose')?.addEventListener('click', ()=>drawer.classList.remove('on'));

  /* ── ⭐ §106 搜索 ── */
  const si = document.getElementById('hSearch');
  const sclr = document.getElementById('hSearchClear');
  const syncClear = ()=>{ if(sclr) sclr.hidden = !String(HIDDEN_SEARCH.q||''); };
  si?.addEventListener('input', ()=>{
    HIDDEN_SEARCH.q = si.value || '';
    syncClear();
    renderHiddenDrawer();
  });
  // 回车：⛔ 不做任何写操作（搜索是只读的），只是把焦点还给列表
  si?.addEventListener('keydown', e=>{ if(e.key==='Enter') e.preventDefault(); });
  sclr?.addEventListener('click', ()=>{
    HIDDEN_SEARCH.q = ''; si.value = ''; syncClear();
    renderHiddenDrawer(); si.focus();
  });

  document.getElementById('hShowAll')?.addEventListener('click', ()=>{
    HIDDEN_LIST_CACHE.forEach(x=>HIDDEN.yearsOpen.add(String(
      (S.works.find(w=>String(w.id)===String(x.key))||{}).year ?? '')));
    HIDDEN.yearsOpen.delete('');
    saveYearsOpen(); render(); drawer.classList.remove('on');
  });
  document.getElementById('hUnhideAll')?.addEventListener('click', async ()=>{
    if(!HIDDEN_LIST_CACHE.length) return;
    // 🔴 §106：搜索状态下「全部取消屏蔽」只针对**当前搜索结果**，
    //    否则打几个字就误清了全部 185 部。⛔ 无搜索时才作用于全量。
    const terms = String(HIDDEN_SEARCH.q||'').trim().toLowerCase().split(/\s+/).filter(Boolean);
    const target = terms.length
      ? HIDDEN_LIST_CACHE.filter(x=>hiddenMatch(x, terms))
      : HIDDEN_LIST_CACHE;
    if(!target.length) return;
    const label = terms.length ? `搜索「${HIDDEN_SEARCH.q}」命中的 ${target.length} 部` : `全部 ${target.length} 部`;
    if(!confirm(`确定取消${label}屏蔽？`)) return;
    for(const x of target) await toggleHide('board', x.key);
    // ⛔ 只移除已解除的那些，别把没搜到的也清了（缓存仍代表全量清单）
    const done = new Set(target.map(x=>x.key));
    HIDDEN_LIST_CACHE = HIDDEN_LIST_CACHE.filter(x=>!done.has(x.key));
    renderHiddenDrawer(); render();
    drawer.classList.remove('on');
  });
  document.getElementById('hBody')?.addEventListener('click', async e=>{
    const b = e.target.closest('[data-unhide]');
    if(!b) return;
    await toggleHide('board', b.dataset.unhide);
    HIDDEN_LIST_CACHE = HIDDEN_LIST_CACHE.filter(x=>x.key !== b.dataset.unhide);
    renderHiddenDrawer(); render();
  });

  // 年份折叠行（事件委托，因为 innerHTML 每次重绘）
  document.getElementById('main')?.addEventListener('click', async e=>{
    // 🔴 2026-10-20 12:5x：折叠条里的「恢复显示」按钮是 `[data-unhide]`，
    //    它在 `.hiddenbar` 内部 ⇒ `closest('[data-hy]')` 会命中父级 ⇒ 会**顺带收起折叠条**。
    //    ⛔ 必须先拦掉 `[data-unhide]`，让它只做恢复、不碰折叠状态。
    if(e.target.closest('[data-unhide]')) return;
    const bar = e.target.closest('[data-hy]');
    if(!bar) return;
    const y = String(bar.dataset.hy);
    if(HIDDEN.yearsOpen.has(y)) HIDDEN.yearsOpen.delete(y);
    else HIDDEN.yearsOpen.add(y);
    saveYearsOpen(); render();
  });

  // 🔴 折叠条里的「恢复显示」按钮（与抽屉里的分开绑，因为不在 #hBody 里）
  document.getElementById('main')?.addEventListener('click', async e=>{
    const b = e.target.closest('[data-unhide]');
    if(!b) return;
    await toggleHide('board', b.dataset.unhide);
    render();
  });
}

/* ══════════ 人工核对标记：数据加载 ══════════ */
async function loadChecked(){
  try{
    const r = await fetch('/api/checked/list');
    if(r.ok){
      const d = await r.json();
      CHECKED.list = d.rows || [];
      // ⚠️ key 统一按**字符串**存集合 —— 接口返的是文本 tmdb_id，
      //    w.id 在 /api/board 里是数字 ⇒ 不归一就会出现
      //    「明明标了却不显示 ✓」这类幽灵 bug。
      CHECKED.board = new Set(CHECKED.list.map(x=>String(x.key)));
      CHECKED.stats = d.stats || {board:0, total:0};
    }
  }catch(e){ /* 老库没跑 migration ⇒ 接口返空，天然不标记 */ }
  paintCheckedCount();
}

function paintCheckedCount(){
  const n = document.getElementById('checkedN');
  const t = document.getElementById('checkedT');
  const s = CHECKED.stats || {};
  if(n) n.textContent = s.board ?? CHECKED.board.size;
  if(t) t.textContent = s.total ?? 0;
}

/* 年份 → 该年**可见作品数**（进度分母）。⛔ 不用 filtered() 的结果当分母：
   勾了「只看有封面」时分母会跟着缩，进度看起来会突然变好看 = 假进度。 */
function yearTotal(y){
  return S.works.filter(w=>w.year===y).length;
}
/* 年份 → 该年已核对数（分子） */
function yearChecked(y){
  return S.works.filter(w=>w.year===y && chkOn(w)).length;
}

async function toggleCheck(key, note){
  const r = await fetch('/api/checked/toggle', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({key:String(key), note:String(note||'')}),
  });
  if(!r.ok){ alert('标记失败：' + r.status); return null; }
  const d = await r.json();
  if(d.action === 'unchecked' || d.action === 'noop') CHECKED.board.delete(String(key));
  else CHECKED.board.add(String(key));
  if(d.stats) CHECKED.stats = d.stats;
  // 清单同步（抽屉里「我核过哪些」靠它）
  try{
    const rr = await fetch('/api/checked/list');
    if(rr.ok){ const dd = await rr.json(); CHECKED.list = dd.rows || []; }
  }catch(e){}
  paintCheckedCount();
  return d.action;
}

/* ══════════ 人工确认入库（2026-10-27 §73 蛙哥）══════════
   与 `toggleCheck`（核对第三方信息）并列但**维度不同**：
   checked = 留凭证，不影响判定；这里 = 确认 Emby 收全了 ⇒ `embyFull` 变 true。
   ⛔ 不写 localStorage（0gh：只存浏览器 = 假闭环），全部走服务端 work_emby_verified。 */
async function toggleEmbyVerify(id, media, snapEps, snapNeed){
  const r = await fetch('/api/emby_verify/toggle', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      id: Number(id), media: String(media || 'tv'),
      // 快照：⛔ 不编造，拿不到就传 null（后端会当「未知」，日后不判过期）
      snapEps:  Number.isFinite(Number(snapEps))  ? Number(snapEps)  : null,
      snapNeed: Number.isFinite(Number(snapNeed)) ? Number(snapNeed) : null,
    }),
  });
  if(!r.ok){ alert('确认失败：' + r.status); return null; }
  const d = await r.json();
  return d.ok ? d.action : null;
}
