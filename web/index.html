function renderCheckedDrawer(){
  const body = document.getElementById('cBody');
  const stat = document.getElementById('cstat');
  if(!body) return;
  const rows = CHECKED.list || [];
  const s = CHECKED.stats || {};
  if(stat) stat.textContent = (s.total ? `${s.board||rows.length} / ${s.total}` : (rows.length?rows.length+' 部':''));
  if(!rows.length){
    body.innerHTML = '<div class="empty" style="padding:26px 10px"><b>还没有核对任何作品</b>'
      + '<div style="margin-top:8px">点开任意一部，右上角点「标记已核对」</div></div>';
    return;
  }
  body.innerHTML = rows.map(x=>`
    <div class="hr">
      <div class="hi">
        <div class="hin">${esc(x.nameZh||x.key)}</div>
        <div class="him">tmdb ${esc(x.key)}${x.year!=null?` · ${x.year}`:''}${x.checked_at?` · 核于 ${esc(ckDate(x.checked_at))}`:''}${x.note?` · ${esc(x.note)}`:''}</div>
      </div>
      <button class="hbtn" data-uncheck="${esc(x.key)}">取消核对</button>
    </div>`).join('');
}

/* ══════════ 人工核对标记：事件绑定 ══════════ */
function bindChecked(){
  const drawer = document.getElementById('cdrawer');
  if(!drawer) return;

  document.getElementById('checkedbtn')?.addEventListener('click', ()=>{
    renderCheckedDrawer();
    drawer.classList.add('on');
  });
  document.getElementById('cClose')?.addEventListener('click', ()=>drawer.classList.remove('on'));
  drawer.addEventListener('click', e=>{ if(e.target === drawer) drawer.classList.remove('on'); });

  document.getElementById('cUncheckAll')?.addEventListener('click', async ()=>{
    if(!CHECKED.list.length) return;
    if(!confirm(`确定取消全部 ${CHECKED.list.length} 部的核对标记？（⛔ 不动任何作品数据，只是去掉凭证）`)) return;
    // 🔴 串行：并发几十个请求会让 node:sqlite 撞 busy（同屏蔽那边的做法）
    for(const x of CHECKED.list) await toggleCheck(x.key);
    renderCheckedDrawer();
    rerenderKeep();
  });

  document.getElementById('cBody')?.addEventListener('click', async e=>{
    const b = e.target.closest('[data-uncheck]');
    if(!b) return;
    await toggleCheck(b.dataset.uncheck);
    renderCheckedDrawer();
    rerenderKeep();
  });
}

/* 重绘但保住滚动位置 —— 核对一部就跳回页顶会没法连续核 */function rerenderKeep(){
  const y = window.scrollY;
  rerenderCurrent();
  window.scrollTo(0, y);
}

/* ══════════════════════════════════════════════════════════════════════
   ⭐ §80 喜欢 / 待下（2026-10-28 蛙哥）
   ----------------------------------------------------------------------
   需求原话：「再加一个喜欢（待下，订阅）功能就是我点一下，这一部进入一个待下状态，
             空了我去补下载+入库。这功能也要做批量，我可以批量选择喜欢的片」
   实现要点：
     ① 状态在**服务端** work_want（三态：待下中 / 已收 / 撤销）⇒ 换设备一致
     ② 点一次 = 加入，再点一次 = 取消（幂等，⛔ 不弹确认框 —— 要能连续点几十部）
     ③ 批量：与「分批核对/屏蔽」**共用同一个选择模式**（SEL_MODE），不另起一套
     ④ 扫 Emby 后自动闭环：收全的部自动标「已收」（见 /api/emby/scan）
   ══════════════════════════════════════════════════════════════════════ */

async function loadWant(){
  try{
    const r = await fetch('/api/want/keys');
    if(r.ok){
      const d = await r.json();
      WANT.keys = new Set(d.keys || []);
      WANT.done = new Set(d.doneKeys || []);
      WANT.stats = d.stats || {want:0, done:0, total:0};
    }
  }catch(e){ /* 老库没跑 migration ⇒ 接口返空，天然不标记 */ }
  paintWantCount();
}

function paintWantCount(){
  const n = document.getElementById('wantN');
  // 角标口径 = **还没收**的部数（已收的不该一直提醒你）
  if(n) n.textContent = (WANT.stats && WANT.stats.want != null)
    ? WANT.stats.want
    : [...WANT.keys].filter(k=>!WANT.done.has(k)).length;
}

/* ══════════════════════════════════════════════════════════════════════
   ⭐ §151 标签档位（2026-11-04 蛙哥）

   蛙哥：「把 hanime 的所有视频标签抓出来汇总去重，我不想看伪娘、猎奇这种，
          就把这部分高亮，让我一眼就看出来，然后避开下载」
   定稿：**两档** —— 红=避开 / 绿=喜欢 / 没选=灰（不关心，⛔ 不上色）。

   🔴 §152（2026-11-04 蛙哥）范围收口：
      「我只想在二级看板里的 hanime 标签展示而已，而不是全局显示」
      ⇒ 标记**只**影响作品抽屉 · 来源列里 hanime 每条视频的 chip。
        海报墙不做角标、不加红圈、不按标签筛选，顶部也不再有独立浏览视图
        （设置页仍在，只用来打标记）。
      ① `TAGS.list`  = 全库标签清单（249 个 + 频次），设置面板铺它
      ② `TAGS.marks` = 你标过的档位（tag → 1|2），逐集 chip 上色用它
      ⛔ 别在前端拿 video_tag 重算 —— 那要拉全库 3549 条 vid 的标签（几百 KB）。
   ══════════════════════════════════════════════════════════════════════ */
const TAGS = { list: [], marks: {}, loaded: false };
/** 某个标签的档位：0=没标 1=避开 2=喜欢 */
const tagLevel = t => Number(TAGS.marks[String(t)] || 0);

async function loadTagMarks(){
  try{
    const r = await fetch('/api/tag-mark');
    if(!r.ok) return;
    const d = await r.json();
    if(d && d.ok !== false){
      TAGS.list = Array.isArray(d.tags) ? d.tags : [];
      TAGS.marks = (d.marks && typeof d.marks === 'object') ? d.marks : {};
      TAGS.loaded = true;
    }
  }catch(e){ /* 表没建 / 接口没上线 ⇒ 全库不标记，⛔ 不阻断看板 */ }
}

/** ⛔ §152 已删除 paintTagHint()：它只服务海报墙那三条标签筛选（已撤）。
    抽屉里的 chip 直接读 TAGS.marks，不需要额外提示。 */

/**
 * 单部 加入 / 取消 待下
 * ⭐ 快照：把「点♥那一刻卡面上的 embyEps / embyNeed」一起送过去 ——
 *    这样扫 Emby 时能判断「这期间它收全了没」，⛔ 不用事后猜目标集数。
 */
async function toggleWant(id, media, snapEps, snapNeed){
  const key = `${media}:${id}`;
  const r = await fetch('/api/want/toggle', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      id: Number(id), media: String(media || 'tv'),
      snapEps:  Number.isFinite(Number(snapEps))  ? Number(snapEps)  : null,
      snapNeed: Number.isFinite(Number(snapNeed)) ? Number(snapNeed) : null,
    }),
  });
  if(!r.ok){ alert('待下操作失败：HTTP ' + r.status); return null; }
  const d = await r.json();
  if(d.action === 'removed' || d.action === 'noop'){ WANT.keys.delete(key); WANT.done.delete(key); }
  else { WANT.keys.add(key); if(!WANT.done) WANT.done = new Set(); }
  if(d.stats) WANT.stats = d.stats;
  paintWantCount();
  return d.action;
}

/* ── 待下清单抽屉 ─────────────────────────────────────────────── */
async function renderWantDrawer(){
  const body = document.getElementById('wBody');
  const stat = document.getElementById('wstat');
  if(!body) return;
  body.innerHTML = '<div class="empty" style="padding:26px 10px">正在读取待下清单…</div>';
  let rows = [];
  try{
    const r = await fetch('/api/want/list' + (WANT.showDone ? '?done=1' : ''));
    if(r.ok){ const d = await r.json(); rows = d.rows || []; WANT.list = rows; if(d.stats) WANT.stats = d.stats; }
  }catch(e){ /* 降级成空清单 */ }
  const s = WANT.stats || {};
  if(stat) stat.textContent = s.total ? `待下 ${s.want ?? 0} · 已收 ${s.done ?? 0}` : '';
  if(!rows.length){
    body.innerHTML = `<div class="empty" style="padding:26px 10px"><b>清单是空的</b>`
      + `<div style="margin-top:8px">${WANT.showDone ? '点过♥的部都在这里；一部都没点过' : '把想收的部点一下封面右上角的♥，或者勾一批用「批量 → 加入待下」'}</div></div>`;
    return;
  }
  body.innerHTML = rows.map(x=>{
    const key = `${x.media_type}:${x.tmdb_id}`;
    const done = Boolean(x.done_at);
    const thumb = x.posterLocal && S.safe !== 'hide'
      ? `<img src="/images/${esc(x.posterLocal)}" alt="" loading="lazy"
             onerror="this.style.display='none'">`
      : `<div class="wph">${S.safe==='hide'?'已隐藏':'无图'}</div>`;
    const epTxt = (x.snap_eps != null && x.snap_need != null) ? ` · 入库 ${x.snap_eps}/${x.snap_need}` : '';
    /* ⭐ §115（2026-11-01 蛙哥）：「待下里 hanime 的视频信息和 mteam 新落盘的视频信息，
       一眼就能看出我应该下哪一个」。这里给作品级汇总，明细在详情抽屉逐集。
       ⛔ 数据没算过（mediaEps == null）就整行不画 —— 别画一串「0 集」让人以为算过了。 */
    const wq = (() => {
      // ⛔ 没有 ep_media 行 = 这一部**没算过**（不是「mteam 没有」）—— 不画，别瞎断言
      const eps = x.mediaEps || 0;
      if(!eps) return '';
      // 分母用 TMDB 集数：⛔ 不是「我们算过几集」，否则「2/2」会把「只下了 2/6」说成下完
      const den = x.tmdbEps || eps;
      const mt = x.mtEps || 0;
      const pct = Math.round(mt * 100 / den);
      const gb = x.mtBytes ? (x.mtBytes / 1073741824) : 0;
      const h = x.mtMaxH ? (x.mtMaxH + 'p') : '';
      const libN = x.libEps || 0;
      /* ⭐ §115 复盘：「还在下」和「全量库根本没有」必须说两种话 —— 否则蛙哥会
         一直等一部 mteam 压根没有的片（实测 953 条里 85 条属于这种）。 */
      const pend = x.mtPendEps || 0;
      const none = x.mtNoneEps || 0;
      if(!mt){
        if(pend) return `<div class="wq none">mteam 待落盘 ${pend}/${den} 集${libN ? ' · Emby 库里 ' + libN + ' 集' : ''}</div>`;
        if(none) return `<div class="wq none">mteam 全量库没有这一部${libN ? ' · Emby 库里 ' + libN + ' 集' : ''}</div>`;
        return `<div class="wq none">mteam 还没落盘（0/${den}）${libN ? ' · Emby 库里 ' + libN + ' 集' : ''}</div>`;
      }
      return `<div class="wq"><b>mteam 已落盘 ${mt}/${den} 集</b>`
        + `<span>${h ? h + ' · ' : ''}${gb ? gb.toFixed(1) + ' GB · ' : ''}${pct}%</span>`
        + (libN ? `<em>Emby 库里 ${libN} 集</em>` : '') + `</div>`;
    })();
    return `<div class="witem${done?' done':''}" data-wk="${esc(key)}">
      ${thumb}
      <div class="wm">
        <div class="wn">${esc(x.nameZh || x.nameOriginal || ('tmdb ' + x.tmdb_id))}
          <span class="wtag ${done?'done':'want'}">${done?'已收':'待下'}</span></div>
        <div class="wd">${x.year ?? '—'} · tmdb ${esc(x.tmdb_id)}${epTxt} · 加入 ${esc(ckDate(x.want_at))}</div>
        ${wq}
      </div>
      <div class="wacts">
        ${done
          ? `<button class="wact" data-wundo="${esc(key)}">撤销已收</button>`
          : `<button class="wact ok" data-wdone="${esc(key)}">已下好</button>`}
        <button class="wact" data-wdel="${esc(key)}">移除</button>
      </div>
    </div>`;
  }).join('');
}

function bindWant(){
  const drawer = document.getElementById('wdrawer');
  if(!drawer) return;

  document.getElementById('wantbtn')?.addEventListener('click', ()=>{
    renderWantDrawer();
    drawer.classList.add('on');
    document.getElementById('mask')?.classList.add('on');
  });
  const close = ()=>{ drawer.classList.remove('on'); document.getElementById('mask')?.classList.remove('on'); };
  document.getElementById('wClose')?.addEventListener('click', close);
  drawer.addEventListener('click', e=>{ if(e.target === drawer) close(); });
  document.getElementById('mask')?.addEventListener('click', close);

  document.getElementById('wShowDone')?.addEventListener('click', ()=>{
    WANT.showDone = !WANT.showDone;
    const b = document.getElementById('wShowDone');
    if(b) b.textContent = WANT.showDone ? '只看待下' : '显示已收';
    renderWantDrawer();
  });
  document.getElementById('wMore')?.addEventListener('click', ()=>{
    close();
    const btn = [...document.querySelectorAll('#segView button')].find(b=>b.dataset.v==='want');
    if(btn) btn.click();
  });

  document.getElementById('wBody')?.addEventListener('click', async e=>{
    const doneBtn = e.target.closest('[data-wdone]');
    const undoBtn = e.target.closest('[data-wundo]');
    const delBtn  = e.target.closest('[data-wdel]');
    const key = (doneBtn||undoBtn||delBtn)?.dataset[doneBtn?'wdone':undoBtn?'wundo':'wdel'];
    if(!key) return;
    const [media, id] = key.split(':');
    // 「移除」= 取消待下（⛔ 不是删行，服务端写 revoked_at）
    const r = await fetch('/api/want/done', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id:Number(id), media, done: Boolean(doneBtn) }),
    });
    if(!r.ok){ alert('操作失败：HTTP ' + r.status); return; }
    const d = await r.json();
    if(d.stats) WANT.stats = d.stats;
    // 本地集合同步（⛔ 不整页重拉 —— 清单要能连续点）
    if(doneBtn) WANT.done.add(key); else WANT.done.delete(key);
    paintWantCount();

    /* 🔴 2026-10-29：点「已下好」后**不能整表重拉**。
       清单默认只查 `done_at IS NULL`，重拉的话这一条会**当场消失** ——
       用户点了「已下好」，屏幕上一行 vanish，会疑心点错了或数据没了。
       ⇒ 就地改这一条的 DOM（划线 + 换按钮）：办完的**看得见地留下**，
         下次打开抽屉才按「只看待下」把它滤掉。 */
    const item = (doneBtn||undoBtn)?.closest('.witem');
    if(item){
      const done = Boolean(doneBtn);
      item.classList.toggle('done', done);
      const tag = item.querySelector('.wtag');
      if(tag){ tag.className = 'wtag ' + (done?'done':'want'); tag.textContent = done?'已收':'待下'; }
      const acts = item.querySelector('.wacts');
      if(acts){
        acts.innerHTML = done
          ? `<button class="wact" data-wundo="${esc(key)}">撤销已收</button>`
            + `<button class="wact" data-wdel="${esc(key)}">移除</button>`
          : `<button class="wact ok" data-wdone="${esc(key)}">已下好</button>`
            + `<button class="wact" data-wdel="${esc(key)}">移除</button>`;
      }
    }
    // 卡片墙要跟着变（♥ 变绿 / 待下小标消失）
    rerenderKeep();
  });
}

/* ── 批量：标记已核对 / 加入待下 / 屏蔽（共用 SEL_MODE）───────────── */

/**
 * 批量核对（§80 需求②）
 * 蛙哥：「我点一下批量核对，可以多选一次性核对」
 * 🔴 一条请求、一个事务 —— ⛔ 不逐部打 /api/checked/toggle（选 200 部就是 200 次往返）
 */
async function bulkCheck(){
  const keys = [...SEL];
  if(!keys.length) return;
  const btn = document.getElementById('bselCheck');
  if(btn) btn.disabled = true;
  try{
    const r = await fetch('/api/checked/bulk', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ keys, on:true }),
    });
    if(!r.ok){ alert('批量核对失败：HTTP ' + r.status); return; }
    const d = await r.json();
    keys.forEach(k=>CHECKED.board.add(String(k)));
    if(d.stats) CHECKED.stats = d.stats;
    paintCheckedCount();
    try{
      const rr = await fetch('/api/checked/list');
      if(rr.ok){ const dd = await rr.json(); CHECKED.list = dd.rows || []; }
    }catch(e){}
    setSelMode(false);
    rerenderKeep();
    alert(`已标记核对 ${d.count ?? keys.length} 部`
      + (d.newly != null ? `（其中 ${d.newly} 部为新标，其余此前已核对）` : ''));
  }catch(e){
    alert('批量核对失败：' + (e && e.message ? e.message : e));
  }finally{
    if(btn) btn.disabled = SEL.size === 0;
  }
}

/**
 * 批量加入待下（§80 需求③）
 * ⚠️ 批量时不带集数快照（一次可以选几百部，逐部查 embyEps 反而慢）⇒
 *    扫 Emby 的自动闭环只对「单部点♥」过的生效（那条路有快照）。
 *    批量加入的部要手动点「已下好」—— 这条差异会在按钮 title 里讲清楚。
 */
async function bulkWant(){
  const keys = [...SEL].map(k=>{
    const w = S.works.find(x=>String(x.id)===String(k));
    return `${w ? w.mediaType : 'tv'}:${k}`;
  });
  if(!keys.length) return;
  const btn = document.getElementById('bselWant');
  if(btn) btn.disabled = true;
  try{
    const r = await fetch('/api/want/bulk', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ keys, on:true }),
    });
    if(!r.ok){ alert('批量加入待下失败：HTTP ' + r.status); return; }
    const d = await r.json();
    keys.forEach(k=>WANT.keys.add(k));
    if(d.stats) WANT.stats = d.stats;
    paintWantCount();
    setSelMode(false);
    rerenderKeep();
    alert(`已加入待下 ${d.count ?? keys.length} 部`
      + (d.newly != null ? `（其中 ${d.newly} 部为新增）` : '')
      + '\n\n补下载/入库之后，在「待下」按钮里点「已下好」收尾。');
  }catch(e){
    alert('批量加入待下失败：' + (e && e.message ? e.message : e));
  }finally{
    if(btn) btn.disabled = SEL.size === 0;
  }
}

/* ══════════════════════════════════════════════════════════════════════
   ⭐ §80 需求④ 一键扫 Emby 里番库
   ----------------------------------------------------------------------
   蛙哥：「点一下自动扫 emby 库，然后匹配新增的片做入库检测」
   流程（服务端 /api/emby/scan，容器内直连 Emby API）：
     拉全库 → 落 emby_series/emby_episode → 与上次 last_sync 做差集
     → 顺手把「待下清单里收全的」自动标已收
   ⚠️ 耗时数十秒 ⇒ 按钮必须有忙碌态（⛔ 不能让用户以为没反应又点一次）
   ══════════════════════════════════════════════════════════════════════ */
async function scanEmbyNow(){
  const btn = document.getElementById('scanBtn');
  const txt = document.getElementById('scanBtnText');
  if(!btn || btn.classList.contains('busy')) return;
  btn.classList.add('busy');
  if(txt) txt.textContent = '扫描中…';
  try{
    const r = await fetch('/api/emby/scan', { method:'POST' });
    const d = await r.json();
    if(!r.ok || !d.ok){
      // 409 = 被「假 0 防线」拦下（权限/库 id 不对），⛔ 不是网络错误，要原文告警
      alert('扫描未完成：\n' + (d.refused || d.error || ('HTTP ' + r.status)));
      return;
    }
    // 拉新数据（入库标/待下状态都要跟着变）
    await loadWant();
    await loadChecked();
    await reloadBoard();
    rerenderKeep();

    const lines = [
      `Emby 里番库：${d.series} 部 · ${d.episodes} 集（用时 ${(d.elapsedMs/1000).toFixed(1)}s）`,
      '',
      `本次新进库：${d.added.length} 部${d.addedOnBoard ? `（其中 ${d.addedOnBoard} 部看板认得出）` : ''}`,
      `新增集数：${d.addedEpisodes} 集`,
      d.removed.length ? `离开库：${d.removed.length} 部（看板会显示为未入库）` : '没有作品离开库',
    ];
    if(d.added && d.added.length){
      lines.push('', '新增明细（前 12 部）：');
      d.added.slice(0,12).forEach(x=>lines.push(`  · ${x.name || 'tmdb ' + x.tmdbId}`));
      if(d.added.length > 12) lines.push(`  … 另有 ${d.added.length-12} 部`);
    }
    if(d.autoClosed && d.autoClosed.length){
      lines.push('', `自动标为「已收」${d.autoClosed.length} 部（待下清单里已收全）：`);
      d.autoClosed.slice(0,8).forEach(x=>lines.push(`  · ${x.name || 'tmdb ' + x.tmdbId}`));
    }
    alert(lines.join('\n'));
  }catch(e){
    alert('扫描失败：' + (e && e.message ? e.message : e));
  }finally{
    btn.classList.remove('busy');
    if(txt) txt.textContent = '扫 Emby';
  }
}

/* ══════════════════════════════════════════════════════════════════════
   ⭐ §80 待下视图（蛙哥需求③）：喜欢过、还没收（以及已收的）都在这一屏
   ----------------------------------------------------------------------
   与「全览」的区别：这里**只画待下**，且分两段 —— 待下中 / 已收。
   ⛔ 不复用 filtered()：那个函数被分档计数/年份进度多处共用，
      把 VIEW 塞进去会让统计口径跟着变（0ay：解口径限制要同口径一起放开）。
   ══════════════════════════════════════════════════════════════════════ */
function renderWantWall(){
  const el = $('#main');
  const list = S.works.filter(wantOn);
  const pend = list.filter(w=>!wantDone(w));
  const done = list.filter(w=>wantDone(w));

  const hero = `<div class="wanthero">
    <div class="wi">${HEART_SVG.replace('<svg ','<svg width="19" height="19" ')}</div>
    <div>
      <h2>待下清单</h2>
      <p>点过♥还没收的部都在这里。补下载/入库之后点卡片上的♥（或这里点「已下好」）收尾；
         点一次「扫 Emby」会自动把收全的部划掉。</p>
    </div>
    <div class="wstat">
      <div><b>${pend.length}</b><span>待下</span></div>
      <div><b>${done.length}</b><span>已收</span></div>
    </div>
  </div>
  <!-- ⭐ §91 进行中的「一条龙」进度（3 秒轮询，⛔ 不重绘卡片，避免滚动跳位） -->
  <div class="wprog" id="wantProg" hidden></div>`;

  if(!list.length){
    el.innerHTML = hero + `<div class="empty"><b>还没有想收的部</b>`
      + `<div style="margin-top:8px">在任意卡片封面右上角点 ♥，或进「批量」勾一批再加「♥ 加入待下」</div></div>`;
    return;
  }

  // 按年份倒序分组（与全览同一套视觉：年份标题 + 海报墙）
  const groupHtml = (arr, note)=>{
    if(!arr.length) return '';
    const byYear = new Map();
    arr.forEach(w=>{ (byYear.get(w.year)||byYear.set(w.year,[]).get(w.year)).push(w); });
    return [...byYear.entries()].sort((a,b)=>(b[0]||0)-(a[0]||0)).map(([y,ws])=>`
      <section style="margin-bottom:30px">
        <div class="yearhead"><h2>${y ?? '—'}</h2>
          <span class="meta"><b>${ws.length}</b> 部${note?` · ${note}`:''}</span></div>
        <div class="grid">${ws.map(w=>card(w,{acts:true})).join('')}</div>
      </section>`).join('');
  };

  el.innerHTML = hero
    + groupHtml(pend, '待下')
    + (done.length
        ? `<div style="margin:26px 0 10px; display:flex; align-items:center; gap:10px">
             <span style="font-size:11px; font-weight:750; letter-spacing:.06em; color:var(--ink4)">已收 · ${done.length} 部</span>
             <span style="flex:1; height:1px; background:var(--line2)"></span></div>`
          + groupHtml(done, '已收')
        : '');
}

/* ══════════════════════════════════════════════════════════════════
   ⭐ §91（2026-10-30）待下页「一条龙 / 入库」—— 抓取 → 下载 → 刮削 → 入库
   ══════════════════════════════════════════════════════════════════
   蛙哥：「入库检测那边的抓取和下载流程已经打通了，待下页也把这套流程做出来」
        「实现抓取，下载，刮削，入库，一条龙」

   🔴 为什么按钮只放待下页：待下 = 「我还没收」的清单，正好是这条链的入口。
      全览/年份页每张卡挂两个按钮太吵，而且那两页是「看」不是「干活」。
   🔴 点击后立刻把按钮禁用 ⇒ 防连点（同一部连点 3 次 = 3 份重复任务）。
   🔴 ⛔ 不在前端做进度模拟：进度条只读 /api/dl/ingest/active 的真实数字（0r31）。 */

let WPROG_TIMER = null;

async function pollWantProgress(){
  const el = document.getElementById('wantProg');
  if(!el) return;
  try{
    const j = await fetch('/api/dl/ingest/active').then(r=>r.ok?r.json():null);
    if(!j || !j.enabled || !Array.isArray(j.rows) || !j.rows.length){
      el.hidden = true; el.innerHTML = '';
      return;
    }
    const nameOf = id => {
      const w = S.works.find(x=>Number(x.id)===Number(id));
      return (w && (w.nameZh || w.nameOriginal)) || ('#'+id);
    };
    el.hidden = false;
    el.innerHTML = `<span class="wprogt">进行中</span>` + j.rows.slice(0,8).map(r=>{
      const dl = r.dlTotal != null ? `下载 <b>${r.dlDone||0}/${r.dlTotal}</b>` : '';
      const ing = `入库 <b>${r.done||0}/${r.total||0}</b>`;
      const bad = r.failed ? `<span class="wbad">失败 ${r.failed}</span>` : '';
      const dot = r.running ? '<span class="wdot"></span>' : '';
      return `<span class="wprogi"><i>${esc(nameOf(r.workId))}</i>${dl?dl+' · ':''}${ing}${dot}${bad}</span>`;
    }).join('');
  }catch(e){ /* 接口没上线也不影响待下页（同 loadWantAudit 的处理） */ }
}

function startWantPoll(){ stopWantPoll(); WPROG_TIMER = setInterval(pollWantProgress, 3000); pollWantProgress(); }
function stopWantPoll(){ if(WPROG_TIMER){ clearInterval(WPROG_TIMER); WPROG_TIMER = null; } }

/* 按钮点击（事件委托：待下页卡片是整批重绘的，⛔ 不能给每张卡单独绑） */
document.addEventListener('click', async (e)=>{
  const b = e.target.closest && e.target.closest('.wactb');
  if(!b) return;
  const [, idStr] = String(b.dataset.wid||'').split(':');
  const workId = Number(idStr);
  if(!Number.isFinite(workId) || workId<=0) return;
  if(b.disabled) return;
  const act = b.dataset.act;
  const w = S.works.find(x=>Number(x.id)===workId) || {};
  const name = w.nameZh || w.nameOriginal || `#${workId}`;
  const box = b.parentElement;
  const btns = box ? [...box.querySelectorAll('button')] : [];
  btns.forEach(x=>{ x.disabled = true; });
  b.classList.add('busy');
  try{
    const r = await fetch(act==='oneshot' ? '/api/dl/oneshot' : '/api/dl/ingest', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ workId }),
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok || !j.ok){
      toast(`❌ ${name}：${j.error || ('HTTP '+r.status)}`, 'bad');
    } else if(act==='oneshot'){
      const miss = j.download && j.download.missing || 0;
      const q = j.ingest && j.ingest.queued || 0;
      toast(`⬇ ${name}：${miss} 集进下载队列，${q} 集待刮削。下完自动入库，关页面也不停`, 'info', 6000);
    } else {
      toast(`📥 ${name}：立刻刮削 ${j.queued||0} 集，等下载 ${j.waiting||0} 集`, 'info', 6000);
    }
    // 数字变了才能重新拉 audit（不然卡片还显示旧的「已下 N」）
    await loadWantAudit();
    if(VIEW==='want') renderWantWall();
    setTimeout(pollWantProgress, 800);
  }catch(err){
    toast(`❌ 请求失败：${(err && err.message) || err}`, 'bad');
    btns.forEach(x=>{ x.disabled = false; });
  }finally{
    b.classList.remove('busy');
  }
});

function render(){
  const list = filtered();
  const el = $('#main');
  // 🔴 2026-10-18：搜索跨年份时必须说清搜索范围，否则用户以为只搜了当前年份
  // ⭐ §77：入库档可多选 ⇒ hint 列出**所有已勾档**（并集），不再是单档
  const STL = {full:'全部入库', part:'部分入库', none:'未入库'};
  const stOn = [...S.st].map(k=>STL[k]);
  const stLabel = stOn.length ? stOn.join(' + ') : '';
  // ⭐ §77：分档总数 = 各已勾档在**其它条件**下的部数之和（并集口径，与实际筛出的一致）
  const stTotal = (()=>{
    if(!S.st.size) return 0;
    let n=0;
    for(const w of filtered({skipSt:true, skipYear:true})){
      const st = embyStatus(w);
      if(st && S.st.has(st)) n++;
    }
    return n;
  })();
  // 🔴 §78：hint 必须说清**当前能得到多少** + **全库多少**。
  //    旧版「不限」只写 list.length（=年份锁后的数，如 39），而按钮上挂着全库 1268 ⇒ 数字对不上像骗人。
  //    现在所有形态都并列给出全库数，且「不限」的实际数 = 实际筛出部数（0cs：口径讲出来别让人猜）。
  //    ⛔ 文案要**短**：.bar 是 flex-wrap:wrap，hint 一长整条工具栏就换行（实测 63px → 109px）。
  const allN = (()=>{ let n=0; for(const w of filtered({skipSt:true, skipYear:true})) n++; return n; })();
  $('#hint').textContent = S.q.trim()
    ? `全库 ${S.works.length} 部中匹配 ${list.length} 部（跨全部年份）`
    : (stLabel ? `${stLabel} ${stTotal} 部（全库 ${allN} 部）`
      : (list.length
        ? `${S.year ? `${S.year} 年 ` : ''}${list.length} 部 / 全库 ${allN} 部`
        : ''));

  if(!list.length){
    // 🔴 2026-10-18：搜索是**全库**的，搜不到就说全库没有，别让用户以为只是这一年份没有。
    if(S.q.trim()){
      const extra=[];
      if(S.type) extra.push('类型筛选');
      if(S.src) extra.push('来源筛选');
      if(S.onlyCover) extra.push('只看有封面');
      if(S.onlyPm) extra.push('只看泡麵番');
      if(S.onlyUnchecked) extra.push('只看未核对');
      if(S.onlyChecked) extra.push('只看已核对');
      if(S.st.size) extra.push(stLabel);
      el.innerHTML = `<div class="empty"><b>全库 ${S.works.length} 部里没有匹配「${esc(S.q.trim())}」的作品</b>`+
        (extra.length?`<div style="margin-top:8px">当前还开着：${extra.join(' · ')} —— 清掉筛选再搜一次</div>`:
        `<div style="margin-top:8px">已跨全部年份搜索，不是只搜了 ${S.year??'—'} 年</div>`)+`</div>`;
      return;
    }
    if(S.onlyUnchecked){
      const yT = S.year ? yearTotal(S.year) : 0;
      const yC = S.year ? yearChecked(S.year) : 0;
      el.innerHTML = `<div class="empty"><b>${yT&&yC>=yT ? `${S.year} 年这 ${yT} 部都核完了` : '当前筛选下没有未核对的作品'}</b>`
        + `<div style="margin-top:8px">取消勾选「只看未核对」可以回看已核过的</div></div>`;
      return;
    }
    // ⭐ §77 只看已核对为空 ⇒ 说清是「都还没核」还是「被别的条件筛没了」
    if(S.onlyChecked){
      el.innerHTML = `<div class="empty"><b>当前筛选下没有已核对的作品</b>`
        + `<div style="margin-top:8px">你还没核对过这些部 —— 取消勾选「只看已核对」可以看全部</div></div>`;
      return;
    }
    // ⭐ §75/§77：入库档为空 ⇒ 说清是「这一档本来就没有」还是「被别的条件筛没了」
    if(S.st.size){
      el.innerHTML = `<div class="empty"><b>当前筛选下没有「${stLabel}」的作品</b>`
        + `<div style="margin-top:8px">${S.year ? `${S.year} 年` : '全库'}这些档共 ${stTotal} 部`
        + (stTotal ? ' —— 被年份/其它筛选条件挡掉了，点「不限」看全部' : ' —— 全库就没有这些档') + `</div></div>`;
      return;
    }
    el.innerHTML = '<div class="empty"><b>没有匹配的作品</b>换个筛选条件试试</div>';
    return;
  }

  // 按年分组（搜索/筛选时不分组）
  if(S.q.trim() || S.type || S.src){
    el.innerHTML = `<div class="grid">${list.map(card).join('')}</div>`;
    return;
  }

  const byYear = new Map();
  list.forEach(w=>{ (byYear.get(w.year)||byYear.set(w.year,[]).get(w.year)).push(w); });
  // 🔴 2026-10-20 12:5x：服务端已过滤被屏蔽的作品（board.ts visibleEx），
  //    ⇒ 「已屏蔽 N 部」的**数据源改成屏蔽清单**，⛔ 不再从作品列表里找。
  //    为什么：作品列表里已经没有它们了 ⇒ 靠列表过滤出来的折叠条永远是空的。
  const hidByYear = new Map();
  (HIDDEN_LIST_CACHE || []).forEach(x=>{
    const y = x.year ?? '';
    (hidByYear.get(y) || hidByYear.set(y,[]).get(y)).push(x);
  });
  el.innerHTML = [...byYear.entries()].sort((a,b)=>b[0]-a[0]).map(([y,ws])=>{
    const hid = hidByYear.get(y) || [];
    const vis = ws;   // ⭐ 服务端已过滤 ⇒ 列表里的就是全部可见的
    /* ⭐ 本年核对进度（2026-10-24）：分子=该年已核对，分母=该年**可见**作品数。
       🔴 分母⛔ 不用 vis.length（那是当前筛选后的），否则勾「只看未核对」时
          分母跟着缩、进度瞬间变好看 = 假进度。 */
    const yT = yearTotal(y), yC = yearChecked(y);
    const yck = yT ? `<span class="yck${yC>=yT?' done':''}" title="本年已核对 ${yC} / 可见 ${yT} 部">已核 ${yC}/${yT}</span>` : '';
    const meta = `<span class="meta"><b>${vis.length}</b> 部 · 剧集 ${vis.filter(w=>w.mediaType==='tv').length} · 剧场 ${vis.filter(w=>w.mediaType==='movie').length}`
      + (hid.length?` · <span style="color:var(--ink3)">已屏蔽 ${hid.length}</span>`:'') + `</span>` + yck;
    const grid = vis.length ? `<div class="grid">${vis.map(card).join('')}</div>` : '';
    const hiddenPart = hid.length ? hiddenBarFor(y, hid) : '';
    return `
    <section style="margin-bottom:38px">
      <div class="yearhead"><h2>${y}</h2>${meta}</div>
      ${grid}${hiddenPart}
    </section>`;
  }).join('');
}

/* 🔴 2026-10-23：`armHoverLoad` 已删除。
   它做的是「悬停时把原图注入卡片」—— 那正是蛙哥指出的泄漏点：

   现在 blur 档直接渲染预生成的模糊图（见 card()），**不存在任何悬停取原图的路径**。 */


/**
 * ⭐ §91 待下页的两个动作按钮（2026-10-30）
 *
 * 蛙哥：「待下页也把这套流程做出来」「抓取，下载，刮削，入库，一条龙」
 *
 * 🔴 两个按钮的区别必须写在 title 里，否则用户不敢点：
 *   - 一条龙 = 缺集下载 + 已下的刮削 + 全进 115（**会花时间**，界面不阻塞）
 *   - 入库   = 只把**已经下好**的送进刮削，不重新下载（补入库用）
 */
function wantActions(w){
  const id = `${w.mediaType}:${w.id}`;
  const a = WANTAUDIT.get(id) || {};
  const hint = (a.dlEps||a.ingEps)
    ? `<span class="wacthint">已下 ${a.dlEps||0} · 入库 ${a.ingEps||0}</span>` : '';
  return `<div class="wact">
    <button class="wactb go" data-act="oneshot" data-wid="${id}"
      title="一条龙：把这部缺的集下载下来 → 逐集刮削改名 → 复制进 115 媒体库。后台跑，关掉浏览器也不停">
      <b>⬇</b> 一条龙</button>
    <button class="wactb" data-act="ingest" data-wid="${id}"
      title="只入库：把已经下载好的集做刮削改名、复制进 115（不重新下载）。补入库、或一条龙跑完个别失败时用">
      <b>📥</b> 入库</button>
    ${hint}
  </div>`;
}

/* ⛔ §152：tagMkLine()（海报墙卡片上的红/绿角标）整段删除。
   蛙哥：「我只想在二级看板里的 hanime 标签展示而已，而不是全局显示」
   ⇒ 海报墙上不再出现任何标签痕迹，标记只在抽屉来源列生效。 */

function card(w, opts){
  // 中文优先；TMDB 未收录中文名时退回原始标题，并显式标注「无中文」
  const hasZh = Boolean(w.nameZh && w.nameZh !== w.nameOriginal);
  const title = w.nameZh || w.nameOriginal || '(无标题)';
  const sub   = hasZh && w.nameOriginal ? w.nameOriginal : '';
  const noZh  = hasZh ? '' : '<span class="nozh" title="TMDB 未收录中文译名">无中文</span>';
  /* 「无中文」是**标题的属性**（TMDB 没收录译名），不是封面的属性 ——
     2026-10-21 视觉重制：放封面上会和右上角的「泡麵番」徽标抢位置。 */
  // ⚠️ 安全模式下不写 <img>：图片根本不进网络传输，
  //    纯 CSS 模糊等于「传了再遮挡」，对隐私无效。
  //    模糊档改为悬停时按需注入 img —— 既能预览，又不会一屏几百张全传。
  let img;
  if (!w.posterLocal) {
    img = `<div class="ph">无封面</div>`;
  } else if (S.safe === 'hide') {
    img = lockCover();
  } else if (S.safe === 'blur') {
    /* 🔴 2026-10-23 蛙哥定调改版：blur 档**直接渲染预生成模糊图**，悬停也不解模糊。
       旧版是「锁图标 → 悬停注入原图」⇒ 鼠标一停就能看到清晰图，等于给了绕过口。
       现在请求的就是磁盘上那张糊图，原图**根本不进网络**（看 DevTools 也只有糊图）。 */
    img = w.posterBlur
      ? `<img class="blurimg" src="${esc(w.posterBlur)}" alt="" loading="lazy"
           onerror="this.style.visibility='hidden'">`
      : `<div class="lockcover">${LOCK_SVG}
           <span class="lt">无模糊图</span></div>`;
  } else {
    img = `<img src="${esc(w.posterLocal)}" alt="${esc(title)}" loading="lazy">`;
  }
  const tag = w.mediaType==='movie' ? '<span class="tag mv">剧场</span>' : '';
  /* ⭐ 全集入库标（2026-10-27 §71）
     蛙哥原话：「再做一个全集入库的标识，直接在 8848 看板就能看到的，不用点进去
     二级菜单就看得出来，哪一部已经全集入库了」。
     · embyEps 是 null ⇒ 还没同步过，什么都不画（0cs：不知道 ≠ 没有），保持原「N 集」
     · 全集  → 绿底 ✓（唯一判据 embyFull，后端算好，前端不自己比大小）
     · 部分  → 「5/9」黑底（能看出还差多少，但不像全集那样抢眼）
     ⛔ 分母用后端给的 embyNeed（tmdb_episode 实际行数，已剔除屏蔽季），
        ⛔ 不能用 w.episodeTotal（TMDB 快照，实测有 4 部两者不等） */
  const epFull = w.embyFull === true;
  const epPart = !epFull && typeof w.embyEps === 'number' && w.embyEps > 0
                 && typeof w.embyNeed === 'number' && w.embyNeed > 0;
  /* ⭐ 2026-10-27（§73）人工确认入库 —— 蛙哥：「人工标记后的效果和 ai 识别无问题的效果一样」
     ⇒ **视觉完全一致**（都是绿底 ✓ N 集），⛔ 不造第二套标。
     区别只写进 tooltip：出处 + 过期警告，可审计但不干扰扫读。 */
  const epNum = (typeof w.embyEps === 'number' && typeof w.embyNeed === 'number')
    ? `${w.embyEps}/${w.embyNeed} 集` : '';
  const verNote = !w.embyVerified ? ''
    : w.embyVerifyStale
      ? ` · 人工确认（⚠ 确认后数据已变${epNum?`：现 ${epNum}`:''}，请复核）`
      : ` · 人工确认${epNum?`（Emby 现收 ${epNum}）`:''}`;
  /* §74：被集级排除的集要说出来 —— 否则「✓ 10 集」但实际只算 8 集，看着像数字错了。
     换个说法比藏起来好：TMDB 的 10 集是事实，有效 8 集是我们的口径（0cs）。 */
  const exN = w.embyExcluded || 0;
  const exNote = exN > 0 ? ` · 已排除 ${exN} 集（TMDB 假集/无资源）` : '';
  const ep  = w.episodeTotal
    ? epFull
      ? `<span class="badge efull" title="已全集入库：Emby 里番库收录 ${w.embyEps}/${w.embyNeed} 集${exNote}${verNote}">✓ ${w.episodeTotal} 集${w.embyVerifyStale?' ⚠':''}</span>`
      : epPart
        ? `<span class="badge epart" title="Emby 已收录 ${w.embyEps} / ${w.embyNeed} 集，还差 ${w.embyNeed - w.embyEps} 集${exNote}">${w.embyEps}/${w.embyNeed}</span>`
        : `<span class="badge">${w.episodeTotal} 集</span>`
    : `<span class="badge none">季集未拉</span>`;
  // ⭐ 溯源徽标：双源互证 / 仅单源。放在封面左上，不挤标题。
  const srcb = w.srcBadge
    ? `<span class="srcbadge sm ${srcBadgeCls(w.srcKinds)}" title="这条 TMDB 信息是从哪些源作品匹配出来的；点开卡片看源片名">${esc(w.srcBadge)}</span>`
    : '';
  /* ⭐ 泡麵番标识（用户 2026-10-15）：泡麵番只有 hanime 有记录是**正常**的，
     M-TEAM 不收短篇。标识出来用户才知道「只有 hanime」不是数据缺口。
     放在封面右上，与左侧的来源徽标不打架。 */
  const pmb = w.isPaomian
    ? `<span class="srcbadge sm pm" title="泡麵番（hanime 短篇）。M-TEAM 不收短篇，所以这类作品只有 hanime 记录是正常的，不是数据缺口">泡麵番</span>`
    : '';
  /* ⭐ 年份提到标题行（2026-10-21 视觉重制）：
     以前年份只藏在「剧集/剧场」筛选里，卡面看不到年份 ⇒ 扫一屏海报
     无法定位到「2008 年那批」。现在年份是标题旁的一枚等宽小标签。 */
  const yrTag = w.year ? `<span class="cyr">${w.year}</span>` : '';
  /* ⭐ 人工核对标记（2026-10-24）：整卡绿色描边 + 标题前 ✓。
     ⛔ 不占封面的四个角（左上来源/右上泡麵番/左下剧场/右下集数）⇒ 不压字。 */
  const ck = chkOn(w);
  const cki = ck ? '<span class="chki" title="我已核对过这部，没问题">✓</span>' : '';
  /* ⭐ 批量屏蔽（2026-10-26）：选择模式下才挂勾选框 ——
     ⛔ 平时不渲染，避免 1421 张卡片各多一个 DOM 节点（也避免误以为是可点复选框）。 */
  const on = SEL_MODE && SEL.has(String(w.id));
  const box = SEL_MODE ? '<span class="bselbox" aria-hidden="true"></span>' : '';
  /* ⭐ §80 需求③：♥ 待下按钮
     - 位置固定封面右上；泡麵番徽标已下移到 top:38px 让位（两枚永不重叠）
     - 未喜欢 = 悬停才显形（一屏上百张卡，常驻会糊成一片红）
     - 已喜欢 = 常驻玫瑰实心；已收 = 绿色（扫 Emby 收全后自动变绿）
     - ⛔ 批量模式下它仍然可点 —— 但那不属于「勾选」，事件里要 stopPropagation */
  /* ⭐ §91：只有待下页要「一条龙 / 入库」按钮（其它视图每张卡挂两个按钮太吵） */
  const acts = opts && opts.acts ? wantActions(w) : '';
  const wOn = wantOn(w), wDone = wantDone(w);
  const wTitle = wOn
    ? (wDone ? '已收（扫 Emby 时收全了）· 点一下取消待下' : '待下中 · 点一下取消')
    : '加入待下（空了去补下载）';
  const wantBtn = `<button class="wantbtn" data-want="${w.mediaType}:${w.id}" title="${wTitle}"
      aria-label="待下">${HEART_SVG}</button>`;
  /* ⭐ §87（2026-10-30 蛙哥：「待下，对齐 hanime 和下载链接」）：
     待下页每张卡直接标「直链 N/M」—— N = 抓到直链的条数，M = 源站这部一共几条视频。
     ⛔ 缺一条就露出来（红色），别让人点进抽屉才发现下不了。
     ⚠️ 数据来自 `/api/dl/want-audit`，只覆盖**待下清单里的部**；其它视图不显示（WANTAUDIT 空） */
  const lkSub = (w) => {
    const a = WANTAUDIT.get(`${w.mediaType}:${w.id}`);
    if(!a) return '';
    /* ⭐ §89：「已下 N 集」—— 待下是人工标记，下载多少集不会自动改它，
       所以把已下数摆在卡上，让人一眼看出该不该点「已收」（⛔ 不替他自动改标记）。 */
    const dl = a.dlEps
      ? `<span class="lkat dl" title="这部已经下到本地 ${a.dlEps} 集（在「下载」页能看到明细）">已下 ${a.dlEps}</span>`
      : '';
    /* ⭐ §91：「入库 N」与「已下 N」分开报 —— 下完了 ≠ 进 115 媒体库了。
       下载落在待整理目录，入库是刮削+改名+复制到 115（带 nfo/封面）。
       两个数字摆一起，一眼看出卡在哪一环。 */
    const ing = a.ingEps
      ? `<span class="lkat ing" title="已经刮削进 115 媒体库 ${a.ingEps} 集（nfo + 封面已齐）">入库 ${a.ingEps}</span>`
      : '';
    const pre = dl + ing;
    if(!a.srcN) return pre || `<span class="lkat none" title="hanime 没有这部作品的源记录（可能只有 mteam）">无源</span>`;
    const miss = a.srcN - a.linkN;
    const exp = a.expN ? ` · ${a.expN} 条签名过期` : '';
    return pre + `<span class="lkat ${miss?'warn':'ok'}"
      title="hanime 源站这部共 ${a.srcN} 条视频，其中 ${a.linkN} 条已抓到直链${miss?`，${miss} 条还没抓到`:''}${exp}">直链 ${a.linkN}/${a.srcN}</span>`;
  };
  return `<article class="card${ck?' wchk':''}${wOn?' want':''}${wOn&&!wDone?' wpending':''}${wDone?' cwantdone':''}${SEL_MODE?' bsel-mode':''}${on?' bsel-on':''}" data-id="${w.id}" data-media="${w.mediaType}">
    <div class="poster">${box}${img}${wantBtn}${tag}${ep}<div class="tlb">${srcb}${pmb}</div></div>
    <div class="cmeta">
      <div class="ctitle">${cki}${esc(title)}</div>
      <div class="csub">${yrTag}${noZh}${lkSub(w)}${sub?`<span class="ja">${esc(sub)}</span>`:''}</div>
      ${acts}
    </div>
  </article>`;
}

/* ── 抽屉：统一挂载（概览 / 溯源 / 季集 三页签）────────────────
   2026-10-21 视觉重制。原来三块内容一次性铺满抽屉 ⇒ 一屏全是字，
   看完标题就淹没在溯源长句里。现在拆成页签：
     概览 = 结论横幅 + 关键指标 + 基本信息
     溯源 = 六因子网格 + 双口径 + 逐条源记录
     季集 = 分集网格
   ⚠️ 数据一个字段没少、判定口径一个没改，只是换了摆放顺序。      */
const DRAWER = { sections:null, cur:null, seq:[], idx:-1, seqKind:'' };

/* ══════ §82 抽屉翻页（2026-10-29 蛙哥：「加一个上一部下一部的切换，让我一部一部切换核对」）
   🔴 序列在**打开抽屉那一刻快照**（当时 filtered() 的结果），翻页只走这份快照。
      不这么做的话：点「屏蔽这部」→ 列表少一项 → 再翻就跳部，翻十部能错三位。
   🔴 seqKind 决定翻页时调哪个 open 函数：'board' → openDetail，'intake' → openIntake。 */

/* 预取缓存：翻页那一刻直接读，不白屏。
   ⚠️ 只在 stepDetail 里使用 —— 正常打开/操作后重开**一律现取**，
      否则「刚确认入库又显示未确认」这种脏数据会让人以为没生效（0gh）。 */
const PREFETCH = new Map();

/** 序列条目 —— 只存翻页必需的 {id, media}，不缓存整份作品对象 */
function seqItemOf(w){ return { id:Number(w.id), media:w.mediaType || 'tv' }; }

/**
 * 建立翻页序列（当前 id 已在同类型序列里就复用，不重建）。
 * board → 用 `filtered()`，即**屏幕上看到的顺序**（年份锁/搜索/各种筛选全部生效）。
 */
function ensureSeq(id, kind){
  if(DRAWER.seqKind === kind && DRAWER.seq.some(x=>x.id === id)){
    DRAWER.idx = DRAWER.seq.findIndex(x=>x.id === id);
    return;
  }
  DRAWER.seqKind = kind;
  if(kind === 'board') DRAWER.seq = filtered().map(seqItemOf);
  // 兜底：不在当前列表里（比如从别处直接打开）也要能翻，⛔ 不能变成空序列
  if(!DRAWER.seq.some(x=>x.id === id)) DRAWER.seq.push({ id, media:'tv' });
  DRAWER.idx = DRAWER.seq.findIndex(x=>x.id === id);
}

/**
 * ⭐ §82：入库检测抽屉的翻页序列 = **缺集清单的顺序**（不是海报墙顺序）。
 * ⚠️ 清单里没有这一部（比如从四色概览点进来的「齐集」部）⇒ 补进序列，照样能翻，
 *    否则从概览点进来的部一旦索引是 -1，整条导航就永远灰着。
 */
function ensureIntakeSeq(id){
  const ids = (INTAKE.short || [])
    .map(x => Number(x.workId))
    .filter(Number.isFinite);
  if(DRAWER.seqKind !== 'intake' || !DRAWER.seq.some(x=>x.id === id)){
    DRAWER.seqKind = 'intake';
    DRAWER.seq = ids.map(i => ({ id:i, media:'tv' }));
  }
  if(!DRAWER.seq.some(x=>x.id === id)) DRAWER.seq.push({ id, media:'tv' });
  DRAWER.idx = DRAWER.seq.findIndex(x=>x.id === id);
}

function navFooterHtml(){
  const n = DRAWER.seq.length, i = DRAWER.idx;
  if(n === 0 || i < 0) return '';
  const first = i <= 0, last = i >= n - 1;
  return `
    <button class="dnav-b" data-nav="-1" ${first?'disabled':''} title="上一部（←）">‹ 上一部</button>
    <span class="dnav-pos">第 <b>${i+1}</b> / ${n} 部</span>
    <button class="dnav-b" data-nav="1" ${last?'disabled':''} title="下一部（→）">下一部 ›</button>
    ${n > 1 && last ? '<span class="dnav-hint">本批已到底</span>' : ''}`;
}

/** 翻页：delta = -1 / +1（连点只认第一次，避免两次响应乱序） */
let NAVBUSY = false;
async function stepDetail(delta){
  if(NAVBUSY) return;
  const i = DRAWER.idx + delta;
  if(!Number.isFinite(i) || i < 0 || i >= DRAWER.seq.length) return;
  const item = DRAWER.seq[i];
  if(!item) return;
  NAVBUSY = true;
  const btns = [...document.querySelectorAll('#dNav [data-nav]')];
  btns.forEach(b=>{ b.disabled = true; });
  try{
    const key = (DRAWER.seqKind === 'intake' ? 'i:' : 'd:') + item.id;
    const pre = PREFETCH.get(key) || null;
    PREFETCH.delete(key);
    if(DRAWER.seqKind === 'intake') await openIntake(item.id, { preloaded:pre });
    else await openDetail(item.id, item.media, DRAWER.cur || 'align', { preloaded:pre });
    const body = $('#dBody'); if(body) body.scrollTop = 0;   // 新内容从头看
    prefetchNeighbor(1);                                      // 顺手把下一部取回来
  }finally{ NAVBUSY = false; }
}

/** 预取相邻的一部（只取数据，⛔ 不碰任何状态） */
function prefetchNeighbor(delta){
  const nx = DRAWER.seq[DRAWER.idx + delta];
  if(!nx) return;
  const key = (DRAWER.seqKind === 'intake' ? 'i:' : 'd:') + nx.id;
  if(PREFETCH.has(key)) return;
  const url = DRAWER.seqKind === 'intake'
    ? '/api/intake/work/' + nx.id
    : `/api/board/work/${nx.id}?media=${nx.media || 'tv'}`;
  fetch(url).then(r=>r.ok?r.json():null)
    .then(j=>{ if(j && !j.error) PREFETCH.set(key, j); })
    .catch(()=>{});
}

/** 底部导航条点击 —— 只挂一次 */
function bindDrawerNav(){
  const nav = $('#dNav');
  if(!nav || nav._bound) return;
  nav._bound = true;
  nav.addEventListener('click', (e)=>{
    const b = e.target.closest('[data-nav]');
    if(!b || b.disabled) return;
    e.preventDefault(); e.stopPropagation();
    stepDetail(Number(b.dataset.nav));
  });
}

/* 键盘 ←/→：只有抽屉开着、且焦点不在输入框里才生效 */
document.addEventListener('keydown', (e)=>{
  if(!$('#drawer').classList.contains('on')) return;
  const t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key === 'ArrowLeft'){ e.preventDefault(); stepDetail(-1); }
  if(e.key === 'ArrowRight'){ e.preventDefault(); stepDetail(1); }
});

function mountDrawer(title, meta, thumb, sections, defaultTab, footer, opts={}){
  $('#dTitle').textContent = title;
  $('#dMeta').innerHTML = meta;
  const th = $('#dThumb');
  if(thumb && S.safe!=='hide'){ th.src = thumb; th.hidden = false; }
  else { th.removeAttribute('src'); th.hidden = true; }
  DRAWER.sections = sections;
  DRAWER.cur = (defaultTab && sections.some(s=>s.key===defaultTab)) ? defaultTab : sections[0].key;
  /* ⭐ 2026-10-27（§73 蛙哥「溯源取消、季集取消」）：
     只剩一个页签时**不画页签栏** —— 一个孤零零的按钮不叫页签，是噪音。 */
  $('#dTabs').innerHTML = sections.length > 1
    ? sections.map(s=>
        `<button data-t="${s.key}" class="${s.key===DRAWER.cur?'on':''}">${esc(s.label)}${
          s.count!=null ? `<span class="n${s.alert?' alert':''}">${s.count}</span>` : ''}</button>`).join('')
    : '';
  $('#dBody').innerHTML = (sections.find(s=>s.key===DRAWER.cur)||{}).html || '';
  /* ⭐ §82：底部翻页条。不传 footer ⇒ 整条收起来（别处调用的人不受影响） */
  const nav = $('#dNav');
  /* ⭐ §87：「标记已核对 / 确认入库 / 屏蔽这部」三个按钮的位置由这里决定。
     🔴 必须在 `nav.innerHTML = footer` **之前**把节点收回头部 ——
        否则上一次append进 nav 的那份会被 innerHTML 直接摧毁（节点连内容一起没了，
        再 append 就是个空 div）。 */
  const acts = $('#dActs');
  const dhead = document.querySelector('.dhead');
  const dclose = $('#dClose');
  if(acts && dhead && dclose && acts.parentElement !== dhead){
    dhead.insertBefore(acts, dclose);
  }
  if(nav){
    if(footer){ nav.innerHTML = footer; nav.style.display = ''; bindDrawerNav(); }
    else { nav.innerHTML = ''; nav.style.display = 'none'; }
  }
  /* 详情抽屉 → 搬到底部翻页条同一行（蛙哥：「核完直接按下一部」）；
     入库检测 → 留在头部，由 openIntake 把它们全部隐藏。 */
  if(acts && opts.actsInNav && footer && nav) nav.appendChild(acts);
  $('#drawer').classList.add('on'); $('#mask').classList.add('on');
}

/* ── 详情抽屉 ─────────────────────────────────────────── */
/* ⭐ 2026-10-26（§69 ⑥）：第三参 `tab` —— 季级屏蔽操作完要重开详情，
   若不指定页签会跳回「对齐表」，用户在「季集」点的按钮就断片了。
   ⭐ §82：第四参 `opt` —— `{ preloaded }` 由翻页预取塞进来，省掉一次请求。 */
async function openDetail(id, mediaType='tv', tab='align', opt={}){
  let j = opt.preloaded || null;
  if(!j){
    const r = await fetch(`/api/board/work/${id}?media=${mediaType}`);
    if(r.status === 401){ location.href = '/login?next=' + encodeURIComponent(location.pathname); return; }
    if(!r.ok) return;
    j = await r.json();
  }
  const {work:w, episodes:eps, evidence:ev, alignment, local, hiddenSeasons,
         hiddenEpisodes, videoMeta} = j;
  /* ⭐ 记下当前抽屉身份 —— 切安全档时 applySafe() 靠它按新档位重渲染同一部 */
  /* ⭐ §73：连 embyEps/embyNeed 一起记 —— 人工确认时要把「你看到的 8 / 10」
     作为快照传给后端（事后回查口径可能已经变了，那就不是"确认时看到的数"）。 */
  S.detail = { id, media: mediaType, embyEps: w.embyEps, embyNeed: w.embyNeed };

  const hasZh = Boolean(w.nameZh && w.nameZh !== w.nameOriginal);
  const title = w.nameZh || w.nameOriginal || '(无标题)';

  // 安全模式：off 原图 / blur 模糊图 / hide 不挂图（抽屉里同样不泄露）
  const thumb = S.safe === 'off'   ? (w.posterLocal || null)
              : S.safe === 'blur'  ? (w.posterBlur  || null)
              : null;

  /* ⭐ 泡麵番标识（用户 2026-10-15）：详情里也标出来，
     理由同卡面 —— M-TEAM 不收短篇，「只有 hanime」对泡麵番是正常的。 */
  const pmTag = w.isPaomian
    ? `<span class="srcbadge pm" title="泡麵番（hanime 短篇）。M-TEAM 不收短篇，所以只有 hanime 记录是正常的，不是数据缺口">泡麵番</span>`
    : '';
  /* ⭐ 2026-10-22 按蛙哥设计图重排头部：**年份 | tmdbid | 剧集简介** 一行。
     原来是一串等宽小字（年份/tmdb/类型/集数），挤在 660px 抽屉里看着像一坨。

     🔴🔴 2026-10-31 §107 修正（蛙哥：「看板好多提示 TMDB 无简介，但我去看是有的」）：
        旧注释说「TMDB 作品级没有 overview 字段（表里只有 tmdb_episode.overview）
        ⇒ 取第一个有简介的集」——**这个前提是错的**：
          · TMDB **作品级**接口本来就有 overview（实测 #103258 = 274 字中文）
          · 是**我们库里没存**这一列（tmdb_work 没有 overview 列）
          · 而这批作品的**集级** overview 在 TMDB 上**真的是空的**
            （实测 ep1/ep2/ep3 长度均为 0）⇒ 旧兜底路径必然落空
          · ⇒ 855/1635 部在看板误报「TMDB 无简介」
        现在：作品级优先（w.overview），没有才回退集级（老逻辑留着当兜底）。 */
  /* ⭐ §112：过一道垃圾闸（TMDB 上有词条被刷成「Episode nothing」/垃圾站网址）。 */
  const desc = cleanOverview(w.overview) || (eps.map(epOvText).find(Boolean) || '');
  const meta =
    `<span class="num">${w.year||'—'}</span>` +
    `<span class="sep">|</span>` +
    `<span>tmdb <b class="num">${w.id}</b></span>` +
    `<span class="sep">|</span>` +
    `<span>${w.mediaType==='tv'?'剧集':'剧场版'} · ${eps.length} 集</span>` +
    `<span class="sep">|</span>` +
    /* ⚠️ 兜底文案要**如实**：区分「TMDB 上确实没简介」与「还没抓到」。
        0cs：接口缺字段要兜底成「没有」，但⛔ 不能把「没抓到」说成「没有」。 */
    `<span class="desc">${desc ? esc(String(desc).replace(/\s+/g,' ')) : 'TMDB 确实没简介'}</span>` +
    pmTag;

  /* ⭐ 已核对按钮（2026-10-24 蛙哥）：「确认这一部没问题」⇒ 打勾留凭证。
     ⛔ 与屏蔽语义相反 —— 核对过的部照常显示，不参与任何过滤。 */
  {
    const btn = $('#dCheckBtn');
    const on = CHECKED.board.has(String(w.id));
    btn.style.display = '';
    btn.classList.toggle('on', on);
    btn.textContent = on ? '✓ 已核对' : '标记已核对';
    btn.title = on
      ? '点一下取消核对标记（⛔ 不会动任何作品数据）'
      : '我核对过这一部、确认没问题';
    btn.onclick = async (ev)=>{
      ev.stopPropagation();
      btn.disabled = true;
      const act = await toggleCheck(String(w.id));
      btn.disabled = false;
      if(act == null) return;
      const now = CHECKED.board.has(String(w.id));
      btn.classList.toggle('on', now);
      btn.textContent = now ? '✓ 已核对' : '标记已核对';
      rerenderKeep();
    };
  }

  /* ⭐ 2026-10-31（§108 蛙哥）：「标记已核对右边加一个收藏或者加入待下，
     和加入待下同一个运行逻辑」⇒ 就是卡面 ♥ 那条路（toggleWant，带 embyEps/embyNeed 快照）。
     🔴 快照必须传当前这部真实值 —— 扫 Emby 时靠它判断「这期间收全了没」，
        ⛔ 传 null 就等于让自动闭环失效（只能手动点「已下好」）。 */
  {
    const btn = $('#dWantBtn');
    const on = wantOn(w), done = wantDone(w);
    btn.style.display = '';
    btn.classList.toggle('on', on && !done);
    btn.classList.toggle('done', on && done);
    btn.textContent = !on ? '♥ 加入待下' : (done ? '✓ 已收待下' : '♥ 待下中');
    btn.title = on
      ? (done ? '已收全（扫 Emby 时自动闭环）· 点一下取消待下' : '在待下清单里 · 点一下取消')
      : '加入待下（空了去补下载/入库）· 与卡面 ♥、批量「加入待下」同一条逻辑';
    btn.onclick = async (ev)=>{
      ev.stopPropagation();
      btn.disabled = true;
      let act = null;
      try{
        act = await toggleWant(w.id, w.mediaType, w.embyEps, w.embyNeed);
      }finally{
        btn.disabled = false;
      }
      if(act == null) return;
      /* 卡面 ♥ 要跟着变 ⇒ 重渲染；抽屉里的按钮文案就地更新（不重开抽屉，避免丢滚动位置） */
      const nowOn = wantOn(w), nowDone = wantDone(w);
      btn.classList.toggle('on', nowOn && !nowDone);
      btn.classList.toggle('done', nowOn && nowDone);
      btn.textContent = !nowOn ? '♥ 加入待下' : (nowDone ? '✓ 已收待下' : '♥ 待下中');
      rerenderKeep();
    };
  }

  /* ⭐ 人工确认入库按钮（2026-10-27 §73 起；§74 蛙哥改为**常驻全局**）
     「这个我希望是做成全局的，不是某一部ai确认我再人工确认，应该和标记核对放一起，
       由我手工判断，ai只是辅助」
     ⇒ ① 位置：右上角，与「标记已核对」「屏蔽这部」并排（⛔ 不再塞在 AI 总结里）
        ② 显示：**不管差几集都显示** —— 判断权在人，AI 只报数
     🔴 点完必须 reloadBoard + openDetail：`embyFull` 是后端算的，只改文案 = 假闭环（0gh）。 */
  {
    const btn = $('#dEverBtn');
    const on = w.embyVerified === true;
    const stale = w.embyVerifyStale === true;
    btn.style.display = '';
    btn.classList.toggle('on', on);
    btn.classList.toggle('stale', on && stale);
    btn.textContent = on ? (stale ? '✓ 已确认 ⚠' : '✓ 已确认入库') : '确认入库';
    btn.title = on
      ? (stale
          ? `人工确认过全集入库，但**确认后数据已变**（当时 Emby ${w.embySnapEps ?? '?'} / TMDB ${w.embySnapNeed ?? '?'}，现在 ${w.embyEps ?? '?'} / ${w.embyNeed ?? '?'}）—— 建议复核。点一下可取消确认。`
          : '人工确认全集入库（点一下取消，⛔ 不动任何 Emby / TMDB 数据）')
      : `我确认这一部已收全（当前 Emby ${w.embyEps ?? '—'} / TMDB ${w.embyNeed ?? '—'} 集）。确认后与「自动判定无问题」效果完全一致：卡面出绿标、计入全集入库。⛔ 不改任何 Emby / TMDB 数据`;
    btn.onclick = async (ev)=>{
      ev.stopPropagation();
      btn.disabled = true;
      const act = await toggleEmbyVerify(w.id, w.mediaType, w.embyEps, w.embyNeed);
      btn.disabled = false;
      if(act == null) return;
      /* ⭐ 重拉列表（卡面绿标要跟着变）+ 重开抽屉（按钮文案/集数都是后端给的） */
      await reloadBoard();
      await openDetail(w.id, w.mediaType, DRAWER.cur || 'align');
    };
  }

  /* ⭐ §139 洗版一条龙（2026-11-03 蛙哥「已入库的也安排上下载一条龙，可能会有洗版需求」）
     force=true 走 /api/dl/oneshot：已入库的集也重新下载 + 重新刮削入库（覆盖 115 文件）。
     🔴 危险操作：整部重下会花流量与时间 ⇒ 必须 confirm 二次确认。 */
  {
    const btn = $('#dWashBtn');
    btn.style.display = '';
    btn.title = '洗版：整部所有集重新下载 → 重新刮削 → 覆盖 115 库文件（包括已入库的集）。用于换更高质量版本。⚠️ 会花大量流量与时间';
    btn.onclick = async (ev)=>{
      ev.stopPropagation();
      const name2 = w.nameZh || w.nameOriginal || `#${w.id}`;
      const eps = (w.embyNeed ?? w.episodeTotal ?? '?');
      if(!confirm(`♻ 确定洗版「${name2}」？\n\n将把整部 ${eps} 集（含已入库的）全部重新下载并重新刮削入库，覆盖 115 库里的现有文件。\n此操作不可中途撤销（可在下载页取消队列）。`)) return;
      btn.disabled = true;
      try{
        const r = await fetch('/api/dl/oneshot', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ workId: w.id, force: true }),
        });
        const j = await r.json().catch(()=>({}));
        if(!r.ok || !j.ok){
          toast(`❌ 洗版失败：${j.error || ('HTTP '+r.status)}`, 'bad');
        } else {
          const dl = j.download || {}, ing = j.ingest || {};
          toast(`♻ ${name2}：洗版已排队 —— 下载 ${dl.enqueued||0} 集、刮削 ${ing.queued||0} + 等下载 ${ing.waiting||0} 集。后台跑，关页面也不停`, 'info', 7000);
          setTimeout(pollWantProgress, 800);
        }
      }catch(err){
        toast(`❌ 请求失败：${(err && err.message) || err}`, 'bad');
      }finally{
        btn.disabled = false;
      }
    };
  }

  // ⭐ 逐件屏蔽按钮（蛙哥 2026-10-20）：详情页右上角，屏蔽/取消一键切
  {
    const btn = $('#dHideBtn');
    const hid = HIDDEN.board.has(String(w.id));
    btn.style.display = '';
    btn.classList.toggle('on', hid);
    btn.textContent = hid ? '✓ 已屏蔽' : '屏蔽这部';
    btn.title = hid
      ? '点一下恢复显示。屏蔽后：年份里收起来、核对漏集/缺集时自动跳过'
      : '不想看这部？屏蔽后年份里会收起来，核对漏集/缺集时自动跳过';
    btn.onclick = async (ev)=>{
      ev.stopPropagation();
      btn.disabled = true;
      const okR = await toggleHide('board', String(w.id));
      btn.disabled = false;
      if(!okR) return;
      const now = HIDDEN.board.has(String(w.id));
      btn.classList.toggle('on', now);
      btn.textContent = now ? '✓ 已屏蔽' : '屏蔽这部';
      /* ⭐ §82：刚屏蔽掉这一部 ⇒ 自动翻到下一部（停在已屏蔽的部上，看着像坏了）。
         ⚠️ 序列是快照，往回翻还能翻回来 —— 那时它已带「已屏蔽」标记，可随时恢复。 */
      if(now && DRAWER.seqKind === 'board' && DRAWER.idx < DRAWER.seq.length - 1){
        await stepDetail(1);
      }
    };
  }

  /* 元信息只留**头部与双口径条里没有的**字段**：
     集数/源作品数在头部 meta 和 calib 条里各出现过一次 ⇒ 不再重复摆。 */
  const info = [
    ['中文名', hasZh ? (w.nameZh || '—') : 'TMDB 未收录'],
    ['原始标题', w.nameOriginal||'—'],
    ['首播', w.firstAirDate||'—'],
    ['季数', w.seasonCount? w.seasonCount:'—'],
    ['热度', w.popularity!=null? w.popularity.toFixed(1):'—'],
    ['TMDB', `https://www.themoviedb.org/${w.mediaType==='tv'?'tv':'movie'}/${w.id}`],
  ];

  const bySeason = new Map();
  eps.forEach(e=>{ (bySeason.get(e.season)||bySeason.set(e.season,[]).get(e.season)).push(e); });

  /* ⭐ 2026-10-26（§69 ⑥ 蛙哥：「壳中的小鸟的S02可以屏蔽不显示」）：
     **季级屏蔽**的前端部分。
     🔴 关键设计：被屏蔽的季**根本不在 eps 里**（后端 `board.detail()` 已过滤）
        ⇒ `bySeason` 里没有它 ⇒ 季卡片上不可能有「恢复」按钮。
        ⇒ 恢复入口只能靠**后端返回的 `d.hiddenSeasons`** 单独渲染一条提示。
        ⛔ 不能「前端自己把季藏起来」—— 那样集数/对齐/缺集统计全都还是含 S02 的旧值，
           属于假闭环（0gh：只改显示不改数据 = 假闭环）。
     ⚠️ `hiddenSeasons` 缺失（旧后端）⇒ 当成空数组，不渲染提示，页面照常可用。 */
  const HID_SEASONS = Array.isArray(hiddenSeasons) ? hiddenSeasons : [];
  const hidSeasonSet = new Set(HID_SEASONS);

  /* ⭐ 2026-10-27（§73）：`whidNoteHtml` / `seasonHtml` 已随「季集」页签一起下线。
     季卡片的集明细与「逐集对照」完全重复；季级屏蔽能力改由上面的分季行承载，
     所以这里不再需要单独的「已屏蔽季」提示条和季卡片渲染。
     ⚠️ `bySeason` / `hidSeasonSet` / `HID_SEASONS` 仍被分季行使用，保留。 */

  const CC = (ev && ev.crossCheck) || null;
  const ccBad  = CC ? CC.items.filter(i=>i.level==='bad').length : 0;
  const ccWarn = CC ? CC.items.filter(i=>i.level==='warn').length : 0;
  const srcRows = (ev && ev.sources) || [];

  /* ── 「元信息」块：放在**最下面** ─────────────────────
     2026-10-21 蛙哥定调：「概况对我来说不重要，溯源才重要」，
     概览与溯源合并成一页，溯源在上、元信息在下。
     ⇒ 原来那四个指标瓦片也砍掉了：首播年/集数/源作品/热度
       头部 meta 与双口径条里都已经有了，重复摆三遍是噪音。 */
  /* ── 分季概览（2026-10-27 §73 蛙哥）────────────────────
     「季集可以取消，他和逐集对照其实是重复的」

     季集页签里只有两样东西：① 季卡片（含每集剧照+标题）② 季级屏蔽按钮。
     ① 与「逐集对照」表完全重复 ⇒ 删；② 是全站唯一入口 ⇒ 压成这一行留着。

     🔴 被屏蔽的季**不在 `bySeason` 里**（后端 `detail()` 已过滤）
        ⇒ 必须并上 `HID_SEASONS` 才画得出「恢复显示」；
        否则屏掉之后这一行会整个消失，再也点不回来（0gh 假闭环的变种）。 */
  const seasonBarHtml = (()=>{
    const nums = [...new Set([...bySeason.keys(), ...HID_SEASONS])].sort((a,b)=>a-b);
    if(!nums.length) return '';
    const items = nums.map(s=>{
      const off = hidSeasonSet.has(s);
      const n = (bySeason.get(s)||[]).length;
      return `<span class="sbar-i${off?' off':''}">
        <b>${s===0?'S0 特别篇':'S'+s}</b><em>${off?'已屏蔽':n+' 集'}</em>
        ${off
          ? `<button class="whid-btn on" data-whid-restore="${s}"
                     title="恢复这一季：重新计入集数、逐集对照与缺集统计">恢复显示</button>`
          : `<button class="whid-btn" data-whid-season="${s}"
                     title="屏蔽这一季：不计入集数、逐集对照与缺集统计，不删数据、可随时恢复">屏蔽本季</button>`}
      </span>`;
    }).join('');
    return `<div class="sbar"><span class="sbar-lb">分季</span>${items}</div>`;
  })();

  const metaHtml = `
    <div class="dsect metablk">
      <h4>元信息</h4>
      <dl class="kv">${
        info.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${k==='TMDB'
          ? `<a href="${esc(v)}" target="_blank" rel="noopener" style="color:var(--info-ink)">${esc(v)}</a>`
          : esc(v)}</dd>`).join('')}</dl>
      ${seasonBarHtml}
    </div>`;

  const al = alignment;
  /* ⭐ 「没配上」≠「缺源」——
     源站官方集数（official_episodes）≥ 我们入库条数 ⇒ 数量是够的，只是没归位 ⇒ 标「未配上」；
     否则才是真的漏抓 ⇒ 标「缺源」。 */
  const srcOfficial = (ev && ev.sources || [])
      .filter(s2 => s2.src === 'hanime')
      .reduce((a, s2) => a + (s2.officialEpisodes || 0), 0);
  const srcHave = (ev && ev.sources || [])
      .filter(s2 => s2.src === 'hanime')
      .reduce((a, s2) => a + (s2.episodes || 0), 0);
  const enough = srcOfficial > 0 ? srcHave >= srcOfficial : true;
  /* ⭐ 2026-10-22：重排后的二级看板要用的三份索引 */
  //   ① 单集封面：episodes 里带 still（TMDB 剧照本地路径），按 (季,集) 建索引
  const stillMap = new Map();
  /* 存对象而不是裸路径 —— 逐集对照表也要能在 blur 档吃模糊图 */
  eps.forEach(e => stillMap.set(`${e.season}-${e.episode}`,
    { still: e.still || null, stillBlur: e.stillBlur || null }));
  /* ⭐ §112：分集简介索引（(季,集) → 简介）。
     ⚠️ 简介挂在 `episodes` 上、不在 `alignment.rows` 上 —— 对齐是纯函数产出，
        ⛔ 不该为了展示去改它。这里按 (季,集) 建索引，表格渲染时直接取。 */
  const epOvMap = new Map();
  eps.forEach(e => {
    const ov = epOvText(e);
    if(ov) epOvMap.set(`${e.season}-${e.episode}`, ov);
  });
  //   ② 入库状态（2026-10-27 起 = Emby 里番库）：后端 local.episodes 已按 (季,集) 给好；season/episode 为 null 的只算作品级
  /* ⚠️ 接口没返回 local（例如后端还是旧版）⇒ 保持 null。
     ⛔ 不能兜底成 {hasWork:false} —— 那会把「不知道」显示成「未入库」，是假结论。 */
  const LOCAL = (local && Array.isArray(local.episodes)) ? local : null;
  const localMap = new Map();
  if(LOCAL) LOCAL.episodes.forEach(l => {   // ⚠️ LOCAL 可能是 null（旧后端）—— 不加这层判断整页会崩
    if(l.season != null && l.episode != null) localMap.set(`${l.season}-${l.episode}`, l.fileName || '');
  });
  /* ⭐ 2026-10-27（§73）：把「人工确认入库」的上下文一并带进去 ——
     AI 总结里那条「入库：Emby 已有 8 / 10 集」正是按下确认的地方，
     按钮放在这句话后面才有上下文，不用去右上角挤第三个按钮。 */
  const ALN_CTX = {stillMap, localMap, LOCAL, epOvMap,
    workId: w.id, mediaType: w.mediaType,
    /* ⭐ §108（2026-10-31 蛙哥）：vid → {标签, hanime 预览图}。
       ⛔ 接口没给（老后端 / 没跑 migration）⇒ 空对象 ⇒ 不画标签、不回退封面，
          而不是画一堆空壳（0cs：缺字段要兜底成「没有」，但不能谎报）。 */
    videoMeta: (videoMeta && typeof videoMeta === 'object') ? videoMeta : {},
    /* ⭐ §115（2026-11-01 蛙哥）：「一眼看出我应该下哪一个，哪一个质量更高」
       ⇒ 逐集体积/画质对照（key = `season-episode`）。
       ⛔ 接口没给（老后端 / 没跑 migration #23）⇒ 空对象 ⇒ 不画这一列，
          而不是画一排「—」让人以为「比过了但没差别」（0cs）。 */
    media: (j.media && typeof j.media === 'object') ? j.media : {},
    mediaAt: j.mediaSnapshotAt || null,
    /* ⭐ §87：逐集对照每一行都要显示「这条源的直链抓到没有」 */
    dlSource: j.dlSource || null,
    embyVerified: w.embyVerified === true,
    embyVerifyStale: w.embyVerifyStale === true,
    embyExcluded: w.embyExcluded || 0,
    /* §74：被集级排除的集（`<season>-<episode>` 集合）——
       逐集对照表里给它们画「已排除」态 + 一个「恢复」按钮，
       ⛔ 不给恢复入口就是死锁（那行被后端剔掉了，页面上找不到）。 */
    hiddenEps: new Set((hiddenEpisodes || []).map(e => `${e.season}-${e.episode}`)),
    hiddenEpRows: hiddenEpisodes || []};
  /* ⭐ 2026-10-27（§73 蛙哥）详情**改成单页顺读**，页签全部取消：
       元信息（最上） → AI 总结 + 逐集对照 → 溯源（接在表格下面）
     · 「溯源取消，放到逐集对照下面」⇒ srcBlockHtml 直接拼在表尾
     · 「元信息放最上面」       ⇒ metaHtml 提到最前
     · 「季集可以取消」         ⇒ 与逐集对照重复；季级屏蔽已并入 metaHtml 的分季行 */
  /* ⭐⭐ §135（2026-11-02）：翻到别的部 ⇒ 先清掉上一部的来源数据。
     🔴 必须在 alignHtml 渲染**之前**清 —— 否则上一部的「已选 hanime」会先画到这一部的行上，
        几百毫秒后又被回填，视觉上像"自己变了"（0gh：界面不许自相矛盾）。 */
  if(PICK.workId !== id){
    PICK.workId = id; PICK.map = new Map(); PICK.loaded = false;
    PICK.err = null; PICK.counts = null; PICK.root = '';
  }
  const sections = [
    {key:'align', label:'逐集对照',
     html: metaHtml
         + aiSummaryHtml(al, ALN_CTX)
         + alignHtml(al, enough, ALN_CTX)
         + srcBlockHtml(w, ev, eps.length)},
  ];
  /* ⭐ §82：建/复用翻页序列（= 屏幕上当前的筛选顺序），并把下一部先取回来 */
  ensureSeq(id, 'board');
  prefetchNeighbor(1);
  mountDrawer(title, meta, thumb, sections, 'align', navFooterHtml(), {actsInNav:true});
  /* ⭐ §135：来源选择单独拉（要读盘找字幕，⛔ 不拖慢抽屉主渲染）。
     回来只回填「来源」列，不重渲染整表（保滚动位置）。 */
  void loadPicks(id);
}

/* ── 逐集对照（2026-10-21 蛙哥提议）─────────────────────────
   「tmdb 上不是已经有完整的分季分集吗，我们只要把 hanime 和 mteam
     对应的数据放它下面，这样不是一眼就看出来对不对，有没有缺少吗」
   ⇒ TMDB 的分季分集当骨架，每集一行，下面挂对应的源条目；
     没挂到源条目的集标「缺源」；没挂到任何集的源条目单列出来。     */
/* ── AI 总结（2026-10-22 · 按蛙哥设计图新增区块）────────────────────
   ⚠️ 这是**规则归纳**，不是外部大模型调用 ——
      只用这次接口已经返回的 alignment / local 数据，不产生任何新判断，
      每一个数字都能在下面的表格里逐条回查。标题里明写「自动归纳」，
      避免被当成人工结论。
   为什么值得有：表格是「逐条明细」，但人第一眼要的是「这部到底什么状况、
   缺哪、下一步该看哪」—— 那三句话就放这儿。 */
function aiSummaryHtml(al, ctx={}){
  if(!al || !al.rows || !al.rows.length) return '';
  const s = al.summary, rows = al.rows;
  const localMap = ctx.localMap || new Map();
  const LOCAL = ctx.LOCAL || null;
  const extra = al.extra || [];

  const hnN = rows.filter(r=>r.hanime.length).length;
  const mtN = rows.filter(r=>r.mteam.length).length;
  const bothN = rows.filter(r=>r.hanime.length && r.mteam.length).length;
  const emptyN = rows.filter(r=>!r.hanime.length && !r.mteam.length).length;
  const strongN = rows.filter(r=>r.how==='named' || r.how==='strong' || r.how==='marker').length;
  const seasonN = rows.filter(r=>r.how==='season').length;
  const inferN  = rows.filter(r=>r.how==='vol' || r.how==='year').length;
  const storedN = rows.filter(r=>localMap.has(`${r.season}-${r.episode}`)).length;
  const extraH  = extra.filter(x=>x.kind==='hanime').length;
  const extraM  = extra.length - extraH;

  /* 一句话结论 —— 覆盖与多余同时看，才能区分「真缺片」和「集号错位」 */
  let line, cls;
  if(!emptyN && !extra.length){
    line = `${s.tmdbEps} 集全部对上源条目，源站也没有多余条目 —— 这一部是干净的。`; cls = 'ok';
  }else if(emptyN && extra.length){
    /* ⚠️ 不能一概说「集号错位」—— 两种情况的数字长得一样，成因完全不同：
       · 空集数 ≈ 多出的条目数 ⇒ 就是错位，源站条数是够的
       · 空集数 远多于 多出的条目数 ⇒ TMDB 有特别篇/总集篇而源站没有，属**源站真没有**
       判据只用数量关系，不猜内容。 */
    const gap = emptyN - extra.length;
    line = Math.abs(gap) <= Math.max(2, Math.round(emptyN * 0.3))
      ? `${s.tmdbEps} 集里 ${emptyN} 集空着，源站有 ${extra.length} 条没对上 —— 数量对得上，多半是集号错位。`
      : `${s.tmdbEps} 集里 ${emptyN} 集空着、源站只多出 ${extra.length} 条 —— 源站条目本来就比 TMDB 少 ${gap} 条（多为特别篇/总集篇源站没有），不是对齐问题。`;
    cls = 'warn';
  }else if(emptyN){
    line = `${s.tmdbEps} 集里 ${emptyN} 集没有任何源条目 —— 源站确实没有，或者没抓到。`; cls = 'bad';
  }else{
    line = `${s.tmdbEps} 集全部有源，但源站多出 ${extra.length} 条对不上任何一集。`; cls = 'warn';
  }

  const li = [];
  li.push(`<li>覆盖：hanime ${hnN} 集 · mteam ${mtN} 集 · 两源都齐 ${bothN} 集${emptyN?` · 全空 ${emptyN} 集`:''}。</li>`);
  li.push(`<li${inferN?' class="warn"':''}>判定：逐字或集号对上 ${strongN} 集${seasonN?` · 季内按序 ${seasonN} 集`:''}${inferN?` · <b>推定 ${inferN} 集</b>（按卷号/年份配的，可能错位，优先核这几集）`:''}。</li>`);
  if(!LOCAL || LOCAL.ready === false){
    // 接口没给入库数据 / Emby 库还没同步过 ⇒ 这一条整个不写，而不是写「未入库」
    // 🔴 2026-10-27（§70）：判据换成 Emby 后，「没同步」≠「没入库」，必须分开（0cs）
  }else if(LOCAL.hasWork){
    /* ⭐ §73 起有「人工确认」，§74 蛙哥把它移到右上角并全局常驻
       （「应该和标记核对放一起，由我手工判断，ai只是辅助」）。
       ⇒ 这里**只报数**，⛔ 不放按钮：AI 的职责是把差几集说清楚，判断权在人。 */
    const gap = rows.length - storedN;
    const exN = ctx.embyExcluded || 0;
    const exNote = exN > 0 ? `，其中 ${exN} 集已被排除（TMDB 假集/无资源）` : '';
    if(ctx.embyVerified){
      li.push(`<li class="ok">入库：<b>已人工确认</b>全集入库（Emby 现收 ${storedN} / ${rows.length} 集${exNote}）。</li>`);
    }else if(gap > 0){
      li.push(`<li class="warn">入库：Emby「动画里番」库已有 ${storedN} / ${rows.length} 集，还差 ${gap} 集${exNote} —— 若这几集 TMDB 本身就是假集或无资源，可在逐集对照里逐集排除，或右上角「确认入库」。</li>`);
    }else{
      li.push(`<li class="ok">入库：Emby「动画里番」库已有 ${storedN} / ${rows.length} 集${exNote}。</li>`);
    }
  }else{
    li.push(`<li class="warn">入库：Emby「动画里番」库里还没有这一部。</li>`);
  }
  if(extra.length){
    const who = [extraH?`hanime ${extraH} 条`:'', extraM?`mteam ${extraM} 条`:''].filter(Boolean).join(' · ');
    li.push(`<li class="warn">多出来的源条目：${who}。如果它们其实是别的集，说明是集号判据没命中；如果确实是别的作品，说明绑定错了。</li>`);
  }
  return `<div class="ai-sum">
    <div class="ai-h"><span class="tag">自动归纳</span>AI 总结 · 数据全部来自本次接口，未做外部推断</div>
    <div class="ai-line ${cls}">${esc(line)}</div>
    <ul>${li.join('')}</ul>
  </div>`;
}

/* ── 逐集对照（2026-10-21 蛙哥提议 · 2026-10-22 按设计图重排）────────
   TMDB 的分季分集当骨架，每集一行，右边挂 hanime / mteam 对应的条目。
   2026-10-22 改动（蛙哥：「二级看板太小了，标题都缩在一起看不清」）：
     ① 7 列固定宽度（colgroup）—— 长标题只在自己列内换行，不再把邻列挤成竖条
     ② 新增「单集封面」列（TMDB 剧照）
     ③ 新增「入库判定」列（2026-10-27 起判据 = Emby 里番库有没有这一集）
     ④ 日文原名不再单行省略号截断，最多两行 */
/* ══════════════════════════════════════════════════════════════════════
   ⭐⭐ §135（2026-11-02 蛙哥）逐集来源选择 —— 「这一集从哪儿取」
   ══════════════════════════════════════════════════════════════════════
   蛙哥原话：「新增一个指定集数，比如我第一集打算从 hanime 下，第二集打算直接
   调取 mteam 的本地视频，就是可以给我手动选择，哪一集我想要哪个资源，
   然后新增一个下载按钮，我选好之后点击下载，就可以走完下载，改名，刮削，入库」

   ## 🔴 两条路本质不同（决定了为什么 UI 只给两个按钮）
   · hanime：要**真下载**（服务端队列 → 落 /downloads/待整理 → 等 promote）
   · mteam ：**不用下**。全量库就挂在 `/downloads/mteam里番全量库`，
             直接把刮削的 srcPath 指过去，立刻可刮（0 秒、不花流量）

   ## 🔴 为什么数据单独拉（不塞进 /api/board/work）
   board 接口是「对齐/核对」的账，mtime 缓存很重；来源选择是另一件事，
   而且它要读盘（每集 readdir 找字幕）。混进去会让抽屉整体变慢。
   ⇒ 表格先画占位（`…`），这份拉回来只**回填那一列**（⛔ 不重渲染整张表，
      否则会丢滚动位置、剧照重新加载一遍）。

   ## ⛔ 三种行不给选择入口（0cs：别给假入口）
   已入库 / 已排除 / 未播出 —— 画灰字，不是画禁用按钮。
      ⛔ 别把「已入库」画成可点的 mteam（点了也不会执行，用户会以为按钮坏了）。 */
const PICK = { workId: 0, map: new Map(), loaded: false, root: '', err: null, busy: false };

/**
 * 体积格式化 —— 🔴 **唯一一份**（原本是 alignHtml 内部的局部 const）。
 * 来源格要和表格里「盘上 510 MB」显示同一个数，两处各写一份迟早分叉（0lx）。
 * ⇒ 提升成全局函数声明（函数声明会提升，alignHtml 内部直接可用）。
 */
function MB(n){
  return n == null ? '—'
    : (n >= 1073741824 ? (n/1073741824).toFixed(2)+' GB' : Math.round(n/1048576)+' MB');
}

/** 单集来源格（渲染期先给占位，loadPicks 回来后回填） */
function pickCellHtml(key, how){
  if(!PICK.loaded){
    return PICK.err
      ? `<span class="pk-na" title="读不到可选来源：${esc(PICK.err)}">读取失败</span>`
      : `<span class="pk-na" title="正在读取可选来源…">…</span>`;
  }
  const e = PICK.map.get(key);
  if(!e) return `<span class="pk-na" title="这一集不在可选清单里">—</span>`;
  if(e.excluded) return `<span class="pk-na" title="这一集被你排除过，先恢复才能选来源">已排除</span>`;
  if(e.future)   return `<span class="pk-na" title="还没播出（播出日未到），现在下不到">未播出</span>`;
  /* ⭐ §142（2026-11-03 蛙哥「入库之后就显示已入库，不能重新下，我要的洗版是针对单集」）：
     已入库的集**不再**画成一行死字「已入库」——
     那样这一集在界面上就永久失去了「选来源」的入口，洗版只能整部洗。
     ⇒ 改成：照常给 H / M 两个按钮（可点、可存 work_ep_src），
       「已入库」缩成角标，右下角多一个 ♻ 只洗这一集。
     ⛔ 「已入库」的判断仍来自 Emby，只是不再阻断操作。 */
  const owned = !!e.owned;

  const manual = e.manual || null;
  const cur = manual ? manual.src : null;
  const hn = (e.hanime && e.hanime[0]) || null;
  const mtList = e.mteam || [];
  const mt = mtList[0] || null;

  const hnQ  = hn ? (hn.quality ? hn.quality+'p' : '画质?') : '';
  const hnSz = hn && hn.size ? MB(hn.size) : '';
  const mtSz = mt ? MB(mt.size) : '';
  const mtQ  = mt && mt.h ? mt.h+'p' : '';

  /* 🔴 §136（2026-11-02 蛙哥「为什么大小对不上」）：
     这一列显示的必须是**执行时真正会取的那个文件**的体积 ⛔ 不能拿别的口径的数字来显示。
     三个数字的来历（实测 323604）：
       · 「mteam 盘上 510 MB」 = ep_media.mt_size = **最大**的文件（RAW/mkv，534927992）
       · 「来源列 M 465 MB」   = 排序第 1 = **CHS**（487849580）—— 这是实际会被取的
       · 「画质对比 M 465 MB」= 同上
     ⇒ 同一格里两个数（510 vs 465）指两个不同文件，看着像对不上。
     ⇒ 修法：这里显示的是「实际会取的那个」的体积；**多文件且体积不同时写成范围**
       （`465~510 MB`），并在 tip 里逐个列出每个文件的体积 ⇒ 一眼就知道差在哪。 */
  const mtSizes = mtList.map(x=>Number(x.size||0)).filter(x=>x>0);
  const mtMin = mtSizes.length ? Math.min(...mtSizes) : 0;
  const mtMax = mtSizes.length ? Math.max(...mtSizes) : 0;
  const mtSpread = mtSizes.length > 1 && mtMax !== mtMin;
  const mtSzText = mt
    ? (mtSpread ? `${MB(mtMin)}~${MB(mtMax)}` : mtSz)
    : '';

  const hnTip = hn
    ? `hanime：${hnQ}${hnSz ? ' · '+hnSz : ' · 体积待补'}`
      + (hn.expired ? '\n⚠️ 直链签名已过期 —— 下载前会自动重抓' : '')
      + (hn.isM3u8 ? '\n⛔ HLS 切片流，本轮不支持下载' : '')
    : 'hanime 没有这一集';
  const mtTip = mt
    ? `mteam 本地文件（不用下载，直接取）：\n${mt.name}\n${mtSz}${mtQ ? ' · '+mtQ : ''}`
      + (mt.sub
          ? `\n✓ 带外挂字幕：${String(mt.sub).split('/').pop()}`
            + (mt.subHow === 'zip' ? '（在月度合集 Subs.zip 里，入库时自动取出）' : '')
          : '\n✗ 这集没有外挂字幕（可能内嵌）')
      + (mtList.length > 1
          ? `\n\n盘上共 ${mtList.length} 个文件（语言/封装不同，体积也不同）：\n`
            + mtList.map((x,i)=>`  ${i===0?'★ ':'  '}${x.name}\n     ${MB(x.size)}${x.h?' · '+x.h+'p':''}${x.codec?' · '+String(x.codec).toUpperCase():''}`).join('\n')
            + `\n★ = 默认会取的那个（点开可以选别的）`
          : '')
    : 'mteam 盘上没有这一集';

  /* ⚠️ 集位推定提醒：how ∈ {vol, year, season} 说明「哪个文件是第几集」是按卷号/顺序推的。
     🔴 必须 trim —— 实测 data-how 读回来是 " vol"（带前导空格），
        直接比较会让这条提醒永远不出现（第一次跑验收就是被这个坑到了）。 */
  const howKey = String(how || '').trim();
  const unsure = howKey === 'vol' || howKey === 'year' || howKey === 'season';
  const warn = (cur === 'mteam' && unsure)
    ? `<span class="pk-warn" title="这一集和 mteam 文件的对应关系是按卷号/顺序推的，可能错位。选它等于你确认了集位">集位推定</span>`
    : '';
  /* ⭐ §150：hanime 侧也有推定 —— 标题里没集号，靠「集名」或「剩余集位」补进来的。
     必须显式标出来（蛙哥：番号/集位对不上时最难查的就是「看上去像明写的」）。 */
  const hnGuess = (hn && hn.guessed)
    ? `<span class="pk-warn" title="这一集的 hanime 视频是推出来的：标题里没有集号，按「集名」或「剩余集位」补上，可能错位。点 H 可以手动换个视频">集位推定</span>`
    : '';

  return `<div class="pk">
    <button class="pk-b h${cur === 'hanime' ? ' on' : ''}" data-pk="${esc(key)}" data-src="hanime"
      ${!hn || hn.isM3u8 ? 'disabled' : ''} title="${esc(hnTip)}">
      <b>H</b><span>${esc(hnQ || '无')}</span>
    </button>
    <button class="pk-b m${cur === 'mteam' ? ' on' : ''}" data-pk="${esc(key)}" data-src="mteam"
      ${!mt ? 'disabled' : ''} title="${esc(mtTip)}">
      <b>M</b><span>${esc(mtSzText || '无')}</span>
    </button>
    ${cur ? '' : '<span class="pk-auto" title="没手动选：执行时按默认策略 —— mteam 盘上有就用 mteam，否则 hanime">自动</span>'}
    ${String(key).startsWith('0-')
      ? '<span class="pk-auto" title="特典（TMDB 把它放在 S00）。§150 起 S00 也参与源站落位：特典视频会按集名或剩余集位落进来，落进来的会标「集位推定」。mteam 盘上有就用 M，可以点 ♻ 单独洗这一集">特典</span>'
      : ''}
    ${hnGuess}
    ${warn}
    ${owned ? '<span class="pk-own" title="Emby 库里已经有这一集。可以在上面重选 H/M，再点 ♻ 只洗这一集">✓ 已入库</span>' : ''}
    <button class="pk-wash" data-wash-ep="${esc(key)}"
      title="只洗这一集：按当前选的来源（没选就自动：mteam 优先）重新取用 → 重新刮削 → 覆盖 115 库里的这一集。⛔ 不影响同作品其它集">♻ 洗版</button>
  </div>`;
}

/** 只回填这一列（⛔ 不重渲染整表：会丢滚动位置、剧照重下） */
function fillPickCells(){
  document.querySelectorAll('.aln-pick[data-pick]').forEach(td=>{
    td.innerHTML = pickCellHtml(td.dataset.pick, td.dataset.how || '');
  });
}

/**
 * 拉这一部每集的可选来源。
 * 🔴 响应回来时若已翻到别的部（PICK.workId 变了）⇒ 丢弃，⛔ 别把上一部的数据画到这一部上。
 */
async function loadPicks(workId){
  try{
    const r = await fetch(`/api/dl/pick?workId=${workId}`);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if(PICK.workId !== workId) return;
    PICK.map = new Map();
    (j.eps || []).forEach(e=> PICK.map.set(`${e.season}-${e.episode}`, e));
    PICK.root = j.mtRoot || '';
    PICK.counts = j.counts || null;
    PICK.err = null;
    PICK.loaded = true;
  }catch(e){
    if(PICK.workId !== workId) return;
    PICK.err = (e && e.message) || String(e);
    PICK.loaded = true;
  }
  fillPickCells();
  refreshPickBar();
}

/** 点一下 = 存一个选择（不执行）。已选中的再点一次 = 退回「自动」 */
async function pickOne(workId, season, episode, src, btn){
  const key = `${season}-${episode}`;
  const e = PICK.map.get(key);
  const cur = e && e.manual ? e.manual.src : null;
  const next = cur === src ? 'auto' : src;
  if(btn) btn.disabled = true;
  try{
    const r = await fetch('/api/dl/pick', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ workId, picks:[{ season:Number(season), episode:Number(episode), src: next }] }),
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok || !j.ok) throw new Error(j.error || ('HTTP '+r.status));
    /* 本地状态跟着改（⛔ 不整表重拉：那要多等一个网络往返，手感很差） */
    if(e){
      e.manual = next === 'auto' ? null : { src:next, hanimeVid:null, mtPath:null, note:null, pickedAt:new Date().toISOString() };
      e.suggest = e.manual ? e.manual.src
        : (e.owned ? 'none' : (e.mteam && e.mteam.length ? 'mteam' : (e.hanime && e.hanime.length ? 'hanime' : 'none')));
    }
    fillPickCells();
    refreshPickBar();
  }catch(err){
    toast(`来源没存上：${err.message || err}`, 'bad');
  }finally{
    if(btn) btn.disabled = false;
  }
}

/**
 * ⭐ §142（2026-11-03 蛙哥「我要的洗版是可以针对单集去洗版，而不是整一部洗」）
 * 只洗这一集：按当前来源（手动选的优先；没选就 mteam 有则 mteam，否则 hanime）
 * 重新取用 → 重新刮削 → 覆盖 115 库里这一集。
 * 🔴 与抽屉底部「♻ 洗版一条龙」的区别：那个是**整部** force，这个只 force 一集。
 */
async function washEp(workId, key, btn){
  const e = PICK.map && PICK.map.get(key);
  if(!e || e.excluded || e.future) return;
  const [s, en] = String(key).split('-').map(Number);
  if(!Number.isFinite(s) || !Number.isFinite(en)) return;
  const cur = e.manual ? e.manual.src : null;
  const mt = (e.mteam && e.mteam[0]) || null;
  const hn = (e.hanime && e.hanime[0]) || null;
  const src = cur || (mt ? 'mteam' : (hn ? 'hanime' : null));
  if(!src){ toast('这一集没有可选来源（hanime 没链接、mteam 盘上也没有）', 'warn'); return; }
  const tag = `S${String(s).padStart(2,'0')}E${String(en).padStart(2,'0')}`;
  if(btn) btn.disabled = true;
  try{
    /* ⭐ §147 洗版第一步：**先预演**（dry）—— 后端算出「取哪个文件、多大、要不要下载」，
       这一步一个队列都不入、一个文件都不碰。⛔ 不许跳过直接 force（覆盖 115 是不可逆的） */
    const dr = await fetch('/api/dl/run', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ workId, force: true, dry: true, eps: [{ season: s, episode: en }] }),
    });
    const dj = await dr.json().catch(()=>({}));
    if(!dr.ok || !dj.ok) throw new Error(dj.error || ('HTTP ' + dr.status));
    const it = (dj.items || [])[0] || null;
    const sk = (dj.skipped || [])[0] || null;
    if(!it){
      toast(`洗不了 ${tag}：${sk ? sk.why : '这一集现在没有可用来源'}`, 'warn');
      return;
    }
    const from = it.src === 'mteam'
      ? `mteam 盘上文件（${MB(it.size)}）　0 流量，直接取用`
      : `hanime 源（${hn && hn.quality ? hn.quality + 'p' : '画质?'}）${it.needDownload ? '　要下载' : '　已下过，直接刮'}`;
    const now = it.libSize ? MB(it.libSize) : '（库里没有）';
    const better = it.libSize && it.size
      ? (it.size > it.libSize ? '↑ 更大' : '↓ 更小')
      : '';
    const okAll = confirm(
      `♻ 洗版 ${tag}（只洗这一集）\n\n` +
      `取用：${from}\n` +
      `115 库里现在：${now}${better ? '　→ ' + better : ''}\n\n` +
      `动作：取文件 → 重新刮削（标题/封面/番号） → 覆盖 115 库里这一集\n` +
      `⛔ 同作品的其它集不受影响`);
    if(!okAll) return;
    if(btn) btn.disabled = true;
    const r = await fetch('/api/dl/run', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ workId, force: true, eps: [{ season: s, episode: en }] }),
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok || !j.ok) throw new Error(j.error || ('HTTP ' + r.status));
    const p = j.plan || {};
    const skipped = (j.skipped || [])[0];
    if(skipped && !p.download && !p.mteam){
      toast(`没洗成 ${tag}：${skipped.why}`, 'warn');
    }else{
      const what = p.mteam ? '取 mteam 盘上文件' : `下载（${p.download} 集）`;
      toast(`♻ ${tag} 已排队：${what} → 重新刮削 → 覆盖 115 库。后台跑，关页面也不停`, 'ok', 7000);
    }
    /* 状态要跟着变（这集重新入库后「已入库」角标还在，但进度条/队列会动） */
    setTimeout(()=>{ try{ pollWantProgress(); }catch(_){} }, 800);
  }catch(err){
    toast(`洗版没跑起来：${err.message || err}`, 'bad');
  }finally{
    if(btn) btn.disabled = false;
  }
}

/** 执行条（表格上方）：先讲清「这一按会做什么」，再给按钮 */
function pickBarHtml(){
  if(!PICK.loaded){
    return `<div class="pkbar" id="pickBar"><span class="pkbar-lb">来源选择</span>
      <span class="pkbar-n">正在读取这一部的可选来源…</span></div>`;
  }
  if(PICK.err){
    return `<div class="pkbar" id="pickBar"><span class="pkbar-lb">来源选择</span>
      <span class="pkbar-n" style="color:var(--bad-ink)">读不到可选来源：${esc(PICK.err)}</span></div>`;
  }
  const eps = [...PICK.map.values()];
  const todo = eps.filter(e=> !e.owned && !e.excluded && !e.future);
  /* ⭐ §142：已入库的集单独计数 —— 它们也能洗版（逐集 ♻），不再从这一条里消失 */
  const washable = eps.filter(e=> e.owned && !e.excluded && !e.future);
  if(!todo.length){
    return `<div class="pkbar" id="pickBar"><span class="pkbar-lb">来源选择</span>
      <span class="pkbar-n">${washable.length
        ? `这一部 <b>${washable.length}</b> 集都已入库 —— 想换版本：在下面每行点 <b>H</b>/<b>M</b> 选来源，再点该行的 <b>♻ 洗版</b>（只洗那一集）`
        : '这一部没有待处理的集（都已排除/未播出）'}</span></div>`;
  }
  const mH = todo.filter(e=> e.manual && e.manual.src === 'hanime').length;
  const mM = todo.filter(e=> e.manual && e.manual.src === 'mteam').length;
  const auto = todo.length - mH - mM;
  const aH = todo.filter(e=> !e.manual && e.suggest === 'hanime').length;
  const aM = todo.filter(e=> !e.manual && e.suggest === 'mteam').length;
  const noSrc = todo.filter(e=> !e.manual && e.suggest === 'none').length;

  return `<div class="pkbar" id="pickBar">
    <span class="pkbar-lb">来源选择</span>
    <span class="pkbar-n">待处理 <b>${todo.length}</b> 集
      · 手动 hanime <b>${mH}</b> / mteam <b>${mM}</b>
      · 自动 <b>${auto}</b>${auto ? `（mteam ${aM} / hanime ${aH}${noSrc?` / 无源 ${noSrc}`:''}）` : ''}${washable.length ? ` · 已入库可洗版 <b>${washable.length}</b> 集` : ''}
    </span>
    <button class="pkbar-btn" data-pkrun="${PICK.workId}"
      title="按上面的选择执行：hanime 的进下载队列，mteam 的直接取盘上文件，然后统一改名 → 刮削 → 入库。后台跑，关掉浏览器也不停">
      ⬇ 按选择执行</button>
    <span class="pkbar-msg" id="pickMsg"></span>
  </div>`;
}

/** 执行（下载 + 刮削 + 入库） */
async function runPicks(workId, btn){
  if(PICK.busy) return;
  PICK.busy = true;
  if(btn) btn.disabled = true;
  const msg = document.getElementById('pickMsg');
  if(msg) msg.textContent = '已提交，正在排队…';
  try{
    const r = await fetch('/api/dl/run', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ workId }),
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok || !j.ok) throw new Error(j.error || ('HTTP '+r.status));
    const p = j.plan || {};
    const parts = [];
    if(p.download) parts.push(`下载 ${p.download} 集`);
    if(p.mteam) parts.push(`直接取 mteam ${p.mteam} 集`);
    if(p.alreadyDownloaded) parts.push(`${p.alreadyDownloaded} 集已下好直接刮`);
    if(p.skip) parts.push(`跳过 ${p.skip} 集`);
    toast(parts.length ? `已开跑：${parts.join(' / ')}` : '没有可执行的集', parts.length ? 'ok' : 'warn');
    if(msg){
      const skip = (j.skipped || []).slice(0, 6)
        .map(s=>`S${String(s.season).padStart(2,'0')}E${String(s.episode).padStart(2,'0')} ${s.why}`)
        .join('；');
      msg.innerHTML = `已提交 · 下载 <b>${p.download||0}</b> · mteam <b>${p.mteam||0}</b> · 跳过 <b>${p.skip||0}</b>`
        + (skip ? `<br><span style="color:var(--ink3)">${esc(skip)}${(j.skipped||[]).length>6?' …':''}</span>` : '');
    }
    /* 进度在「刮削」页签/待下页顶部那条进度里看，这里不重复造一份 */
  }catch(err){
    toast(`没跑起来：${err.message || err}`, 'bad');
    if(msg) msg.textContent = `没跑起来：${err.message || err}`;
  }finally{
    PICK.busy = false;
    if(btn) btn.disabled = false;
  }
}

function alignHtml(al, enough=true, ctx={}){

  const s = al.summary;

  const epOvMap = ctx.epOvMap || new Map();
  const localKnown = !!ctx.LOCAL && ctx.LOCAL.ready !== false;   // 后端给没给、Emby 库同步过没有

  /* ⭐ §87：源站条目 ⇄ 直链 的对账数（后端现算，⛔ 不认缓存） */
  const dl = ctx.dlSource || null;

  const videoMeta = ctx.videoMeta || {};
  /* ⭐ §115：本集的三份东西 —— mteam 盘上实测 / Emby 媒体库里那份 / 源侧最高可下档。
     ⚠️ 三者在数据上是分开的三列，⛔ 不许合成一个「大小」：

     ⭐⭐ §127（2026-11-02）：第二份的来源从 `local_file`（115 `/library/已整理` 的
