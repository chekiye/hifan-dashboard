<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>未确定匹配 · 作品合集核对台</title>
<style>
:root{
  --canvas:#EFF2F7; --surface:#FFFFFF; --surface-2:#F6F8FC; --surface-3:#EAEFF7;
  --ink:#0A1020; --ink2:#48536A; --ink3:#8A94A8; --ink4:#B3BCC9;
  --line:rgba(10,16,32,.09); --line2:rgba(10,16,32,.16);
  --brand:#4F46E5; --brand-ink:#3730A3; --brand-soft:#EDEEFE;
  --ok:#0E9F6E; --ok-ink:#05603F; --ok-soft:#E1F6ED;
  --warn:#C07800; --warn-ink:#7A4700; --warn-soft:#FCF1DA;
  --bad:#DC2B2B; --bad-ink:#8A1414; --bad-soft:#FDEBEB;
  --info:#2F7FD8; --info-ink:#18549B; --info-soft:#E7F0FC;
  --rose:#D4537E; --rose-ink:#72243E; --rose-soft:#FBEAF0;
  --r-xs:6px; --r-s:9px; --r-m:13px; --r-l:17px;
  --sh-1:0 1px 2px rgba(10,16,32,.05);
  --sh-2:0 2px 5px rgba(10,16,32,.04),0 10px 22px -10px rgba(10,16,32,.14);
  --sh-3:0 26px 64px -22px rgba(10,16,32,.30),0 4px 14px rgba(10,16,32,.08);
  --ease:cubic-bezier(.22,1,.36,1);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--ink); font:14px/1.6 var(--sans);
  background:radial-gradient(1000px 520px at 12% -8%, #F6F8FF 0%, transparent 60%),
             radial-gradient(800px 460px at 100% 0%, #F1F6FF 0%, transparent 55%), var(--canvas);
  background-attachment:fixed; min-height:100vh; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;font-size:13px;padding:7px 11px;border:1px solid var(--line2);
  border-radius:var(--r-s);background:var(--surface);color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(10,16,32,.16);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* ══ 顶栏 ══ */
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);
  backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:12px 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .mark{width:30px;height:30px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(140deg,#D4537E,#F0997B);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.brand h1{margin:0;font-size:19px;font-weight:780;letter-spacing:-.02em;line-height:1.2}
.brand .sub{font-size:11.5px;color:var(--ink3);display:block}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{display:inline-flex;align-items:baseline;gap:5px;padding:4px 11px;border-radius:999px;
  font-size:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip b{font-size:13.5px;font-weight:760;color:var(--ink)}
.chip.hi{background:var(--rose-soft);border-color:rgba(212,83,126,.26);color:var(--rose-ink)}
.chip.hi b{color:var(--rose-ink)}
.bar{display:flex;gap:8px;align-items:center;padding:0 22px 10px;flex-wrap:wrap}
.grow{flex:1;min-width:200px}
.spacer{flex:1}
.btn{font:inherit;font-size:13px;font-weight:600;padding:7px 13px;border:1px solid var(--line2);
  border-radius:var(--r-s);background:var(--surface);color:var(--ink2);white-space:nowrap}
.btn:hover{border-color:var(--ink3);color:var(--ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
.tabs{display:flex;gap:3px;padding:0 22px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:none;background:none;border-radius:0;padding:10px 14px;font-size:13px;
  color:var(--ink2);border-bottom:2.5px solid transparent;font-weight:650;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--brand-ink);border-bottom-color:var(--brand)}
.tabs .n{font:700 10.5px var(--mono);color:var(--ink4);margin-left:5px}
.tabs button.on .n{color:var(--brand)}

/* ══ 两栏布局 ══ */
.split{display:grid;grid-template-columns:minmax(300px,380px) 1fr;align-items:start;
  gap:0;max-width:1720px;margin:0 auto;height:calc(100vh - 132px)}
.split.full{grid-template-columns:1fr}
.split.full .listpane{display:none}
.listpane{position:sticky;top:132px;height:calc(100vh - 132px);overflow:auto;
  border-right:1px solid var(--line);background:rgba(255,255,255,.5)}
.lp-h{display:flex;align-items:baseline;gap:8px;padding:12px 16px 9px;
  font-size:11.5px;font-weight:750;color:var(--ink3);letter-spacing:.05em;
  position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);z-index:2}
.lp-h .n{margin-left:auto;font-family:var(--mono);color:var(--ink4);font-weight:500}
.lrow{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;
  padding:9px 14px;border-bottom:1px solid var(--line);transition:background .12s var(--ease);
  border-left:3px solid transparent}
.lrow:hover{background:var(--surface)}
.lrow.on{background:var(--brand-soft);border-left-color:var(--brand)}
.lrow.done .ltitle{color:var(--ink3)}
.lstatus{width:8px;height:8px;border-radius:50%;background:var(--ink4);flex:0 0 auto;margin-top:6px}
.lstatus.ok{background:var(--ok)} .lstatus.no{background:var(--bad)} .lstatus.wait{background:var(--warn)}
.lmain{flex:1;min-width:0}
.ltitle{display:block;font-size:13.5px;font-weight:650;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmeta{display:block;font-size:11px;color:var(--ink3);font-family:var(--mono);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmeta .b{color:var(--ink2);font-weight:600}
.lmeta .sep{color:var(--ink4);margin:0 4px}
.lv{font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;flex:0 0 auto;margin-top:2px}
.lv.ok{background:var(--ok-soft);color:var(--ok-ink)}
.lv.no{background:var(--bad-soft);color:var(--bad-ink)}
.lv.wait{background:var(--warn-soft);color:var(--warn-ink)}
.lv.hid{background:var(--surface-3);color:var(--ink3)}

.detailpane{padding:20px 26px 60px;min-width:0}
.dp-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.dp-t{font-size:22px;font-weight:780;letter-spacing:-.025em;line-height:1.25;word-break:break-word}
.dp-s{font-size:12px;color:var(--ink3);font-family:var(--mono);margin-top:5px;
  display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.dp-nav{margin-left:auto;display:flex;gap:6px;flex:none}
.dp-nav button{width:30px;height:30px;border:1px solid var(--line2);border-radius:var(--r-s);
  background:var(--surface);color:var(--ink2);font-size:14px;line-height:1}
.dp-nav button:hover{border-color:var(--ink3);color:var(--ink)}

.dp-sec{margin-bottom:18px}
.dp-t2{font-size:11.5px;font-weight:750;color:var(--ink3);letter-spacing:.05em;
  margin-bottom:7px;display:flex;align-items:center;gap:8px}
.dp-t2 .n{font-family:var(--mono);color:var(--ink4);font-weight:500}
/* 人工匹配直跳 TMDB（2026-11-02）—— 带名字过去，不猜 id */
.tm-go{display:inline-flex;align-items:center;gap:4px;margin-top:9px;
  font-size:12.5px;font-weight:650;color:var(--brand-ink);text-decoration:none;
  background:var(--brand-soft);border:1px solid rgba(79,70,229,.22);
  padding:5px 11px;border-radius:var(--r-xs);transition:background .12s}
.tm-go:hover{background:#E3E4FD}
.copy{display:inline-block;font-family:var(--mono);font-size:13px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-xs);padding:3px 9px;cursor:pointer;
  user-select:all;transition:.12s;margin:2px 4px 2px 0}
.copy:hover{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}
.copy.big{font-size:16px;font-weight:750;background:var(--brand-soft);border-color:rgba(79,70,229,.3);
  color:var(--brand-ink);padding:7px 14px;font-family:var(--sans)}
.hint{display:inline-block;font-size:12px;color:var(--warn-ink);background:var(--warn-soft);
  border:1px solid rgba(192,120,0,.26);border-radius:var(--r-xs);padding:3px 9px;
  cursor:pointer;user-select:all;margin:2px 4px 2px 0}
.hint:hover{background:#F8E6BF}

table.items{width:100%;border-collapse:collapse;font-size:12.5px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
table.items th{text-align:left;padding:8px 10px;background:var(--surface-2);color:var(--ink3);
  font-size:11px;font-weight:650;border-bottom:1px solid var(--line);white-space:nowrap}
table.items td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.items tbody tr:last-child td{border-bottom:none}
table.items tbody tr:hover td{background:var(--surface-2)}
table.items .mono{font-family:var(--mono);font-size:12px;white-space:nowrap}
.tag{display:inline-block;padding:1px 7px;border-radius:var(--r-xs);font-size:11px;font-weight:650}
.tag.hanime{background:var(--rose-soft);color:var(--rose-ink)}
.tag.mteam{background:var(--info-soft);color:var(--info-ink)}
.tag.pending{background:var(--warn-soft);color:var(--warn-ink)}
.tag.orphan{background:var(--bad-soft);color:var(--bad-ink)}
.tag.matched{background:var(--ok-soft);color:var(--ok-ink)}
/* ── TMDB 候选块（2026-10-24 新增）──────────────────────────────
   作者：「你把未确定的先整理在未确定看板，我确认没问题再入8848看板」
   ⇒ 核对结果直接摆进详情面板，档次必须肉眼可分（已确认/待核/疑似/无）。 */
.tm-card{border:1px solid var(--line2);border-radius:var(--r-m);
  padding:12px 14px;background:var(--surface-2)}
.tm-card.ok{border-color:rgba(14,159,110,.38);background:var(--ok-soft)}
.tm-card.no{border-color:rgba(220,43,43,.28);background:var(--bad-soft)}
.tm-card.wait{border-color:rgba(192,120,0,.34);background:var(--warn-soft)}
.tm-badge{display:inline-block;font-size:11.5px;font-weight:750;padding:2px 10px;
  border-radius:999px;margin-bottom:8px;letter-spacing:.02em}
.tm-badge.ok{background:var(--ok);color:#fff}
.tm-badge.no{background:var(--bad);color:#fff}
.tm-badge.wait{background:var(--warn);color:#fff}
.tm-name{font-size:15.5px;font-weight:750;color:var(--ink);margin-bottom:4px;line-height:1.35}
.tm-orig{font-size:12.5px;color:var(--ink2);margin-bottom:7px}
.tm-meta{font-size:12px;color:var(--ink2);display:flex;gap:11px;flex-wrap:wrap;align-items:center}
.tm-meta a{color:var(--brand);text-decoration:none;font-weight:700;
  font-family:var(--mono);font-size:11.5px}
.tm-meta a:hover{text-decoration:underline}
.tm-note{font-size:12px;color:var(--ink2);margin-top:8px;line-height:1.55;
  padding-top:8px;border-top:1px dashed var(--line2)}
/* 左列表的 TMDB 档次小徽标 */
.ltm{font-size:10px;font-weight:750;padding:1px 6px;border-radius:999px;
  white-space:nowrap;letter-spacing:.02em}

/* ══════════ mteam 落盘前待确认（2026-10-31）══════════
   独立页签专属样式，⛔ 不复用 .lrow/.lstatus：那边是「合集」的语义。 */
.mt-wrap{padding:16px 22px 44px;display:flex;flex-direction:column;gap:14px;max-width:1180px}
.mt-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding:11px 14px;background:var(--surface);border:1px solid var(--line2);
  border-radius:var(--r-m);box-shadow:var(--sh-1)}
.mt-bar .spacer{flex:1}
.mt-f{padding:5px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);
  font-size:12.5px;font-weight:600;color:var(--ink2)}
.mt-f:hover{border-color:var(--ink3);color:var(--ink)}
.mt-f.on{background:var(--brand);border-color:var(--brand);color:#fff}
.mt-card{border:1px solid var(--line2);border-radius:var(--r-l);background:var(--surface);
  box-shadow:var(--sh-2);overflow:hidden}
.mt-card.confirm{border-left:4px solid var(--ok)}
.mt-card.suspect{border-left:4px solid var(--warn)}
.mt-card.missing{border-left:4px solid var(--bad)}
.mt-hd{display:flex;gap:10px;align-items:baseline;padding:12px 16px;background:var(--surface-2);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.mt-key{font:700 11px var(--mono);color:var(--ink4);flex:none;white-space:nowrap}
.mt-name{font-size:15.5px;font-weight:750;letter-spacing:-.01em;color:var(--ink);line-height:1.35}
.mt-vd{font-size:11px;font-weight:750;padding:2px 9px;border-radius:999px;letter-spacing:.02em}
.mt-vd.confirm{background:var(--ok);color:#fff}
.mt-vd.suspect{background:var(--warn);color:#fff}
.mt-vd.missing{background:var(--bad);color:#fff}
.mt-hd .to{font-size:12.5px;color:var(--ink2);font-family:var(--mono)}
.mt-bd{padding:14px 16px;display:flex;flex-direction:column;gap:13px}
.mt-lab{font-size:11.5px;font-weight:750;color:var(--ink3);letter-spacing:.05em;margin-bottom:6px}
.mt-lab .n{font-family:var(--mono);color:var(--ink4);font-weight:500}
.mt-title{font-family:var(--mono);font-size:14px;font-weight:700;background:var(--brand-soft);
  border:1px solid rgba(79,70,229,.3);color:var(--brand-ink);border-radius:var(--r-s);
  padding:7px 12px;display:inline-block;cursor:pointer;word-break:break-all;line-height:1.5}
.mt-title:hover{background:#E2E3FD}
.mt-title.sm{font-size:12.5px;font-weight:600;background:var(--surface-2);border-color:var(--line);
  color:var(--ink2);padding:5px 10px}
.mt-title.sm:hover{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}
.mt-reason{font-size:13px;line-height:1.8;color:var(--ink2);background:var(--ok-soft);
  border:1px solid rgba(14,159,110,.26);border-radius:var(--r-s);padding:9px 12px}
.mt-card.suspect .mt-reason{background:var(--warn-soft);border-color:rgba(192,120,0,.24)}
.mt-card.missing .mt-reason{background:var(--surface-3);border-color:var(--line)}
.mt-neigh{display:flex;gap:6px;flex-wrap:wrap}
.mt-nh{font:11.5px var(--mono);padding:3px 9px;border-radius:var(--r-xs);
  border:1px solid var(--line2);background:var(--surface);color:var(--ink2)}
.mt-nh.gap{border-color:rgba(220,43,43,.42);background:var(--bad-soft);color:var(--bad-ink);font-weight:750}
.mt-nh.me{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink);font-weight:750}
.mt-nh .t{font-family:var(--sans);font-size:11px;opacity:.78}
.mt-files{display:flex;flex-direction:column;gap:4px;max-height:168px;overflow:auto}
.mt-file{font:11.5px var(--mono);color:var(--ink2);padding:5px 9px;border-radius:var(--r-xs);
  background:var(--surface-2);border:1px solid var(--line);cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt-file:hover{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}
.mt-bro{font-size:12px;color:var(--ink2);line-height:1.9}
.mt-bro .k{font-family:var(--mono);font-weight:700;color:var(--info-ink);background:var(--info-soft);
  padding:1px 7px;border-radius:var(--r-xs);margin-right:7px}
.mt-cand{font-size:12px;color:var(--ink3);line-height:1.85}
.mt-cand .k{font-family:var(--mono);color:var(--ink4);margin-right:6px}
.mt-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding-top:11px;border-top:1px dashed var(--line2)}
.mt-v{font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:var(--r-s);
  border:1px solid var(--line2);background:var(--surface);color:var(--ink2)}
.mt-v:hover{border-color:var(--ink3);color:var(--ink)}
.mt-v.on1{background:var(--ok);border-color:var(--ok);color:#fff}
.mt-v.on2{background:var(--bad);border-color:var(--bad);color:#fff}
.mt-v.on3{background:var(--warn);border-color:var(--warn);color:#fff}
.mt-note{font-size:12px;color:var(--ink3);line-height:1.7;margin-top:2px}
/* 已解决留档（2026-11-02 作者「解决了就去掉」）—— 折叠、灰、不占人工位 */
.mt-res{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface-2);
  padding:10px 14px;font-size:12.5px}
.mt-res>summary{cursor:pointer;color:var(--ink3);font-weight:600;
  list-style:none;display:flex;align-items:center;gap:6px}
.mt-res>summary::-webkit-details-marker{display:none}
.mt-res>summary:before{content:'▸';color:var(--ink4);transition:transform .15s}
.mt-res[open]>summary:before{transform:rotate(90deg)}
.mt-res[open]>summary{margin-bottom:8px}
.mt-res table{width:100%;border-collapse:collapse;table-layout:fixed}
.mt-res th{text-align:left;font-size:11px;font-weight:600;color:var(--ink3);
  padding:6px 8px;border-bottom:1px solid var(--line)}
.mt-res td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;
  color:var(--ink2);line-height:1.55;word-break:break-word}
.mt-res tr:last-child td{border-bottom:0}
.mt-res td.e{font:11.5px/1.5 var(--mono,ui-monospace,monospace);color:var(--ink3)}
/* ══ §122 问题清单（2026-11-01 作者「不确定的所有问题，一个一个看」）══
   ⛔ 与 mt-* 分开：那块是「作品该绑哪个词条」，这块是「文件对不对上集号」。 */
.is-t{width:100%;border-collapse:collapse;font-size:12.5px;margin:7px 0 3px}
.is-t th{text-align:left;font-weight:700;color:var(--ink3);padding:5px 8px;
  border-bottom:1px solid var(--line2);white-space:nowrap;font-size:11.5px}
.is-t td{padding:5px 8px;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:top}
.is-t tr:last-child td{border-bottom:none}
.is-t td.nm{font-family:var(--mono);font-size:11.5px;word-break:break-all;color:var(--ink);max-width:520px}
.is-t td.e{font-weight:750;color:var(--ink);white-space:nowrap}
.is-sub{font-size:11.5px;font-weight:750;color:var(--ink3);margin:11px 0 1px;letter-spacing:.02em}
.is-b{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 7px;
  border-radius:999px;margin-right:7px;letter-spacing:.02em;vertical-align:1px}
.is-b.swap{background:var(--bad);color:#fff}
.is-b.seq{background:var(--warn);color:#fff}
.is-b.orphan{background:var(--info);color:#fff}
.is-b.nosize{background:var(--surface-3);color:var(--ink2)}
.is-row{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;
  border:1px solid var(--line2);border-radius:var(--r-l);background:var(--surface);margin-bottom:8px}
.is-row.done{opacity:.5}
.is-row .isc{flex:none;margin-top:3px}
.is-row .ism{flex:1;min-width:0}
.is-t1{font-size:13.5px;font-weight:650;color:var(--ink);word-break:break-word;cursor:pointer}
.is-t1:hover{color:var(--brand-ink)}
.is-t2{font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.65;word-break:break-word}
.is-x{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line2);display:none}
.is-x.on{display:block}
.is-prog{font-size:12px;color:var(--ink3)}
.is-prog b{color:var(--ink);font-size:13px}
.is-act{font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);
  background:var(--surface);color:var(--ink2);cursor:pointer}
.is-act:hover{background:var(--surface-2);color:var(--ink)}
/* 优先级：让 23 条倒挂里「真可能错」的那 2 条一眼跳出来 */

const HID = new Set();

async function loadHid(){
  try{
    const r = await fetch('/api/hidden/keys?scope=unconfirmed');
    if(r.ok){ const d = await r.json(); (d.keys||[]).forEach(k=>HID.add(String(k))); }
  }catch(e){/* 老库没跑 migration ⇒ 空集 */ }
  try{ hidOpen = localStorage.getItem('hifan-unconf-hid-open')==='1'; }catch(e){}
}

async function togHid(key, ev){
  ev && ev.stopPropagation && ev.stopPropagation();
  const k = String(key);
  try{
    const r = await fetch('/api/hidden/toggle', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({scope:'unconfirmed', key:k}),
    });
    if(!r.ok){ tip('屏蔽失败 '+r.status); return; }
    const d = await r.json();
    if(d.action==='unhidden'||d.action==='noop') HID.delete(k); else HID.add(k);
  }catch(e){ tip('屏蔽请求失败'); return; }
  render();
}

  const fn=document.getElementById('fn').value;
  const fv=document.getElementById('fv').value;
  const ft=(document.getElementById('ft')||{}).value||'';
  let L = GS.slice();
  if(TAB==='multi')  L=L.filter(g=>g.n_eps>1);
  if(TAB==='single') L=L.filter(g=>g.n_eps===1);
  if(TAB==='pending')L=L.filter(g=>!V[g.gid]);
  if(TAB==='done')   L=L.filter(g=>V[g.gid]);
  if(fs==='both')    L=L.filter(g=>g.both_src);
  else if(fs)        L=L.filter(g=>g.srcs.includes(fs));
  if(fn==='multi')   L=L.filter(g=>g.n_eps>1);
  else if(fn==='1')  L=L.filter(g=>g.n_eps===1);
  if(fv==='none')    L=L.filter(g=>!V[g.gid]);
  else if(fv)        L=L.filter(g=>V[g.gid]&&V[g.gid].v===fv);
  /* TMDB 对应筛选（2026-10-24） */
  if(ft==='has')     L=L.filter(g=>g.tmdb&&g.tmdb.id);
  else if(ft==='none') L=L.filter(g=>!g.tmdb||!g.tmdb.id);
  else if(ft)        L=L.filter(g=>g.tmdb&&g.tmdb.tier===ft);
  if(kw){
    L=L.filter(g=>[g.title_ja,g.work_key,g.brand,g.year,
        (g.titles_zh||[]).join(' '),(g.mteam_keys||[]).join(' '),
        (g.hanime_keys||[]).join(' '),(g.title_ja_all||[]).join(' '),
        g.items.map(i=>i.src_key+' '+i.title).join(' ')].join(' ').toLowerCase().includes(kw));
  }
  return L;
}

function render(){
  if(TAB==='pin'){
    document.getElementById('split').classList.add('full');
    document.getElementById('detailPane').innerHTML = pinTable();
    document.getElementById('cnt').textContent='';
    document.getElementById('lpCount').textContent='';
    autoSyncOnBoot();      /* 上次没交成功的，进页面自动补交 */
    return;
  }
  if(TAB==='gap' || TAB==='wrongbind'){
    document.getElementById('split').classList.add('full');
    document.getElementById('detailPane').innerHTML =
      TAB==='gap' ? gapTable() : wrongTable();
    document.getElementById('cnt').textContent='';
    document.getElementById('lpCount').textContent='';
    return;
  }
  if(TAB==='detail'){
    document.getElementById('split').classList.add('full');
    document.getElementById('detailPane').innerHTML = detailTable();
    document.getElementById('cnt').textContent='';
    document.getElementById('lpCount').textContent='';
    return;
  }
  if(TAB==='mteam'){
    document.getElementById('split').classList.add('full');
    document.getElementById('cnt').textContent='';
    document.getElementById('lpCount').textContent='';
    renderMt();
    return;
  }
  if(TAB==='emby'){
    document.getElementById('split').classList.add('full');
    document.getElementById('cnt').textContent='';
    document.getElementById('lpCount').textContent='';
    renderEmby();
    return;
  }
  if(TAB==='issues'){
    document.getElementById('split').classList.add('full');
    document.getElementById('cnt').textContent='';
    document.getElementById('lpCount').textContent='';
    renderIssues();
    return;
  }
  document.getElementById('split').classList.remove('full');

  const all = curList();
  // 整组都被屏蔽的合集收进底部折叠区
  const vis = all.filter(g=>!groupHidden(g)), hid = all.filter(groupHidden);
  VIS = vis;
  if(!SEL || !vis.some(g=>g.gid===SEL)) SEL = vis.length ? vis[0].gid : null;

  document.getElementById('cnt').textContent =
    `显示 ${vis.length} / ${GS.length} 个合集` + (hid.length?` · 已屏蔽 ${hid.length}`:'');
  document.getElementById('lpCount').textContent = vis.length+' 条';

  /* 左列表 */
  let listHtml = vis.map(g=>{
    const v = V[g.gid];
    const st = v ? (v.v==='ok'?'ok':v.v==='no'?'no':'wait') : '';
    const vTxt = v ? ({ok:'✓',no:'✗',wait:'⚠'}[v.v]) : '';
    const meta = [];
    meta.push(`<span class="b">${g.n_eps}</span> 集`);
    if(g.both_src) meta.push('两源');
    else if(g.srcs.includes('hanime')) meta.push('hanime');
    else if(g.srcs.includes('mteam')) meta.push('mteam');
    if(g.year) meta.push(g.year);
    const tmt = g.tmdb && g.tmdb.tier;
    const TMLB = {user:'TMDB✓',auto:'待核',guess:'疑似',none:'无词条',user_nf:'无词条'};
    return `<button class="lrow${g.gid===SEL?' on':''}${v?' done':''}" data-gid="${esc(g.gid)}">
      <span class="lstatus ${st}"></span>
      <span class="lmain">
        <span class="ltitle">${esc(groupTitle(g))}</span>
        <span class="lmeta">${meta.join('<span class="sep">·</span>')}${
          tmt?`<span class="sep">·</span><span class="ltm ${tmt}">${TMLB[tmt]||tmt}</span>`:''}</span>
      </span>
      ${vTxt?`<span class="lv ${st}">${vTxt}</span>`:''}
    </button>`;
  }).join('');
  if(hid.length){
    listHtml += `<div class="hidbar" id="hidbar">
      <span>${hidOpen?'▾':'▸'}</span>
      <span>已屏蔽 <b>${hid.length}</b> 个合集</span>
      <span style="margin-left:auto;opacity:.7">${hidOpen?'点一下收起':'点一下展开看看'}</span>
    </div>`;
    if(hidOpen) listHtml += hid.map(g=>{
      const v = V[g.gid];
      return `<button class="lrow hid" data-gid="${esc(g.gid)}">
        <span class="lstatus"></span>
        <span class="lmain"><span class="ltitle">${esc(groupTitle(g))}</span>
        <span class="lmeta">${g.n_eps} 条源记录${(g.n_hanime_eps&&g.n_hanime_eps>1)?` · hanime ${g.n_hanime_eps} 集`:''} · 已屏蔽</span></span>
        ${v?`<span class="lv ${v.v}">${({ok:'✓',no:'✗',wait:'⚠'})[v.v]}</span>`:''}
      </button>`;
    }).join('');
  }
  if(!all.length) listHtml = '<div class="empty"><b>没有符合筛选条件的合集</b>换个筛选条件试试</div>';
  document.getElementById('listPane').innerHTML = listHtml;

  renderDetail();
}

/* ── 右详情面板 ── */
function renderDetail(){
  const pane = document.getElementById('detailPane');
  const g = VIS.find(x=>x.gid===SEL);
  if(!g){
    pane.innerHTML = '<div class="empty"><b>左边选一个合集</b>右边会显示它的日文标题、番号与源记录</div>';
    return;
  }
  const v = V[g.gid];
  const idx = VIS.findIndex(x=>x.gid===g.gid);

  /* 日文标题 —— 这是拿去 TMDB 搜的东西，字号最大 */
  const ja = g.title_ja
    ? `<span class="copy big" onclick="cp(this.textContent)">${esc(g.title_ja)}</span>`+
      (g.title_ja_all && g.title_ja_all.length>1
        ? `<div style="margin-top:6px">${g.title_ja_all.slice(1).map(t=>
            `<span class="copy" onclick="cp(this.textContent)">${esc(t)}</span>`).join('')}</div>` : '')
    /* 🔴 无 vid 日文名时，title_ja 其实是中文主干（title_zh 兜底），
       这时**别标「无日文名」**误导作者 —— 直接按中文展示，标注仅供参考 */
    : (g.title_zh
        ? `<span class="copy big" onclick="cp(this.textContent)" title="仅中文，去 TMDB 搜建议用下方番号">${esc(g.title_zh)}</span>`+
          `<span class="hint">仅中文译名，去 TMDB 搜建议用下方 mteam 番号</span>`
        : `<span class="hint">⚠ 无日文名</span>`)+
      (g.search_hint?`<span class="hint" onclick="cp(this.textContent)">搜：${esc(g.search_hint)}</span>`:'');

  /* ── TMDB 对应（2026-10-24）──
     档次语义必须分开，⛔ auto 不许显示成「已确认」：
       user    = 作者人工搜过并确认
       user_nf = 作者人工搜过、TMDB 确实没有
       auto    = 助手本轮搜到，标题逐字对 + 年份吻合，待作者核
       guess   = 助手的系列/跨卷疑似，必须人工判断
       none    = 搜不到 */
  const TMC = {
    user:    ['✅ 作者已确认',  'ok'],
    user_nf: ['🚫 人工搜过·无词条','no'],
    auto:    ['🔍 助手搜到·待你核','wait'],
    guess:   ['⚠️ 疑似·需人工判断','wait'],
    none:    ['❌ 未找到',       'no']
  };
  let tmdbBlock = '';
  if (g.tmdb){
    const t = g.tmdb, pc = TMC[t.tier] || TMC.none;
    if (t.id){
      tmdbBlock = `<div class="dp-sec">
        <div class="dp-t2">TMDB 对应</div>
        <div class="tm-card ${pc[1]}">
          <span class="tm-badge ${pc[1]}">${pc[0]}</span>
          <div class="tm-name">${esc(t.name||'')}</div>
          ${t.orig && t.orig!==t.name?`<div class="tm-orig">${esc(t.orig)}</div>`:''}
          <div class="tm-meta">
            <span class="mono">${esc(t.media_type||'')}/${t.id}</span>
            ${t.date?`<span>${esc(t.date)}</span>`:''}
            ${t.eps?`<span>${t.eps}${t.media_type==='movie'?' 分钟':' 集'}</span>`:''}
            ${t.seasons?`<span>${t.seasons} 季</span>`:''}
            <a href="${esc(t.url)}" target="_blank" rel="noopener">打开 TMDB ↗</a>
          </div>
          ${t.note?`<div class="tm-note">${esc(t.note)}</div>`:''}
        </div>
      </div>`;
    } else {
      tmdbBlock = `<div class="dp-sec">
        <div class="dp-t2">TMDB 对应</div>
        <div class="tm-card ${pc[1]}">
          <span class="tm-badge ${pc[1]}">${pc[0]}</span>
          <div class="tm-meta">${esc(t.note||'无候选')}</div>
        </div>
      </div>`;
    }
  }

  const zh = (g.titles_zh && g.titles_zh.length)
    ? g.titles_zh.map(t=>`<span class="copy" onclick="cp(this.textContent)">${esc(t)}</span>`).join('')
    : `<span style="color:var(--ink4);font-size:12.5px">—</span>`;

  const mtKeys = (g.mteam_keys && g.mteam_keys.length)
    ? g.mteam_keys.map(k=>`<span class="copy" onclick="cp(this.textContent)">${esc(k)}</span>`).join('')
    : '';

  const rows = (g.items||[]).map(i=>`<tr>
      <td><span class="tag ${i.src}">${i.src}</span></td>
      <td><span class="tag ${i.status}">${i.status}</span></td>
      <td class="mono">${esc(i.src_key||'')}</td>
      <td>${i.ep?`<span class="mono" style="color:var(--ink4)">${esc(i.ep)}</span> `:''}${
        i.title_ja?`<span class="copy" style="font-size:12px" onclick="cp(this.textContent)">${esc(i.title_ja)}</span>`
        :esc(i.title||'')}</td>
      <td style="text-align:right;white-space:nowrap">
        ${HID.has(String(i.src_key))
          ? `<button class="hidbtn on" data-hidkey="${esc(i.src_key)}" title="点一下恢复这条源">✓ 已屏蔽</button>`
          : `<button class="hidbtn" data-hidkey="${esc(i.src_key)}" title="不想看这条源？屏蔽后核对时自动跳过">屏蔽这条</button>`}
      </td>
    </tr>`).join('');

  const ghid = groupHidden(g);

  pane.innerHTML = `
    <div class="dp-head">
      <div style="min-width:0">
        <div class="dp-t">${esc(groupTitle(g))}</div>
        <div class="dp-s">
          <span>${esc(g.gid)}</span>
          <span>${g.n_eps} 条源记录</span>
          ${(g.n_hanime_eps&&g.n_hanime_eps>1)?`<span>hanime 实为 ${g.n_hanime_eps} 集</span>`:''}
          ${g.both_src?'<span>两源齐全</span>':''}
          ${g.srcs.includes('hanime')?'<span>hanime</span>':''}
          ${g.srcs.includes('mteam')?'<span>mteam</span>':''}
          ${g.year?`<span>${g.year}</span>`:''}
          ${g.brand?`<span>${esc(g.brand)}</span>`:''}
        </div>
      </div>
      <div class="dp-nav">
        <button id="prevG" title="上一条（↑）"${idx<=0?' disabled':''}>↑</button>
        <button id="nextG" title="下一条（↓）"${idx>=VIS.length-1?' disabled':''}>↓</button>
      </div>
    </div>

    <div class="dp-sec">
      <div class="dp-t2">日文标题 · 点一下复制去 TMDB 搜</div>
      ${ja}
      ${(() => {
        /* 2026-11-02：人工匹配要少一步 —— 直接带着名字跳 TMDB 搜，
           ⛔ 不猜 id：只拼 query，命不命中由人看 */
        const q = g.title_ja || g.title_zh || (g.mteam_keys || [])[0] || (g.hanime_keys || [])[0] || '';
        if (!q) return '';
        const u = 'https://www.themoviedb.org/search?query=' + encodeURIComponent(q);
        return `<a class="tm-go" href="${u}" target="_blank" rel="noopener">去 TMDB 搜 ↗</a>`;
      })()}
    </div>

    ${tmdbBlock}

    ${(g.titles_zh&&g.titles_zh.length)?`<div class="dp-sec">
      <div class="dp-t2">hanime 原标题 <span class="n">${g.titles_zh.length}</span></div>
      <div>${zh}</div>
    </div>`:''}

    ${(g.hanime_eps&&g.hanime_eps.length>1)?`<div class="dp-sec">
      <div class="dp-t2">hanime 逐集 <span class="n">${g.hanime_eps.length}</span>
        <span class="hint">同一行 source_work 的 entry_detail 里的全部集次</span></div>
      <div>${g.hanime_eps.map((t,i)=>`<span class="copy" style="font-size:12px" onclick="cp(this.textContent)">${i+1}. ${esc(t)}</span>`).join('')}</div>
      ${(g.hanime_eps_ja&&g.hanime_eps_ja.length)?`<div style="margin-top:6px">${g.hanime_eps_ja.map((t,i)=>`<span class="copy" style="font-size:12px" onclick="cp(this.textContent)">${i+1}. ${esc(t)}</span>`).join('')}</div>`:''}
    </div>`:''}

    ${(g.mteam_keys&&g.mteam_keys.length)?`<div class="dp-sec">
      <div class="dp-t2">mteam 番号 <span class="n">${g.mteam_keys.length}</span></div>
      <div>${mtKeys}</div>
    </div>`:''}

    <div class="dp-sec">
      <div class="dp-t2">涉及的源记录 <span class="n">${(g.items||[]).length}</span>
        <button class="hidbtn ${ghid?'on':''}" data-hidkey="${
          (g.items||[]).map(it=>esc(it.src_key)).join(',')
        }" style="margin-left:auto" title="${ghid
          ? '这组源已全部屏蔽，点一下恢复'
          : '不想看这一整组？点一下把 ' + (g.items||[]).length + ' 条源全部屏蔽'}">${ghid?'✓ 已屏蔽':'屏蔽这组'}</button>

      <table class="items">
        <thead><tr><th style="width:64px">源</th><th style="width:62px">状态</th>
          <th style="width:132px">番号/键</th><th>标题（点击复制）</th><th style="width:78px"></th></tr></thead>

    <div class="dp-verdict">

      <button class="vb ${v&&v.v==='ok'?'on':''}"   data-v="ok"   onclick="setV('${esc(g.gid)}','ok')">✓ 是同一部</button>
      <button class="vb ${v&&v.v==='no'?'on':''}"   data-v="no"   onclick="setV('${esc(g.gid)}','no')">✗ 不是</button>
      <button class="vb ${v&&v.v==='wait'?'on':''}" data-v="wait" onclick="setV('${esc(g.gid)}','wait')">⚠ 待定</button>
      <input class="vnote" placeholder="备注（可选）" value="${esc((v&&v.note)||'')}"
             onchange="noteV('${esc(g.gid)}',this.value)">
      ${v?`<span class="savehint">已存本地</span><button class="vb" onclick="clrV('${esc(g.gid)}')">清除</button>`:''}
      <span class="kbd">↑↓ 换条 · 1/2/3 判定 · F 复制日文名</span>
    </div>`;
}

/* ── 判定操作 ── */
function saveV(gid,v,note){
  V[gid] = {v:v, note:note||'', ts:Date.now()};
  localStorage.setItem(LS, JSON.stringify(V));
  tip('已记下：'+gid+' → '+({ok:'✓ 是同一部',no:'✗ 不是',wait:'⚠ 待定'}[v]||v));
}
function clearV(gid){ delete V[gid]; localStorage.setItem(LS, JSON.stringify(V)); }
function setV(gid,v){ saveV(gid,v); render(); }
function noteV(gid,n){ if(V[gid]){ V[gid].note=n; localStorage.setItem(LS,JSON.stringify(V)); } }

  const rows = G.map(x=>`<tr>

        <th style="width:170px">站上候选</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
}

  const rows = W.map(x=>`<tr>
      <td class="mono">${x.work}</td>
      <td>${esc(x.name||'—')}<div style="color:var(--ink3);font-size:11.5px">${esc(x.orig||'')}</div></td>

      <td><span class="tag ${x.missing}">缺 ${x.missing}</span></td>
      <td class="mono">${esc(x.src_key||'')}<div style="font-size:11.5px;color:var(--ink3)">${esc((x.src_title||'').slice(0,64))}</div></td>
      <td class="mono">${x.bound_work||'—'}<div style="font-size:11.5px;color:var(--ink3)">${esc((x.bound_name||'').slice(0,26))}</div></td>
      <td>${(x.score||0).toFixed(2)}</td>
    </tr>`).join('');
  const frow = F.map(x=>`<tr>
      <td class="mono">${x.work}</td>
      <td>${esc(x.name||'—')}<div style="color:var(--ink3);font-size:11.5px">${esc(x.orig||'')}</div></td>
      <td>${x.year||'—'} / ${x.eps||'—'}集</td>
      <td class="mono">${esc(x.src_key||'')}<div style="font-size:11.5px;color:var(--ink3)">${esc((x.src_title||'').slice(0,64))}</div></td>
      <td>${(x.score||0).toFixed(2)}</td>
    </tr>`).join('');
  // 已补挂：6 条都已落库并复核完（§130 作者「不是都确认了吗，不清理？」）
  // ⇒ 清单改成 archived 留档后这里恒为空，整块不渲染
  const fBlock = F.length ? `
    <div class="sec" style="margin-top:18px">已补挂（本轮已直接写入库，留档供你复核）· ${F.length} 条</div>
    <table class="items">
      <thead><tr><th style="width:74px">TMDB</th><th>作品</th><th style="width:96px">年份/集数</th>
        <th>已挂上的源（番号 / 标题）</th><th style="width:52px">分数</th></tr></thead>
      <tbody>${frow}</tbody></table>` : '';
  return `<div class="sec">疑似绑错 · ${W.length} 条
      —— 这部缺的源在库里已经绑给别的作品了：源标题看着就是它，需要你确认是否改绑</div>
    <table class="items">
      <thead><tr><th style="width:74px">TMDB</th><th>作品</th><th style="width:96px">年份/集数</th>
        <th style="width:104px">缺哪边</th><th>候选源（番号 / 标题）</th>
        <th>现在绑给了谁</th><th style="width:52px">分数</th></tr></thead>
      <tbody>${rows}</tbody></table>${fBlock}`;
}

/* ══════════ extra 待钉（作者 2026-10-24：逐条核对，不然完全分不清）══════════
   口径：源已绑在作品上、但没落到具体集 ⇒ 只出现在主看板详情抽屉底部的 extra 区。
   一条记录 = 一条源。
   🔴 录入方式（10-24 二改）：作者原话「可钉的我还可以直接选，不可钉的，
      我要是指定哪一集，现在的看板不方便」⇒ ⛔ 不再只有 ✓/✗/?，
      每行给「钉到」下拉，选项 = 该作品**每一集**的 集名+日文名+air_date+两站占用。
   存储：localStorage(unc_pin_v1) ＋「提交」POST /api/pin_marks
        → 容器 /app/data/pin_marks.json（持久卷，助手下轮直接读）
        ⛔ 仍不写库、不动线上看板；落库另走五步闭环。
   🔴 锚 rowkey = work|src|src_key —— ⛔ 不用行号/序号（重建会重排，0fs）。 */
const PL = D['待钉'] || {};
const PR = PL['记录'] || [];
const POOL = PL['集池'] || {};
const PLS = 'unc_pin_v1';
const PV = (()=>{ try{ return JSON.parse(localStorage.getItem(PLS)||'{}'); }catch(e){ return {}; } })();
/* 🔴 10-24 作者：「这些不是确定我提交过吗，怎么没上看板」——他选了 4 条，
   但没点「提交给助手」，服务端只有 16:00 那 3 条。⇒ 选完不点＝白选。
   现在改成**自动提交**：每次改动 ≤700ms 后自己 POST；PSS 存上次成功提交的快照，
   用来判断「还有没有没提交的改动」，进页面时也会自动补交一次。*/
const PSS = 'unc_pin_sent_v1';
const PSENT0 = (()=>{ try{ return localStorage.getItem(PSS)||''; }catch(e){ return ''; } })();
let PSENT = PSENT0;                 /* 上次成功提交的快照 JSON */
let PSYNC = {busy:false, ts:'', err:''};
let PTIER = 'A';           /* 默认停在「可钉」：先把能落的看完 */

const TLBL = {A:'可钉', B:'待你判', C1:'建议留', C2:'建议留', C3:'错绑'};
const TICON = {A:'✓', B:'?', C1:'—', C2:'—', C3:'⚠'};
const TCLS = {A:'matched', B:'pending', C1:'matched', C2:'matched', C3:'orphan'};
const PAD = n => String(n).padStart(2,'0');

/* ── TMDB 直达链接（作者 10-24：我要能跳过去核对）────────────────────
   词条：/tv/{id}?language=zh-CN   ·   单集：/tv/{id}/season/{s}/episode/{e}
   ⚠️ 里番一律 tv（0dp），但 media 字段在就照它走，别硬编码。
   ⛔ 只用数字 id 拼 URL，不拼用户可写的标题 ⇒ 无注入面；仍加 rel=noopener。 */
function tmdbUrl(r, s, e){
  const kind = (r.media==='movie') ? 'movie' : 'tv';
  const base = 'https://www.themoviedb.org/' + kind + '/' + encodeURIComponent(String(r.work));
  return (s==null) ? (base + '?language=zh-CN')
                   : (base + '/season/' + s + '/episode/' + e + '?language=zh-CN');
}
/* txt 由调用方给（已 esc）；s/e 不传＝词条首页 */
function tmdbA(r, txt, s, e, cls){
  return `<a class="tmdb ${cls||''}" href="${tmdbUrl(r,s,e)}" target="_blank"
    rel="noopener noreferrer" title="在 TMDB 新窗口打开核对">${txt}<span class="tmdbic">↗</span></a>`;
}

/* ── 墓碑（2026-10-24 17:50）────────────────────────────────────
   🔴 起因：作者「真正的蓝色 / 抽彩三角铃 我已经确认提交过几次了」——
   查服务器日志只有 2 次 POST，且都是 count=3（旧那 3 条）。
   两个真 bug：
     ① 后端 `writeFileSync` **整包覆盖** ⇒ 任一端提交都会清掉另一端已提交的
     ② localStorage 按 **origin** 隔离 ⇒ 8848 内网 与 hifan.example.com:16666
        是两份互不可见的标记，他在一边选、另一边自动提交把旧的盖回去
   ⇒ 对策：后端 merge（不再覆盖）＋ 进页面先 GET 服务端已有标记合并进本地。
   ⚠️ merge 带来新问题：「取消某条」删不掉（本地删了，下次 GET 又拉回来）。
      所以删除不真删，写**墓碑** `{del:1}`：本地看得见它被删了，提交时转成
      `unset` 列表让后端从文件里摘掉。
   ⛔ 墓碑不算「已定」，计数/筛选/渲染一律走 isMark()。 */
const isMark = m => !!(m && !m.del);
const cntPV  = () => Object.keys(PV).filter(k=>isMark(PV[k])).length;

/* 标记的**稳定签名**：只取语义字段 + key 排序。
   ⛔ 不能直接 JSON.stringify(PV)：对象插入顺序会变、迭代器顺序不稳 ⇒
   「刚提交过」和「又判定未提交」来回翻 ⇒ 700ms 防抖变死循环 POST。 */
function pvSig(){
  const o = {};
  Object.keys(PV).sort().forEach(k=>{
    const v = PV[k]; if(!v || typeof v!=='object') return;
    if(v.del) o[k] = {del:1};
    else if(v.pick) o[k] = {pick:{s:+v.pick.s, e:+v.pick.e}};
    else if(v.skip) o[k] = {skip:1};
    else if(v.wait) o[k] = {wait:1};
    else if(v.v) o[k] = {v:v.v};
  });
  return JSON.stringify(o);
}

/* 进页面先拉服务端已提交的标记，并入本地（本地为准：本地有就不用服务端的） */
async function pullServerMarks(){
  try{
    const res = await fetch('/api/pin_marks', {cache:'no-store'});
    const j = await res.json();
    const sm = (j && j.marks) || {};
    let added = 0;
    Object.keys(sm).forEach(k=>{
      if(k in PV) return;                 /* 本地已有（含墓碑）⇒ 不覆盖 */
      if(sm[k] && typeof sm[k]==='object'){ PV[k] = sm[k]; added++; }
    });
    if(added){
      try{ localStorage.setItem(PLS, JSON.stringify(PV)); }catch(e){}
      /* ⛔ 不把 PSENT 对齐到合并后的状态：本地新选的那些还没提交呢 */
      console.log('[pin] 从服务端并入 '+added+' 条已有标记');
    }
  }catch(e){ /* 拉不到不影响本地操作 */ }
}

function savePV(){
  try{ localStorage.setItem(PLS, JSON.stringify(PV)); }catch(e){}
  scheduleSync();
}

/* 改动后延迟自动提交（连点几下只发最后一下） */
let _psT = null;
function scheduleSync(){
  if(_psT) clearTimeout(_psT);
  _psT = setTimeout(()=>{ _psT = null; pinSubmit(true); }, 700);
}

/* 同步状态文案：让「选了但没提交」这件事在页面上**看得见** */
function pinSyncText(nDone){
  const cur = pvSig();
  if(PSYNC.busy) return `已定 <b>${nDone}</b> / ${PR.length} 条 · <span class="psync-w">提交中…</span>`;
  if(PSYNC.err)  return `已定 <b>${nDone}</b> / ${PR.length} 条 · <span class="psync-e">❌ 未提交：${esc(PSYNC.err)}</span> <a href="javascript:pinSubmit(false)" style="color:var(--bad-ink)">重试</a>`;
  if(!nDone) return `已定 <b>0</b> / ${PR.length} 条`;
  if(cur !== PSENT) return `已定 <b>${nDone}</b> / ${PR.length} 条 · <span class="psync-w">未提交，稍后自动提交…</span>`;
  return `已定 <b>${nDone}</b> / ${PR.length} 条 · <span class="psync-ok">✅ 已提交${PSYNC.ts?' '+PSYNC.ts:''}</span>`;
}

/* 统一读法：新标记 {pick:{s,e}} / {skip:1} / {wait:1}；兼容旧标记 {v:'ok'|'no'|'wait'} */
function pickOf(r){
  const m = PV[r.rowkey]; if(!isMark(m)) return null;
  if(m.pick) return {s:m.pick.s, e:m.pick.e};
  if(m.skip) return {skip:true};
  if(m.wait) return {wait:true};
  if(m.v==='ok'){
    const t=/S(\d+)E(\d+)/.exec(r.target||'');
    if(t) return {s:+t[1], e:+t[2]};
  }
  if(m.v==='no') return {skip:true};
  if(m.v==='wait') return {wait:true};
  return null;
}
function epOf(w,s,e){ return (POOL[w]||[]).find(x=>x.s===s && x.e===e) || {}; }
/* 该条源在某一集上的占用情况：mine=同站已占(会挤掉) oth=跨站已占(可共占) */
function occOf(r,e){
  const k = r.src==='hanime' ? 'h' : 'm';
  const o = r.src==='hanime' ? 'm' : 'h';
  return {mine:(e&&e[k])||[], oth:(e&&e[o])||[]};
}
function pinFiltered(){
  const kw = ((document.getElementById('kw')||{}).value||'').trim().toLowerCase();
  return PR.filter(r=>{
    if(PTIER==='A' && r.tier!=='A') return false;
    if(PTIER==='B' && r.tier!=='B') return false;
    if(PTIER==='C' && !(r.tier==='C1'||r.tier==='C2'||r.tier==='C3')) return false;
    if(PTIER==='undo' && isMark(PV[r.rowkey])) return false;
    if(PTIER==='ans') return isMark(PV[r.rowkey]);
    if(kw){
      const hay = [r.work,r.name,r.name_ja,r.src_key,r.title,r.target_name,r.target_ja,r.why,r.brief,r.ask]
        .join(' ').toLowerCase();
      if(!hay.includes(kw)) return false;
    }
    return true;
  });
}
/* 「钉到」下拉：把该作品每一集都列出来，他直接点选哪一集 */
function pinSelect(r){
  const pool = POOL[r.work] || [];
  const cur = pickOf(r);
  const rk = esc(r.rowkey);
  let h = `<select class="pselect" data-rk="${rk}" onchange="pinPick(this)">`;
  h += `<option value=""${!cur?' selected':''}>— 未选 —</option>`;
  h += `<option value="0-0"${cur&&cur.skip?' selected':''}>✗ 不钉（留 extra）</option>`;
  h += `<option value="w"${cur&&cur.wait?' selected':''}>? 待定</option>`;
  if(pool.length){
    const g = {};
    pool.forEach(e=>{ (g[e.s] = g[e.s]||[]).push(e); });
    Object.keys(g).sort((a,b)=>(+a)-(+b)).forEach(s=>{
      h += `<optgroup label="第 ${s} 季${+s===0?'（特典/SP）':''}">`;
      g[s].forEach(e=>{
        const o = occOf(r,e);
        const mark = o.mine.length ? ` ⚠同站已占${o.mine.length}`
                   : (o.oth.length ? ` ＋跨站已占` : '');
        const on = cur && !cur.skip && !cur.wait && cur.s===e.s && cur.e===e.e;
        h += `<option value="${e.s}-${e.e}"${on?' selected':''}>`
           + `S${PAD(e.s)}E${PAD(e.e)} · ${esc(e.name||'（无集名）')}`
           + (e.air?` · ${e.air}`:'') + mark + `</option>`;
      });
      h += `</optgroup>`;
    });
  }
  h += `</select>`;
  return h + pinInfo(r);
}

/* 选中集之后的三行小字：集名/日文名/air_date/占用警告（省得再去点开下拉看） */
function pinInfo(r){
  const cur = pickOf(r);
  if(!cur) return `<div class="pinfo"></div>`;
  if(cur.skip) return `<div class="pinfo"><span class="pnone">已定：留 extra，不钉</span></div>`;
  if(cur.wait) return `<div class="pinfo"><span class="pnone">已定：待定</span></div>`;
  const e = epOf(r.work, cur.s, cur.e);
  const o = occOf(r, e);
  return `<div class="pinfo">`
    + `<div class="pep"><b class="mono">S${PAD(cur.s)}E${PAD(cur.e)}</b> ${esc(e.name||'（该集无集名）')}</div>`
    + (e.ja?`<div class="pepja">${esc(e.ja)}</div>`:'')
    + (e.air?`<div class="pair">配信/放送日 ${e.air}</div>`:'')
    + `<div class="plink">${tmdbA(r, 'TMDB 打开这一集', cur.s, cur.e)}</div>`
    + (o.mine.length?`<div class="pwarn">⚠ 该集已有同站源 ${esc(o.mine.join('、'))} —— 钉下去会把它挤成 extra</div>`:'')
    + (!o.mine.length && o.oth.length?`<div class="poks">＋ 该集已有另一站源 ${esc(o.oth.join('、'))}（跨站可共占）</div>`:'')
    + `</div>`;
}

/* 只局部更新：⛔ 不整页 render（长列表里 render 会把他滚回顶部） */
function pinPick(el){
  const k = el.dataset.rk, v = el.value;
  if(!v){ PV[k] = {del:1, ts:Date.now()}; }   /* 墓碑：不是真删，见 isMark 注释 */
  else if(v==='0-0'){ PV[k] = {skip:1, ts:Date.now()}; }
  else if(v==='w'){ PV[k] = {wait:1, ts:Date.now()}; }
  else { const p = v.split('-'); PV[k] = {pick:{s:+p[0], e:+p[1]}, ts:Date.now()}; }
  savePV();
  const tr = el.closest('tr');
  const r = PR.find(x=>x.rowkey===k);
  const m = isMark(PV[k]) ? PV[k] : null;
  if(tr){
    tr.classList.toggle('pv-ok', !!(m && m.pick));
    tr.classList.toggle('pv-no', !!(m && m.skip));
    tr.classList.toggle('pv-wait', !!(m && m.wait));
    const box = tr.querySelector('.pinfo');
    if(box && r) box.outerHTML = pinInfo(r);
  }
  updCnt();
  tip(m ? (m.pick?`记下：钉到 S${PAD(m.pick.s)}E${PAD(m.pick.e)}`:(m.skip?'记下：不钉':'记下：待定')) : '已清除');
}

function updCnt(){
  const n = cntPV();
  const el = document.getElementById('pinCnt');
  if(el) el.innerHTML = `已定 <b>${n}</b> / ${PR.length} 条`;
  const b = document.getElementById('pinSub');
  if(b) b.disabled = !n;
}

/* A 档一键采纳「建议集」（每条 A 档都有 target） */
function pinAcceptA(){
  let n = 0;
  PR.filter(r=>r.tier==='A' && !isMark(PV[r.rowkey])).forEach(r=>{
    const t = /S(\d+)E(\d+)/.exec(r.target||'');
    if(!t) return;
    PV[r.rowkey] = {pick:{s:+t[1], e:+t[2]}, ts:Date.now(), auto:1};
    n++;
  });
  savePV(); render(); tip(n?`已采纳 A 档建议 ${n} 条`:'A 档都已有定论');
}

/* 一键清空（本机范围） */
function pinReset(){
  if(!cntPV()) return tip('本来就没标过');
  if(!confirm('清空本机全部标记？' + cntPV() + ' 条')) return;
  /* 全清也写墓碑 ⇒ 下次提交时后端会把它们从 pin_marks.json 摘掉，
     ⛔ 否则进页面 GET 又会把它们并回来 */
  Object.keys(PV).forEach(k=>{ PV[k] = {del:1, ts:Date.now()}; });
  savePV(); render(); tip('已清空');
}

/* 提交给助手：写 /app/data/pin_marks.json，助手下一轮直接读文件
   auto=true 时是自动提交（不弹提示、失败不弹兜底框，改成状态条上显红字+重试） */
async function pinSubmit(auto){
  /* 墓碑拆出去走 unset：后端 merge 语义下，只有显式 unset 才能真的删掉一条 */
  const marks = {}, unset = [];
  Object.keys(PV).forEach(k=>{
    const v = PV[k];
    if(v && v.del) unset.push(k);
    else if(v && typeof v==='object') marks[k] = v;
  });
  const n = Object.keys(marks).length;
  if(!n && !unset.length){ if(!auto) tip('还没定任何一条'); return; }
  if(PSYNC.busy) return;
  PSYNC.busy = true; PSYNC.err = '';
  paintSync();
  try{
    const res = await fetch('/api/pin_marks', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({marks:marks, unset:unset, page:'unconfirmed-extra-pin'})
    });
    const j = await res.json();
    if(!res.ok || !j.ok) throw new Error((j&&j.error)||('HTTP '+res.status));
    PSENT = pvSig();          /* 存稳定签名，⛔ 不是 marks 的 JSON */
    PSYNC.ts = new Date().toLocaleTimeString().slice(0,5);
    try{ localStorage.setItem(PSS, PSENT); }catch(e){}
    PSYNC.busy = false;
    paintSync();
    if(!auto) tip(`已提交 ${j.count} 条（我这边下次就能读到）`);
  }catch(err){
    PSYNC.busy = false;
    PSYNC.err = String((err&&err.message)||err);
    paintSync();
    if(!auto) pinFallback(marks, unset, err);   /* 手动提交失败才摊出来让他复制 */
  }
}

/* 只重画状态条，⛔ 不整页 render（否则长列表会把他滚回顶部） */
function paintSync(){
  const el = document.getElementById('pinCnt');
  if(el){
    const n = cntPV();
    el.innerHTML = pinSyncText(n);
  }
  const btn = document.getElementById('pinSub');
  if(btn){
    if(PSYNC.busy){ btn.disabled = true; btn.textContent = '提交中…'; }
    else if(PSYNC.err){ btn.disabled = false; btn.textContent = '重试提交'; }
    else if(PSENT && pvSig()===PSENT){ btn.disabled = true; btn.textContent = '已提交 ✓'; }
    else { btn.disabled = false; btn.textContent = '提交给助手'; }
  }
}

/* 进页面时补交一次：上次没提交成功 / 或选了没来得及发 */
function autoSyncOnBoot(){
  if(!Object.keys(PV).length) return;
  if(pvSig() === PSENT) return;
  scheduleSync();
}

/* 提交失败兜底：把内容摊出来让作者复制（⛔ 不能因为接口挂了就丢他半天的标记） */
function pinFallback(marks, unset, err){
  const txt = JSON.stringify({marks:marks, unset:unset||[], page:'unconfirmed-extra-pin'});
  const d = document.createElement('div');
  d.className = 'pmodal';
  d.innerHTML = `<div class="pmodal-in">
    <div class="pmodal-t">提交失败：${esc(String((err&&err.message)||err))}</div>
    <div class="pmodal-h">内容已全选，Ctrl+C 复制后粘给助手即可（标记本身还在浏览器里，没丢）。</div>
    <textarea class="pmodal-ta" readonly></textarea>
    <div class="pmodal-b"><button class="vb" onclick="this.closest('.pmodal').remove()">关闭</button></div>
  </div>`;
  d.querySelector('.pmodal-ta').value = txt;
  document.body.appendChild(d);
  const ta = d.querySelector('.pmodal-ta');
  ta.focus(); ta.select();
}
function pinTable(){
  const L = pinFiltered();
  const cnt = t => PR.filter(r=>t(r)).length;
  const nA = cnt(r=>r.tier==='A'), nB = cnt(r=>r.tier==='B');
  const nC = cnt(r=>r.tier==='C1'||r.tier==='C2'||r.tier==='C3');
  const nDone = cntPV();
  const st = PL['统计'] || {};

  const rows = L.map(r=>{
    const s = r.summary||{};
    const cur = pickOf(r);
    const cls = !cur ? '' : (cur.pick ? 'pv-ok' : (cur.skip ? 'pv-no' : 'pv-wait'));
    const nowChip = `<span class="tag orphan">extra</span>`;
    let tgt;
    if(r.target){
      /* 建议集也做成链接：点一下直接落到 TMDB 那一集，肉眼对集名 */
      const tm = /^S(\d+)E(\d+)$/.exec(r.target);
      const box = tm ? tmdbA(r, `<span class="ptgt">${r.target}</span>`, +tm[1], +tm[2], 'tg')
                     : `<span class="ptgt">${r.target}</span>`;
      tgt = box + (r.clash?`<div class="pclash">${esc(r.clash)}</div>`:'');
    } else if(r.tier==='B'){
      tgt = `<span class="pnone" title="需要你先定归属">❓ 待你判</span>`;
    } else {
      /* A 档却无建议集 ⇒ 同站冲突钉不进（依据列已写原因），别只显示一个破折号 */
      tgt = `<span class="pnone">${r.tier==='A'?'— 留 extra':'—'}</span>`;
    }
    const why = r.tier==='B'
      ? `<div class="pask">${esc(r.ask||'')}</div><div class="popt">${esc(r.opt||'')}</div>`
      : `<div class="pwhy">${esc(r.why||r.brief||'')}</div>`;
    return `<tr class="${cls}">
      <td>
        <span class="mono">${r.work}</span>
        <div class="pname">${tmdbA(r, esc(r.name||'—'))}</div>
        <div class="pmeta">${s.withSource||0}/${s.tmdbEps||0} 集 · extra ${s.extra||0}</div>
        <span class="tag ${TCLS[r.tier]||'matched'}">${TICON[r.tier]||''} ${TLBL[r.tier]||r.tier}</span>
      </td>
      <td>
        <span class="tag ${r.src}">${r.src}</span>
        <div class="mono" style="margin-top:3px;white-space:normal;word-break:break-all">${esc(r.src_key)}</div>
      </td>
      <td class="psrc">${esc((r.title||'—').slice(0,90))}</td>
      <td>${nowChip}</td>
      <td>${tgt}</td>
      <td class="pcell">${pinSelect(r)}</td>
      <td class="pwhycell">${why}</td>
    </tr>`;

function renderEmby(){

  const st = EMBP['统计'] || {};
  EMALL = EMBP['条目'] || [];
  const badge = document.getElementById('tEmby');
  if(badge) badge.textContent = EMALL.length ? (EMALL.filter(x=>!EV[x.emby_tmdb]).length || '') : '';

  if(!EMALL.length){
    /* §133：已确认解决的不再留在待办里（0r192）。但要说清「是已经处理完」而不是「没数据」 */
    const arc = EMBP['归档'] || [];
    if(arc.length){
      pane.innerHTML = '<div class="empty"><b>✅ 已全部处理完，这里没有待办</b>'
        + arc.length + ' 部 / ' + (st['已归档集数']||0) + ' 集都是「同一部作品在盘上留了两个目录」，'
        + '正主词条都已入库。<br><span style="opacity:.72">盘上的旧目录还在（我没删），要清理跟我说一声。</span></div>';
      return;
    }
    pane.innerHTML = '<div class="empty"><b>这批还没有数据</b>先跑 scripts/_emby_pending.py 生成</div>';

  }
  const cnt = k => EMALL.filter(x=>x.suggest===k).length;

    <div class="mt-bar">

      <span class="chip" style="background:var(--ok-soft);color:var(--ok-ink)"><b>${cnt('merge')}</b> 可合并到已有词条</span>
      <span class="chip" style="background:var(--bad-soft);color:var(--bad-ink)"><b>${cnt('new')}</b> 库里没有</span>
      <span class="chip"><b>${EMALL.filter(x=>EV[x.emby_tmdb]).length}</b> 已判</span>
      <span class="spacer"></span>
      ${[['all','全部'],['merge','可合并'],['new','库里没有'],['todo','未判定'],['done','已判定']]
        .map(([k,t])=>`<button class="mt-f${EMF===k?' on':''}" data-ef="${k}">${t}</button>`).join('')}
      <button class="btn" id="emExp">导出我的判定</button>
    </div>
    <div class="mt-note">
      这 ${EMALL.length} 部在 <b>Emby 里已经整理好 ${st['集数']||0} 集</b>，但它们目录名里的 tmdb id
      <b>不在看板的词条表里</b> ⇒ 看板连这一部都看不到（所以永远不会显示「已入库」）。
      <br><b style="color:var(--ok-ink)">可合并</b>=库里已有同一部的正主词条（名字/日文原名精确相等），
      把 Emby 目录改挂到正主 id 即可，<b>不用重下</b>；
      <b style="color:var(--bad-ink)">库里没有</b>=要决定是否新增 TMDB 词条。
      判定只存<b>这台浏览器</b>，不写库。
    </div>
    ${L.map(emCard).join('') || '<div class="empty"><b>这个筛选下没有条目</b></div>'}

/* ══════════ §122 问题清单（2026-11-01 16:29 作者）══════════════════════
   「把不确定的所有问题，都更新到未确定看板，我一个一个看」

   四类口径完全独立，⛔ 不合计算总数（混起来每类分母都不对）：
     swap   年份倒挂 —— 按集号升序排，文件年份却倒着走。**硬矛盾，先看这个**
     seq    集位靠顺序猜 —— 文件名里没集号，只能按发布先后填（单集作品不算风险）
     orphan 种子里有视频，但连 source_work 都没有 ⇒ 这部作品根本没进看板
     nosize hanime 有直链、拿不到体积（youjizz 第三方嵌入，域名已废）

   ⚠️ 「已看」只存本浏览器 localStorage，⛔ 不写库、不上报。
   ⚠️ 详情是点开才算：886 条全渲染 DOM 会拖慢，默认只画摘要行。
*/
const ISSUE = D['问题清单'] || {统计:{},条目:[],未匹配:[],缺体积:[]};
const ISIT = ISSUE['条目'] || [];
const LSI = 'unc_issue_seen_v1';
let ISEEN = new Set();
try{ ISEEN = new Set(JSON.parse(localStorage.getItem(LSI) || '[]')); }catch(_){ }
let ISF = 'swap';       /* 默认落在「倒挂」—— 唯一有硬矛盾的一类 */
let ISKW = '';

function issSave(){ try{ localStorage.setItem(LSI, JSON.stringify([...ISEEN])); }catch(_){ } }

/* 四类拍平成同一个列表；key 必须稳定（用作品 id / 文件路径 / vid，⛔ 别用下标） */
function issAll(){
  const L = [];
  ISIT.forEach(i => L.push(i));                       /* cat = swap | seq */
  (ISSUE['未匹配'] || []).forEach(o => L.push(Object.assign({}, o, {
    cat:'orphan', key:'o:'+(o.path || o.name)
  })));
  (ISSUE['缺体积'] || []).forEach(o => L.push(Object.assign({}, o, {
    cat:'nosize', key:'n:'+(o.vid || o.url)
  })));
  return L;
}

function issTitle(it){
  if(it.cat === 'orphan') return it.name || '（无文件名）';
  if(it.cat === 'nosize') return it.ja || it.title || ('vid ' + (it.vid || ''));
  return it.title || '（未知作品）';
}

function issWhy(it){
  if(it.cat === 'orphan'){
    return [it.year ? it.year + ' 年' : '年份未知', it.code || '无番号',
            it.size ? mtBytes(it.size) : '', it.reason || ''].filter(Boolean).join(' · ');
  }
  if(it.cat === 'nosize'){
    return [it.year || '', 'vid ' + (it.vid || ''), it.host || '',
            it.q || ''].filter(Boolean).join(' · ');
  }
  return [it.year || '', (it.n_eps || 0) + ' 集', it.why || ''].filter(Boolean).join(' · ');
}

/* 详情：每类给不同证据表 */
function issDetail(it){
  if(it.cat === 'swap'){
    return (it.bad || []).map(b => `
      <div class="is-sub">S${String(b.s).padStart(2,'0')} · 文件年份序列 ${b.ys.join(' → ')}</div>
      <table class="is-t"><thead><tr><th>集号</th><th>文件</th><th>体积</th><th>年份</th><th>判据</th></tr></thead><tbody>
      ${b.rows.map(r => `<tr>
        <td class="e">E${r.e}</td>
        <td class="nm">${esc(r.name)}</td>
        <td>${mtBytes(r.size)}</td>
        <td>${r.y || '—'}</td>
        <td>${esc(r.how)}</td></tr>`).join('')}
      </tbody></table>`).join('');
  }
  if(it.cat === 'seq'){
    return `<table class="is-t"><thead><tr><th>集号</th><th>文件</th><th>番号</th><th>体积</th><th>年份</th><th>判据</th></tr></thead><tbody>
      ${(it.rows || []).map(r => `<tr>
        <td class="e">S${String(r.s).padStart(2,'0')}E${r.e}</td>
        <td class="nm">${esc(r.name)}</td>
        <td>${esc(r.code || '—')}</td>
        <td>${mtBytes(r.size)}</td>
        <td>${r.y || '—'}</td>
        <td>${esc(r.how)}</td></tr>`).join('')}
      </tbody></table>
      <div style="font-size:11.5px;color:var(--ink3);margin-top:6px;line-height:1.7">
        判据 <b>seq</b> = 文件名里没有集号，按「发布先后」填进去的（不是读出来的）。
        要改就告诉我正确顺序，我写进 override 表，⛔ 不动引擎。
      </div>`;
  }
  if(it.cat === 'orphan'){
    return `<table class="is-t"><tbody>
      <tr><th style="width:74px">种子内路径</th><td class="nm">${esc(it.path || '')}</td></tr>
      <tr><th>体积</th><td>${mtBytes(it.size)}</td></tr>
      <tr><th>判成原因</th><td>${esc(it.reason || '')}</td></tr>
      <tr><th>归并键</th><td>${esc(it.series || '—')}</td></tr>
      </tbody></table>
      <div style="margin-top:8px;display:flex;gap:7px;flex-wrap:wrap">
        <button class="is-act" data-cp="${esc(it.name || '')}">复制文件名</button>
        <button class="is-act" data-cp="${esc(it.path || '')}">复制路径</button>
        <a class="is-act" target="_blank" rel="noopener"
           href="/mteam.html?q=${encodeURIComponent(it.name || '')}"
           style="text-decoration:none">在「全部片名」页看这条</a>
        <a class="is-act" target="_blank" rel="noopener"
           href="https://www.themoviedb.org/search?query=${encodeURIComponent(it.series || it.name || '')}"
           style="text-decoration:none">去 TMDB 搜</a>
      </div>
      <div style="font-size:11.5px;color:var(--ink3);margin-top:8px;line-height:1.7">
        这部种子里有视频，但库里<b>连 source_work 都没有</b> ⇒ 看板完全不显示它。
        在 TMDB 查到词条后告诉我，我建 source_work + 词条再重匹配。
      </div>`;
  }
  return `<table class="is-t"><tbody>
      <tr><th style="width:74px">直链</th><td class="nm">${esc(it.url || '')}</td></tr>
      <tr><th>域名</th><td>${esc(it.host || '—')}</td></tr>
      <tr><th>画质</th><td>${esc(it.q || '—')}</td></tr>
      </tbody></table>
      <div style="font-size:11.5px;color:var(--ink3);margin-top:8px;line-height:1.7">
        直链能拿到、<b>HEAD 拿不到 content-length</b>。<code>cdne-mobile.youjizz.com</code> 已解析到
        Facebook 段（<code>2a03:2880::</code>）⇒ 域名已废，⛔ 不是抓法问题，建议放弃。
      </div>`;
}

function issRow(it){
  const seen = ISEEN.has(it.key);
  const n = (it.cat === 'swap') ? (it.bad || []).length
          : (it.cat === 'seq') ? (it.rows || []).length : 1;
  /* pri 只对 swap/seq 有：1=建议先看 2=只能人工钉 3=多半不算错 */
  const pri = ({1:'<span class="is-pri p1">建议先看</span>',
                2:'<span class="is-pri p2">只能人工钉</span>',
                3:'<span class="is-pri p3">多半不算错</span>'})[it.pri] || '';
  return `<div class="is-row${seen ? ' done' : ''}" data-k="${esc(it.key)}">
    <input type="checkbox" class="isc" ${seen ? 'checked' : ''} title="标记为已看">
    <div class="ism">
      <div class="is-t1"><span class="is-b ${it.cat}">${({swap:'年份倒挂',seq:'集位靠猜',orphan:'未匹配',nosize:'缺体积'})[it.cat]}</span>${esc(issTitle(it))}${pri}</div>
      <div class="is-t2">${esc(issWhy(it))}</div>
      <div class="is-x">${issDetail(it)}</div>
    </div>
    <div style="flex:none;font-size:11px;color:var(--ink4)">${n} 条</div>
  </div>`;
}

function renderIssues(){
  const pane = document.getElementById('detailPane');
  const st = ISSUE['统计'] || {};
  const ALL = issAll();
  const badge = document.getElementById('tIss');
  /* 角标只算「待人工」—— 已知拿不到的那些不该再催作者（2026-11-02） */
  if(badge) badge.textContent = Math.max(0, (st['待人工']||ALL.length) - ISEEN.size) || '';

  if(!ALL.length){
    pane.innerHTML = '<div class="empty"><b>这批还没有数据</b>先跑 scripts/build_issue_list.py</div>';
    return;
  }
  const cnt = c => ALL.filter(x => x.cat === c).length;
  const unseen = ALL.filter(x => !ISEEN.has(x.key)).length;

  let L = ALL.slice();
  if(ISF === 'unseen') L = L.filter(x => !ISEEN.has(x.key));
  else if(ISF !== 'all') L = L.filter(x => x.cat === ISF);
  if(ISKW) L = L.filter(x => (issTitle(x) + ' ' + issWhy(x) + ' ' + (x.path || '')).toLowerCase().includes(ISKW));

  pane.innerHTML = `<div class="mt-wrap">
    <div class="mt-bar">
      <span class="chip hi"><b>${cnt('swap')}</b> 部年份倒挂<span style="opacity:.7">（建议先看 ${st['swap_p1']||0}）</span></span>
      <span class="chip" style="background:var(--warn-soft);color:var(--warn-ink)"><b>${st['seq_all']||0}</b> 部集位靠猜</span>
      ${cnt('orphan')
        ? `<span class="chip" style="background:var(--info-soft);color:var(--info-ink)"><b>${cnt('orphan')}</b> 条未匹配<span style="opacity:.7">（26年 ${st['orphan_2026']||0}）</span></span>`
        : `<span class="chip ok" title="曾经 75 条，现已全部落位">未匹配 <b>0</b> · 已清零</span>`}
      <span class="chip"><b>${st['nosize_todo']||0}</b> 条缺体积待查<span style="opacity:.7">（另有 ${st['nosize_dead']||0} 条已知拿不到）</span></span>
      <span class="spacer"></span>
      <span class="is-prog">已看 <b>${ISEEN.size}</b> / ${st['待人工']||ALL.length}</span>
    </div>
    <div class="mt-bar">
      ${[['swap','年份倒挂'],['seq','集位靠猜'],['orphan','未匹配'],['nosize','缺体积'],
         ['unseen','只看没看过的'],['all','全部']]
        .filter(([k]) => k !== 'orphan' || cnt('orphan'))
        .map(([k,t]) => `<button class="mt-f${ISF===k?' on':''}" data-if="${k}">${t}${
          k==='unseen' ? ' '+unseen : (k==='all' ? ' '+ALL.length : '')}</button>`).join('')}
      <input id="isKw" placeholder="搜作品名 / 文件名 / 番号" value="${esc(ISKW)}" style="width:230px">
      <span class="spacer"></span>
      <button class="is-act" id="isExp">导出没看过的</button>
      <button class="is-act" id="isClr">清空已看</button>
    </div>
    <div class="mt-note">
      四类口径互不相同，<b>不合计算总数</b>：
      <b style="color:var(--bad-ink)">年份倒挂</b>=按集号排下来文件年份倒着走（硬矛盾，最该先看）；
      <b style="color:var(--warn-ink)">集位靠猜</b>=文件名里根本没集号，是按发布先后<b>填</b>的不是读出来的
      （${st['seq_eps']||0} 集，其中 ${st['seq_all']||0} 部整部都没集号）；
      <b style="color:var(--info-ink)">未匹配</b>=种子里有视频、库里连作品记录都没有
      <b>（已清零，这块从看板撤掉）</b>；
      <b>缺体积</b>=hanime 有直链但 HEAD 拿不到大小 ——
      ${st['nosize_dead']||0} 条是 youjizz 系（域名已污染，拿不到，<b>不用你管</b>），
      只剩 ${st['nosize_todo']||0} 条是别的源，值得点一下。
      <br>勾选框只记<b>这台浏览器</b>，⛔ 不写库。你逐条看，看到不对的告诉我编号或名字，我改 override 重跑。
    </div>
    ${L.map(issRow).join('') || '<div class="empty"><b>这个筛选下没有条目</b></div>'}
  </div>`;

  /* 事件：筛选 / 搜索 / 勾选 / 展开 / 复制 */
  pane.querySelectorAll('[data-if]').forEach(b => {
    b.onclick = () => { ISF = b.dataset.if; renderIssues(); };
  });
  const kw = document.getElementById('isKw');
  if(kw){
    kw.oninput = () => { ISKW = kw.value.trim().toLowerCase(); renderIssues();
      const k2 = document.getElementById('isKw'); if(k2){ k2.focus(); k2.setSelectionRange(999,999); } };
  }
  pane.querySelectorAll('.is-row').forEach(row => {
    const k = row.dataset.k;
    const cb = row.querySelector('.isc');
    const x = row.querySelector('.is-x');
    row.querySelector('.is-t1').onclick = () => { if(x) x.classList.toggle('on'); };
    if(cb) cb.onclick = e => {
      e.stopPropagation();
      if(cb.checked) ISEEN.add(k); else ISEEN.delete(k);
      issSave(); row.classList.toggle('done', cb.checked);
      const bd = document.getElementById('tIss');
      if(bd) bd.textContent = Math.max(0, (st['待人工']||ALL.length) - ISEEN.size) || '';
    };
  });
  pane.querySelectorAll('[data-cp]').forEach(b => {
    b.onclick = e => { e.stopPropagation(); cp(b.dataset.cp); };
  });
  const ex = document.getElementById('isExp');
  if(ex) ex.onclick = () => {
    const out = ALL.filter(x => !ISEEN.has(x.key))
      .map(x => [x.cat, issTitle(x), issWhy(x)].join('\t'));
    if(!out.length) return tip('全都看过了');
    navigator.clipboard.writeText(out.join('\n'))
      .then(() => tip('已复制 ' + out.length + ' 条没看过的'));
  };
  const cl = document.getElementById('isClr');
  if(cl) cl.onclick = () => { ISEEN.clear(); issSave(); renderIssues(); tip('已清空已看标记'); };
}

/* 详情面板：上一条/下一条 + 屏蔽按钮 */
document.getElementById('detailPane').addEventListener('click', e=>{

    const ef = e.target.closest('[data-ef]');
    if(ef){ EMF = ef.dataset.ef; renderEmby(); return; }
    const vb2 = e.target.closest('[data-ev]');
    if(vb2){ emSetV(vb2.dataset.ek, vb2.dataset.ev); return; }
    const c2 = e.target.closest('[data-cp]');
    if(c2){ cp(c2.dataset.cp); return; }
    return;
  }
  /* mteam 页（独立口径，⛔ 不要落到下面的合集逻辑里） */
  if(TAB==='mteam'){
    if(e.target.closest('#mtExp')){ mtExport(); return; }
    const mf = e.target.closest('[data-mf]');
    if(mf){ MTF = mf.dataset.mf; renderMt(); return; }
    const vb = e.target.closest('[data-mv]');
    if(vb){ mtSetV(vb.dataset.mk, vb.dataset.mv); return; }
    const c = e.target.closest('[data-cp]');
    if(c){ cp(c.dataset.cp); return; }
    return;
  }
  if(e.target.closest('#prevG')){ step(-1); return; }
  if(e.target.closest('#nextG')){ step(1); return; }
  const h = e.target.closest('[data-hidkey]');
  if(h){ togHid(h.dataset.hidkey, e); }
});

/* 键盘：↑↓ 换条，1/2/3 判定，F 复制日文名 */
function step(d){
  if(!VIS.length) return;
  const i = VIS.findIndex(x=>x.gid===SEL);
  const j = (i<0?0:(i+d+VIS.length)%VIS.length);
  SEL = VIS[j].gid;
  render();
  const row = document.querySelector('.lrow.on');
  if(row) row.scrollIntoView({block:'nearest'});
}
document.addEventListener('keydown', e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||'')) return;
  if(TAB==='detail' || TAB==='pin' || TAB==='mteam') return;   /* pin/mteam 页用鼠标点按钮，避免 1/2/3 误判到合集 */
  if(e.key==='ArrowDown'){ e.preventDefault(); step(1); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); step(-1); }
  else if(e.key==='1' && SEL){ setV(SEL,'ok'); }
  else if(e.key==='2' && SEL){ setV(SEL,'no'); }
  else if(e.key==='3' && SEL){ setV(SEL,'wait'); }
  else if((e.key==='f'||e.key==='F') && SEL){
    const g = VIS.find(x=>x.gid===SEL);
    if(g && g.title_ja) cp(g.title_ja); else tip('这条没有日文名');
  }
});

/* 🔴 进页面顺序：先拉服务端已提交的（另一个 origin 交的也在这里），合并后再渲染。
   ⛔ 顺序不能反：先 render 再 pull ⇒ 列表闪一下、且 autoSyncOnBoot 会拿旧 PV 去提交。 */
loadHid().then(pullServerMarks).then(()=>{
  /* ⭐ 可钉清零后别停在空页：默认档跟着**实际还有没有东西**走
     （A 档存在的意义是「先把能落的看完」，看完了就该跳到他真正要判的那档） */
  if(!PR.some(r=>r.tier==='A' && !isMark(PV[r.rowkey]))){
    PTIER = PR.some(r=>r.tier==='B' && !isMark(PV[r.rowkey])) ? 'B'
          : PR.some(r=>!isMark(PV[r.rowkey])) ? 'all' : 'A';
  }
  renderStats(); render(); autoSyncOnBoot();
});
/* extra 待钉 的 tab 角标（可钉条数） */
(function(){ const el=document.getElementById('tPin');
  const n=(((D['待钉']||{})['统计'])||{})['A可钉']||0;
  if(el) el.textContent = n ? n : ''; })();
</script></body></html>
